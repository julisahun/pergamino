<!doctype html><meta charset=utf-8><title>probe · transport (tv side)</title>
<body>the television side of the transport probe
<script type="module">
/* The receiving half: takes whatever the admin window posts and tries to be a
   television with it — query the permission, open a file, read the bytes. */
const bus = new BroadcastChannel('dnd-dm');
bus.addEventListener('message', async e => {
  if (e.data?.kind !== 'probe') return;
  const out = { kind: 'tv-report' };
  try {
    const root = e.data.handle;
    out.cloned = root ? root.constructor.name : null;
    out.permission = root.queryPermission
      ? await root.queryPermission({ mode: 'read' })
      : 'granted-or-absent';
    if (out.permission === 'granted') out.permission = 'granted-or-absent';
    const dir = await root.getDirectoryHandle('assets');
    const file = await (await dir.getFileHandle('map.txt')).getFile();
    out.text = await file.text();
    out.error = null;
  } catch (err) {
    out.error = err.name + ': ' + err.message;
  }
  bus.postMessage(out);
});
bus.postMessage({ kind: 'tv-ready' });
</script>
