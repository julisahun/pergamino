<!doctype html><meta charset=utf-8><title>probe · transport</title>
<body><pre id=out></pre>
<script type="module">
/* Stage 2's first question, asked before anything is built on the answer:

   CAN THE TELEVISION WINDOW READ THE CAMPAIGN FOLDER ITSELF?

   The plan's preferred design posts the FileSystemDirectoryHandle to the TV
   window and lets it open files directly — no copies, no blob bookkeeping, no
   second source of bytes. Three things have to hold for that:

     1. a handle survives structured cloning over a BroadcastChannel
     2. the receiving window can query its permission without a gesture
     3. the receiving window can actually read a file through it

   This probe opens a real second window (window.open, same origin), posts an
   OPFS handle to it, and has it read a file back. OPFS has no permission
   model, so (2) is only half-answered here — a picked folder's grant is a
   Chromium per-origin question that no headless probe can settle. What this
   does settle is whether the mechanism works at all, and what the fallbacks
   cost if it does not. */

const results = [];
const check = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  results.push({ ok, name, ...(ok ? {} : { got, want }) });
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* A file to read from the other side. */
const root = await navigator.storage.getDirectory();
for await (const name of root.keys()) await root.removeEntry(name, { recursive: true });
const dir = await root.getDirectoryHandle('assets', { create: true });
const fh = await dir.getFileHandle('map.txt', { create: true });
const w = await fh.createWritable();
await w.write('los bytes del mapa');
await w.close();

/* 1 — does a handle clone over a BroadcastChannel at all? */
const bus = new BroadcastChannel('dnd-dm');
try {
  bus.postMessage({ kind: 'probe-clone-only', handle: root });
  check('a directory handle can be posted over a BroadcastChannel', true, true);
} catch (e) {
  check('a directory handle can be posted over a BroadcastChannel', e.name, true);
}

/* 2 and 3 — a real second window on the same origin.

   A BroadcastChannel only delivers to channels that already exist, so the
   television has to say it is there before anything is sent to it. That
   handshake is not probe scaffolding: it is what the real app needs, because
   a television opened (or reloaded) at any moment must be able to ask for the
   current state rather than wait for the next change. */
const ready = new Promise(resolve => {
  bus.addEventListener('message', e => { if (e.data?.kind === 'tv-ready') resolve(true); });
});
const reply = new Promise(resolve => {
  bus.addEventListener('message', e => { if (e.data?.kind === 'tv-report') resolve(e.data); });
});

const tv = window.open('/probes/transport-tv.html', 'tv-probe', 'width=600,height=400');
check('the television window opened', !!tv, true);

const sawReady = await Promise.race([ready, sleep(6000).then(() => false)]);
check('the television announced itself on the channel', sawReady, true);

bus.postMessage({ kind: 'probe', handle: root });
const report = await Promise.race([reply, sleep(8000).then(() => ({ timeout: true }))]);

check('the television received the handle and read the file through it',
  [report.timeout ?? false, report.error ?? null, report.text ?? null],
  [false, null, 'los bytes del mapa']);
check('and it could ask about permission without a gesture',
  report.permission ?? null, 'granted-or-absent');

/* What the fallbacks would cost, measured rather than assumed. */
check('a blob URL made here is a string the other window can be handed',
  typeof URL.createObjectURL(await fh.getFile()), 'string');
try {
  bus.postMessage({ kind: 'probe-blob', blob: await fh.getFile() });
  check('a Blob itself also travels over the channel', true, true);
} catch (e) {
  check('a Blob itself also travels over the channel', e.name, true);
}

const failed = results.filter(r => !r.ok);
document.getElementById('out').textContent =
  results.map(r => (r.ok ? '✔ ' : '✖ ') + r.name).join('\n');
console.log('PROBE:TRANSPORT ' + JSON.stringify({
  total: results.length, failed: failed.length, failures: failed, tv: report,
}));
</script>
