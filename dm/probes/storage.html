<!doctype html><meta charset=utf-8><title>probe 1 · storage</title>
<body><pre id=out></pre>
<script type="module">
/* Stage 1's gate, run against a real browser filesystem.

   OPFS hands out a genuine FileSystemDirectoryHandle with no permission model
   and no picker gesture, which is the only way to drive fs.js headlessly. The
   modules under test are the real ones — nothing is stubbed. */

import { readTree, writeFile, readText, deleteToTrash, listRuns, scanMtimes,
         isEmptyDir, createCampaignSubdirs } from '/src/admin/fs.js';
import { seedBaseline, putFile, deleteFile, checkExternalChanges, Autosaver } from '/src/admin/disk.js';
import { shadowById, shadowByPath, classify } from '/src/shared/runs.js';
import { probe, check, sleep, freshRoot } from './kit.js';

await probe('STORAGE', async () => {

const root = await freshRoot();

/* ---------------------------------------------- a campaign, then a mesa */

check('an untouched folder reads as empty', await isEmptyDir(root), true);
await createCampaignSubdirs(root);
check('a new campaign is seeded flat, with no runs/', await isEmptyDir(root), false);
check('runs/ is not one of the seeded folders',
  await root.getDirectoryHandle('runs').then(() => 'exists', () => 'absent'), 'absent');

const beast = (id, name) => JSON.stringify({ id, name, ac: 12, hpMax: 7 });

// the shared preparation
await writeFile(root, 'monsters/vann.json', beast('vann', 'Vann'));
await writeFile(root, 'monsters/raimo.json', beast('raimo', 'Raimo'));
await writeFile(root, 'objects/arpon.json', JSON.stringify({ id: 'arpon', name: 'Arpón' }));
await writeFile(root, 'scenarios/cala.json', JSON.stringify({ id: 'cala', name: 'La cala' }));
await writeFile(root, 'story/lore/roquena.md', '# Roquena\n');
await writeFile(root, 'README.md', 'not a note');
await writeFile(root, 'assets/maps/cala.jpg', 'campaign-bytes');
await writeFile(root, 'assets/audio/mar.mp3', 'sound');

// this table
await writeFile(root, 'runs/guils/session.json', '{"version":2}');
await writeFile(root, 'runs/guils/players/amparo.json', JSON.stringify({ id: 'c1', name: 'Amparo' }));
await writeFile(root, 'runs/guils/monsters/vann.json', beast('vann', 'Vann (herido)'));
await writeFile(root, 'runs/guils/assets/maps/cala.jpg', 'run-bytes');
await writeFile(root, 'runs/guils/estado.md', '# Estado\n');
await writeFile(root, 'runs/guils/bitacora/01.md', '# Sesión 1\n');
await writeFile(root, 'runs/guils/guils.md', '---\nmesa: Guils\n---\n# Guils\n');
// and another one, which must stay invisible
await writeFile(root, 'runs/last/session.json', '{"version":2}');
await writeFile(root, 'runs/last/players/otro.json', JSON.stringify({ id: 'c9' }));
await writeFile(root, 'runs/last/monsters/vann.json', beast('vann', 'Vann (de la otra mesa)'));

/* ------------------------------------------------------------- the picker */

const runs = await listRuns(root);
check('both mesas are listed, by the name their note gives them',
  runs.map(r => [r.slug, r.label, r.players, r.played]),
  [['guils', 'Guils', 1, true], ['last', 'Last', 1, true]]);

/* ------------------------------------------------------- reading a mesa */

const { tree, mtimes } = await readTree(root, 'runs/guils');
const paths = b => tree[b].map(e => `${e.layer}:${e.path}`).sort();

check('the session comes from the mesa', tree.session, '{"version":2}');
check('the party comes from the mesa', paths('players'), ['run:runs/guils/players/amparo.json']);
check('both layers of the bestiary are read, each stamped',
  paths('monsters'),
  ['campaign:monsters/raimo.json', 'campaign:monsters/vann.json', 'run:runs/guils/monsters/vann.json']);
check('notes come from story/ and from inside the mesa',
  paths('story'),
  ['campaign:story/lore/roquena.md', 'run:runs/guils/bitacora/01.md',
   'run:runs/guils/estado.md', 'run:runs/guils/guils.md']);
check('a README at the campaign root is nobody\'s note',
  tree.story.some(e => e.path === 'README.md'), false);
check('nothing from the other mesa is anywhere in the payload',
  JSON.stringify(tree).includes('runs/last'), false);
check('assets carry their layer too',
  tree.assets.map(a => `${a.layer}:${a.path}`).sort(),
  ['campaign:assets/audio/mar.mp3', 'campaign:assets/maps/cala.jpg',
   'run:runs/guils/assets/maps/cala.jpg']);

/* --------------------------------------------------------- the shadowing */

const parsed = b => tree[b].map(e => ({ ...JSON.parse(e.text), file: e.path, layer: e.layer }));
const monsters = parsed('monsters');
const seen = shadowById(monsters.filter(m => m.layer === 'campaign'),
                        monsters.filter(m => m.layer === 'run'));
const vann = seen.find(m => m.id === 'vann');
check('this table sees ITS Vann', [vann.name, vann.layer, vann.shadows],
  ['Vann (herido)', 'run', 'monsters/vann.json']);
check('the campaign\'s Vann is untouched on disk',
  JSON.parse(await readText(root, 'monsters/vann.json')).name, 'Vann');
check('a monster only the campaign has is still there',
  seen.find(m => m.id === 'raimo').layer, 'campaign');
check('the bestiary has two entries, not three', seen.length, 2);

const assets = shadowByPath(
  tree.assets.filter(a => a.layer === 'campaign').map(a => a.path),
  tree.assets.filter(a => a.layer === 'run').map(a => a.path),
  'runs/guils');
const cala = assets.find(a => a.rel === 'assets/maps/cala.jpg');
check('the map this table loads is the mesa\'s copy',
  [cala.path, cala.layer, cala.shadows],
  ['runs/guils/assets/maps/cala.jpg', 'run', 'assets/maps/cala.jpg']);
check('and its bytes are the mesa\'s bytes', await readText(root, cala.path), 'run-bytes');

/* ------------------------------------------------- the other two modes */

const flat = (await readTree(root, '')).tree;
check('read flat, the campaign is one layer and runs/ does not exist',
  [flat.monsters.length, flat.monsters.every(e => e.layer === 'campaign'),
   flat.players.length, flat.session],
  [2, true, 0, null]);

const prep = (await readTree(root, null)).tree;
check('preparation-only finds no table: no session, no party',
  [prep.session, prep.players.length, prep.monsters.length, prep.story.length],
  [null, 0, 2, 1]);

/* ----------------------------------------------- our writes vs somebody's */

seedBaseline(mtimes);
await putFile(root, 'monsters/raimo.json', beast('raimo', 'Raimo el pálido'));
check('a write of ours is not an external change',
  (await checkExternalChanges(root)).changed, []);

/* A text editor writing the same file, going around disk.js entirely. */
await sleep(12);
await writeFile(root, 'story/lore/roquena.md', '# Roquena\n\nMarea baja.\n');
const outside = await checkExternalChanges(root);
check('somebody else\'s write is', outside.changed, ['story/lore/roquena.md']);
check('and it belongs to a bucket this mesa reads',
  classify(outside.changed[0], 'runs/guils'), { bucket: 'story', layer: 'campaign' });

/* ------------------------------------------------------------ autosaving */

const saver = new Autosaver(root, msg => results.push({ ok: false, name: 'autosave error', got: msg }));
saver.mark('monsters/raimo.json', () => beast('raimo', 'uno'));
saver.mark('monsters/raimo.json', () => beast('raimo', 'dos'));   // a burst collapses
saver.mark('monsters/raimo.json', () => beast('raimo', 'tres'));
await sleep(700);
check('a burst of edits writes once, with the latest truth',
  JSON.parse(await readText(root, 'monsters/raimo.json')).name, 'tres');
check('and the autosave is not an external change',
  (await checkExternalChanges(root)).changed, []);
saver.detach();

/* ---------------------------------------------------------------- trash */

const { trashedTo } = await deleteToTrash(root, 'monsters/raimo.json');
check('a delete is a move into trash/', trashedTo.startsWith('trash/raimo.json-'), true);
check('the bytes survive it', JSON.parse(await readText(root, trashedTo)).id, 'raimo');
const after = (await readTree(root, 'runs/guils')).tree;
check('the deleted monster is gone from the tree',
  after.monsters.some(e => e.path === 'monsters/raimo.json'), false);
check('and trash/ is invisible to the walker',
  JSON.stringify(after).includes('trash/'), false);
check('trash is invisible to the mtime scan too',
  [...(await scanMtimes(root)).keys()].some(p => p.startsWith('trash/')), false);

});
</script>
