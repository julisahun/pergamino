<!doctype html><meta charset=utf-8><title>probe · capas</title>
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/board.css">
<link rel="stylesheet" href="/src/styles/admin.css">
<body><div id="app"></div><pre id=out></pre>
<script type="module">
/* Stage 6's gate: two layers, and the question that goes with them.

   The claim under test is the one the old app got wrong by accident — that
   half of it wrote run-local and half wrote shared, from the same screen, with
   nothing on screen saying which. So every check here is about WHICH FILE
   MOVED, read back off the disk afterwards. */

import { h, render } from '/src/html.js';
import { App } from '/src/admin/app.js';
import { state, subscribe, update, onAfterMutation, attachSaver, flushSaves } from '/src/admin/store.js';
import { loadCampaign } from '/src/admin/campaign.js';
import { pushState } from '/src/admin/broadcast.js';
import { writeFile, readText } from '/src/shared/files.js';
import { createRun } from '/src/admin/fs.js';
import { probe, check, sleep, until, $, $$, byText, type, freshRoot } from './kit.js';

await probe('CAPAS', async () => {

onAfterMutation(pushState);
subscribe(() => render(h(App, null), $('#app')));

const exists = async (root, path) => {
  try { await readText(root, path); return true; } catch { return false; }
};

/* ------------------------------------------------- a campaign with a mesa */

const root = await freshRoot();
await writeFile(root, 'monsters/vann.json', JSON.stringify(
  { id: 'vann', name: 'Vann', ac: 13, hpMax: 9, initMod: 2, speed: 9 }));
await writeFile(root, 'monsters/raimo.json', JSON.stringify(
  { id: 'raimo', name: 'Raimo', ac: 11, hpMax: 5 }));
await createRun(root, 'guils', 'Guils');

/* Open the mesa, the way the picker does. */
state.run = { slug: 'guils', path: 'runs/guils', label: 'Guils', prep: false };
await loadCampaign(root);
attachSaver(root);
state.booted = true;
update(s => { s.ui.tab = 'pnj'; });
render(h(App, null), $('#app'));
await sleep(150);

check('the mesa was scaffolded with somewhere to write',
  [await exists(root, 'runs/guils/guils.md'), await exists(root, 'runs/guils/estado.md'),
   await exists(root, 'runs/guils/bitacora/00-plantilla.md')],
  [true, true, true]);
check('and its note names it, which is what the picker will show',
  (await readText(root, 'runs/guils/guils.md')).includes('mesa: Guils'), true);
check('the campaign prep is visible from inside the mesa',
  $$('.beast .who b').map(b => b.textContent), ['Raimo', 'Vann']);
check('marked as the campaign\'s, not this table\'s',
  $$('.beast .mesa-tag').map(t => t.textContent), ['campaña', 'campaña']);

/* ------------------------------------------------------ the question */

const vannCard = () => $$('.beast').find(el => el.textContent.includes('Vann'));
[...vannCard().querySelectorAll('.link')].find(b => b.textContent.includes('editar')).click();
await sleep(80);
type($('.modal input'), 'Vann el Calafate');
byText('.modal-foot button', 'Guardar').click();
await sleep(80);

check('SAVING ASKS WHICH LAYER, rather than picking one quietly',
  !!byText('.modal h3', '¿Dónde guardo'), true);
check('and both answers say the exact file they mean',
  $$('.layer-choice .fine').map(f => f.textContent.trim().split(' ')[0]),
  ['monsters/vann-el-calafate.json', 'runs/guils/monsters/vann-el-calafate.json']);

byText('.layer-choice button', 'Sólo a esta mesa').click();
await sleep(100);
flushSaves();
await sleep(400);

check('only this mesa got the change',
  [await exists(root, 'runs/guils/monsters/vann-el-calafate.json'),
   JSON.parse(await readText(root, 'monsters/vann.json')).name],
  [true, 'Vann']);
check('the flash named the file and the layer',
  [(state.flash || '').includes('runs/guils/monsters/vann-el-calafate.json'),
   (state.flash || '').includes('sólo esta mesa')],
  [true, true]);

/* The mesa's copy now shadows the campaign's, by id. */
await loadCampaign(root, { keepSession: true });
await sleep(120);
check('the table sees ITS Vann, and only one of him',
  state.session.bestiary.filter(b => b.id === 'vann').map(b => [b.name, b.layer]),
  [['Vann el Calafate', 'run']]);
check('and the card says so on screen',
  vannCard()?.textContent.includes('esta mesa'), true);

/* ----------------------------------------------------------- promoting */

[...vannCard().querySelectorAll('.link')].find(b => b.textContent.includes('mover a la campaña')).click();
await sleep(150);
flushSaves();
await sleep(400);

check('promoting writes the shared file…',
  JSON.parse(await readText(root, 'monsters/vann-el-calafate.json')).name, 'Vann el Calafate');
check('…AND RETIRES THE COPY that would otherwise keep shadowing it',
  await exists(root, 'runs/guils/monsters/vann-el-calafate.json'), false);
check('which the flash says out loud',
  (state.flash || '').includes('la copia de esta mesa se ha movido a trash/'), true);

/* -------------------------------------------------------- copying down */

await loadCampaign(root, { keepSession: true });
await sleep(120);
const raimoCard = () => $$('.beast').find(el => el.textContent.includes('Raimo'));
[...raimoCard().querySelectorAll('.link')].find(b => b.textContent.includes('copiar a esta mesa')).click();
await sleep(150);
flushSaves();
await sleep(400);
check('copying down leaves the campaign\'s untouched',
  [await exists(root, 'runs/guils/monsters/raimo.json'), await exists(root, 'monsters/raimo.json')],
  [true, true]);

/* ------------------------------------------------------------ deleting */

await loadCampaign(root, { keepSession: true });
await sleep(120);
/* From inside a mesa: its own files, yes. */
const shared = state.session.bestiary.find(b => b.layer === 'campaign');
const { canDelete } = await import('/src/admin/layers.js');
check('from inside a mesa, its own files can be deleted',
  canDelete(state.session.bestiary.find(b => b.layer === 'run')).ok, true);
check('and the campaign\'s cannot — that is what prep-only mode is for',
  [canDelete(shared).ok, canDelete(shared).why.includes('Sólo preparación')],
  [false, true]);

update(s => { s.run = { slug: '#prep', path: null, label: 'Sólo preparación', prep: true }; });
await loadCampaign(root);
await sleep(120);
check('preparation-only mode has no table and no party',
  [state.session.party.length, state.session.npcs.length, state.tree.session], [0, 0, null]);
check('it shows only the tabs that are about the campaign',
  $$('.tab-btn').map(b => b.textContent), ['PNJ', 'Objetos', 'Escenas', 'Historia']);
check('and there the campaign\'s own files CAN be deleted',
  canDelete(state.session.bestiary[0]).ok, true);
check('while a mesa\'s cannot, since no mesa is open',
  canDelete({ name: 'x', file: 'runs/guils/monsters/raimo.json' }).ok, false);

/* One layer, one place things go: a flat campaign never asks. */
update(s => { s.run = { slug: '', path: '', label: null, prep: false }; });
await loadCampaign(root);
await sleep(120);
update(s => { s.ui.tab = 'pnj'; });
await sleep(80);
const anyCard = () => $$('.beast')[0];
[...anyCard().querySelectorAll('.link')].find(b => b.textContent.includes('editar')).click();
await sleep(80);
byText('.modal-foot button', 'Guardar').click();
await sleep(120);
check('read flat, there is one layer and nothing to ask about',
  [!!byText('.modal h3', '¿Dónde guardo'), (state.flash || '').includes('—')],
  [false, false]);

});
</script>
