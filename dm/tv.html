<!doctype html>
<!-- ======================================================================
  Tablero — the television window.

  A renderer, and nothing else: it draws one object — the projection the
  admin window hands it over a BroadcastChannel — and sends back the one
  thing that flows the other way, a dragged token's position. It has no
  session, no rules and no secrets: what is not in the projection was never
  revealed, so opening devtools here teaches a player nothing.

  Open it from the admin's «Tablero ↗». There is no code to type and no
  table to join: it is a window on the same machine, on the same origin.
====================================================================== -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero</title>
<link rel="stylesheet" href="/src/styles/fonts.css">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/board.css">
<link rel="stylesheet" href="/src/styles/tv.css">
</head>
<body>
<div id="tv"></div>
<!-- The browser refuses to play anything until this window has been touched.
     That is not an error to log, it is a thing to ask for — and only on a
     genuine NotAllowedError, never because a file is missing. -->
<div id="sound" hidden>Toca la pantalla para oír</div>
<script type="module" src="/src/tv/main.js"></script>
</body>
</html>
