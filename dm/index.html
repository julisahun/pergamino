    `MAP_KEY`-style slot. */
function portraitSrc(p) {
  if (!p) return null;
  return p.src ? campaignPath(p.src) : p.stamp || null;
}

function portraitWidget(key, name, portrait, opts) {
  opts = opts || {};
  const src = portraitSrc(portrait);
  const initials = String(name || '').trim().split(/\s+/).slice(0, 2)
    .map(w => w[0] || '').join('').toUpperCase();
  return `<div class="portrait${opts.big ? ' big' : ''}${opts.readonly ? '' : ' editable'}"
      ${opts.readonly ? '' : `data-portrait="${esc(key)}" role="button" tabindex="0"
      title="Cambiar retrato" aria-label="Cambiar retrato de ${esc(name || 'Sin nombre')}"`}>
    ${src ? `<img src="${esc(src)}" alt="">` : `<span class="ini">${esc(initials)}</span>`}
  </div>`;
}

/** Downscaled to 512 px and re-encoded as JPEG, tighter than the map's 1920 px:
    a portrait is a thumbnail and a token icon, never a full-bleed image, so
    many of them stay cheap against the same 5 MB ceiling. `onReady` decides
    where the stamp lands — a bestiary draft, an npc mid-combat, and so on —
    since unlike the map there is no single owner to write it into. */
function readPortrait(file, onReady) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(512, img.naturalWidth);
      const h = Math.round(img.naturalHeight * (w / img.naturalWidth));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      onReady(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => flash('No pude leer esa imagen.');
    img.src = String(reader.result);
  };
  reader.onerror = () => flash('No se pudo leer el archivo.');
  reader.readAsDataURL(file);
}

/** Where a stamp lands, decoded from the same key `portraitWidget()` put on
    the widget: the still-unsaved monster wizard's draft, or an npc already
    seated in the current encounter. */
function applyPortrait(key, stamp) {
  const [kind, id] = String(key).split(':');
  if (kind === 'modal') {
    if (modal?.kind === 'beast') modal.portrait = { src: null, stamp };
    render();
  } else if (kind === 'npc') {
    const n = npcById(id);
    if (n) { n.portrait = { src: null, stamp }; save(); render(); }
  }
}

/** The path or the stamp of one scene's art, for a thumbnail in the library.
    A scene never uses MAP_KEY, so this is only ever a path or nothing —
    resolved against the campaign folder, since a library card renders it
    straight into a `background-image`, unlike the portable path a scene
    file itself stores. */
const sceneThumb = scene => campaignPath(scene?.art?.src) || null;

/* ============================================================= BESTIARIO */

/* This is the only place a creature is written down. A fight is assembled out
   of things you already decided on, which is why the combat screens have no
   form on them at all. */
function bestiaryScreen() {
  const n = session.bestiary.length;
  const shown = n ? session.bestiary.filter(b => matchesFilter(`${b.name} ${b.tag || ''}`, beastFilter)) : [];
  return topBar('PNJ', `${n} ficha${n === 1 ? '' : 's'}`) +

      </div>

                    <div class="st">CA ${b.ac} · ${b.hpMax} PG · iniciativa ${signed(b.initMod)}${

                </div>

                  <button class="small ghost" data-delbeast="${esc(b.id)}">Borrar</button>
                </div>
                ${b.abilities.length ? `<div class="nt"><b>${b.abilities.map(a => esc(a.name)).join(' · ')}</b></div>` : ''}

            Escribe aquí a quien vayas a usar — monstruos, aldeanos, aliados — y entrarán en

          </div>`}

/* ========================================================= combatant card
   The one component. Players and monsters differ only in what the expanded
   panel holds and in whether death saves can appear.
========================================================================= */

function cbCard(cb, opts) {
  const p = cb.play;
  const max = Math.max(0, cb.hpMax || 0);
  const hp = currentHP(cb);
  const down = max > 0 && hp <= 0;
  const bloodied = !down && max > 0 && hp * 2 <= max;
  const pct = max ? Math.round(hp / max * 100) : 0;
  const tpct = max ? Math.min(100 - pct, Math.round((p.temp || 0) / max * 100)) : 0;
  const open = openRows.has(cb.ref);

  const state = cb.broken?.length ? 'ficha incompleta'
    : down ? (cb.kind === 'npc' ? 'fuera de combate'
      : p.death.fail >= 3 ? 'muerto' : p.death.ok >= 3 ? 'estable' : 'inconsciente')
    : bloodied ? 'malherido' : '';

  const on = picked.has(cb.ref);

  /* `bare` is for the muster, where the row above the card already is the
     head: the name, the tick that decides whether it is in the fight, and the
     caret that opened this. Drawing a second name, a second tick and a second
     caret inside it read as two controls for one thing. */
  return `<article class="cb ${cb.kind}${down ? ' down' : ''}${bloodied ? ' bloodied' : ''}${
      opts.active ? ' active' : ''}${on ? ' picked' : ''}${opts.bare ? ' bare' : ''}${
      opts.compact ? ' compact' : ''}" data-ref="${esc(cb.ref)}">

    ${opts.bare ? '' : `<div class="head">
      <button class="tick${on ? ' on' : ''}" data-pick="${esc(cb.ref)}"
        aria-pressed="${on}" title="Marcar para repartir el mismo daño">${on ? '✓' : ''}</button>
      <div class="who" data-expand="${esc(cb.ref)}" role="button" tabindex="0"
           aria-expanded="${open}">
        ${portraitWidget(cb.ref, cb.name, cb.portrait, { readonly: true })}
        <div class="id">
          <b>${esc(cb.name)}</b>
          ${cb.sub ? `<span class="sub">${esc(cb.sub)}</span>` : ''}
        </div>
      </div>
      ${opts.editInit
        ? `<div class="init"><input type="number" inputmode="numeric" data-init="${esc(cb.ref)}"
             value="${opts.init ?? ''}" placeholder="—"
             aria-label="Iniciativa de ${esc(cb.name)}"><small>iniciativa</small></div>`
        : `<div class="init caret" data-expand="${esc(cb.ref)}">${open ? '▾' : '▸'}</div>`}
    </div>`}

    <div class="nums">
      <span>CA<b>${cb.ac ?? '—'}</b></span>
      <span>Inic.<b>${signed(cb.initMod || 0)}</b></span>
      ${cb.pp != null ? `<span>Perc.<b>${cb.pp}</b></span>` : ''}
      ${cb.speed != null ? `<span>Vel.<b>${metres(cb.speed)}</b></span>` : ''}
      ${p.exh ? `<span>Agot.<b>${p.exh}</b></span>` : ''}
    </div>

    <div class="hp">
      <div class="bar"><i style="width:${pct}%"></i>${tpct ? `<u style="width:${tpct}%"></u>` : ''}</div>
      <div class="hpline">
        <span class="cur">${hp}</span><span class="max">/ ${max} PG</span>
        ${p.temp ? `<span class="tmp">+${p.temp} temp</span>` : ''}
        ${state ? `<span class="state">${esc(state)}</span>` : ''}
      </div>
      <div class="dmg">
        <button data-quick="${esc(cb.ref)}:-1" title="1 de daño">−</button>
        <input data-delta="${esc(cb.ref)}" placeholder="7 · +3 · t5 · =11"
          aria-label="Daño o curación para ${esc(cb.name)}" autocomplete="off">
        <button data-quick="${esc(cb.ref)}:+1" title="1 de curación">+</button>
      </div>
    </div>

    ${chipRow(cb)}
    ${cb.kind === 'npc' ? revealRow(cb) : ''}
    ${opts.bench && cb.kind === 'pc' ? benchRow(cb) : ''}
    ${down && cb.kind === 'pc' ? deathRow(cb) : ''}
    ${opts.bare
      /* The head carried the only way into the detail panel, and a bare card
         has no head — so the way in moves to the foot, where it says what it
         opens instead of being a caret you have to try. */
      ? `<div class="more"><button class="small ghost" data-expand="${esc(cb.ref)}"
           aria-expanded="${open}">${open ? '▾ cerrar' : '▸'} ${
           cb.kind === 'npc' ? 'editar la ficha' : 'ver la ficha'}</button></div>`
      : ''}
    ${open ? `<div class="detail">${cb.kind === 'pc' ? pcDetail(cb) : npcDetail(cb)}</div>` : ''}
  </article>`;
}

/* What the players get to know about this monster, next to the hit points it
   is about — the two questions are asked at the same moment, when it walks
   into the room. */
function revealRow(cb) {
  const r = session.field.reveal[cb.id] = normaliseReveal(session.field.reveal[cb.id]);
  const modes = [['none', 'nada'], ['coarse', 'aproximada'], ['exact', 'exacta']];
  return `<div class="reveal${r.on ? '' : ' off'}">
    <button class="small ${r.on ? '' : 'ghost'}" data-reveal="${esc(cb.id)}:on"
      >${r.on ? '◉ en el tablero' : '○ oculto'}</button>
    <label>salud
      <select data-reveal="${esc(cb.id)}:hp" aria-label="Salud visible de ${esc(cb.name)}"
        ${r.on ? '' : 'disabled'}>
        ${modes.map(([k, es]) => `<option value="${k}"${r.hp === k ? ' selected' : ''}>${es}</option>`).join('')}
      </select></label>
  </div>`;
}

/** Off the board without touching the character — a player who is out sick,
    or sitting a session out. Unlike an npc there is nothing to delete: the
    party member still exists, still has a sheet, still has hit points; only
    whether they are currently seated anywhere is what this decides. Lives
    on Jugadores rather than the muster, since it is a fact about the table,
    not about any one fight. */
function benchRow(cb) {
  const benched = session.field.benched.includes(cb.ref);
  return `<div class="benchrow">
    <button class="small ghost" data-bench="${esc(cb.ref)}">${
      benched ? 'Volver a la mesa' : 'Quitar de la mesa'}</button>
    ${benched ? '<span class="muted" style="font-size:.78rem">Fuera del tablero</span>' : ''}
  </div>`;
}

/* --------------------------------------------------- the same damage, twice
   A fireball on four goblins was four boxes and four chances to fumble one.
   Tick them and type the number once; `mitad` is the half for whoever made
   the save, so one AoE is two gestures instead of eight. */
function pickBar() {
  if (!picked.size) return '';
  const names = [...picked].map(r => handleFor(r)?.name).filter(Boolean);
  return `<div class="foot pickbar">
    <span class="who">${picked.size} marcado${picked.size === 1 ? '' : 's'}
      <span class="muted">${esc(names.join(', '))}</span></span>
    <input data-multi placeholder="7 · +3 · t5" aria-label="Daño o curación para los marcados" autocomplete="off">
    <button class="primary" data-applyall="1">Aplicar</button>
    <button data-applyall="half" title="La mitad, para quien haya salvado">Mitad</button>
    <button class="ghost" data-clearpick="1" title="Quitar las marcas">✕</button>
  </div>`;
}

/** The shared box takes the same grammar as every other one. */
function applyToPicked(expr, half) {
  const s = String(expr).trim().toLowerCase().replace(/\s+/g, '');
  const m = s.match(/^(t|=|\+|-)?(\d+)$/);
  if (!m) { flash('No entiendo eso. Prueba 7, +3 o t5.'); return; }
  const n = half ? Math.floor(Number(m[2]) / 2) : Number(m[2]);
  const expression = (m[1] === '-' ? '' : (m[1] || '')) + n;
  const hit = [];
  remember(`${half ? 'mitad de ' : ''}${expr} a ${picked.size}`);
  for (const ref of picked) {
    const cb = handleFor(ref);
    if (cb && applyDelta(cb, expression)) hit.push(cb.name);
  }
  save(); render();
  flash(hit.length ? `${expression} → ${hit.join(', ')}.` : 'No se aplicó a nadie.');
}

function chipRow(cb) {
  const p = cb.play;
  const on = p.conditions.map(k => {
    const c = CONDITION(k);
    if (!c) return '';
    const lvl = c.exh && p.exh ? ` ${p.exh}` : '';
    return `<button class="chip on" data-cond="${esc(cb.ref)}:${c.key}">${esc(c.es)}${lvl}</button>`;
  }).join('');

  const picker = condFor === cb.ref ? `<div class="condbox">
    <div class="grid">${CONDITIONS.map(c => `<button class="chip${
      p.conditions.includes(c.key) ? ' on' : ''}" data-toggle="${esc(cb.ref)}:${c.key}">${esc(c.es)}</button>`).join('')}</div>
    ${condShown && CONDITION(condShown)
      ? `<p class="why"><b>${esc(CONDITION(condShown).es)}.</b> ${esc(CONDITION(condShown).d)}</p>`
      : '<p class="why muted">Toca una para ponerla o quitarla; te recuerdo lo que hace.</p>'}
  </div>` : '';

  return `<div class="chips">${on}
    <button class="chip add" data-picker="${esc(cb.ref)}">${condFor === cb.ref ? '× cerrar' : '+ estado'}</button>
  </div>${picker}`;
}

function deathRow(cb) {
  const d = cb.play.death;
  const pips = (kind, n, mark) => `<span class="pips">${[1, 2, 3].map(i =>
    `<button class="pip ${kind}${i <= n ? ' on' : ''}" data-death="${esc(cb.ref)}:${kind}:${i}"
       aria-label="${kind === 'ok' ? 'Éxitos' : 'Fallos'} ${i}">${i <= n ? mark : ''}</button>`).join('')}</span>`;

  const verdict = d.fail >= 3 ? 'muerto' : d.ok >= 3 ? 'estable' : '';
  return `<div class="death">
    <span>Salvaciones de muerte</span>
    ${pips('ok', d.ok, '✓')}${pips('fail', d.fail, '✗')}
    ${verdict ? `<span class="verdict">${verdict}</span>` : ''}
  </div>`;
}

          <td class="c">${esc(a.damage)}</td>

/** The creator's featuresHTML(), rewritten to take a character instead of
    reading the global the creator keeps. Same rows, same order. */
function featuresFor(c, d) {
  const rows = [];
  const sp = SPECIES[c.species];
  const cls = CLASSES[c.class];
  if (sp) for (const t of sp.traits) rows.push([t.n, t.d]);
  const lineage = sp?.lineages?.[c.lineage];
  if (lineage) for (const t of (lineage.traits || [])) rows.push([t.n, t.d]);
  const CHOICE_TABLES = {
    fightingStyle: [FIGHTING_STYLES, 'Estilo de combate'],
    divineOrder:   [DIVINE_ORDERS,   'Orden divina'],
    primalOrder:   [PRIMAL_ORDERS,   'Orden primigenia'],
  };
  if (cls) for (const f of cls.features) {
    const table = f.choice && CHOICE_TABLES[f.choice];
    const chosen = f.choice && c[f.choice];
    if (table && chosen && table[0][chosen]) rows.push([`${table[1]}: ${table[0][chosen].es}`, table[0][chosen].d]);
    else rows.push([f.n, f.d]);
  }
  for (const f of d.hooks.feats) {
    const feat = ORIGIN_FEATS[f];
    if (feat) rows.push([`${feat.es} (dote de origen)`, feat.d]);
  }
  if (!rows.length) return '<div class="muted">—</div>';
  return rows.map(([n, dsc]) => `<div class="feat"><b>${esc(n)}.</b> ${esc(dsc)}</div>`).join('');
}

function npcDetail(cb) {
  const n = cb.npc;
  return `<div class="mform">
    <div class="wide" style="display:flex;justify-content:center">
      ${portraitWidget('npc:' + n.id, n.name, n.portrait, { big: true })}</div>
    <label class="wide">Nombre <input data-npc="${esc(n.id)}:name" value="${esc(n.name)}"></label>
    <label>CA <input data-npc="${esc(n.id)}:ac" type="number" inputmode="numeric" value="${n.ac}"></label>
    <label>PG máx <input data-npc="${esc(n.id)}:hpMax" type="number" inputmode="numeric" value="${n.hpMax}"></label>
    <label>Mod. inic. <input data-npc="${esc(n.id)}:initMod" type="number" inputmode="numeric" value="${n.initMod}"></label>
    <label class="wide">Notas
      <textarea data-npc="${esc(n.id)}:note" rows="3">${esc(n.note)}</textarea></label>
    ${n.abilities.length ? `<details class="wide abdetails">
      <summary>Habilidades y ataques</summary>
      ${n.abilities.map(a => `<div class="feat"><b>${esc(a.name)}.</b> ${esc(a.desc)}</div>`).join('')}
    </details>` : ''}
    <div class="acts">
      <button class="small ghost" data-keep="${esc(n.id)}">Guardar en los PNJ</button>
      <button class="small ghost" data-delnpc="${esc(n.id)}">Quitar de la mesa</button>
    </div>
  </div>`;
}

/* ------------------------------------------------------------ files
   A file input is the only way to read a local .json without a server. The
   same input takes a character export and a whole saved session — the
   envelope says which.
====================================================================== */

function readFiles(files) {
  for (const f of Array.from(files || [])) {
    if (/^image\//.test(f.type)) readImage(f); else readOne(f);
  }
}

function readOne(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (parsed?.kind === 'dnd-dm-session' || (parsed?.party && parsed?.play)) {
        session = normaliseSession(parsed.session || parsed);
        statCache.clear();
        save(); render();
        flash('Sesión cargada.');
        return;
      }
      /* One scene, dropped on the board. The scan is how you load a folder of
         them; this is how you load the one somebody just sent you, and it is the
         same envelope either way. Matched on `kind` alone: a bare object with a
         `name` would be indistinguishable from a character. */
      if (parsed?.kind === 'dnd-dm-scene') {
        const scene = normaliseScene(parsed);
        const at = library.scenes.findIndex(s => s.id === scene.id);
        if (at >= 0) library.scenes[at] = scene; else library.scenes.push(scene);
        library.scenes.sort((a, b) => a.name.localeCompare(b.name, 'es'));
        saveScenes(); render();
        flash(`Escena ${at >= 0 ? 'actualizada' : 'añadida'}: ${scene.name}.`);
        return;
      }
      const raw = parsed?.character || parsed;
      if (!raw || typeof raw !== 'object') throw new Error('formato');
      absorb(normalise(raw));
    } catch (err) {
      flash('Ese archivo no es una ficha de este creador.');
    }
  };
  reader.onerror = () => flash('No se pudo leer el archivo.');
  reader.readAsText(file);
}

/** A re-import replaces the sheet and keeps what the character has lived
    through: current hit points, conditions, notes. Players edit their sheets
    mid-campaign, and losing their wounds to a re-import would be worse than
    not being able to re-import at all. The merge itself is `mergeParty()`,
    silent and reusable, because a folder scan absorbs several characters at
    once and one toast per file would be noise; a single drop still gets its
    own message here. */
function mergeParty(c) {
  const at = session.party.findIndex(x => x.id === c.id);
  if (at >= 0) {
    session.party[at] = c;
    const p = playOf(c.id);
    const max = stats(c).hp ?? 0;
    if (p.hp != null) p.hp = Math.min(p.hp, max);
    return 'updated';
  }
  session.party.push(c);
  const p = playOf(c.id);
  p.hp = stats(c).hp ?? 0;
  return 'added';
}

function absorb(c) {
  statCache.clear();
  const result = mergeParty(c);
  flash(`${result === 'updated' ? 'Actualizado' : 'Importado'}: ${c.name || 'sin nombre'}.`);
  seatAll();
  save();
  render();
}

/** Guardar sesión always downloads mesa.json — the copy that moves between
    machines — and, wherever a campaign folder is already writable (or
    becomes so with one more pick, the same one Guardar campaña asks for),
    also writes that same file straight into it. A browser that cannot write
    to disk at all still has the download, so there is nothing further to say
    to it here — Guardar campaña's own message already covers that case. */
async function exportSession() {
  const payload = { kind: 'dnd-dm-session', version: 1, session };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mesa.json';
  a.click();
  URL.revokeObjectURL(a.href);

  if (!window.showDirectoryPicker) return;
  const dir = await getCampaignDirHandle();
  if (!dir) return;
  try {
    await writeJSON(dir, 'mesa.json', payload);
    flash('Sesión descargada y guardada en la campaña.');
  } catch (e) {
    flash('Sesión descargada. No se pudo escribir mesa.json en la campaña.');
  }
}

/* ---------------------------------------------------------------- writeback
   Guardar campaña writes every party member and bestiary monster back to
   players/*.json and monsters/*.json on disk — the one thing a download
   cannot do, since a download cannot land inside a folder already picked.
   `showDirectoryPicker`'s write mode is Chrome-only, like the rest of this
   file's localStorage trick, and is asked for once per page load: nothing
   here tries to remember the handle across a reload, for the same reason
   the read-side folder pick is not remembered either. */

let campaignDirHandle = null;

/** Step 0's other half: a campaign that does not exist yet. There is no way
    to ask the OS to create a named folder through this API — the native
    picker's own "New Folder" button is how you name it — so this only picks
    an empty folder and gives it the five subfolders every campaign has, all
    empty, ready for Nueva escena and + Nuevo PNJ to actually have
    somewhere to write once Guardar campaña is pressed. */
async function createNewCampaign() {
  if (!window.showDirectoryPicker) {
    flash('Este navegador no puede crear carpetas. Crea campaigns/<nombre> a mano y usa Cargar campaña.');
    return;
  }
  let dir;
  try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
  catch (e) { if (e.name !== 'AbortError') flash('No se pudo crear la campaña.'); return; }

  for (const sub of ['scenarios', 'assets', 'players', 'monsters', 'story']) {
    try { await dir.getDirectoryHandle(sub, { create: true }); } catch (e) { /* best effort */ }
  }

  if (campaign.name && campaign.name !== dir.name) resetCampaignState();
  campaignDirHandle = dir;
  campaign.name = dir.name;
  saveCampaign();
  render();
  flash(`Campaña nueva: ${dir.name}.`);
}

async function getCampaignDirHandle() {
  if (!window.showDirectoryPicker) {
    flash('Este navegador no puede escribir en disco. Usa Guardar sesión.');
    return null;
  }
  if (campaignDirHandle) return campaignDirHandle;
  try {
    campaignDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    if (e.name !== 'AbortError') flash('No se pudo abrir la carpeta de la campaña.');
    return null;
  }
  if (campaign.name && campaignDirHandle.name !== campaign.name) {
    flash(`Ojo: esa carpeta se llama "${campaignDirHandle.name}", y la campaña cargada es "${campaign.name}".`);
  }
  return campaignDirHandle;
}

/** Creates any folder the path passes through that is not there yet —
    `players/liga/x.json` walks through `players` then `liga` before the
    file itself, the same tolerance a hand-made subfolder under story/
    already gets on the read side. */
async function writeJSON(dir, path, data) {
  const parts = path.split('/');
  const name = parts.pop();
  let at = dir;
  for (const part of parts) at = await at.getDirectoryHandle(part, { create: true });
  const handle = await at.getFileHandle(name, { create: true });
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}

/** Files are named after the character or monster, not the id — id is what
    a re-scan matches on, a name is what you find in Finder. */
const slugify = s => String(s).toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sin-nombre';

/** Every party member, every bestiary monster and every scene in the
    library, each to its own file. A loaded npc instance (`session.npcs`) is
    not among them — it was never in the bestiary either, only spawned from
    an entry that already is, so there is nothing on disk that owns the copy
    itself. A character, monster or scene this has never written
    before gets a fresh file under players/, monsters/ or scenarios/, and is
    remembered under that path from then on. */
async function saveCampaignToDisk() {
  const dir = await getCampaignDirHandle();
  if (!dir) return;

  let ok = 0, failed = 0;
  for (const c of session.party) {
    const path = session.playerFiles[c.id] || `players/${slugify(c.name)}.json`;
    try {
      await writeJSON(dir, path, { kind: 'dnd-creator-character', version: 2, character: c });
      session.playerFiles[c.id] = path;
      ok++;
    } catch (e) { failed++; }
  }
  for (const b of session.bestiary) {
    const path = b.file || `monsters/${slugify(b.name)}.json`;
    try {
      await writeJSON(dir, path, b);
      b.file = path;
      ok++;
    } catch (e) { failed++; }
  }
  for (const s of library.scenes) {
    const path = s.file || `scenarios/${slugify(s.name)}.json`;
    const { file, ...clean } = s;
    try {
      await writeJSON(dir, path, { kind: 'dnd-dm-scene', version: 1, scene: clean });
      s.file = path;
      ok++;
    } catch (e) { failed++; }
  }
  save();
  saveScenes();
  flash(failed
    ? `Guardado en la campaña: ${ok}. No se pudo escribir ${failed}.`
    : `Guardado en la campaña: ${ok} archivo${ok === 1 ? '' : 's'}.`);
}

function flash(msg) {
  const n = document.createElement('div');
  n.textContent = msg;
  n.style.cssText = 'position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);' +
    'background:#2b2118;color:#f4ead2;padding:.5rem 1rem;border-radius:3px;z-index:99;font-family:var(--serif)';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2200);
}

/* -------------------------------------------------------------- listeners
   All delegated, because every screen is rewritten wholesale on render.
   Text fields commit on change, never on keystroke, so typing a note cannot
   steal its own focus.
====================================================================== */

document.addEventListener('click', ev => {
  /* Clicking the darkness behind a modal closes it, which is what everybody
     tries first. The panel itself is not the scrim, so a click inside it does
     not travel out here. */
  if (modal && ev.target.matches('[data-scrim]')) { closeModal(); return; }

  const t = ev.target.closest('[data-nav],[data-import],[data-export],[data-savecampaign],[data-rest],[data-turn],[data-bench],' +
    '[data-endcombat],[data-expand],[data-quick],[data-picker],[data-cond],[data-toggle],' +
    '[data-death],[data-delnpc],[data-delbeast],[data-editbeast],[data-keep],' +
    '[data-opentv],[data-reveal],[data-mapfile],[data-mapclear],[data-mute],' +
    '[data-undo],[data-pauseboard],[data-tvpanel],[data-pick],[data-applyall],[data-clearpick],' +
    '[data-scan],[data-newcampaign],[data-golive],[data-stagescene],[data-unstage],[data-scenes],[data-gridtoggle],[data-delscene],[data-scenexport],' +
    '[data-joinfight],[data-musteropen],[data-startcombat],' +
    '[data-musterpick],[data-musterhide],[data-musterconfirm],[data-musterbeast],' +
    '[data-initnav],[data-initjump],[data-initstart],' +
    '[data-add],[data-newbeast],[data-closemodal],[data-count],[data-joinpick],[data-commitadd],' +
    '[data-abrow-add],[data-abrow-del],' +
    '[data-newscene],[data-editscene],[data-editorback],[data-editorsave],[data-editorexport],' +
    '[data-rosteradd],[data-rosterdel],' +
    '[data-opennote],[data-tag],' +
    '[data-portrait]');
  if (!t) return;

  const once = (attr, fn) => { if (t.hasAttribute(attr)) { fn(t.getAttribute(attr)); return true; } return false; };

  if (once('data-portrait', key => {
    const input = document.getElementById('portrait-file');
    input.dataset.target = key;
    input.click();
  })) return;

  if (once('data-closemodal', () => closeModal())) return;

  if (once('data-newbeast', () => { modal = { kind: 'beast', abilities: [], portrait: null }; render(); })) return;

  if (once('data-editbeast', id => {
    const b = session.bestiary.find(x => x.id === id);
    if (!b) return;
    modal = { kind: 'beast', beastId: id, abilities: b.abilities.map(a => ({ ...a })), portrait: b.portrait };
    render();
  })) return;

  /* Rows are draft state on the modal, not on the bestiary, so cancelling the
     wizard throws them away with everything else in it. */
  if (once('data-abrow-add', () => { modal.abilities.push({ name: '', desc: '' }); render(); })) return;

  if (once('data-abrow-del', i => { modal.abilities.splice(Number(i), 1); render(); })) return;

  if (once('data-add', what => {
    modal = what === 'monstruo' ? { kind: 'npcs', counts: new Map() }
      : { kind: 'players', refs: new Set() };
    render();
  })) return;

  /* Ticking a row means one of it; the stepper takes it from there. Stepping
     down to zero unticks it, so there is no state where a row is on and brings
     nothing. */
  if (once('data-count', v => {
    if (modal?.kind !== 'npcs') return;
    const at = v.lastIndexOf(':');
    const id = v.slice(0, at), how = v.slice(at + 1);
    const now = modal.counts.get(id) || 0;
    const next = how === 'toggle' ? (now ? 0 : 1) : Math.min(20, Math.max(0, now + Number(how)));
    if (next) modal.counts.set(id, next); else modal.counts.delete(id);
    render();
  })) return;

  if (once('data-joinpick', ref => {
    if (modal?.kind !== 'players') return;
    if (modal.refs.has(ref)) modal.refs.delete(ref); else modal.refs.add(ref);
    render();
  })) return;

  /* One undo step for the whole trip through the modal: bringing in three
     goblins and an ogre was one decision, so it comes back out as one.
     Loading never touches `session.encounter` — an npc reaches the board
     here and joins a fight, if it ever does, through its own tick. */
  if (once('data-commitadd', kind => {
    if (kind === 'npcs') {
      if (modal?.kind !== 'npcs' || !modal.counts.size) return;
      const total = [...modal.counts.values()].reduce((a, b) => a + b, 0);
      remember(`cargar ${total} PNJ`);
      for (const [id, n] of modal.counts) {
        const b = session.bestiary.find(x => x.id === id);
        if (b) loadNpc(b, n);
      }
      flash(`${total} PNJ en la mesa.`);
    } else {
      if (modal?.kind !== 'players' || !modal.refs.size) return;
      remember(`meter a ${modal.refs.size} en el combate`);
      for (const ref of modal.refs) {
        if (!session.encounter.members.includes(ref)) session.encounter.members.push(ref);
      }
    }
    modal = null;
    save(); render();
  })) return;

  if (once('data-nav', v => nav(v))) return;
  if (once('data-import', () => document.getElementById('import-file').click())) return;
  if (once('data-export', () => exportSession())) return;

  if (once('data-savecampaign', () => saveCampaignToDisk())) return;
  if (once('data-mapfile', () => document.getElementById('map-file').click())) return;
  if (once('data-undo', () => undo())) return;

  /* Not an undo step, the same reason muting or staging are not: pausing
     changes nothing the players have already been shown, and resuming just
     hands over everything that piled up while it was off. */
  if (once('data-pauseboard', () => {
    const f = session.field;
    f.paused = !f.paused;
    save();
    render();
    flash(f.paused
      ? 'Tablero en pausa: la mesa no verá tus cambios hasta que los envíes.'
      : 'Enviado a la mesa.');
  })) return;

  if (once('data-tvpanel', () => { showTV = !showTV; render(); })) return;

  if (once('data-pick', ref => {
    if (picked.has(ref)) picked.delete(ref); else picked.add(ref);
    render();
  })) return;

  if (once('data-clearpick', () => { picked.clear(); render(); })) return;

  if (once('data-joinfight', ref => {
    const e = session.encounter;
    if (!e.members.includes(ref) && handleFor(ref)) {
      remember(`meter a ${handleFor(ref).name} en el combate`);
      e.members.push(ref);
      save(); render();
    }
  })) return;

  if (once('data-musteropen', ref => {
    if (musterOpen.has(ref)) musterOpen.delete(ref); else musterOpen.add(ref);
    render();
  })) return;

  /* Empezar no longer starts anything: it opens the picker, asking who is in
     this fight before anything else does. */
  if (once('data-startcombat', () => {
    modal = { kind: 'muster', refs: new Set(), hidden: new Set(), counts: new Map(), filter: '' };
    render();
  })) return;

  if (once('data-musterpick', ref => {
    if (modal?.kind !== 'muster') return;
    if (modal.refs.has(ref)) { modal.refs.delete(ref); modal.hidden.delete(ref); }
    else modal.refs.add(ref);
    render();
  })) return;

  /* The stepper for a bestiary entry never loaded at all — same arithmetic
     as npcPicker()'s data-count, on its own attribute because it lives in a
     different modal kind. */
  if (once('data-musterbeast', v => {
    if (modal?.kind !== 'muster') return;
    const at = v.lastIndexOf(':');
    const id = v.slice(0, at), how = v.slice(at + 1);
    const now = modal.counts.get(id) || 0;
    const next = how === 'toggle' ? (now ? 0 : 1) : Math.min(20, Math.max(0, now + Number(how)));
    if (next) modal.counts.set(id, next);
    else { modal.counts.delete(id); modal.hidden.delete('bestiary:' + id); }
    render();
  })) return;

  /* Visible unless the DM says otherwise: the common case is a monster the
     table is meant to see, so hiding one — an ambush, a lurker — is the one
     extra tap, not the default everybody has to remember to undo. A ref
     here can name a bestiary entry rather than a loaded npc — "bestiary:id"
     — since that batch does not have real ids until the picker is confirmed. */
  if (once('data-musterhide', ref => {
    if (modal?.kind !== 'muster') return;
    if (modal.hidden.has(ref)) modal.hidden.delete(ref); else modal.hidden.add(ref);
    render();
  })) return;

  /* The picker's own commit: spawn whatever was still just a count in the
     bestiary section, fold every hide flag into `field.reveal` — the same
     switch the ◉/○ toggle on a card uses — then hand the whole roster to the
     same initiative wizard the muster always used. */
  if (once('data-musterconfirm', () => {
    if (modal?.kind !== 'muster') return;
    const refs = new Set(modal.refs);
    for (const [id, n] of modal.counts) {
      if (!n) continue;
      const b = session.bestiary.find(x => x.id === id);
      if (!b) continue;
      const hidden = modal.hidden.has('bestiary:' + id);
      for (const ref of loadNpc(b, n)) {
        refs.add(ref);
        if (hidden) modal.hidden.add(ref);
      }
    }
    if (!refs.size) return;
    for (const ref of refs) {
      if (!ref.startsWith('npc:')) continue;
      const id = ref.slice(4);
      const r = session.field.reveal[id] = normaliseReveal(session.field.reveal[id]);
      r.on = !modal.hidden.has(ref);
    }
    const queue = initQueue([...refs]);
    for (const ref of [...rolled.keys()]) if (!queue.includes(ref)) rolled.delete(ref);
    modal = { kind: 'init', queue, at: 0, vals: rolled };
    save(); render();
  })) return;

  if (once('data-initnav', v => stepInit(modal.at + Number(v)))) return;
  if (once('data-initjump', v => stepInit(Number(v)))) return;

  if (once('data-initstart', () => {
    commitInit();
    /* The queue *is* the fight: it was built from what you ticked, monsters
       included, so it is also the membership. */
    const refs = [...modal.queue];
    remember('empezar el combate');
    /* `rolled` is deliberately not cleared here: undoing the start puts you
       back on the muster, and the numbers the table called out are still the
       numbers the table called out. endCombat() is what forgets them. */
    startCombat(refs, modal.vals);
    modal = null;
    save(); render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  })) return;

  if (once('data-applyall', mode => {
    const box = document.querySelector('[data-multi]');
    if (box && box.value.trim()) applyToPicked(box.value, mode === 'half');
  })) return;

  /* A named window, so pressing the button again brings the television back
     to the front instead of opening a second one. */
  if (once('data-opentv', () => {
    syncBoard();
    const w = window.open('tablero.html', 'tablero');
    if (!w) flash('El navegador ha bloqueado la ventana. Abre tablero.html a mano.');
  })) return;

  /* ------------------------------------------------------------- escenas */

  /* Not an undo step. Undo is for the numbers you said out loud, and a volume
     you have gone too far with undoes by being dragged back — the same argument
     the dragged token already makes. */
  if (once('data-mute', () => {
    audioPrefs.muted = !audioPrefs.muted;
    saveAudioPrefs();
    syncBoard();
    render();
  })) return;

  if (once('data-scan', () => document.getElementById('scan-dir').click())) return;

  if (once('data-newcampaign', () => createNewCampaign())) return;

  if (once('data-scenes', () => { modal = { kind: 'scenes' }; render(); })) return;

  /* An empty value is "no scene": a bare grid, which is what a fight you did not
     prepare needs and what the board always was before scenes existed. */
  if (once('data-golive', id => {
    const scene = id ? sceneById(id) : null;
    if (id && !scene) { flash('Esa escena ya no está en la lista.'); return; }
    remember(scene ? `poner ${scene.name}` : 'quitar la escena');
    goLive(scene);
    modal = null;
    save();
    /* Landing on the muster is the point: a scene going live is the start of
       "and then what is standing on it". */
    if (screen !== 'juego') nav('juego'); else render();
    flash(scene ? `${scene.name} está en el tablero.` : 'Tablero sin escena.');
  })) return;

  /* A free-standing session toggle, independent of the scene and of combat:
     it never touches the library, so switching it never edits scenarios/. */
  if (once('data-gridtoggle', () => {
    remember(session.field.grid ? 'quitar la cuadrícula' : 'poner la cuadrícula');
    session.field.grid = !session.field.grid;
    save(); render();
  })) return;

  /* Prepares without touching what is on the television — see stageScene().
     Not an undo step, for the same reason muting is not: nothing about it was
     said out loud at the table yet. */
  if (once('data-stagescene', id => {
    const scene = id ? sceneById(id) : null;
    if (id && !scene) { flash('Esa escena ya no está en la lista.'); return; }
    stageScene(scene);
    save();
    render();
    flash(scene ? `${scene.name} preparada, sin tocar el tablero.` : 'Nada preparado.');
  })) return;

  if (once('data-unstage', () => {
    session.field.staged = null;
    save();
    render();
  })) return;

  if (once('data-scenexport', id => {
    const s = sceneById(id);
    if (s) exportScene(s);
  })) return;

  /* Only from the library, and only the library: the .json on disk is the
     scene, so this forgets it rather than deleting anything. */
  if (once('data-delscene', id => {
    const s = sceneById(id);
    if (!s) return;
    if (!confirm(`¿Quitar "${s.name}" de la lista? El archivo en scenarios/ se queda donde está.`)) return;
    library.scenes = library.scenes.filter(x => x.id !== id);
    if (session.field.sceneId === id) session.field.sceneId = null;
    if (session.field.staged && session.field.staged.sceneId === id) session.field.staged = null;
    saveScenes(); save(); render();
  })) return;

  /* --------------------------------------------------------------- editor
     `editorDraft` is a plain-JSON clone, never a reference into `library`:
     opening a scene to look at it must not be able to edit it by accident. */
  if (t.hasAttribute('data-newscene')) {
    editorDraft = blankScene();
    editingSceneId = editorDraft.id;
    render();
    return;
  }

  if (once('data-editscene', id => {
    const s = sceneById(id);
    if (!s) return;
    editorDraft = normaliseScene(JSON.parse(JSON.stringify(s)));
    editingSceneId = editorDraft.id;
    render();
  })) return;

  if (t.hasAttribute('data-editorback')) {
    editingSceneId = null; editorDraft = null;
    render();
    return;
  }

  /* ---------------------------------------------------------------- story
     An index row, a wikilink and a backlink all do the same thing: open a
     note by path (empty path = back to the index). */
  if (once('data-opennote', path => { storyOpen = path || null; render(); })) return;

  /* A tag is a shortcut into the search box, not a filter of its own — and
     picking one always means "show me everything with it", so it also backs
     out to the index if a note happened to be open. */
  if (once('data-tag', tag => { storyFilter = tag; storyOpen = null; render(); })) return;

  if (t.hasAttribute('data-editorsave')) {
    if (!editorDraft) return;
    const at = library.scenes.findIndex(s => s.id === editorDraft.id);
    const saved = normaliseScene(JSON.parse(JSON.stringify(editorDraft)));
    if (at >= 0) library.scenes[at] = saved; else library.scenes.push(saved);
    library.scenes.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    saveScenes();
    /* Saving the scene that is on the television right now has to reach the
       television — a stale field would go on showing the old art or mix
       until the next unrelated change. */
    if (session.field.live && session.field.sceneId === saved.id) goLive(saved);
    /* Same reasoning for a scene that is only prepared: the preview should
       show what was just saved, not what the scene used to say. */
    else if (session.field.staged && session.field.staged.sceneId === saved.id) stageScene(saved);
    save(); render();
    flash(`Guardado "${saved.name}".`);
    return;
  }

  if (t.hasAttribute('data-editorexport')) {
    if (editorDraft) exportScene(editorDraft);
    return;
  }

  if (once('data-rosteradd', id => {
    if (!editorDraft) return;
    const sq = freeRosterSquare(editorDraft.roster, sceneGridSize(editorDraft));
    editorDraft.roster.push({ beastId: id, x: sq.x, y: sq.y });
    render();
  })) return;

  if (once('data-rosterdel', i => {
    if (!editorDraft) return;
    editorDraft.roster.splice(Number(i), 1);
    render();
  })) return;

  if (once('data-mapclear', () => {
    remember('quitar el mapa');
    session.field.map = null;
    mapMemory = null;
    try { localStorage.removeItem(MAP_KEY); } catch (e) { /* private mode */ }
    save(); render();
  })) return;

  if (once('data-reveal', v => {
    const [id, what] = v.split(':');
    if (what !== 'on') return;
    const r = session.field.reveal[id] = normaliseReveal(session.field.reveal[id]);
    remember(r.on ? 'ocultar en el tablero' : 'mostrar en el tablero');
    r.on = !r.on;
    save(); render();
  })) return;

  if (t.hasAttribute('data-rest')) {
    if (confirm('¿Descanso largo? Todos vuelven a sus PG máximos y pierden estados.')) {
      remember('descanso largo');
      longRest(); save(); render();
    }
    return;
  }

  if (once('data-bench', ref => {
    const f = session.field, e = session.encounter;
    const benched = f.benched.includes(ref);
    remember(benched ? 'volver a la mesa' : 'quitar de la mesa');
    f.benched = benched ? f.benched.filter(r => r !== ref) : [...f.benched, ref];
    if (!benched) {
      /* Off the board is off any fight it was in too — there is nowhere left
         for a turn to be whosever it is. */
      e.members = e.members.filter(r => r !== ref);
      delete e.init[ref];
      if (e.activeRef === ref) e.activeRef = null;
      /* Off the board is off the *next* fight too, if the picker had it
         ticked — benching from inside musterPicker() must not leave a
         player queued for a fight they were just taken off the table for. */
      if (modal?.kind === 'muster') modal.refs.delete(ref);
    }
    seatAll();
    save(); render();
  })) return;

  if (once('data-turn', v => { remember('cambio de turno'); advance(Number(v)); save(); render(); })) return;

  if (t.hasAttribute('data-endcombat')) {
    if (confirm('¿Terminar el combate? Los PG y los estados de los jugadores se quedan como están.')) {
      remember('terminar el combate');
      endCombat(); save();
      /* Back to the scene if there is one — the fight ended, the tavern did
         not — and to the party if there is not, which is where you go to read
         the wounds when there is nothing else to look at. */
      nav(sceneById(session.field.sceneId) ? 'juego' : 'jugadores');
    }
    return;
  }

  if (once('data-expand', ref => {
    if (openRows.has(ref)) openRows.delete(ref); else openRows.add(ref);
    render();
  })) return;

  if (once('data-quick', v => {
    const at = v.lastIndexOf(':');
    const cb = handleFor(v.slice(0, at));
    if (!cb) return;
    remember(`1 ${v.slice(at + 1) === '+1' ? 'de curación' : 'de daño'} a ${cb.name}`);
    applyDelta(cb, v.slice(at + 1) === '+1' ? '+1' : '1'); save(); render();
  })) return;

  if (once('data-picker', ref => {
    condFor = condFor === ref ? null : ref;
    condShown = null;
    render();
  })) return;

  /* A chip on the card explains itself rather than vanishing: removing a
     condition by brushing past it is the mistake worth preventing. */
  if (once('data-cond', v => {
    const at = v.lastIndexOf(':');
    condFor = v.slice(0, at);
    condShown = v.slice(at + 1);
    render();
  })) return;

  if (once('data-toggle', v => {
    const at = v.lastIndexOf(':');
    const cb = handleFor(v.slice(0, at));
    const key = v.slice(at + 1);
    if (!cb) return;
    const p = cb.play;
    const cond = CONDITION(key);
    remember(`${cond?.es || 'estado'} en ${cb.name}`);
    if (cond?.exh) {
      /* Exhaustion has six levels, so its chip counts up and then clears. */
      p.exh = p.exh >= 6 ? 0 : p.exh + 1;
      p.conditions = p.exh ? [...new Set([...p.conditions, key])] : p.conditions.filter(k => k !== key);
    } else if (p.conditions.includes(key)) {
      p.conditions = p.conditions.filter(k => k !== key);
    } else {
      p.conditions.push(key);
    }
    condShown = key;
    save(); render();
  })) return;

  if (once('data-death', v => {
    const [ref, kind, nth] = v.split(':');
    const cb = handleFor(ref);
    if (!cb) return;
    const d = cb.play.death;
    remember(`salvación de muerte de ${cb.name}`);
    d[kind] = d[kind] === Number(nth) ? Number(nth) - 1 : Number(nth);
    save(); render();
  })) return;

  /* Off the board entirely — cheap to undo, and cheaper still to redo: an npc
     is a spawned copy of a bestiary entry, never the entry itself, so there
     is always more where it came from. Takes it out of a fight too, if it
     was in one, since there is nothing left on the board to be in it. */
  if (once('data-delnpc', id => {
    remember(`quitar ${npcById(id)?.name || 'un PNJ'}`);
    const e = session.encounter;
    session.npcs = session.npcs.filter(n => n.id !== id);
    e.members = e.members.filter(r => r !== 'npc:' + id);
    delete e.init['npc:' + id];
    delete session.field.tokens['npc:' + id];
    delete session.field.reveal[id];
    if (e.activeRef === 'npc:' + id) e.activeRef = null;
    if (selectedToken === 'npc:' + id) selectedToken = null;
    save(); render();
  })) return;

  if (once('data-delbeast', id => {
    remember('borrar un PNJ');
    session.bestiary = session.bestiary.filter(b => b.id !== id);
    save(); render();
  })) return;

  once('data-keep', id => {
    const n = npcById(id);
    if (!n) return;
    session.bestiary.push(normaliseBeast({ ...n, id: newId(), name: n.name.replace(/\s\d+$/, '') }));
    save(); render();
    flash('Guardado en los PNJ.');
  });
});

/* Enter in a damage box applies and clears it, because the next number is
   usually seconds away. Escape backs out of a modal, which is the other thing
   every pair of hands tries without being told. */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && modal) { ev.preventDefault(); closeModal(); return; }
  if (ev.key !== 'Enter') return;

  /* Enter is the whole point of asking one at a time: a number, Enter, the
     next name. On the last one it starts the fight. */
  if (modal?.kind === 'init' && ev.target.matches('input[name="init"]')) {
    ev.preventDefault();
    if (modal.at < modal.queue.length - 1) stepInit(modal.at + 1);
    else document.querySelector('[data-initstart]')?.click();
    return;
  }

  const multi = ev.target.closest('input[data-multi]');
  if (multi) { ev.preventDefault(); if (multi.value.trim()) applyToPicked(multi.value, false); return; }

  const gbox = ev.target.closest('input[data-goldy]');
  if (gbox) {
    ev.preventDefault();
    const cb = handleFor(gbox.getAttribute('data-goldy'));
    if (!cb) return;
    remember(`${gbox.value.trim()} po a ${cb.name}`);
    if (!applyGoldDelta(cb.play, gbox.value)) { undoStack.pop(); flash('No entiendo eso. Prueba 50, +50, -12 o =200.'); return; }
    save();
    render();
    return;
  }

  const box = ev.target.closest('input[data-delta]');
  if (!box) return;
  ev.preventDefault();
  const cb = handleFor(box.getAttribute('data-delta'));
  if (!cb) return;
  remember(`${box.value.trim()} a ${cb.name}`);
  if (!applyDelta(cb, box.value)) { undoStack.pop(); flash('No entiendo eso. Prueba 7, +3, t5 o =11.'); return; }
  save();
  render();
});

document.addEventListener('change', ev => {
  const el = ev.target;

  if (el.matches('input[data-goldy]')) {
    const cb = handleFor(el.getAttribute('data-goldy'));
    if (cb && el.value.trim()) {
      remember(`${el.value.trim()} po a ${cb.name}`);
      if (!applyGoldDelta(cb.play, el.value)) { undoStack.pop(); flash('No entiendo eso. Prueba 50, +50, -12 o =200.'); }
    }
    save(); render();
    return;
  }

  if (el.matches('[data-inventory]')) {
    const cb = handleFor(el.getAttribute('data-inventory'));
    if (cb) { cb.play.inventory = el.value; save(); }
    return;
  }

  if (el.matches('input[data-delta]')) {
    const cb = handleFor(el.getAttribute('data-delta'));
    if (cb && el.value.trim()) {
      remember(`${el.value.trim()} a ${cb.name}`);
      if (!applyDelta(cb, el.value)) { undoStack.pop(); flash('No entiendo eso. Prueba 7, +3, t5 o =11.'); }
    }
    save(); render();
    return;
  }

  if (el.matches('input[data-init]')) {
    const ref = el.getAttribute('data-init');
    const e = session.encounter;
    remember('iniciativa');
    /* Clearing the box means "not rolled yet", not "not in the fight" —
       leaving is the ✕ on the card, which is a different intention. */
    if (el.value.trim() === '') delete e.init[ref];
    else e.init[ref] = Number(el.value);
    save(); render();
    return;
  }

  if (el.matches('[data-note]')) {
    const cb = handleFor(el.getAttribute('data-note'));
    if (cb) { cb.play.note = el.value; save(); }
    return;
  }

  if (el.matches('[data-abname]')) {
    const row = modal?.abilities?.[Number(el.getAttribute('data-abname'))];
    if (row) row.name = el.value;
    return;
  }

  if (el.matches('[data-abdesc]')) {
    const row = modal?.abilities?.[Number(el.getAttribute('data-abdesc'))];
    if (row) row.desc = el.value;
    return;
  }

  if (el.matches('[data-field]')) {
    const f = session.field;
    f.cols = Math.min(60, Math.max(4, Number(el.value) || 24));
    f.rows = deriveRows(f.cols, fieldAspect());
    /* Shrinking the field must not leave anybody standing outside it. */
    for (const p of Object.values(f.tokens)) { p.x = clampCol(f, p.x); p.y = clampRow(f, p.y); }
    save(); render();
    return;
  }

  if (el.matches('select[data-reveal]')) {
    const id = el.getAttribute('data-reveal').split(':')[0];
    remember('salud que enseña');
    const r = session.field.reveal[id] = normaliseReveal(session.field.reveal[id]);
    r.hp = el.value;
    save(); render();
    return;
  }

  /* -------------------------------------------------------------- editor
     None of this touches `session` or `save()`: it is a draft, and nothing
     here is real until Guardar. */
  if (el.matches('[data-escfield]') && editorDraft) {
    const d = editorDraft, key = el.getAttribute('data-escfield');
    if (key === 'name') d.name = el.value;
    else if (key === 'note') d.note = el.value;
    render();
    return;
  }

  if (el.matches('select[data-escart]') && editorDraft) {
    const d = editorDraft, src = el.value;
    d.art = src ? normaliseArt({ src }) : null;
    render();
    return;
  }

  if (el.matches('input[data-escgrid]') && editorDraft) {
    const d = editorDraft;
    /* Kept as typed, not yet clamped — Guardar's own normaliseScene() pass is
       what decides a blank box is no override at all. */
    d.grid = el.value.trim() ? { cols: el.value } : null;
    render();
    return;
  }

  if (el.matches('[data-escaudiosrc]') && editorDraft) {
    const d = editorDraft, key = el.getAttribute('data-escaudiosrc'), src = el.value;
    const layers = { music: d.audio?.music || null, ambience: d.audio?.ambience || null };
    layers[key] = src ? normaliseLayer({ src, volume: .5 }) : null;
    d.audio = normaliseAudio(layers);
    render();
    return;
  }

  if (el.matches('input[data-escaudiovol]') && editorDraft) {
    const d = editorDraft, key = el.getAttribute('data-escaudiovol');
    if (d.audio?.[key]) d.audio[key].volume = Math.min(1, Math.max(0, Number(el.value) || 0));
    render();
    return;
  }

  if (el.matches('[data-npc]')) {
    const [id, field] = el.getAttribute('data-npc').split(':');
    const n = npcById(id);
    if (!n) return;
    /* A note is not an undo step, the same as a player's note is not one:
       twenty-five deep is for the numbers you said out loud, and a paragraph
       typed into a monster would push them all out. */
    if (field !== 'note') remember(`editar ${n.name}`);
    if (field === 'hpMax') {
      /* Raising the maximum on a monster that has not been hurt yet has to
         raise its hit points too. Clamping in one direction only left a goblin
         you had just decided was tougher standing at 7 of 20 — wounded before
         the fight began, which is what "adding hit points does nothing" looks
         like. One already bleeding keeps its wound. */
      const was = Math.max(0, n.hpMax || 0);
      const untouched = (n.hp ?? was) >= was;
      n.hpMax = Math.max(1, Number(el.value) || 0);
      n.hp = untouched ? n.hpMax : Math.min(n.hp ?? n.hpMax, n.hpMax);
    } else {
      n[field] = (field === 'name' || field === 'note') ? el.value : Number(el.value) || 0;
    }
    save(); render();
  }
});

/* The volume slider repaints live and commits on release: re-rendering the
   whole screen on every pixel of a drag would tear the slider out from under
   the thumb. */
document.addEventListener('input', ev => {
  const el = ev.target;

  /* A filter box has to feel live, but every screen is rewritten wholesale
     on render — so render() would tear the caret out of the box you are
     still typing in. Remember where it was and put it back. */
  if (el.matches('[data-filter]')) {
    const key = el.getAttribute('data-filter'), pos = el.selectionStart;
    if (key === 'scenes') sceneFilter = el.value;
    else if (key === 'beasts') beastFilter = el.value;
    else if (key === 'story') storyFilter = el.value;
    else if (key === 'muster' && modal?.kind === 'muster') modal.filter = el.value;
    render();
    const again = document.querySelector(`[data-filter="${key}"]`);
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    return;
  }

  /* Repaint the number in place, push to the television on every pixel
     because the television *is* the preview, and write the setting down
     on release. It does not touch the session at all. */
  if (el.matches('[data-master]')) {
    audioPrefs.master = Math.min(1, Math.max(0, Number(el.value) || 0));
    const out = el.parentElement.querySelector('b');
    if (out) out.textContent = Math.round(audioPrefs.master * 100) + '%';
    syncBoard();
    return;
  }
});

document.addEventListener('change', ev => {
  if (ev.target.matches('[data-master]')) saveAudioPrefs();
});

/* The one form left in the file. Enter in any of its boxes submits it, because
   the wizard is a thing you finish rather than a panel you leave open. */
document.addEventListener('submit', ev => {
  const form = ev.target;
  if (!form.matches('[data-beast]')) return;
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(form));
  if (!String(f.name || '').trim()) return;

  /* Editing an existing monster keeps the file it came from — normaliseBeast
     alone would drop it, since the form never carries a path. */
  const existing = modal.beastId ? session.bestiary.find(b => b.id === modal.beastId) : null;
  const beast = normaliseBeast({
    name: f.name, tag: f.tag, ac: f.ac, hpMax: f.hpMax, initMod: f.initMod, note: f.note,
    abilities: modal.abilities, portrait: modal.portrait, file: existing?.file ?? null });

  const i = modal.beastId ? session.bestiary.findIndex(b => b.id === modal.beastId) : -1;
  if (i >= 0) {
    remember(`editar ${beast.name}`);
    session.bestiary[i] = { ...beast, id: modal.beastId };
  } else {
    remember('guardar un PNJ');
    session.bestiary.push(beast);
  }
  modal = null;
  save(); render();
  flash('Guardado en los PNJ.');
});

/** `Goblin ×3` becomes Goblin 1, 2 and 3, each with its own hit points. */
/** `Goblin ×3` becomes Goblin 1, 2 and 3, each with its own hit points, the
    moment they are loaded — not the moment they join a fight, which is a
    separate decision made later, on the muster or the board, by ticking one
    in. Nothing here touches `session.encounter`. */
function loadNpc(beast, count) {
  const created = [];
  for (let i = 1; i <= count; i++) {
    const n = normaliseBeast({ ...beast, id: newId(), name: count > 1 ? `${beast.name} ${i}` : beast.name });
    session.npcs.push(Object.assign(n, blankPlay(), { hp: n.hpMax }));
    created.push('npc:' + n.id);
  }
  seatAll();
  return created;
}

for (const id of ['import-file', 'map-file']) {
  document.getElementById(id).addEventListener('change', ev => {
    readFiles(ev.target.files);
    ev.target.value = '';
  });
}

const portraitInput = document.getElementById('portrait-file');
portraitInput.addEventListener('change', ev => {
  const file = ev.target.files?.[0];
  if (file) readPortrait(file, stamp => applyPortrait(portraitInput.dataset.target, stamp));
  ev.target.value = '';

/* A portrait's own drop target, not the board's document-wide one — that one
   is for the battlemap and would otherwise swallow this gesture too. */
document.addEventListener('dragover', ev => {
  if (ev.target.closest('[data-portrait]')) ev.preventDefault();
});
document.addEventListener('dragenter', ev => {
  const w = ev.target.closest('[data-portrait]');
  if (w) { ev.preventDefault(); w.classList.add('drag'); }
});
document.addEventListener('dragleave', ev => {
  ev.target.closest('[data-portrait]')?.classList.remove('drag');
});
document.addEventListener('drop', ev => {

  if (!w) return;

  ev.stopImmediatePropagation();

  if (file) readPortrait(file, stamp => applyPortrait(w.dataset.portrait, stamp));
});

/* The folder pick is its own input because it reads a whole tree rather than
   one file, and what it does with what it finds is nothing like an import:
   scene files are parsed, assets are only counted and named. */
document.getElementById('scan-dir').addEventListener('change', ev => {
  scanFolder(ev.target.files);
  ev.target.value = '';
});

/* --------------------------------------------------- dragging on the field
   Pointer events rather than HTML5 drag-and-drop, the same choice the
   television made and for the same reasons: one path for mouse and touch, no
   drag ghost, and no re-render in the middle of the gesture. The token is
   moved with a transform while the hand is down and only committed to the
   session on release, so a drag costs one render rather than sixty.

   A move is deliberately **not** an undo step. Undo is twenty-five deep and
   it is for the numbers you said out loud; a dragged token undoes by being
   dragged back, which is the same gesture that made the mistake. Nor does the
   television record its own drags, so this keeps the two boards honest with
   each other.
====================================================================== */
let tdrag = null;

/** Which square a point is over. The containing block of an absolutely
    positioned child is the *padding* box, so the border comes off both the
    origin and the length — a 1 px border is a tenth of a square at this size
    and the drop lands next door without it. */
function miniCellAt(grid, clientX, clientY) {
  /* The real field is always session.field's own size, but the scene
     editor's Reparto board can be a different size now that a scene may
     override it — data-cols/data-rows on the grid itself is what
     rosterFieldHTML() sets it to, so this reads whichever board it was
     actually handed rather than assuming there is only ever one. */
  const cols = Number(grid.dataset.cols) || session.field.cols;
  const rows = Number(grid.dataset.rows) || session.field.rows;
  const r = grid.getBoundingClientRect();
  const b = parseFloat(getComputedStyle(grid).borderLeftWidth) || 0;
  const w = (r.width - 2 * b) / cols, h = (r.height - 2 * b) / rows;
  const x = Math.floor((clientX - r.left - b) / w), y = Math.floor((clientY - r.top - b) / h);
  if (x < 0 || y < 0 || x >= cols || y >= rows) return null;
  return { x, y };
}

document.addEventListener('pointerdown', ev => {
  const tok = ev.target.closest('[data-mtoken],[data-rtoken]');
  if (!tok) return;
  /* The scene editor's roster grid shares this whole drag machinery — same
     cell math, same drag feel — but writes into editorDraft.roster instead
     of session.field.tokens, since nothing there is real until Guardar. */
  const roster = tok.hasAttribute('data-rtoken');
  const grid = tok.closest(roster ? '[data-rosterfield]' : '[data-minifield]');
  if (!grid) return;
  ev.preventDefault();
  tok.setPointerCapture(ev.pointerId);
  tdrag = { roster, ref: roster ? null : tok.getAttribute('data-mtoken'),
            idx: roster ? Number(tok.getAttribute('data-rtoken')) : null,
            el: tok, grid, x0: ev.clientX, y0: ev.clientY, moved: false };
  tok.classList.add('grabbed');
});

document.addEventListener('pointermove', ev => {
  if (!tdrag) return;
  const dx = ev.clientX - tdrag.x0, dy = ev.clientY - tdrag.y0;
  if (Math.hypot(dx, dy) > 4) tdrag.moved = true;
  tdrag.el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  const cell = miniCellAt(tdrag.grid, ev.clientX, ev.clientY);
  const mark = tdrag.grid.querySelector('.target');
  if (!mark) return;
  mark.hidden = !cell || !tdrag.moved;
  if (cell) mark.style.cssText =
    `left:calc(${cell.x} * var(--sq));top:calc(${cell.y} * var(--sqy));` +
    'width:var(--sq);height:var(--sqy)';
});

document.addEventListener('pointerup', ev => {
  if (!tdrag) return;
  const d = tdrag; tdrag = null;
  d.el.classList.remove('grabbed');
  d.el.style.transform = '';

  /* A tap that did not travel is a selection, not a move: it lights what that
     combatant could cross, which is the payoff for a measured grid. The
     roster grid has no reach to show and nothing to select — a tap there
     that goes nowhere is just a tap. */
  if (!d.moved) {
    if (!d.roster) selectedToken = selectedToken === d.ref ? null : d.ref;
    render(); return;
  }

  const cell = miniCellAt(d.grid, ev.clientX, ev.clientY);
  if (!cell) { render(); return; }

  if (d.roster) {
    const r = editorDraft?.roster[d.idx];
    if (r) { r.x = cell.x; r.y = cell.y; }
    render();
    return;
  }

  const at = session.field.tokens[d.ref];
  if (at) {
    if (at.x !== cell.x || at.y !== cell.y) {
      at.x = cell.x; at.y = cell.y;
      save();                          // which is what pushes it to the television
    }
  }
  render();
});

/* The whole board is a drop target: dragging three sheets onto it is how a
   session starts, and a file input alone hides that. */
let dragDepth = 0;
document.addEventListener('dragenter', ev => {
  ev.preventDefault();
  if (++dragDepth === 1) document.body.classList.add('dragging');
});
document.addEventListener('dragover', ev => ev.preventDefault());
document.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
});
document.addEventListener('drop', ev => {
  ev.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  readFiles(ev.dataTransfer?.files);
});

/* ------------------------------------------------------------------ boot
   Land in the fight if there is one, on the party if there is not. */
if (session.encounter.on) screen = 'juego';
seatAll();
syncBoard();                         // so a television opened first is not blank, unless paused mid-prep
render();
</script>
