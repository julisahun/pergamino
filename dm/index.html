  e.members = [...new Set(refs)].filter(r => handleFor(r));
  e.on = e.members.length > 0;
  e.round = 1;
  e.activeRef = null;
  e.init = {};
  for (const [ref, v] of (inits || [])) {
    if (e.members.includes(ref) && Number.isFinite(v)) e.init[ref] = v;
  }
  /* Combat is a state of the game, not a mode of the television: starting one
     does not touch the grid. Whatever the DM had the TV showing — full-bleed
     art or tokens on a battlemap — it goes on showing, and buildBoard() is
     what decides what a running fight still owes the players in either case. */
  session.field.live = true;
  seatAll();
}

/** Bookkeeping only: who is in the fight, whose turn it is, what round it is.
    None of that is a fact about who exists — an npc loaded for this fight is
    exactly as loaded after it as before, still standing where it was, still
    revealed or not however the DM last left it. Only combat's own state
    resets. */
function endCombat() {
  session.encounter = { on: false, round: 1, activeRef: null, members: [], init: {} };
  rolled.clear();                    // the next fight asks the table again
}

/* ==================================================================== BOARD
   The television. `tablero.html` is a second file:// page in the same Chrome,
   which means it shares this localStorage — that is the whole channel. No
   server, no network, nothing to configure.

   What travels is a *projection*, never the session: only what the players
   are allowed to see, already filtered. A hidden monster is absent from the
   payload rather than merely unrendered, so it cannot leak by opening the
   television window's devtools, and tablero.html needs no rules data and no
   engine — it is a renderer with nothing to reason about.

   Positions are the one thing that flows the other way: the television writes
   x and y back and bumps the revision, and boardPoll() folds them in here.
   Each side remembers the last revision it wrote and ignores that echo, which
   is what stops the two of them ringing at each other.
====================================================================== */

const BOARD_KEY = 'dnd-dm-board';
const MAP_KEY = 'dnd-dm-map';
const REV_KEY = 'dnd-dm-rev';
const AUDIO_KEY = 'dnd-dm-audio';

/* How loud the room is, over the top of whatever mix the live scene carries.
   Its own key, and deliberately not in the session: it is neither prep nor
   play state but a property of the machine and the television it is plugged
   into, so it must not ride along in mesa.json to a different room — and,
   more to the point, must not be in the snapshots undo takes. Correcting a
   damage roll should not also move the volume back. */
function loadAudioPrefs() {
  try {
    const r = JSON.parse(localStorage.getItem(AUDIO_KEY) || 'null');
    const m = Number(r?.master);
    return { master: Number.isFinite(m) ? Math.min(1, Math.max(0, m)) : .7,
             muted: r?.muted === true };
  } catch (e) { return { master: .7, muted: false }; }
}

let audioPrefs = loadAudioPrefs();

function saveAudioPrefs() {
  try { localStorage.setItem(AUDIO_KEY, JSON.stringify(audioPrefs)); } catch (e) { /* private mode */ }
}

/* One colour per player, in import order. Monsters are all the one ink, so a
   glance at the field separates "us" from "them" before any name is read. */
const TOKEN_COLOURS = Object.freeze(['#2f6f4e', '#2d5f8a', '#7b3f9d', '#a8621b', '#146a72', '#8a2f4a']);

let myRev = 0;                       // the last revision this window wrote

/** The five words the players get instead of a number. */
function coarseWord(hp, max) {
  if (hp <= 0) return 'fuera de combate';
  const pct = max ? hp / max : 1;
  if (pct >= 1) return 'ileso';
  if (pct > .5) return 'herido';
  if (pct > .25) return 'malherido';
  return 'grave';
}

function tokenHP(cb, mode) {
  const max = Math.max(0, cb.hpMax || 0);
  const hp = currentHP(cb);
  if (mode === 'none') return null;
  if (mode === 'exact') return { mode: 'exact', cur: hp, max, pct: max ? hp / max : 0 };
  return { mode: 'coarse', word: coarseWord(hp, max), pct: max ? hp / max : 0 };
}

function buildBoard() {
  const f = session.field;
  const e = session.encounter;
  const order = inOrder();
  const active = order.find(o => o.ref === e.activeRef);
  const colourOf = ref => ref.startsWith('pc:')
    ? TOKEN_COLOURS[session.party.findIndex(c => 'pc:' + c.id === ref) % TOKEN_COLOURS.length]
    : null;

  const tokens = [];
  for (const [ref, at] of Object.entries(f.tokens)) {
    const cb = handleFor(ref);
    if (!cb) continue;
    /* An npc's ◉/○ decides whether it is in the payload at all, in or out of
       a fight — a hidden threat and a hidden bartender are staged off-screen
       for the same reason. A player is never staged; there is nothing to
       decide. Once it is in, whether its *card* shows — hit points,
       conditions — is a second, separate question: only a fight owes the
       table that, so a loaded npc nobody has put into one yet reads as pure
       scenery, exactly like a player never has that gate at all. */
    let hp = null, conditions = [];
    if (cb.kind === 'npc') {
      const r = f.reveal[cb.id] || normaliseReveal(null);
      if (!r.on) continue;
      if (e.members.includes(ref)) {
        hp = tokenHP(cb, r.hp);
        conditions = cb.play.conditions.map(k => CONDITION(k)?.es).filter(Boolean);
      }
    } else {
      hp = tokenHP(cb, 'exact');
      conditions = cb.play.conditions.map(k => CONDITION(k)?.es).filter(Boolean);
    }
    tokens.push({
      id: ref, name: cb.name, kind: cb.kind, colour: colourOf(ref),
      /* The one place a portrait's actual bytes enter the board payload: the
         TV window never sees the character or bestiary objects, only this.
         Downscaled to 512 px already, so this stays a bounded exception to
         "big bytes never enter the payload" rather than the map's problem. */
      portrait: portraitSrc(cb.portrait),
      x: at.x, y: at.y,
      active: ref === e.activeRef,
      hp, conditions,
      /* Squares this one can cross in a move, so selecting a token shows its
         reach. 5e 2024 counts a diagonal as one square, hence Chebyshev. Not
         gated on being in a fight — planning a position is useful before one
         starts too. */
      reach: cb.speed != null ? Math.round(cb.speed / 1.5) : null,
    });
  }

  /* A place or a battlemap, and nothing else distinguishes them — this is
     purely the grid toggle now, not whether a fight happens to be running.
     In 'scene' the television draws the art full-bleed and has no grid to put
     a token on, so tokens never travel in that mode regardless of combat.

     Only the *live* scene's path travels. The library never does — which is what
     keeps a filename like assets/emboscada-trolls.jpg out of a payload the
     players' window can be made to cough up, the same rule a hidden monster
     already obeys. */
  const mode = !f.live ? 'idle' : f.grid ? 'field' : 'scene';

  /* Three independent facts, not a chain: being on the board is what puts
     you in the HUD at all, grid is what puts a token on the screen, and
     combat is what puts an hp hint on an npc's HUD row. None of the three
     gates any of the others — a player or npc who is loaded shows in the
     roster whether or not there is a grid or a fight; combat only decides
     whether an npc's row says anything about hit points. */
  const audio = f.live && f.audio
    ? { ...f.audio, master: audioPrefs.muted ? 0 : audioPrefs.master }
    : null;

  return {
    rev: myRev,
    cols: f.cols, rows: f.rows,
    mode,
    map: f.map,
    audio,
    /* The turn banner and order strip are combat's own data, not a HUD
       visibility switch — they are null because there is no round or turn
       to report, the same reason an npc's hp is null outside a fight. */
    banner: e.on && order.length ? { round: e.round, active: active ? active.cb.name : null } : null,
    order: e.on ? order.map(o => {
      const revealed = o.cb.kind !== 'npc' || (f.reveal[o.cb.id] || {}).on;
      return {
        name: revealed ? o.cb.name : '···',
        /* A hidden monster's face is exactly as secret as its name — a
           portrait would put the goblin back in the payload the name just
           took it out of. */
        portrait: revealed ? portraitSrc(o.cb.portrait) : null,
        kind: o.cb.kind, active: o.ref === e.activeRef,
        down: skippable(o.cb),
      };
    }) : [],
    /* On the game, period — a benched player is the one exception, since
       being off the board is the whole point of a bench. */
    party: partyHandles().filter(cb => !f.benched.includes(cb.ref)).map((cb, i) => ({
      name: cb.name, colour: TOKEN_COLOURS[i % TOKEN_COLOURS.length],
      portrait: portraitSrc(cb.portrait),
      hp: currentHP(cb), hpMax: Math.max(0, cb.hpMax || 0), temp: cb.play.temp || 0,
      state: cb.broken.length ? '' : currentHP(cb) <= 0 ? 'inconsciente' : '',
    })),
    /* An npc's own HUD row: reveal decides whether it is here at all, the
       same gate a token already gets — combat decides only whether it says
       anything about hit points. */
    npcs: session.npcs.filter(n => (f.reveal[n.id] || normaliseReveal(null)).on).map(n => {
      const cb = npcHandle(n);
      const inCombat = e.members.includes('npc:' + n.id);
      return {
        name: cb.name, portrait: portraitSrc(cb.portrait),
        hp: inCombat ? tokenHP(cb, (f.reveal[n.id] || normaliseReveal(null)).hp) : null,
      };
    }),
    /* Tokens are the one thing that stays grid-only even mid-fight: there is
       no board to place one on under full-bleed art. */
    tokens: mode === 'field' ? tokens : [],
  };
}

function pushBoard() {
  try {
    myRev = Date.now();
    const board = buildBoard();
    localStorage.setItem(BOARD_KEY, JSON.stringify(board));
    localStorage.setItem(REV_KEY, String(myRev));
  } catch (e) { /* private mode, or a map that will not fit */ }
}

/** Every place that used to call pushBoard() straight after changing
    something calls this instead: the one gate `field.paused` has to pass
    through to reach the television. Pausing does not touch what the
    television already has — it just stops handing it anything new — so
    three goblins dragged into position one at a time never trickle onto the
    players' screen; **Enviar al tablero** is what turns `paused` back off
    and pushes everything that piled up while it was on, in a single write. */
function syncBoard() {
  if (!session.field.paused) pushBoard();
}

/* The television may move a token. Nothing else about the payload is ever
   read back, so this is the whole of the return path. */
let lastSeenRev = 0;
function boardPoll() {
  let rev;
  try { rev = Number(localStorage.getItem(REV_KEY)) || 0; } catch (e) { return; }
  if (rev === myRev || rev === lastSeenRev) return;
  lastSeenRev = rev;
  let board;
  try { board = JSON.parse(localStorage.getItem(BOARD_KEY) || 'null'); } catch (e) { return; }
  if (!board || !Array.isArray(board.tokens)) return;

  let moved = false;
  for (const t of board.tokens) {
    const at = session.field.tokens[t.id];
    if (!at) continue;
    const x = clampCol(session.field, t.x), y = clampRow(session.field, t.y);
    if (at.x !== x || at.y !== y) { at.x = x; at.y = y; moved = true; }
  }
  if (!moved) return;
  updateExplored();
  try { localStorage.setItem(DM_KEY, JSON.stringify(session)); } catch (e) { /* private mode */ }
  myRev = rev;                       // adopt it rather than bouncing a new one back
  /* The small field is on screen during a fight, so a token dragged on the
     television has to land on it too — but never under a caret: this fires
     five times a second, and a re-render mid-number would eat the digits. */
  const box = document.activeElement;
  const typing = box && box.matches && box.matches('input, textarea');
  if (!typing && !tdrag && screen === 'juego' && session.encounter.on) render();
}

setInterval(boardPoll, 200);

/* ------------------------------------------------------------------ router */
/** Step 0. Nothing else in this file has anywhere honest to put a party or a
    scene until a campaign folder is picked, so this screen replaces the
    tabs entirely rather than landing on an empty Juego — the same reason the
    tabs never render here: a count of zero on five tabs would look like a
    campaign that loaded wrong, not one that has not loaded yet. */
function campaignGateScreen() {
  return `<main class="gate"><section class="panel">
    <h1>Mesa del DM</h1>
    <p class="muted">Antes de nada — ¿qué campaña vamos a jugar?</p>
    <div class="quickadd" style="margin-top:1rem">
      <button class="primary" data-scan="1">Cargar campaña</button>
      <button class="ghost" data-newcampaign="1">Nueva campaña</button>
    </div>
    <p class="muted" style="font-size:.85rem;margin-top:1rem">
      <b>Cargar campaña</b> lee una carpeta que ya tiene <code>scenarios/</code>,
      <code>assets/</code>, <code>story/</code>, <code>players/</code> o
      <code>monsters/</code>. <b>Nueva campaña</b> crea esas carpetas vacías donde
      tú elijas, dentro de <code>campaigns/</code>, y las deja listas para editar
      desde aquí.</p>
  </section></main>`;
}

function render() {
  document.getElementById('app').innerHTML = (
    !campaign.name         ? campaignGateScreen() :
    screen === 'juego'     ? juegoScreen() :
    screen === 'monstruos' ? bestiaryScreen() :
    screen === 'escenas'   ? escenasScreen() :
    screen === 'story'     ? storyScreen() : tableScreen()
  ) + modalView();
  /* A modal that opens without the caret in it is a modal you have to click
     twice. Only for the two you type into. The initiative box is selected as
     well as focused, so stepping back onto a number you already wrote replaces
     it with the next keystroke instead of appending to it. */
  const typed = document.querySelector('.modal input[name="name"], .modal input[name="init"]');
  typed?.focus();
  if (typed?.name === 'init') typed.select();
}

function nav(to) {
  screen = to;
  condFor = null;
  modal = null;
  selectedToken = null;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function closeModal() { modal = null; render(); }

/* The header is the same controls on every screen — undo, opening the
   television, reloading from disk, and the two saves — none of them about
   any one view, all of them reached for constantly enough that hunting for
   them on whichever screen happens to be up would be worse than a header
   that never changes.
   Everything else a screen needs is that screen's own to show, in its panel:
   a scene's Buscar campaña sits by Nueva escena, Terminar combate sits in the
   fight's own endbar, and so on — one bar that is always the same, instead of
   one that silently swapped buttons under you tab to tab. */
function topBar(title, sub) {
  const paused = session.field.paused;
  return `<header class="top">
    <h1>${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</h1>
    <div class="actions">
      ${undoStack.length ? `<button data-undo="1" class="ghost" title="Deshacer: ${esc(undoStack[undoStack.length - 1].label)}">⟲</button>` : ''}
      <button class="ghost${paused ? ' on' : ''}" data-pauseboard="1" title="${paused
        ? 'Envía a la mesa todo lo que has cambiado desde que se pausó'
        : 'La mesa deja de enterarse de lo que cambias, hasta que lo envíes tú'}">${
        paused ? '▶ Enviar al tablero' : '⏸ Pausar tablero'}</button>
      <button data-opentv="1">Tablero ↗</button>
      <button class="ghost" data-scan="1" title="Vuelve a leer players/, monsters/, scenarios/ y story/ de la carpeta de la campaña">Recargar campaña</button>
      <button class="ghost" data-export="1" title="Descarga mesa.json y lo escribe también en la carpeta de la campaña">Guardar sesión</button>
      <button class="ghost" data-savecampaign="1" title="Escribe jugadores, PNJ y escenas en la carpeta de la campaña">Guardar campaña</button>
    </div>
    ${paused ? `<div class="pausedbar">⏸ La mesa está congelada donde la dejaste — nada de lo que
      cambies aquí llega hasta que pulses <b>Enviar al tablero</b>.</div>` : ''}
  </header>` + tabs() + (showTV ? tvPanel() : '');
}

function tvPanel() {
  const f = session.field;
  const src = mapSrc();
  return `<div class="tvpanel">
    <div class="fieldbar">
      ${f.grid ? `<label>Columnas <input type="number" data-field="cols" min="4" max="60" value="${f.cols}"></label>
      <span class="muted" style="font-size:.78rem">${f.rows} filas · ${metres(f.cols * 1.5)} × ${metres(f.rows * 1.5)} m</span>` : ''}
      <span class="spacer"></span>
      <button class="small ghost" data-mapfile="1">${f.map ? 'Cambiar mapa' : 'Poner un mapa'}</button>
      ${f.map ? '<button class="small ghost" data-mapclear="1">Quitar</button>' : ''}
    </div>
    ${f.map && src ? `<div class="fieldbar maptune"><img class="mapthumb" src="${src}" alt=""></div>`
    : `<p class="muted tvhint">Suelta una imagen (<code>.png</code>, <code>.jpg</code>) en cualquier
      parte para usarla de mapa. Se reduce a 1920 px de ancho antes de guardarla.</p>`}
    ${audioBar()}
    <p class="muted tvhint">Las fichas se colocan solas. Se arrastran en el tablero, no aquí.</p>
  </div>`;
}

/* The volume lives beside the map sliders because it is the same kind of thing:
   something you set once while the players are still arguing about marching
   order, and then forget. What it does *not* do is name the files — the mix is
   the scene's, and the scene is where you edit it. */
function audioBar() {
  const a = session.field.audio;
  const pct = Math.round(audioPrefs.master * 100);
  const layers = !a ? '' : [
    a.music ? `música ${Math.round(a.music.volume * 100)}%` : '',
    a.ambience ? `ambiente ${Math.round(a.ambience.volume * 100)}%` : '',
  ].filter(Boolean).join(' · ');
  return `<div class="fieldbar">
    <button class="small ghost${audioPrefs.muted ? ' on' : ''}" data-mute="1"
      title="${audioPrefs.muted ? 'Quitar el silencio' : 'Silenciar el tablero'}">${
      audioPrefs.muted ? '🔇' : '🔊'}</button>
    <label style="flex:1 1 12rem;min-width:0">Volumen
      <input type="range" data-master="1" min="0" max="1" step="0.01"
        value="${audioPrefs.master}"${audioPrefs.muted ? ' disabled' : ''}>
      <b>${pct}%</b></label>
    <span class="muted" style="font-size:.78rem">${
      /* Three states, and "sin escena" is its own: the board is live and there
         is simply nothing there to have a mix, which is not the same as a
         scene that was prepared without one. */
      !session.field.live ? 'Nada en el tablero'
      : !session.field.sceneId ? 'Sin escena, sin sonido'
      : a ? esc(layers) : 'Esta escena no trae sonido'}</span>
  </div>
  <p class="muted tvhint">El sonido sale por el tablero, no por aquí. La primera vez hay que
    <b>tocar una vez en la ventana del tablero</b>: Chrome no deja sonar nada hasta que
    alguien la ha tocado. Ella misma lo pide si hace falta.</p>`;
}

function tabs() {
  const fighting = session.encounter.on ? session.encounter.members.length : 0;
  const tab = (key, label, count) => `<button data-nav="${key}"${
    screen === key ? ' aria-current="true"' : ''}>${esc(label)}${
    count ? ` <span class="n">${count}</span>` : ''}</button>`;
  return `<nav class="tabs">
    ${tab('juego', 'Juego', fighting)}
    ${tab('jugadores', 'Jugadores', session.party.length)}
    ${tab('monstruos', 'PNJ', session.bestiary.length)}
    ${tab('escenas', 'Escenas', library.scenes.length)}
    ${tab('story', 'Historia')}
  </nav>`;
}

/* ================================================================== MESA
   The party out of combat: who is hurt, who is conditioned, and every number
   a DM looks up without asking the player to read their own sheet aloud.
========================================================================= */

function tableScreen() {
  const party = partyHandles();
  return topBar('Jugadores', `${party.length} personaje${party.length === 1 ? '' : 's'}`) +
    `<main><section class="panel">
      <div class="quickadd">
        <button data-import="1" class="ghost">Importar</button>
        ${party.length ? '<button data-rest="1" class="ghost">Descanso largo</button>' : ''}
      </div>
      ${party.length ? `<div class="board">${party.map(cb => cbCard(cb, { bench: true })).join('')}</div>`
      : `<div class="drop" data-import="1">
          <b>Arrastra aquí las fichas de tus jugadores</b>
          Los <code>.json</code> que exporta el creador de personajes. También puedes
          <button class="link" data-import="1">elegir los archivos</button>.
          <p class="muted" style="font-size:.85rem;margin:.8rem 0 0">
            Cada ficha trae sus propios números: PG, CA, iniciativa, percepción pasiva.
            Si un jugador cambia su ficha, vuelve a importarla y se actualiza sin perder
            los PG que lleve.</p>
        </div>`}
    </section></main>` + pickBar();
}

/* ================================================================= JUEGO

   One tab for everything that is on the television: which place the players are
   looking at, and — when it comes to that — the fight standing on it. The
   scene library itself lives in its own tab, Escenas; this one is only ever
   the live table.

   Three branches. Before anything has ever gone live there is nothing to
   show a board of, so scenePanel() carries the whole picture on its own,
   hero image and all. Once a scene (or "sin escena") has gone live once,
   the other two both wear the same shape — Jugadores | midBoard() | PNJ,
   the same `.sides` grid — because who is loaded on the board is a fact
   independent of whether a fight is running: rosterRow() is prep, not a
   membership control, and cbCard()s in a column are whoever is in the fight
   running now. Nothing here deletes an npc; only + and ✕ do that, wherever
   they show up.

     nothing live   scenePanel() alone, empty, with a pointer at Escenas
     not fighting   Jugadores | midBoard() | PNJ, plain rows either side
     fighting       Jugadores | midBoard() | PNJ, full cards for whoever
                    is in this fight, tick-rows for whoever else is loaded

   Combat is still a thing you start, and the muster is still where you press
   Empezar combate — but who is in it is asked fresh, in musterPicker(), every
   time that button is pressed, never assumed from what is loaded on the board.
========================================================================= */

function juegoScreen() {
  if (session.encounter.on) return fightScreen();
  if (!session.field.live) return nothingLiveScreen();
  return musterScreen();
}

/** Nothing is up on the television. Opens the same scenePicker() modal
    sceneBar() does, over Juego rather than away from it — choosing what goes
    live is play, not library upkeep, so it never leaves this tab. */
function nothingLiveScreen() {
  return topBar('Juego', 'nada en el tablero') +
    `<main><section class="panel">
      ${scenePanel()}
    </section></main>` + pickBar();
}

/** The scene, wherever Juego needs it: the same panel whether nothing has
    ever gone live, the board is bare grid with no scene on it, or a scene is
    sitting there — muster and fight alike show it, at the same size, so
    starting or ending combat never makes the place the players are looking
    at jump around. */
function scenePanel() {
  return session.field.sceneId ? sceneBar() : sceneEmptyPanel();
}

/** No scene on the table. A dashed invitation rather than a footnote, because
    "what does the television show" is the first question of a session, not
    an afterthought under the muster. */
function sceneEmptyPanel() {
  const f = session.field;
  return `${stagedStrip()}
    <div class="drop scenepanel-empty" data-scenes="1">
      <b>Ninguna escena en la mesa</b>
      <button class="primary" data-scenes="1">Fijar escena</button>
      <p class="muted" style="font-size:.85rem;margin:.8rem 0 0">
        Elige una en <button class="link" data-scenes="1">Escenas</button>.${
        f.live ? '' : ` O empieza sin ninguna: <button class="link" data-golive="">sin escena · solo cuadrícula</button>.`}</p>
    </div>`;
}

/** The landing state, and a picture-first one: a scene *is* an image, so a list
    of names would have you opening three of them to find the tavern. */
function escenasScreen() {
  return editingSceneId ? sceneEditor() : sceneLibrary();
}

/** Escenas is the library, not the table: what you do here is write and edit
    scenes, never decide what is on the television right now. Putting one up
    or preparing it happens from Juego — sceneBar()'s "Cambiar escena" and
    nothingLiveScreen() both open the same scenePicker() modal, over the game
    screen rather than away from it — so this tab has no golive/stage buttons
    and no staged strip of its own. */
function sceneLibrary() {
  const n = library.scenes.length;
  const shown = n ? library.scenes.filter(s => matchesFilter(s.name, sceneFilter)) : [];
  return topBar('Escenas', n ? `${n} escena${n === 1 ? '' : 's'}` : 'nada cargado') +
    `<main><section class="panel">
      <div class="quickadd">
        <button data-newscene="1" class="primary">Nueva escena</button>
        <button data-scan="1" class="ghost">Buscar campaña</button>
      </div>
      ${n
        ? `<div class="filterbar"><input type="text" data-filter="scenes" placeholder="Buscar escena…" value="${esc(sceneFilter)}"></div>
           ${shown.length
             ? `<div class="scenegrid">${shown.map(s => sceneCard(s, { configOnly: true })).join('')}</div>`
             : `<p class="muted">Ninguna escena coincide con “${esc(sceneFilter)}”.</p>`}`
        : `<div class="drop" data-scan="1">
            <b>Ninguna escena todavía</b>
            Una escena es un fondo y una cuadrícula: un sitio donde estar, o un campo
            donde pelear. Se guardan de una en una en <code>scenarios/</code>, y las
            imágenes en <code>assets/</code>.
            <p class="muted" style="font-size:.85rem;margin:.8rem 0 0">
              Pulsa <button class="link" data-scan="1">buscar campaña</button> y elige la
              carpeta de tu campaña, <code>campaigns/&lt;nombre&gt;</code>. El navegador no
              puede mirar dentro de una carpeta por su cuenta, así que hay que
              enseñársela — una vez por sesión. La misma búsqueda también trae las notas de
              <code>story/</code>, y los <code>.json</code> sueltos en <code>players/</code>
              y <code>monsters/</code>.
              O <button class="link" data-newscene="1">crea una desde cero</button> en el editor.</p>
          </div>`}
    </section></main>`;
}

/** `configOnly` is Escenas's own view of a scene: name, art, what is missing,
    and the edit/export/delete a library entry is for. Without it — the
    default, used by scenePicker() from inside Juego — the card is also how
    you put a scene up or prepare it, which is why golive/stage live here and
    not in sceneLibrary(). */
function sceneCard(s, opts) {
  const configOnly = !!(opts && opts.configOnly);
  const src = sceneThumb(s);
  const gone = missingAssets(s);
  const live = session.field.live && session.field.sceneId === s.id;
  const staged = !live && session.field.staged && session.field.staged.sceneId === s.id;
  const badge = live ? '<span class="badge">en el tablero</span>'
    : staged ? '<span class="badge staged">preparada</span>' : '';
  return `<article class="scenecard${live ? ' on' : ''}${staged ? ' staged' : ''}">
    ${src && !gone.length
      ? `<div class="thumb" style="background-image:url(&quot;${esc(src)}&quot;)">${badge}</div>`
      : `<div class="thumb none">${gone.length ? 'falta el archivo' : 'sin imagen'}${badge}</div>`}
    <div class="meta">
      <b>${esc(s.name)}</b>
      ${gone.length ? `<span class="gone">No encuentro ${gone.map(esc).join(', ')}</span>` : ''}
    </div>
    <div class="acts">
      ${configOnly ? '' : `<button class="small primary" data-golive="${esc(s.id)}">Al tablero</button>
      <button class="small ghost" data-stagescene="${esc(s.id)}"${staged ? ' disabled' : ''}
        title="Deja el arte y el sonido listos sin que el tablero se entere">${staged ? 'Preparada ✓' : 'Preparar'}</button>`}
      <button class="small ghost" data-editscene="${esc(s.id)}">Editar</button>
      <button class="small ghost" data-scenexport="${esc(s.id)}">Exportar</button>
      ${configOnly ? `<button class="small ghost" data-delscene="${esc(s.id)}">Quitar</button>` : ''}
    </div>
  </article>`;
}

/** What is prepared but not on the television, shown wherever the DM is
    likely to be looking for it: the library, and the "nothing live" screen. */
function stagedStrip() {
  const st = session.field.staged;
  if (!st) return '';
  const s = sceneById(st.sceneId);
  return `<div class="quickadd staged">
    <span class="tag">Preparada</span>
    <b>${esc(s ? s.name : 'una escena que ya no está en la lista')}</b>
    <button class="small primary" data-golive="${esc(st.sceneId)}">Al tablero</button>
    <button class="small ghost" data-unstage="1">Descartar</button>
  </div>`;
}

/** Read-only: a note is edited on disk, not here, and reappears on the next
    scan. Only one note on screen at a time — `storyOpen` (a path) says
    which, `null` means "show the index" — the same trick escenasScreen()
    plays between its library and its editor, just with the note picked by
    path instead of an id. A stale path (the note it pointed to vanished on
    the last rescan) falls back to the index rather than rendering nothing. */
function storyScreen() {
  const note = storyOpen ? story.notes.find(n => n.path === storyOpen) : null;
  if (storyOpen && !note) storyOpen = null;
  return note ? storyNoteView(note) : storyIndexView();
}

/** Grouped by the first folder under story/, because that grouping is the
    DM's own to choose — pueblo, mazmorra, whatever the campaign needs — and
    the scan already sorted `story.notes` by (group, name), so building the
    groups in that order costs nothing extra. Titles only — opening a note is
    what storyNoteView() is for. */
function storyIndexView() {
  const n = story.notes.length;
  const shown = n ? story.notes.filter(note =>
    matchesFilter(`${noteTitle(note)} ${note.content}`, storyFilter)) : [];
  const groups = [];
  for (const note of shown) {
    let g = groups.find(x => x.name === note.group);
    if (!g) { g = { name: note.group, notes: [] }; groups.push(g); }
    g.notes.push(note);
  }
  return topBar('Historia', n ? `${n} nota${n === 1 ? '' : 's'}` : 'nada cargado') +
    `<main><section class="panel">
      <div class="quickadd">
        <button data-scan="1" class="ghost">Buscar campaña</button>
      </div>
      ${n
        ? `<div class="filterbar"><input type="text" data-filter="story" placeholder="Buscar en las notas…" value="${esc(storyFilter)}"></div>
           ${groups.length
             ? groups.map(g => `
               <h2>${esc(g.name)}</h2>
               <ul class="storyindex">${g.notes.map(note => {
                 const tags = noteTags(note);
                 return `<li><button class="link" data-opennote="${esc(note.path)}">${esc(noteTitle(note))}</button>${
                   tags.length ? ` <span class="notetags inline">${tags.map(t => `#${esc(t)}`).join(' ')}</span>` : ''}</li>`;
               }).join('')}</ul>`).join('')
             : `<p class="muted">Ninguna nota coincide con “${esc(storyFilter)}”.</p>`}`
        : `<div class="drop" data-scan="1">
            <b>Ninguna nota todavía</b>
            Una nota es un archivo <code>.md</code> escrito a mano bajo <code>story/</code>,
            agrupado por la primera carpeta que le pongas — <code>story/pueblo/*.md</code>,
            <code>story/mazmorra/*.md</code>.
            <p class="muted" style="font-size:.85rem;margin:.8rem 0 0">
              Pulsa <button class="link" data-scan="1">buscar campaña</button> y elige la
              carpeta de tu campaña, <code>campaigns/&lt;nombre&gt;</code>. La misma
              búsqueda también trae escenas, jugadores y PNJ.</p>
          </div>`}
    </section></main>`;
}

/** The one note on screen: [[wikilinks]] and #tags inside the prose are
    mdToHtml()'s job (data-opennote spans there navigate straight here, note
    to note, without a detour through the index); this adds the tag-pill
    summary and the backlinks footer around it, plus the way back. */
function storyNoteView(note) {
  const idx = storyIndex();
  const tags = noteTags(note);
  const backlinks = backlinksFor(note, idx);
  return topBar('Historia', esc(noteTitle(note))) +
    `<main><section class="panel">
      <div class="quickadd">
        <button data-opennote="" class="ghost">← Índice</button>
      </div>
      <article class="notecard">
        <b>${esc(noteTitle(note))}</b>
        ${tags.length ? `<div class="notetags">${tags.map(t =>
          `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="notebody">${mdToHtml(note.content, idx)}</div>
        ${backlinks.length ? `<div class="backlinks"><b>Mencionada en</b> ${
          backlinks.map(b => `<span class="wikilink" data-opennote="${esc(b.path)}">${esc(noteTitle(b))}</span>`).join(', ')
        }</div>` : ''}
      </article>
    </section></main>`;
}

/* ================================================================= EDITOR
   A full screen, not a modal: you are in it for minutes, not seconds.
   `editorDraft` is a working copy — nothing here is real until Guardar, so a
   half-finished edit can never be the one currently on the television.
========================================================================= */

function sceneEditor() {
  const d = editorDraft;
  const isNew = !sceneById(d.id);
  return topBar(d.name || 'Escena sin nombre', isNew ? 'nueva escena' : 'editando') +
    `<main><section class="panel wide">
      <div class="quickadd">
        <button data-editorsave="1" class="primary">Guardar</button>
        <button data-editorexport="1" class="ghost">Exportar</button>
        <button data-editorback="1" class="ghost">Volver</button>
      </div>
      ${editorFields()}
    </section></main>`;
}

/** Everything about a scene that used to only be reachable by typing JSON. */
function editorFields() {
  const d = editorDraft;
  const images = library.assets.filter(p => /\.(jpe?g|png|webp)$/i.test(p));
  const sounds = library.assets.filter(p => /\.(mp3|ogg|wav|m4a)$/i.test(p));
  const audioPick = (key, label) => {
    const layer = d.audio?.[key];
    return `<label>${label}
      <select data-escaudiosrc="${key}">
        <option value="">— ninguno —</option>
        ${sounds.map(p => `<option value="${esc(p)}"${layer?.src === p ? ' selected' : ''}>${esc(p)}</option>`).join('')}
      </select></label>
      ${layer ? `<label>Volumen
        <input type="range" data-escaudiovol="${key}" min="0" max="1" step="0.01" value="${layer.volume}">
        <b>${Math.round(layer.volume * 100)}%</b></label>` : ''}`;
  };
  return `<div class="escfields">
    <label>Nombre <input type="text" data-escfield="name" value="${esc(d.name)}"></label>
    <label>Nota <textarea data-escfield="note">${esc(d.note)}</textarea></label>

    <h3>Arte</h3>
    <label>Imagen
      <select data-escart="src">
        <option value="">— ninguna —</option>
        ${images.map(p => `<option value="${esc(p)}"${d.art?.src === p ? ' selected' : ''}>${esc(p)}</option>`).join('')}
      </select></label>

    <h3>Cuadrícula <span class="n">${d.grid
      ? `${d.grid.cols} × ${deriveRows(d.grid.cols, aspectOf(d.art?.src ? campaignPath(d.art.src) : null, session.field.cols / session.field.rows))}`
      : 'de la mesa'}</span></h3>
    <p class="tip">El tamaño del tablero para esta escena en concreto — vacío, y usa el que ya
      tenga la mesa en ese momento. Solo se elige el número de columnas: las filas salen solas
      de la proporción real de la imagen, para que los cuadros salgan siempre cuadrados.</p>
    <div class="row">
      <label>Columnas <input type="number" min="4" max="60" data-escgrid="cols" value="${d.grid?.cols ?? ''}"></label>
    </div>

    <h3>Sonido</h3>
    ${audioPick('music', 'Música')}
    ${audioPick('ambience', 'Ambiente')}

    <h3>Reparto <span class="n">${d.roster.length}</span></h3>
    <p class="tip">Quién espera en esta escena, y en qué cuadro — se sienta solo,
      con el mapa de esta escena, la primera vez que sale a la mesa. Arrastra
      una ficha para cambiarla de sitio.</p>
    ${session.bestiary.length ? rosterFieldHTML() : ''}
    ${session.bestiary.length
      ? `<div class="rosterpick">${session.bestiary.map(b => `<div class="rprow">
          <b>${esc(b.name)}</b>${b.tag ? `<span class="muted"> · ${esc(b.tag)}</span>` : ''}
          <button class="small ghost" data-rosteradd="${esc(b.id)}">+ Añadir</button>
        </div>`).join('')}</div>`
      : `<p class="muted">No hay PNJ todavía. Se escriben en
        <button class="link" data-nav="monstruos">PNJ</button>.</p>`}
    ${d.roster.length ? `<ul class="rosterlist">${d.roster.map((r, i) => {
        const b = session.bestiary.find(x => x.id === r.beastId);
        return `<li>${esc(b ? b.name : '(ese PNJ ya no existe)')}
          <button class="small ghost" data-rosterdel="${i}" aria-label="Quitar del reparto">✕</button></li>`;
      }).join('')}</ul>` : ''}
  </div>`;
}

/** The scene's roster, drawn as its own small board — same grid geometry this
    scene will actually go live at (see sceneGridSize()) and the same
    background art, but backed by `editorDraft.roster` rather than
    `session.field.tokens`: nothing here is
    real until Guardar, so dragging a goblin around while editing can never
    move anything actually on the table. An entry whose bestiary id has since
    been deleted draws nothing — it still shows in the list underneath, since
    that is the one place left to remove it from. */
function rosterFieldHTML() {
  const d = editorDraft;
  const { cols, rows } = sceneGridSize(d);
  const src = d.art?.src ? campaignPath(d.art.src) : null;
  const seated = d.roster
    .map((r, i) => ({ i, r, beast: session.bestiary.find(b => b.id === r.beastId) }))
    .filter(o => o.beast);
  const at = {};
  for (const o of seated) (at[o.r.x + ',' + o.r.y] ||= []).push(o.i);
  const token = o => {
    const share = at[o.r.x + ',' + o.r.y];
    const idx = share.indexOf(o.i), n = share.length;
    const place = n > 1
      ? `left:calc((${o.r.x} + ${.5 + (idx % 2 ? .22 : -.22)}) * var(--sq));
         top:calc((${o.r.y} + ${.5 + (idx > 1 ? .22 : -.22)}) * var(--sqy));
         width:calc(var(--sq) * .5);height:calc(var(--sqy) * .5)`
      : `left:calc((${o.r.x} + .5) * var(--sq));top:calc((${o.r.y} + .5) * var(--sqy))`;
    const initials = o.beast.name.split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
    return `<div class="token" data-rtoken="${o.i}" style="${place}" title="${esc(o.beast.name)}">
      <span class="ini">${esc(initials)}</span></div>`;
  };
  /* No forced aspect-ratio when there is an image: the <img> below sizes the
     container by simply being in flow, at its own natural proportions, so
     the grid overlaid on top of it (position:absolute; inset:0) can never
     span past where the picture actually is. Only a grid with nothing to
     show still needs telling what shape to be. */
  return `<div class="minifield" data-rosterfield data-cols="${cols}" data-rows="${rows}"
      style="--sq:calc(100% / ${cols});--sqy:calc(100% / ${rows})${src ? '' : `;aspect-ratio:${cols} / ${rows}`}">
    ${src ? `<img class="mapimg" src="${esc(src)}" alt="">` : ''}
    <div class="grid" style="background-size:calc(100% / ${cols}) calc(100% / ${rows})"></div>
    <div class="target" hidden></div>
    ${seated.map(token).join('')}
  </div>`;
}

/** The nearest free square to the top-left among a scene's own roster, so
    adding "Goblin" three times lands three of them on three squares instead
    of stacking them until the DM drags each apart by hand — the same reason
    freeSquare() exists for the real field. Sized to whatever this scene's
    own board will be, not necessarily the table's current one. */
function freeRosterSquare(roster, size) {
  const taken = new Set(roster.map(r => r.x + ',' + r.y));
  for (let y = 0; y < size.rows; y++) {
    for (let x = 0; x < size.cols; x++) if (!taken.has(x + ',' + y)) return { x, y };
  }
  return { x: 0, y: 0 };
}

/** The name, the toggles, and the note — the part of the scene strip that is
    the same whether it sits under a big hero picture (sceneBar(), for the
    muster and for nothing-live) or under the small tactical board that is
    already showing the art (sceneControls(), mid-fight): no reason to lay
    those two rows out twice. */
function sceneRow(s, f, gone) {
  return `<div class="row">
      <div>
        <b>${esc(s ? s.name : 'Sin escena')}</b>
        <div class="st">${f.grid ? 'con cuadrícula' : 'a pantalla completa'}${f.map ? '' : ' · sin imagen'}</div>
        ${gone.length ? `<div class="gone">No encuentro ${gone.map(esc).join(', ')}</div>` : ''}
      </div>
      <div class="acts">
        <button class="small ghost" data-gridtoggle="1"
          title="Cuadrícula y fichas, o el arte a pantalla completa — no cambia nada de la escena">${
          f.grid ? '▦ con cuadrícula' : '▣ a pantalla completa'}</button>
        <button class="small ghost" data-tvpanel="1">Ajustar</button>
        <button class="small ghost" data-scenes="1">${s ? 'Cambiar escena' : 'Fijar escena'}</button>
        ${s ? '<button class="small ghost" data-golive="" title="Vuelve a la cuadrícula, sin ninguna escena">Quitar</button>' : ''}
      </div>
    </div>
    ${audioMini(f.audio)}
    ${s && s.note ? `<p class="nt">${esc(s.note)}</p>` : ''}`;
}

/** The live scene, hero picture and all: for the muster and for nothing-live,
    where nothing else on the tab shows the art, so the picture has to be
    here. Not the library: the things you do here are line the art up, toggle
    the grid, swap or drop the scene, and walk back out. The grid toggle is a
    session switch, not a scene setting — it flips the television between
    full-bleed art and tokens on a grid whenever you like, independent of
    whether combat is running. */
function sceneBar() {
  const f = session.field;
  const s = sceneById(f.sceneId);
  const src = mapSrc();
  const gone = s ? missingAssets(s) : [];
  return `<div class="scenebar">
    <div class="hero"${src && !gone.length ? ` style="background-image:url(&quot;${esc(src)}&quot;)"` : ''}></div>
    ${sceneRow(s, f, gone)}
  </div>`;
}

/** The same controls, no picture: mid-fight, midBoard()'s own minifield is
    already showing the art, between the two sides — putting a second, bigger
    copy of it above the whole screen would just be the same scene twice. This
    sits right under that board instead. */
function sceneControls() {
  const f = session.field;
  const s = sceneById(f.sceneId);
  const gone = s ? missingAssets(s) : [];
  return `<div class="scenebar compact">${sceneRow(s, f, gone)}</div>`;
}

/** The scene's mix, right where the scene itself is: mute and the master
    fader, the same two controls audioBar() keeps in the map panel — nothing
    here is scene-specific, since which files play is written in the editor,
    not adjusted at the table. Absent when the scene brought no sound, same
    as audioBar()'s own "esta escena no trae sonido". */
function audioMini(a) {
  if (!a) return '';
  const pct = Math.round(audioPrefs.master * 100);
  return `<div class="audiomini">
    <button class="small ghost${audioPrefs.muted ? ' on' : ''}" data-mute="1"
      title="${audioPrefs.muted ? 'Quitar el silencio' : 'Silenciar el tablero'}">${
      audioPrefs.muted ? '🔇' : '🔊'}</button>
    <input type="range" data-master="1" min="0" max="1" step="0.01"
      value="${audioPrefs.master}"${audioPrefs.muted ? ' disabled' : ''}
      aria-label="Volumen">
    <b>${pct}%</b>
  </div>`;
}

/* ------------------------------------------------------------- the muster
   This is prep, not a tick-list: who is fighting is no longer decided here.
   Both sides are cards you can open, add to, or remove from — the same as
   any other time between fights — and Empezar combate is always live,
   because pressing it does not commit to anything by itself. It opens
   musterPicker(), which is where the DM actually says who walks in.
========================================================================= */
function musterScreen() {
  const party = partyHandles().filter(cb => !session.field.benched.includes(cb.ref));
  const monsters = session.npcs.map(npcHandle);

  const side = (title, cls, rows, empty, plus) => `<div class="side ${cls}">
    <h3 class="sideh ${cls}">${title} <span class="n">${rows.length}</span>${plus || ''}</h3>
    ${rows.length
      ? `<div class="picklist">${rows.map(rosterRow).join('')}</div>`
      : `<p class="muted">${empty}</p>`}
  </div>`;

  const scene = sceneById(session.field.sceneId);
  return topBar(scene ? scene.name : 'Combate', 'sin empezar') +
    `<main><section class="panel wide">

      <div class="sides">
        ${side('Jugadores', 'pcs', party,
          'No hay fichas. Impórtalas en <button class="link" data-nav="jugadores">Jugadores</button>.')}
        ${midBoard()}
        ${side('PNJ', 'npcs', monsters,
          `Nadie cargado todavía. Tráelos de
            <button class="link" data-nav="monstruos">PNJ</button>.`,
          addPlus('monstruo'))}
      </div>

      <div class="startbar">
        <button class="primary big" data-startcombat="1">Empezar combate</button>
        <span class="muted">Elegirás quién entra, y si algún PNJ entra oculto, en la ventana que se abre.</span>
      </div>

    </section></main>` + pickBar();
}

/** One row, players and monsters alike: a name that opens the whole card
    underneath it, and the three numbers you would otherwise open the card
    to read. Nothing here is a fight membership control any more — that
    question moved into musterPicker(), asked fresh every time Empezar
    combate is pressed. An npc still gets a ✕: off the board entirely, which
    is a different question from being in any one fight. A player has no ✕
    here; taking one off the board is Jugadores' question, not the muster's. */
function rosterRow(cb) {
  const open = musterOpen.has(cb.ref);
  return `<div class="mrow plain${open ? ' open' : ''}">
    <button class="nm" data-musteropen="${esc(cb.ref)}" aria-expanded="${open}"><b>${esc(cb.name)}</b></button>
    <span class="st">CA ${cb.ac} · ${currentHP(cb)}/${cb.hpMax} PG · inic. ${signed(cb.initMod)}</span>
    <button class="caret ghost" data-musteropen="${esc(cb.ref)}"
      aria-label="${open ? 'Cerrar' : 'Abrir'} la ficha de ${esc(cb.name)}">${open ? '▾' : '▸'}</button>
    ${cb.kind === 'npc' ? `<button class="small ghost" data-delnpc="${esc(cb.id)}"
      aria-label="Quitar ${esc(cb.name)} de la mesa">✕</button>` : ''}
    ${open ? `<div class="open-card">${cbCard(cb, { bare: true })}</div>` : ''}
  </div>`;
}

/** The same shell as rosterRow(), for an npc already loaded but not part of
    the fight currently running — mid-fight, the tick here reads and writes
    `encounter.members` directly: one tap seats it in the turn order,
    unrolled, exactly as a late player already arrives through Jugadores +. */
function sidelinedRow(cb) {
  const open = musterOpen.has(cb.ref);
  return `<div class="mrow${open ? ' open' : ''}">
    <button class="tick" data-joinfight="${esc(cb.ref)}"
      aria-label="Meter a ${esc(cb.name)} en este combate">+</button>
    <button class="nm" data-musteropen="${esc(cb.ref)}" aria-expanded="${open}"><b>${esc(cb.name)}</b></button>
    <span class="st">CA ${cb.ac} · ${currentHP(cb)}/${cb.hpMax} PG · inic. ${signed(cb.initMod)}</span>
    <button class="caret ghost" data-musteropen="${esc(cb.ref)}"
      aria-label="${open ? 'Cerrar' : 'Abrir'} la ficha de ${esc(cb.name)}">${open ? '▾' : '▸'}</button>
    <button class="small ghost" data-delnpc="${esc(cb.id)}" aria-label="Quitar ${esc(cb.name)} de la mesa">✕</button>
    ${open ? `<div class="open-card">${cbCard(cb, { bare: true })}</div>` : ''}
  </div>`;
}

/* -------------------------------------------------------------- the fight */
function fightScreen() {
  const e = session.encounter;
  const list = inOrder();
  const active = list.find(o => o.ref === e.activeRef);
  const pcs = list.filter(o => o.cb.kind === 'pc');
  const npcs = list.filter(o => o.cb.kind === 'npc');
  /* Loaded, but sitting this one out — a different question from being in
     the fight, so it gets a different row: a tick rows into it, not a full
     combat card, the same shape the muster already uses for the same
     question. */
  const sidelined = session.npcs.map(npcHandle).filter(cb => !e.members.includes(cb.ref));

  const pending = list.filter(o => o.init == null).length;

  const column = (title, cls, rows, what, empty) => `<div class="side ${cls}">
    <h3 class="sideh ${cls}">${title} <span class="n">${rows.filter(o => !skippable(o.cb)).length}</span>
      ${addPlus(what)}</h3>
    ${rows.length ? rows.map(o => cbCard(o.cb, {
      init: o.init, editInit: true, compact: true, active: o.ref === e.activeRef })).join('')
      : `<p class="muted">${empty}</p>`}
    ${cls === 'npcs' && sidelined.length ? `<div class="picklist" style="margin-top:.6rem">
      <p class="muted" style="font-size:.78rem;margin:0 0 .1rem">Cargados, fuera de este combate</p>
      ${sidelined.map(sidelinedRow).join('')}
    </div>` : ''}
  </div>`;

  const f = session.field;
  const scene = sceneById(f.sceneId);
  /* The grid is still just a display toggle, reachable here too now that a
     fight no longer forces it — turning it off mid-round leaves the fight
     running underneath, on the TV as a place with the banner and everybody's
     hit points laid over the art instead of a battlemap. It is midBoard()'s
     own sceneControls() below, not the header, that carries the toggle. */
  return topBar(scene ? scene.name : 'Combate', `ronda ${e.round}`) +
    `<main><section class="panel wide">

      <div class="turnbar">
        <span class="round">Ronda <b>${e.round}</b></span>
        <span class="spacer"></span>
        <button class="small" data-turn="-1">← Anterior</button>
        <button class="small primary" data-turn="1">Siguiente →</button>
        <span class="now">${active
          ? `Turno de <b>${esc(active.cb.name)}</b>${active.init != null ? ` · iniciativa ${active.init}` : ''}`
          : pending
            ? `Faltan <b>${pending}</b> iniciativa${pending === 1 ? '' : 's'}. Puedes empezar igualmente.`
            : 'Pulsa <b>Siguiente</b> para empezar la ronda.'}</span>
        ${list.length ? `<ol class="orderstrip">${list.map(o =>
          `<li class="${o.ref === e.activeRef ? 'now' : ''}${skippable(o.cb) ? ' out' : ''} ${o.cb.kind}">
            <b>${o.init ?? '—'}</b> ${esc(o.cb.name)}</li>`).join('')}</ol>` : ''}
      </div>

      <div class="sides">
        ${column('Jugadores', 'pcs', pcs, 'jugador', 'Nadie de la mesa está en este combate.')}
        ${midBoard()}
        ${column('PNJ', 'npcs', npcs, 'monstruo', 'No hay PNJ.')}
      </div>

      <div class="endbar">
        <button class="danger big" data-endcombat="1">Terminar combate</button>
        <span class="muted">Se va la ronda, el turno y las iniciativas. Los PNJ se quedan en la mesa
          exactamente donde están, y los PG, los estados y las notas de todos no se tocan.</span>
      </div>

    </section></main>` + pickBar();
}

/* ------------------------------------------------------ the field, in small
   The same field as the television's, between the two sides because that is
   where the field is: what the players are looking at while you look at their
   hit points. Both boards write to the same `session.field.tokens`, so a drop
   here reaches the television on the next push and a drag there lands here on
   the next poll — it is one board with two windows onto it, not two boards to
   keep in step.

   It shows one thing the television must not: a monster staged off-screen,
   drawn as a dashed circle. This is the DM's window, and "where is the ambush
   standing" is exactly the question it is for.
========================================================================= */

/** The token you have tapped, which lights the squares it could cross. Held by
    ref, so re-rendering under it does not move the selection to a neighbour. */
let selectedToken = null;

function midBoard() {
  const f = session.field;
  const e = session.encounter;
  const src = mapSrc();

  const seated = Object.entries(f.tokens)
    .map(([ref, at]) => ({ ref, at, cb: handleFor(ref) }))
    .filter(o => o.cb);

  if (selectedToken && !seated.some(o => o.ref === selectedToken)) selectedToken = null;
  const sel = seated.find(o => o.ref === selectedToken);

  const at = {};
  for (const o of seated) (at[o.at.x + ',' + o.at.y] ||= []).push(o.ref);

  const colourOf = ref => ref.startsWith('pc:')
    ? TOKEN_COLOURS[session.party.findIndex(c => 'pc:' + c.id === ref) % TOKEN_COLOURS.length]
    : null;

  const token = o => {
    const share = at[o.at.x + ',' + o.at.y];
    const i = share.indexOf(o.ref), n = share.length;
    /* Two goblins in one square is a normal Tuesday, so a shared square fans
       its tokens instead of hiding all but the last one drawn. */
    const place = n > 1
      ? `left:calc((${o.at.x} + ${.5 + (i % 2 ? .22 : -.22)}) * var(--sq));
         top:calc((${o.at.y} + ${.5 + (i > 1 ? .22 : -.22)}) * var(--sqy));
         width:calc(var(--sq) * .5);height:calc(var(--sqy) * .5)`
      : `left:calc((${o.at.x} + .5) * var(--sq));top:calc((${o.at.y} + .5) * var(--sqy))`;
    const colour = colourOf(o.ref);
    const npc = o.cb.kind === 'npc';
    const hidden = npc && !(f.reveal[o.cb.id] || normaliseReveal(null)).on;
    const inCombat = e.members.includes(o.ref);
    /* A loaded npc not yet in any fight shows no hp at all — it is scenery
       until something makes it a combatant. A player always shows theirs. */
    const tracked = !npc || inCombat;
    const initials = o.cb.name.split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
    const port = portraitSrc(o.cb.portrait);
    const hp = tracked ? currentHP(o.cb) : null, max = tracked ? Math.max(0, o.cb.hpMax || 0) : null;
    const lit = o.ref === e.activeRef || o.ref === selectedToken;
    return `<div class="token${o.ref === e.activeRef ? ' active' : ''}${
        o.ref === selectedToken ? ' selected' : ''}${tracked && max > 0 && hp <= 0 ? ' out' : ''}${
        hidden ? ' hidden' : ''}"
      data-mtoken="${esc(o.ref)}"
      style="${place};${colour ? `--tint:${colour}` : ''}"
      title="${esc(o.cb.name)}${tracked ? ` · ${hp}/${max} PG` : ''}${hidden ? ' · oculto en el tablero' : ''}">
      ${port ? `<img class="pimg" src="${esc(port)}" alt="">` : `<span class="ini">${esc(initials)}</span>`}
      ${lit ? `<span class="lbl">${esc(o.cb.name)}</span>` : ''}</div>`;
  };

  /* Chebyshev distance — 5e 2024 counts a diagonal as one square — means the
     whole reach is a rectangle, so it is one element rather than one per
     cell, clamped to the field's own edges. Shown regardless of combat —
     planning a position is useful before a fight starts too. */
  const reach = sel && sel.cb.speed != null ? Math.round(sel.cb.speed / 1.5) : null;
  const box = reach == null ? '' : (() => {
    const x0 = Math.max(0, sel.at.x - reach), x1 = Math.min(f.cols - 1, sel.at.x + reach);
    const y0 = Math.max(0, sel.at.y - reach), y1 = Math.min(f.rows - 1, sel.at.y + reach);
    return `<div class="reach" style="left:calc(${x0} * var(--sq));top:calc(${y0} * var(--sqy));
      width:calc(${x1 - x0 + 1} * var(--sq));height:calc(${y1 - y0 + 1} * var(--sqy))"></div>`;
  })();

  return `<div class="midboard">
    <h3 class="sideh">Tablero <span class="n">${metres(f.cols * 1.5)} × ${metres(f.rows * 1.5)} m</span></h3>
    <div class="minifield" data-minifield style="--sq:calc(100% / ${f.cols});--sqy:calc(100% / ${f.rows})${
        f.map && src ? '' : `;aspect-ratio:${f.cols} / ${f.rows}`}">
      ${f.map && src ? `<img class="mapimg" src="${esc(src)}" alt="">` : ''}
      ${f.grid ? `<div class="grid" style="background-size:calc(100% / ${f.cols}) calc(100% / ${f.rows})"></div>
      ${box}
      <div class="target" hidden></div>
      ${seated.map(token).join('')}` : ''}
    </div>
    <p class="tip">${!f.grid
      ? 'A pantalla completa: sin cuadrícula ni fichas que mover.'
      : sel
      ? `<b>${esc(sel.cb.name)}</b>${reach != null
          ? ` · ${reach} cuadros (${metres(sel.cb.speed)} m) de movimiento`
          : ' · sin velocidad en la ficha'}`
      : 'Arrastra una ficha para moverla, tócala para ver lo que alcanza. Un círculo de trazos es alguien que el tablero no enseña.'}</p>
    ${sceneControls()}
  </div>`;
}

/* ==================================================================== modals
   Two errands, and neither of them belongs on the screen for a whole session:
   choosing who joins the fight, and writing a statblock down. Creating a
   creature happens in the PNJ tab and nowhere else, so a fight is always
   assembled out of things you already decided on.
========================================================================= */

/** The + in a column heading. Disabled with a reason rather than hidden: a
    control that comes and goes is a control you stop looking for. */
function addPlus(what) {
  const empty = what === 'monstruo'
    ? !session.bestiary.length
    : !partyHandles().some(cb => !session.encounter.members.includes(cb.ref));
  const why = what === 'monstruo'
    ? (empty ? 'No hay PNJ todavía' : 'Añadir PNJ')
    : (empty ? 'Ya está toda la mesa en el combate' : 'Meter a alguien de la mesa');
  return `<button class="small plus" data-add="${what}"${empty ? ' disabled' : ''}
    title="${esc(why)}" aria-label="${esc(why)}">+</button>`;
}

function modalView() {
  if (!modal) return '';
  const body = modal.kind === 'beast' ? beastWizard()
    : modal.kind === 'npcs' ? npcPicker()
    : modal.kind === 'scenes' ? scenePicker()
    : modal.kind === 'init' ? initWizard()
    : modal.kind === 'muster' ? musterPicker() : playerPicker();
  return `<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true"
    aria-label="${esc(body.title)}">
    <h2>${esc(body.title)}<button class="ghost" data-closemodal="1" aria-label="Cerrar">✕</button></h2>
    <div class="body">${body.html}</div>
    <div class="acts">${body.acts}</div>
  </div></div>`;
}

/** Name, the three numbers a monster needs at the table, and a free-text line
    for whatever you want in front of you. Quantity is not here: how many
    goblins walk in is a question about a fight, not about a goblin. */
function beastWizard() {
  const editing = modal.beastId && session.bestiary.find(b => b.id === modal.beastId);
  const b = editing || {};
  const tags = [...new Set(session.bestiary.map(x => x.tag).filter(Boolean))].sort();
  return {
    title: editing ? 'Editar PNJ' : 'Nuevo PNJ',
    html: `<form class="mform" id="beastform" data-beast>
      <div class="wide" style="display:flex;justify-content:center">
        ${portraitWidget('modal:1', b.name || 'Nuevo PNJ', modal.portrait, { big: true })}</div>
      <label class="wide">Nombre
        <input name="name" required placeholder="Goblin" autocomplete="off" value="${esc(b.name || '')}"></label>
      <label class="wide">Tipo — para agrupar y filtrar: monstruo, aldeano, aliado…
        <input name="tag" list="npctags" placeholder="monstruo" autocomplete="off" value="${esc(b.tag || '')}"></label>
      <datalist id="npctags">${tags.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      <label>CA <input name="ac" type="number" inputmode="numeric" value="${b.ac ?? 12}"></label>
      <label>PG <input name="hpMax" type="number" inputmode="numeric" value="${b.hpMax ?? 7}"></label>
      <label>Mod. inic. <input name="initMod" type="number" inputmode="numeric" value="${b.initMod ?? 0}"></label>
      <label class="wide">Notas — resistencias, comportamiento, lo que quieras tener delante
        <textarea name="note" rows="3"
          placeholder="Resistente al fuego · Huye por debajo de la mitad de PG">${esc(b.note || '')}</textarea></label>
      <div class="wide abilities">
        <label>Habilidades y ataques</label>
        ${modal.abilities.map((a, i) => `<div class="abrow">
          <input data-abname="${i}" placeholder="Mordisco" autocomplete="off" value="${esc(a.name)}">
          <textarea data-abdesc="${i}" rows="2"
            placeholder="Ataque de arma cuerpo a cuerpo: +4, alcance 1,5 m, un objetivo. Impacto: 1d6+2 perforante.">${esc(a.desc)}</textarea>
          <button type="button" class="small ghost" data-abrow-del="${i}">Quitar</button>
        </div>`).join('')}
        <button type="button" class="small ghost" data-abrow-add="1">+ Añadir habilidad</button>
      </div>
    </form>`,
    acts: `<button class="ghost" data-closemodal="1">Cancelar</button>
      <button class="primary" type="submit" form="beastform">Guardar</button>`,
  };
}

/** Tick the statblocks, say how many of each, commit once. Three goblins and
    an ogre used to be four trips through a form. This is the one way any npc
    reaches the board — loading and joining a fight are different decisions
    now, so nothing here touches `session.encounter`. */
function npcPicker() {
  const total = [...modal.counts.values()].reduce((a, b) => a + b, 0);
  return {
    title: 'Cargar PNJ',
    html: session.bestiary.length
      ? session.bestiary.map(b => {
        const n = modal.counts.get(b.id) || 0;
        return `<div class="pickrow${n ? ' on' : ''}">
          <button class="tick${n ? ' on' : ''}" data-count="${esc(b.id)}:toggle"
            aria-pressed="${!!n}" aria-label="${esc(b.name)}">${n ? '✓' : ''}</button>
          <button class="nm" data-count="${esc(b.id)}:toggle"><b>${esc(b.name)}</b>${
            b.tag ? ` <span class="muted" style="font-size:.78rem">· ${esc(b.tag)}</span>` : ''}</button>
          <span class="st">CA ${b.ac} · ${b.hpMax} PG · iniciativa ${signed(b.initMod)}</span>
          <span class="stepper">
            <button class="ghost" data-count="${esc(b.id)}:-1" aria-label="Uno menos">−</button>
            <b>${n}</b>
            <button class="ghost" data-count="${esc(b.id)}:1" aria-label="Uno más">+</button>
          </span>
        </div>`;
      }).join('')
      : `<p class="muted">No hay PNJ todavía. Se escriben en
        <button class="link" data-nav="monstruos">PNJ</button>.</p>`,
    acts: `<span class="count">${total
      ? `${total} PNJ`
      : 'Nada elegido todavía'}</span>
      <button class="ghost" data-closemodal="1">Cancelar</button>
      <button class="primary" data-commitadd="npcs"${total ? '' : ' disabled'}>Cargar</button>`,
  };
}

/** The same library, as a picker, for swapping the scene without leaving the
    muster. Going live is one click here rather than tick-then-commit: there is
    only ever one scene on the television, so there is nothing to accumulate. */
function scenePicker() {
  return {
    title: 'Cambiar escena',
    html: library.scenes.length
      ? `<div class="scenegrid">${library.scenes.map(sceneCard).join('')}</div>`
      : `<p class="muted">No hay escenas cargadas. Pulsa <b>Buscar campaña</b> y elige la
        carpeta de tu campaña; se leen los <code>.json</code> de <code>scenarios/</code>.</p>`,
    acts: `<button class="ghost" data-scan="1">Buscar campaña</button>
      <span class="spacer" style="flex:1"></span>
      <button class="ghost" data-golive="">Sin escena</button>
      <button class="ghost" data-closemodal="1">Cerrar</button>`,
  };
}

/** The queue for the initiative wizard: the players you ticked in the order
    they sit at the table, then what they are fighting. Somebody who already
    has a number keeps it, so re-opening the wizard is not starting over. */
function initQueue(refs) {
  const order = [
    ...partyHandles().map(cb => cb.ref),
    ...session.npcs.map(n => 'npc:' + n.id),
  ];
  return [...new Set(order)].filter(r => refs.includes(r) && handleFor(r));
}

/* -------------------------------------------------------- one number at a time
   At the table the numbers arrive one at a time, going round: a name is said,
   a number is said, the next player speaks. So the wizard asks the same way —
   one name, one box, Enter — instead of a grid of boxes you have to keep
   finding your place in. Nothing is rolled here either; it is still the
   player's dice that decide. */
function initWizard() {
  const q = modal.queue;
  const ref = q[modal.at];
  const cb = handleFor(ref);
  const last = modal.at >= q.length - 1;
  const val = modal.vals.has(ref) ? modal.vals.get(ref) : '';
  const done = q.filter(r => modal.vals.has(r)).length;

  return {
    title: 'Iniciativas',
    html: `<div class="initstep">
        <span class="sub">${modal.at + 1} de ${q.length}</span>
        <b class="nm">${esc(cb.name)}</b>
        <span class="sub">${cb.kind === 'pc' ? 'jugador' : 'PNJ'} ·
          modificador ${signed(cb.initMod || 0)}</span>
        <input name="init" type="number" inputmode="numeric" value="${val}" placeholder="—"
          aria-label="Iniciativa de ${esc(cb.name)}">
        <p class="hint">Escribe el total que ha sacado y pulsa Intro.
          Déjalo en blanco si todavía no ha tirado.</p>
      </div>
      <ol class="initqueue">${q.map((r, i) => {
        const h = handleFor(r);
        return `<li class="${h.kind}${i === modal.at ? ' now' : ''}">
          <button data-initjump="${i}">${modal.vals.has(r)
            ? `<b>${modal.vals.get(r)}</b> ` : ''}${esc(h.name)}</button></li>`;
      }).join('')}</ol>`,
    acts: `<span class="count">${done} de ${q.length} ${done === 1 ? 'apuntada' : 'apuntadas'}</span>
      <button class="ghost" data-initnav="-1"${modal.at ? '' : ' disabled'}>← Atrás</button>
      ${last
        ? '<button class="primary" data-initstart="1">Empezar combate</button>'
        : `<button class="ghost small" data-initstart="1">Empezar ya</button>
           <button class="primary" data-initnav="1">Siguiente →</button>`}`,
  };
}

/* The one thing read back out of the DOM, and for the same reason the shared
   damage box is: a number is committed when you leave the step, never on the
   keystroke, because re-rendering under a caret is how a digit gets lost. */
function commitInit() {
  if (modal?.kind !== 'init') return;
  const box = document.querySelector('.modal input[name="init"]');
  if (!box) return;
  const raw = box.value.trim();
  const ref = modal.queue[modal.at];
  /* Blank means "has not rolled yet" — the same thing clearing the box on a
     card means, and not the same thing as being out of the fight. */
  if (raw === '' || !Number.isFinite(Number(raw))) modal.vals.delete(ref);
  else modal.vals.set(ref, Number(raw));
}

function stepInit(to) {
  if (modal?.kind !== 'init') return;
  commitInit();
  modal.at = Math.min(modal.queue.length - 1, Math.max(0, to));
  render();
}

/** Whoever sat the first round out. Only ever the party not already in. */
function playerPicker() {
  const out = partyHandles()
    .filter(cb => !session.encounter.members.includes(cb.ref) && !session.field.benched.includes(cb.ref));
  return {
    title: 'Meter jugadores',
    html: out.length
      ? out.map(cb => {
        const on = modal.refs.has(cb.ref);
        return `<div class="pickrow${on ? ' on' : ''}">
          <button class="tick${on ? ' on' : ''}" data-joinpick="${esc(cb.ref)}"
            aria-pressed="${on}" aria-label="${esc(cb.name)}">${on ? '✓' : ''}</button>
          <button class="nm" data-joinpick="${esc(cb.ref)}"><b>${esc(cb.name)}</b></button>
          <span class="st">CA ${cb.ac} · ${currentHP(cb)}/${cb.hpMax} PG · iniciativa ${signed(cb.initMod)}</span>
        </div>`;
      }).join('')
      : '<p class="muted">Toda la mesa está ya en el combate.</p>',
    acts: `<span class="count">${modal.refs.size
      ? `${modal.refs.size} jugador${modal.refs.size === 1 ? '' : 'es'}`
      : 'Nadie elegido todavía'}</span>
      <button class="ghost" data-closemodal="1">Cancelar</button>
      <button class="primary" data-commitadd="players"${modal.refs.size ? '' : ' disabled'}>Meter</button>`,
  };
}

/** Empezar combate opens this instead of starting anything: who walks into a
    fight is asked here, every time, not assumed from a tick left over on a
    screen you were not looking at. Both sides are the same two questions —
    is this one in, and (npc only) does the table see it yet — asked the same
    way on both, in one modal, rather than a screen you had to visit first.

    Players and monsters who are already sat at the table lead each column,
    because that is who a fight is about nine times out of ten; a benched
    player is still one tap away, listed right under them, the same as
    joining ever was. The PNJ column goes one step further: anyone still in
    the bestiary and never loaded at all is reachable too, with its own
    count, so an ambush the table has not met yet does not need a trip to
    PNJ and back before it can join. */
function musterPicker() {
  const q = modal.filter || '';
  /* A row you already ticked never disappears under its own search — typing
     to find one more goblin should not make it look like the last one got
     unticked. */
  const matches = (cb, ref) => matchesFilter(cb.name, q) || modal.refs.has(ref ?? cb.ref);

  const party = partyHandles().filter(cb => matches(cb));
  const onScene = party.filter(cb => !session.field.benched.includes(cb.ref));
  const offScene = party.filter(cb => session.field.benched.includes(cb.ref));
  const npcs = session.npcs.map(npcHandle).filter(cb => matches(cb));
  /* Every bestiary entry, not just what is missing from the board: loading a
     second batch of goblins is exactly as normal as loading the first. */
  const unloaded = session.bestiary.filter(b =>
    matchesFilter(`${b.name} ${b.tag || ''}`, q) || modal.counts.get(b.id));

  const hideToggle = (ref, hidden) => `<button type="button" class="small ghost" data-musterhide="${esc(ref)}"
    aria-pressed="${hidden}" title="${hidden ? 'Entra oculto — no se revela a los jugadores' : 'Entra visible para los jugadores'}">${
    hidden ? '🙈 Oculto' : '👁 Visible'}</button>`;

  const pcRow = cb => {
    const on = modal.refs.has(cb.ref);
    const benched = session.field.benched.includes(cb.ref);
    return `<div class="pickrow${on ? ' on' : ''}">
      <button class="tick${on ? ' on' : ''}" data-musterpick="${esc(cb.ref)}"
        aria-pressed="${on}" aria-label="${esc(cb.name)}">${on ? '✓' : ''}</button>
      <button class="nm" data-musterpick="${esc(cb.ref)}"><b>${esc(cb.name)}</b></button>
      <span class="st withtoggle">
        <span>CA ${cb.ac} · ${currentHP(cb)}/${cb.hpMax} PG · iniciativa ${signed(cb.initMod)}</span>
        <button type="button" class="small ghost" data-bench="${esc(cb.ref)}"
          title="${benched ? 'Volver a la mesa' : 'Quitar de la mesa'}">${
          benched ? '↩ Volver' : '✕ Quitar'}</button>
      </span>
    </div>`;
  };

  const npcRow = cb => {
    const on = modal.refs.has(cb.ref);
    return `<div class="pickrow${on ? ' on' : ''}">
      <button class="tick${on ? ' on' : ''}" data-musterpick="${esc(cb.ref)}"
        aria-pressed="${on}" aria-label="${esc(cb.name)}">${on ? '✓' : ''}</button>
      <button class="nm" data-musterpick="${esc(cb.ref)}"><b>${esc(cb.name)}</b></button>
      <span class="st withtoggle">
        <span>CA ${cb.ac} · ${cb.hpMax} PG</span>
        ${hideToggle(cb.ref, modal.hidden.has(cb.ref))}
      </span>
    </div>`;
  };

  /* Not loaded yet — a stepper, the same one +PNJ always used, because
     bringing three goblins into a fight that has not started is exactly the
     same decision as bringing three goblins onto the board. */
  const beastRow = b => {
    const n = modal.counts.get(b.id) || 0;
    const hideRef = 'bestiary:' + b.id;
    return `<div class="pickrow${n ? ' on' : ''}">
      <button class="tick${n ? ' on' : ''}" data-musterbeast="${esc(b.id)}:toggle"
        aria-pressed="${!!n}" aria-label="${esc(b.name)}">${n ? '✓' : ''}</button>
      <button class="nm" data-musterbeast="${esc(b.id)}:toggle"><b>${esc(b.name)}</b>${
        b.tag ? ` <span class="muted" style="font-size:.78rem">· ${esc(b.tag)}</span>` : ''}</button>
      <span class="st withtoggle">
        <span class="stepper">
          <button class="ghost" data-musterbeast="${esc(b.id)}:-1" aria-label="Uno menos">−</button>
          <b>${n}</b>
          <button class="ghost" data-musterbeast="${esc(b.id)}:1" aria-label="Uno más">+</button>
        </span>
        ${hideToggle(hideRef, modal.hidden.has(hideRef))}
      </span>
    </div>`;
  };

  const anyChosen = modal.refs.size || [...modal.counts.values()].some(n => n > 0);
  const noMatches = q.trim() && !party.length && !npcs.length && !unloaded.length;

  return {
    title: 'Elegir quién entra en combate',
    html: `<div class="filterbar">
      <input type="text" data-filter="muster" placeholder="Buscar por nombre…" value="${esc(q)}">
    </div>
    ${noMatches ? `<p class="muted">Nada llamado «${esc(q.trim())}».</p>` : `<div class="musterpick">
      <div class="pickcol">
        <h3>Jugadores</h3>
        ${party.length ? '' : `<p class="muted">${
          q.trim() ? 'Ninguno coincide.' : 'No hay fichas.'}</p>`}
        ${onScene.map(pcRow).join('')}
        ${offScene.length ? `<p class="muted" style="font-size:.78rem;margin:.5rem 0 .1rem">Fuera de la mesa</p>
          ${offScene.map(pcRow).join('')}` : ''}
      </div>
      <div class="pickcol">
        <h3>PNJ</h3>
        ${npcs.length ? npcs.map(npcRow).join('')
          : !unloaded.length && !q.trim() ? '<p class="muted">Nadie cargado todavía.</p>' : ''}
        ${unloaded.length ? `<p class="muted" style="font-size:.78rem;margin:.5rem 0 .1rem">Sin cargar todavía</p>
          ${unloaded.map(beastRow).join('')}`
          : (npcs.length || q.trim() ? '' : `<p class="muted">Escríbelos primero en
              <button class="link" data-nav="monstruos">PNJ</button>.</p>`)}
      </div>
    </div>`}`,
    acts: `<span class="count">${anyChosen
      ? 'Elegido para esta lucha'
      : 'Nadie elegido todavía'}</span>
      <button class="ghost" data-closemodal="1">Cancelar</button>
      <button class="primary" data-musterconfirm="1"${anyChosen ? '' : ' disabled'}>Elegir iniciativas</button>`,
  };
}

/* ================================================================ CAMPO
   There is no grid in this window. The field is the television's job, and
   looking at two of them was worse than looking at one — so what is left here
   is the state behind it: everyone is seated automatically, and the only
   choices a DM makes are on each monster's card (who the players can see) and
   in the map panel in the header.
========================================================================= */

/** The nearest free square to the top-left, so six goblins do not all land on
    the same cell before anybody has dragged them anywhere. */
function freeSquare(f) {
  const taken = new Set(Object.values(f.tokens).map(p => p.x + ',' + p.y));
  for (let y = 0; y < f.rows; y++) {
    for (let x = 0; x < f.cols; x++) if (!taken.has(x + ',' + y)) return { x, y };
  }
  return { x: 0, y: 0 };
}

/** Everybody who exists is on the field, in or out of any fight — an npc from
    the moment it is loaded, a player from the moment they join the party.
    Whether the *players* see one is the reveal switch on its own row, and
    whether a card shows hit points is whether it is in a fight — neither is
    a reason to leave someone off the board itself. A benched player is the
    one exception: on the board is the default, not the guarantee. */
function seatAll() {
  const f = session.field;
  const refs = [...session.party.map(c => 'pc:' + c.id).filter(r => !f.benched.includes(r)),
                ...session.npcs.map(n => 'npc:' + n.id)];
  for (const ref of refs) if (!f.tokens[ref]) f.tokens[ref] = freeSquare(f);
  for (const ref of Object.keys(f.tokens)) if (!refs.includes(ref)) delete f.tokens[ref];
}

let mapMemory = null;                // the image when localStorage would not take it

/** Down to 1920 px and re-encoded as JPEG before it is stored: a photographed
    battle plan lands around 300 KB that way, which is the difference between
    the 5 MB ceiling being a non-issue and being a trap. */
function readImage(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(1920, img.naturalWidth);
      const h = Math.round(img.naturalHeight * (w / img.naturalWidth));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const url = cv.toDataURL('image/jpeg', 0.82);
      mapMemory = url;
      session.field.map = { src: null, stamp: newId() };
      /* Known this instant, from the decode that just happened — seeding the
         cache with it means the very next column edit needs no reload of
         its own, and the board's rows square up to this map right away
         rather than one render behind. */
      aspectCache[url] = w / h;
      session.field.rows = deriveRows(session.field.cols, w / h);
      /* You dropped a map to use it, so the board is live. And it is no longer
         the scene it was: what is on the television is now these bytes, not
         that scene's file, and saying so keeps the strip above the muster from
         claiming a name and a missing asset that no longer apply. */
      session.field.live = true;
      session.field.sceneId = null;
      const kb = Math.round(url.length * 0.75 / 1024);
      try {
        localStorage.setItem(MAP_KEY, url);
        flash(`Mapa puesto \u00b7 ${w}\u00d7${h}, ${kb} KB.`);
      } catch (e) {
        flash(`El mapa (${kb} KB) no cabe en el almacenamiento: vale para esta sesi\u00f3n, pero no se guarda.`);
      }
      showTV = true;
      save(); render();
    };
    img.onerror = () => flash('No pude leer esa imagen.');
    img.src = String(reader.result);
  };
  reader.onerror = () => flash('No se pudo leer el archivo.');
  reader.readAsDataURL(file);
}

/** A relative path loads straight from disk in both windows; an image that was
    dropped on the board is bytes in MAP_KEY and only this window has them until
    the projection carries the stamp across. */
function mapSrc() {
  const m = session.field.map;
  if (!m) return null;
  if (m.src) return m.src;
  try { return localStorage.getItem(MAP_KEY) || mapMemory; }
  catch (e) { return mapMemory; }
}

/** The ratio the table's own board is squaring its columns against — the map
    actually on it, when there is one, or its own current shape otherwise, so
    typing a new column count with no map keeps the board the shape it
    already was instead of asking for a second number. */
function fieldAspect() {
  const f = session.field;
  return aspectOf(f.map ? mapSrc() : null, f.cols / f.rows);
}

/** A portrait resolves the same way the map does — a path through
    `campaignPath()`, or a stamp, which here is the data URI itself rather
    than a pointer into a shared key: there are many portraits, not one map,
    so each rides inside its own character or bestiary entry instead of a
