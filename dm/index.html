<script id="engine">
/* ================================================================= ENGINE
   Pure functions. No DOM, no state mutation: every function takes what it
   needs and returns a value, so each rule can be checked by hand.
========================================================================= */

const byKey = (list, key) => list.find(x => x.key === key);
const skill = key => byKey(SKILLS, key);
const weapon = key => byKey(WEAPONS, key);
const armor = key => byKey(ARMORS, key);

const signed = n => (n >= 0 ? `+${n}` : `${n}`);
const abilityMod = score => Math.floor((score - 10) / 2);

/** Point-buy cost of one score, or null if outside the legal 8..15 range. */
function buyCost(score) {
  return POINT_BUY_COST[score] ?? null;
}

/** Total points spent across the six purchased scores. */
function buySpent(buy) {
  return ABILITIES.reduce((sum, a) => sum + (buyCost(buy[a.key]) ?? 0), 0);
}

/**
 * Final ability scores: purchased values plus the background improvement.
 * The 8..15 range applies to the purchase only; the background can push a
 * score to 17, which is the single most misread part of the 2024 rules.
 */
function finalScores(state) {
  const out = {};
  for (const a of ABILITIES) out[a.key] = state.buy[a.key];
  for (const [key, bonus] of Object.entries(state.boosts || {})) {
    if (out[key] != null) out[key] += bonus;
  }
  return out;
}

function mods(scores) {
  const out = {};
  for (const a of ABILITIES) out[a.key] = abilityMod(scores[a.key]);
  return out;
}

/** Every mechanical hook granted by species, background feat and class. */
function hooks(state) {
  const sp = SPECIES[state.species];
  const bg = BACKGROUNDS[state.background];
  const feats = [];
  if (bg) feats.push(bg.feat);
  if (state.extraFeat) feats.push(state.extraFeat);   // Human's Versatile

  let hpPerLevel = 0, initiativeProficiency = false, unarmed = null;
  if (sp?.grants?.hpPerLevel) hpPerLevel += sp.grants.hpPerLevel;
  for (const f of feats) {
    const h = ORIGIN_FEATS[f]?.hooks || {};
    if (h.hpPerLevel) hpPerLevel += h.hpPerLevel;
    if (h.initiativeProficiency) initiativeProficiency = true;
    if (h.unarmed) unarmed = h.unarmed;
  }
  return { feats, hpPerLevel, initiativeProficiency, unarmed };
}

/** Hit points at level 1: max hit die + CON mod + per-level bonuses. */
function hitPoints(state, m) {
  const cls = CLASSES[state.class];
  if (!cls) return null;
  const h = hooks(state);
  return cls.hitDie + m.CON + h.hpPerLevel;
}

/**
 * What the character is actually carrying, merged from the chosen class and
 * background packages. Single source for AC, attacks and the equipment list,
 * so the sheet can never disagree with the package that was picked.
 */
function loadout(state) {
  const packs = [
    CLASSES[state.class]?.equipment?.[state.equipmentClass],
    BACKGROUNDS[state.background]?.equipment?.[state.equipmentBackground],
  ].filter(Boolean);

  const items = [];
  let gp = 0, armorKey = 'ninguna', shield = false;
  const weapons = [];

  for (const p of packs) {
    items.push(...(p.items || []));
    gp += p.gp || 0;
    const g = p.grants || {};
    // Heaviest armor wins when both packages grant one.
    if (g.armor && (armor(g.armor)?.ca ?? 0) > (armor(armorKey)?.ca ?? 0)) armorKey = g.armor;
    if (g.shield) shield = true;
    for (const w of g.weapons || []) if (!weapons.includes(w)) weapons.push(w);
  }
  return { items, gp, armor: armorKey, shield, weapons };
}

/** Armor Class from the equipped armor and shield. */
function armorClass(state, m) {
  const kit = loadout(state);
  const a = armor(kit.armor) || armor('ninguna');
  let ca = a.ca;
  // 'full' adds Dexterity outright, a number caps it (a negative one still
  // applies), 'none' means heavy armour where Dexterity does not count at all.
  if (a.dex === 'full') ca += m.DES;
  else if (typeof a.dex === 'number') ca += Math.min(m.DES, a.dex);
  if (kit.shield) ca += 2;
  if (state.fightingStyle === 'defensa' && a.key !== 'ninguna') ca += 1;

  // Unarmored Defense only applies with no armor. The Barbarian may still use
  // a shield; the Monk may not, so each class declares it.
  const ud = CLASSES[state.class]?.unarmoredDefense;
  if (ud && a.key === 'ninguna' && !(kit.shield && !ud.shield)) {
    ca = Math.max(ca, 10 + m.DES + m[ud.ability] + (kit.shield && ud.shield ? 2 : 0));
  }
  return ca;
}

/** Warns when the armor's Strength requirement is not met. */
function armorPenalty(state, scores) {
  const a = armor(loadout(state).armor);
  if (!a || !a.str) return null;
  if (scores.FUE >= a.str) return null;
  return `${a.es} pide Fuerza ${a.str} y tienes ${scores.FUE}: tu velocidad baja 3 m.`;
}

/** Set of skill keys the character is proficient in, and which are expertise. */
function skillProficiencies(state) {
  const prof = new Set();
  const expertise = new Set();
  const bg = BACKGROUNDS[state.background];
  if (bg) bg.skills.forEach(s => prof.add(s));
  for (const s of state.classSkills || []) prof.add(s);
  for (const s of state.speciesSkills || []) prof.add(s);
  for (const s of state.featSkills || []) prof.add(s);
  for (const s of state.expertise || []) if (prof.has(s)) expertise.add(s);
  return { prof, expertise };
}

/** Skills granted automatically, mapped to where they came from. */
function grantedSkillSources(state) {
  const src = new Map();
  const bg = BACKGROUNDS[state.background];
  if (bg) bg.skills.forEach(s => src.set(s, bg.es));
  for (const s of state.speciesSkills || []) if (!src.has(s)) src.set(s, SPECIES[state.species]?.es || 'Especie');
  for (const s of state.featSkills || []) if (!src.has(s)) src.set(s, 'Dote');
  return src;
}

function skillRow(key, m, prof, expertise) {
  const sk = skill(key);
  const base = m[sk.ability];
  const bonus = expertise.has(key) ? PROFICIENCY_BONUS * 2 : prof.has(key) ? PROFICIENCY_BONUS : 0;
  return { ...sk, total: base + bonus, prof: prof.has(key), expertise: expertise.has(key) };
}

function saves(state, m) {
  const cls = CLASSES[state.class];
  const profSaves = new Set(cls?.saves || []);
  return ABILITIES.map(a => ({
    ...a,
    prof: profSaves.has(a.key),
    total: m[a.key] + (profSaves.has(a.key) ? PROFICIENCY_BONUS : 0),
  }));
}

/** Walking speed in metres. A lineage may override the species value. */
function speed(state) {
  const sp = SPECIES[state.species];
  if (!sp) return null;
  return sp.lineages?.[state.lineage]?.speed ?? sp.speed;
}

/** Size, either fixed by the species or chosen by the player. */
function size(state) {
  const sp = SPECIES[state.species];
  if (!sp) return null;
  return sp.size.length === 1 ? sp.size[0] : (state.size || null);
}

function initiative(state, m) {
  const h = hooks(state);
  return m.DES + (h.initiativeProficiency ? PROFICIENCY_BONUS : 0);
}

function passivePerception(m, prof, expertise) {
  return 10 + skillRow('percepcion', m, prof, expertise).total;
}

/**
 * Armor and weapon proficiency, after the level-1 class choices that widen it:
 * the Cleric's Protector order and the Druid's Guardian order.
 */
function proficiencies(state) {
  const cls = CLASSES[state.class];
  if (!cls) return { armor: [], weapons: [], weaponProf: { simple: false, martial: false } };
  const armorList = [...cls.armor];
  const weaponList = [...cls.weapons];
  const wp = { ...cls.weaponProf };

  if (state.divineOrder === 'protector') {
    if (!armorList.includes('pesadas')) armorList.push('pesadas');
    if (wp.martial !== 'todas') { wp.martial = 'todas'; weaponList.push('marciales'); }
  }
  if (state.primalOrder === 'guardian') {
    if (!armorList.includes('medias')) armorList.push('medias');
    if (wp.martial !== 'todas') { wp.martial = 'todas'; weaponList.push('marciales'); }
  }
  return { armor: armorList, weapons: weaponList, weaponProf: wp };
}

/** Whether the character is proficient with a given weapon. */
function proficientWithWeapon(state, w) {
  const wp = proficiencies(state).weaponProf;
  if (w.cat === 'simple') return !!wp.simple;
  const has = p => w.props.some(x => x.startsWith(p));
  switch (wp.martial) {
    case 'todas': return true;
    case 'sutil-o-ligera': return has('sutil') || has('ligera');
    case 'ligera': return has('ligera');
    default: return false;
  }
}

/**
 * A Monk's Martial Arts lets Dexterity replace Strength on unarmed strikes and
 * on "monk weapons": Simple melee, or Martial melee with Ligera, never Pesada
 * or a dos manos.
 */
function isMonkWeapon(w) {
  if (!w.melee) return false;
  const has = p => w.props.some(x => x.startsWith(p));
  if (has('pesada') || has('a dos manos')) return false;
  return w.cat === 'simple' || has('ligera');
}

/** Attack rows for the character's chosen weapons, plus unarmed when it matters. */
function attacks(state, m) {
  const masteries = new Set(state.masteries || []);
  const cls = CLASSES[state.class];
  const martialArts = cls?.martialArts;

  const rows = loadout(state).weapons.map(key => {
    const w = weapon(key);
    if (!w) return null;
    const proficient = proficientWithWeapon(state, w);
    const finesse = w.props.some(p => p.startsWith('sutil'));
    const dexAllowed = !w.melee || finesse || (martialArts && isMonkWeapon(w));
    const useDex = dexAllowed && m.DES >= m.FUE;
    const abilityKey = useDex ? 'DES' : 'FUE';
    const mod = m[abilityKey];
    return {
      key,
      name: w.es,
      en: w.en,
      ability: abilityKey,
      attack: mod + (proficient ? PROFICIENCY_BONUS : 0),
      damage: `${w.dmg}${mod ? ' ' + signed(mod) : ''} ${DAMAGE_TYPES[w.type]}`,
      props: w.props,
      mastery: masteries.has(key) ? MASTERIES[w.mastery] : null,
      proficient,
    };
  }).filter(Boolean);

  // Unarmed strike, listed only when something makes it worth rolling.
  const h = hooks(state);
  const unarmedDie = martialArts || h.unarmed;
  if (unarmedDie) {
    const useDex = martialArts ? m.DES >= m.FUE : false;
    const mod = useDex ? m.DES : m.FUE;
    rows.push({
      key: 'unarmed',
      name: 'Golpe sin armas',
      en: 'Unarmed Strike',
      ability: useDex ? 'DES' : 'FUE',
      attack: mod + PROFICIENCY_BONUS,
      damage: `${unarmedDie}${mod ? ' ' + signed(mod) : ''} ${DAMAGE_TYPES.c}`,
      props: martialArts ? ['artes marciales'] : ['camorrista'],
      mastery: null,
      proficient: true,
    });
  }
  return rows;
}

/** Level-1 spellcasting numbers, or null for a character who does not cast. */
function spellcasting(state, m) {
  const cls = CLASSES[state.class];
  if (!cls?.casting) return null;
  const ab = cls.casting.ability;
  return {
    ability: ab,
    abilityName: byKey(ABILITIES, ab).es,
    dc: 8 + PROFICIENCY_BONUS + m[ab],
    attack: PROFICIENCY_BONUS + m[ab],
    cantrips: cls.casting.cantrips || 0,
    prepared: cls.casting.prepared ?? null,
    known: cls.casting.known ?? null,
    slots: cls.casting.slots1 || 0,
    ritual: !!cls.casting.ritual,
  };
}

/* Spells are identified by their English name, which is unique in the table. */
const spellByEn = en => SPELLS.find(s => s.en === en) || null;

/** The spells one class list offers at a given level. */
function spellList(classKey, lvl) {
  return SPELLS.filter(s => s.lvl === lvl && s.classes.includes(classKey))
    .sort((a, b) => a.es.localeCompare(b.es, 'es'));
}

/** Does this character have a Magic Initiate feat, and from which list? */
function magicInitiateFeat(state) {
  const h = hooks(state);
  if (!h.feats.includes('iniciado')) return null;
  return state.magicInitiate || { list: null, cantrips: [], level1: null };
}

/**
 * Every spell the character has, grouped by where it came from. Species and
 * feat spells are separate from class spells because they do not use the
 * class's spell slots.
 */
function extraSpellSources(state) {
  const out = [];
  const sp = SPECIES[state.species];
  if (sp?.grants?.cantrips?.length) {
    out.push({ from: sp.es, cantrips: sp.grants.cantrips, level1: [] });
  }
  const lineage = sp?.lineages?.[state.lineage];
  if (lineage?.cantrips?.length) {
    out.push({ from: lineage.es, cantrips: lineage.cantrips, level1: [] });
  }
  const mi = magicInitiateFeat(state);
  if (mi && (mi.cantrips?.length || mi.level1)) {
    out.push({
      from: `Iniciado en la magia (${MAGIC_INITIATE_LISTS[mi.list]?.es || '—'})`,
      cantrips: mi.cantrips || [],
      level1: mi.level1 ? [mi.level1] : [],
    });
  }
  return out;
}

/** True when there is anything at all to put on a spell sheet. */
function castsAnything(state) {
  if (CLASSES[state.class]?.casting) return true;
  const sp = SPECIES[state.species];
  if (sp?.grants?.cantrips?.length) return true;
  if (sp?.lineages?.[state.lineage]?.cantrips?.length) return true;
  return !!magicInitiateFeat(state);
}

/** Class cantrips and level-1 spells the player has actually picked. */
function chosenClassSpells(state) {
  return {
    cantrips: (state.spells?.cantrips || []).map(spellByEn).filter(Boolean),
    level1: (state.spells?.level1 || []).map(spellByEn).filter(Boolean),
  };
}

/** Full derived character. One call, everything the sheet needs. */
function derive(state) {
  const scores = finalScores(state);
  const m = mods(scores);
  const { prof, expertise } = skillProficiencies(state);
  return {
    scores, mods: m,
    hp: hitPoints(state, m),
    ca: armorClass(state, m),
    initiative: initiative(state, m),
    saves: saves(state, m),
    skills: SKILLS.map(s => skillRow(s.key, m, prof, expertise)),
    passivePerception: passivePerception(m, prof, expertise),
    attacks: attacks(state, m),
    casting: spellcasting(state, m),
    extraSpells: extraSpellSources(state),
    classSpells: chosenClassSpells(state),
    hooks: hooks(state),
    loadout: loadout(state),
    proficiencies: proficiencies(state),
    speed: speed(state),
    size: size(state),
    armorPenalty: armorPenalty(state, scores),
  };
}

/* ============================================================ QUIZ ENGINE
   Pure: takes the answers and returns a complete, legal proposal for the
   background, ability spread, skills, equipment and spells. It never writes
   to the state — the app applies it, and the player can change all of it.
========================================================================= */

/** Adds every selected answer's weights into one bucket per channel. */
function quizWeights(answers) {
  const acc = { bg: {}, ab: {}, sk: {}, kit: {}, tone: {} };
  for (const q of QUIZ) {
    const pick = answers?.[q.id];
    if (pick == null) continue;
    const w = q.options[pick]?.w;
    if (!w) continue;
    for (const channel of ['bg', 'ab', 'sk', 'kit', 'tone']) {
      for (const [key, value] of Object.entries(w[channel] || {})) {
        acc[channel][key] = (acc[channel][key] || 0) + value;
      }
    }
  }
  return acc;
}

/** Keys of a score bucket, highest first, ties broken alphabetically. */
function ranked(bucket) {
  return Object.entries(bucket)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([key]) => key);
}

const quizAnswered = answers => QUIZ.filter(q => answers?.[q.id] != null).length;

/**
 * Ability priority. The quiz gives the flavour, but the class decides what the
 * character actually needs, so its primary abilities get a decisive bonus and
 * Constitution a small one — nobody at level 1 wants a d6 class with CON 8.
 */
function abilityPriority(state, weights) {
  const cls = CLASSES[state.class];
  const score = {};
  for (const a of ABILITIES) {
    score[a.key] = (weights.ab[a.key] || 0)
      + (cls?.primary?.includes(a.key) ? 20 : 0)
      + (a.key === 'CON' ? 4 : 0);
  }
  // A spellcasting class must not end up with a weak casting ability.
  if (cls?.casting) score[cls.casting.ability] += 20;

  const order = ranked(score);

  // Constitution must land in the top three, which is a 13 or better on the
  // standard spread. A level-1 character with CON 12 and three players at the
  // table goes down too easily for the quiz to hand that out by accident.
  const at = order.indexOf('CON');
  if (at > 2) {
    order.splice(at, 1);
    order.splice(2, 0, 'CON');
  }
  return order;
}

/**
 * The standard 27-point spread, handed out in priority order, plus the
 * background improvement placed as high up that order as the background allows.
 */
const QUIZ_SPREAD = Object.freeze([15, 14, 13, 12, 10, 8]);

function allocateAbilities(priority, backgroundKey) {
  const buy = {};
  priority.forEach((key, i) => { buy[key] = QUIZ_SPREAD[i]; });

  // +2/+1, both restricted to the three abilities the background offers.
  const allowed = BACKGROUNDS[backgroundKey]?.abilities || [];
  const byPriority = priority.filter(k => allowed.includes(k));
  const boosts = {};
  if (byPriority[0]) boosts[byPriority[0]] = 2;
  if (byPriority[1]) boosts[byPriority[1]] = 1;
  return { buy, boosts };
}

/** The package that best matches a fighting style, never the gold-only one. */
function packageForStyle(cls, style) {
  const entries = Object.entries(cls?.equipment || {}).filter(([, p]) => (p.items || []).length);
  if (!entries.length) return Object.keys(cls?.equipment || { A: 1 })[0];

  const score = ([, p]) => {
    const weapons = (p.grants?.weapons || []).map(weapon).filter(Boolean);
    const has = pred => weapons.some(pred);
    const prop = (w, name) => w.props.some(x => x.startsWith(name));
    let n = 0;
    if (style === 'distancia' && has(w => !w.melee)) n += 3;
    if (style === 'cuerpo' && has(w => w.melee && !prop(w, 'ligera'))) n += 2;
    if (style === 'cuerpo' && (p.grants?.shield || armor(p.grants?.armor || 'ninguna')?.cat === 'pesada')) n += 2;
    if (style === 'sutil' && has(w => prop(w, 'sutil') || prop(w, 'ligera'))) n += 3;
    if (style === 'apoyo' && p.grants?.shield) n += 2;
    return n;
  };
  return entries.slice().sort((a, b) => score(b) - score(a))[0][0];
}

/** Class skills, chosen by affinity and skipping anything already granted. */
function pickClassSkills(state, weights, backgroundKey) {
  const cls = CLASSES[state.class];
  if (!cls) return [];
  const taken = new Set([
    ...(BACKGROUNDS[backgroundKey]?.skills || []),
    ...(state.speciesSkills || []),
  ]);
  const pool = cls.skills.from.filter(k => !taken.has(k));
  const order = pool.slice().sort((a, b) =>
    (weights.sk[b] || 0) - (weights.sk[a] || 0) || a.localeCompare(b));
  return order.slice(0, cls.skills.n);
}

/** Spells from the curated list, trimmed to what the class may actually take. */
function pickSpells(state, slant) {
  const cls = CLASSES[state.class];
  if (!cls?.casting) return { cantrips: [], level1: [] };
  const picks = SPELL_PICKS[state.class]?.[slant];
  if (!picks) return { cantrips: [], level1: [] };

  const legal = (names, lvl) => {
    const allowed = new Set(spellList(state.class, lvl).map(s => s.en));
    return names.filter(n => allowed.has(n));
  };
  const wantL1 = cls.casting.book ?? cls.casting.prepared ?? cls.casting.known ?? 0;
  return {
    cantrips: legal(picks.c, 0).slice(0, cls.casting.cantrips),
    level1: legal(picks.l, 1).slice(0, wantL1),
  };
}

/**
 * Weapon masteries. Mastery only pays off on a weapon you actually swing, so
 * the ones in the chosen starting package come first; after that, whatever
 * fits the fighting style and hits hardest, so the count is always filled.
 */
function pickMasteries(state, cls, style, carried = []) {
  const usable = WEAPONS.filter(w => proficientWithWeapon(state, w));
  const wantsRanged = style === 'distancia';
  const fitsStyle = w => wantsRanged ? !w.melee
    : style === 'sutil' ? w.props.some(p => p.startsWith('sutil') || p.startsWith('ligera'))
    : w.melee;

  // Average damage, only used to break ties sensibly.
  const avg = w => {
    const m = /^(\d+)d(\d+)$/.exec(w.dmg);
    return m ? Number(m[1]) * (Number(m[2]) + 1) / 2 : Number(w.dmg) || 0;
  };
  const score = w =>
    (carried.includes(w.key) ? 100 : 0) +
    (fitsStyle(w) ? 20 : 0) +
    (w.cat === 'marcial' ? 5 : 0) +
    avg(w);

  return usable.slice().sort((a, b) => score(b) - score(a) || a.key.localeCompare(b.key))
    .slice(0, cls.mastery.n).map(w => w.key);
}

/** The full proposal. `null` until the questionnaire is finished. */
function quizResult(state) {
  const answers = state.quiz?.answers || {};
  if (quizAnswered(answers) < QUIZ.length) return null;

  const weights = quizWeights(answers);
  const background = ranked(weights.bg)[0] || 'trotamundos';
  const priority = abilityPriority(state, weights);
  const { buy, boosts } = allocateAbilities(priority, background);
  const style = ranked(weights.kit)[0] || 'cuerpo';
  const tones = ranked(weights.tone).slice(0, 3);

  const cls = CLASSES[state.class];
  const classSkills = pickClassSkills(state, weights, background);

  // Expertise, for the Rogue, follows the same affinity order.
  let expertise = [];
  if (cls?.expertise) {
    const proficient = [...new Set([...classSkills, ...(BACKGROUNDS[background]?.skills || []),
      ...(state.speciesSkills || [])])];
    expertise = proficient
      .sort((a, b) => (weights.sk[b] || 0) - (weights.sk[a] || 0) || a.localeCompare(b))
      .slice(0, cls.expertise.n);
  }

  // A support-leaning character gets the support spell list.
  const slant = (style === 'apoyo' || tones[0] === 'protector') ? 'apoyo' : 'ofensivo';

  // Masteries need to know the equipment first: they follow what you carry.
  const equipmentClass = cls ? packageForStyle(cls, style) : 'A';
  const carried = cls?.equipment?.[equipmentClass]?.grants?.weapons || [];

  return {
    background, priority, buy, boosts, style, tones, classSkills, expertise, slant,
    equipmentClass,
    equipmentBackground: 'A',
    spells: pickSpells(state, slant),
    // Class choices the quiz can settle without the player going back.
    fightingStyle: cls?.features?.some(f => f.choice === 'fightingStyle')
      ? (style === 'distancia' ? 'arqueria' : style === 'sutil' ? 'dosarmas' : 'defensa') : null,
    divineOrder: cls?.features?.some(f => f.choice === 'divineOrder')
      ? (style === 'cuerpo' ? 'protector' : 'taumaturgo') : null,
    primalOrder: cls?.features?.some(f => f.choice === 'primalOrder')
      ? (style === 'cuerpo' ? 'guardian' : 'mago') : null,
    masteries: cls?.mastery ? pickMasteries(state, cls, style, carried) : [],
  };
}

/**
 * Non-blocking notices. Order matters: `error` entries mean the step is
 * incomplete, `warn` entries are advice a player is free to ignore.
 */
function validate(state) {
  const out = [];
  const push = (level, step, text) => out.push({ level, step, text });

  if (!state.name?.trim()) push('error', 'concepto', 'El personaje no tiene nombre.');
  if (!state.species) push('error', 'especie', 'Falta elegir especie.');
  if (!state.class) push('error', 'clase', 'Falta elegir clase.');
  if (!state.background) push('error', 'trasfondo', 'Falta elegir trasfondo.');

  const sp = SPECIES[state.species];
  if (sp?.lineages && !state.lineage) push('error', 'especie', `Falta elegir el linaje de ${sp.es}.`);
  if (sp?.size?.length > 1 && !state.size) push('error', 'especie', 'Falta elegir tamaño.');

  const cls = CLASSES[state.class];
  if (cls) {
    const need = cls.skills.n, have = (state.classSkills || []).length;
    if (have < need) push('error', 'habilidades', `Te faltan ${need - have} habilidad(es) de ${cls.es}.`);
    if (cls.mastery && (state.masteries || []).length < cls.mastery.n) {
      push('error', 'clase', `Te faltan armas con maestría (${(state.masteries||[]).length} de ${cls.mastery.n}).`);
    }
    if (cls.features?.some(f => f.choice === 'fightingStyle') && !state.fightingStyle) {
      push('error', 'clase', 'Falta elegir estilo de combate.');
    }
    if (cls.features?.some(f => f.choice === 'divineOrder') && !state.divineOrder) {
      push('error', 'clase', 'Falta elegir orden divina.');
    }
    if (cls.features?.some(f => f.choice === 'primalOrder') && !state.primalOrder) {
      push('error', 'clase', 'Falta elegir orden primigenia.');
    }
    if (cls.expertise && (state.expertise || []).length < cls.expertise.n) {
      push('error', 'habilidades', `Te falta elegir experticia (${(state.expertise||[]).length} de ${cls.expertise.n}).`);
    }
  }

  const bg = BACKGROUNDS[state.background];
  if (bg) {
    const spent = Object.values(state.boosts || {}).reduce((a, b) => a + b, 0);
    if (spent !== 3) push('error', 'trasfondo', 'Falta repartir las mejoras de puntuación del trasfondo (+2/+1 o +1/+1/+1).');
  }

  if (cls?.casting) {
    const c = cls.casting;
    const nCantrips = (state.spells?.cantrips || []).length;
    const nLevel1 = (state.spells?.level1 || []).length;
    const wantLevel1 = c.book ?? c.prepared ?? c.known ?? 0;
    if (nCantrips < c.cantrips) push('error', 'conjuros', `Te faltan ${c.cantrips - nCantrips} truco(s).`);
    if (nLevel1 < wantLevel1) push('error', 'conjuros', `Te faltan ${wantLevel1 - nLevel1} conjuro(s) de nivel 1.`);
  }
  const mi = magicInitiateFeat(state);
  if (mi) {
    if (!mi.list) push('error', 'conjuros', 'Falta elegir la lista de Iniciado en la magia.');
    else {
      if ((mi.cantrips || []).length < 2) push('error', 'conjuros', 'Iniciado en la magia: te faltan trucos.');
      if (!mi.level1) push('error', 'conjuros', 'Iniciado en la magia: falta el conjuro de nivel 1.');
    }
  }

  const spentPoints = buySpent(state.buy);
  if (spentPoints > POINT_BUY_TOTAL) push('error', 'puntos', `Te has pasado: ${spentPoints} de ${POINT_BUY_TOTAL} puntos.`);
  else if (spentPoints < POINT_BUY_TOTAL) push('warn', 'puntos', `Te quedan ${POINT_BUY_TOTAL - spentPoints} puntos por gastar.`);

  // advice, never blocking
  if (cls && state.class) {
    const scores = finalScores(state);
    const best = cls.primary.reduce((a, b) => (scores[a] >= scores[b] ? a : b));
    if (scores[best] < 14) {
      push('warn', 'puntos', `${cls.es} funciona mejor con ${cls.primary.map(k => byKey(ABILITIES,k).es).join(' o ')} alta; ahora la mejor está en ${scores[best]}.`);
    }
  }
  const pen = state.class ? armorPenalty(state, finalScores(state)) : null;
  if (pen) push('warn', 'equipo', pen);

  return out;
}
</script>

<script id="dm-app">
/* ==================================================================== DM APP
   One serializable `session` object is the single source of truth. Inputs
   write to it and call render(); nothing is ever read back out of the DOM.

   Players and monsters are deliberately the same thing to this file: both are
   a *handle* (name, CA, max hit points, initiative modifier) over a *play
   state* (current hit points, temporary hit points, conditions), so one card
   component and one damage function serve the whole table. The difference is
   only where the handle comes from — derive() for a player, a typed form for
   a monster.

   Nothing here rolls dice. Every roll at this table is physical; initiative
   totals, damage and death saves are entered, never generated.
========================================================================= */

const DM_KEY = 'dnd-dm-v1';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const metres = n => n == null ? '—' : String(n).replace('.', ',');

/* >>> copied verbatim from creator/index.html script#app.
       Needed to accept an exported .json safely. check-sync.py fails if these
       three drift from the creator's, so fix them there, not here. */

function blankCharacter() {
  return {
    id: newId(),
    updatedAt: Date.now(),
    wizardStep: 0,
    wizardDone: false,
    name: '', player: '', appearance: '', portrait: null,
    species: null, lineage: null, size: null, speciesSkills: [], extraFeat: null,
    class: null, classSkills: [], masteries: [], expertise: [], fightingStyle: null,
    divineOrder: null, primalOrder: null,
    quiz: { answers: {}, applied: false },
    background: null, boosts: {}, featSkills: [], featTools: [], magicInitiate: null,
    buy: { FUE: 8, DES: 8, CON: 8, INT: 8, SAB: 8, CAR: 8 },
    equipmentClass: 'A', equipmentBackground: 'A',
    spells: { cantrips: [], level1: [] },
    story: { personality: '', ideals: '', bonds: '', flaws: '', backstory: '', ties: '' },
  };
}

function newId() {
  return 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
}

/** Fills in anything a stored character is missing, so old saves stay usable. */
function normalise(c) {
  const merged = Object.assign(blankCharacter(), c);
  merged.id = c.id || newId();
  merged.quiz = Object.assign({ answers: {}, applied: false }, c.quiz);
  merged.spells = Object.assign({ cantrips: [], level1: [] }, c.spells);
  merged.story = Object.assign(
    { personality: '', ideals: '', bonds: '', flaws: '', backstory: '', ties: '' }, c.story);
  merged.portrait = c.portrait
    ? { src: typeof c.portrait.src === 'string' ? c.portrait.src : null,
        stamp: typeof c.portrait.stamp === 'string' ? c.portrait.stamp : null }
    : null;
  delete merged.step;                // v1 field, replaced by wizardStep
  return merged;
}

/* <<< end copied */

/* ---------------------------------------------------------------- storage
   One key, its own, so the character schema is never touched — the same
   separation the theme already uses. Monsters live inside the encounter and
   die with it; the bestiary is where a statblock survives.
====================================================================== */

function blankPlay() {
  return { hp: null, temp: 0, conditions: [], exh: 0, death: { ok: 0, fail: 0 }, note: '',
           gold: 0, inventory: '' };
}

/* The field is squares, not pixels: 24 x 14 of them is 36 m x 21 m, which is
   16:9 and so fills a television with no bars. The map image itself lives in
   its own key — see BOARD below — and `map` here only remembers how to line it
   up with the grid.

   The field is the *live* board, and a scene loads into it. That is the whole
   relationship: scenes are prep, sitting in their own key, and nothing
   downstream of here — tokens, the projection, undo, the small field — has to
   know they exist.

   `live` is whether anything is on the television at all: false lands the
   Escenas tab on the library. `grid` is a session toggle, independent of the
   scene and of combat alike — the DM turns it on to overlay tokens on the
   art, from the muster or mid-fight, and starting or ending a fight never
   touches it either way.

   `benched` is the one exception to "everyone who exists is on the field":
   a player taken off the board on purpose (out sick, sitting out a session)
   without touching their character. There is no equivalent for an npc — an
   npc is cheap to load again from PNJ, so taking one off the board deletes
   it outright rather than needing a bench of its own. */
function blankField() {
  return { cols: 24, rows: 14, live: false, grid: false, sceneId: null,
           map: null, audio: null, staged: null, paused: false,
           tokens: {}, reveal: {}, benched: [] };
}

function blankSession() {
  return {
    version: 1,
    party: [],
    play: {},
    playerFiles: {},          // '<charId>': 'players/<name>.json', when it came from a scan
    bestiary: [],
    /* Every npc instance currently loaded, in or out of any fight — see
       normaliseBeast() for the shape. Combat is a separate fact about a
       subset of these, tracked below. */
    npcs: [],
    encounter: { on: false, round: 1, activeRef: null, members: [], init: {} },
    field: blankField(),
  };
}

/** Fills in anything a stored session is missing, so old saves keep opening. */
function normaliseSession(s) {
  const out = Object.assign(blankSession(), s);
  out.version = 1;
  out.party = Array.isArray(s?.party) ? s.party.map(normalise) : [];
  out.bestiary = Array.isArray(s?.bestiary) ? s.bestiary.map(normaliseBeast) : [];

  out.play = {};
  for (const c of out.party) out.play[c.id] = normalisePlay(s?.play?.[c.id]);

  /* Which players/*.json a party member came from, so Guardar campaña knows
     which file to overwrite rather than inventing a new one every save. A
     character with no entry here was dropped in by hand or typed fresh, and
     gets a file the first time it is actually saved. */
  out.playerFiles = {};
  for (const [id, path] of Object.entries(s?.playerFiles || {})) {
    if (typeof path === 'string' && out.party.some(c => c.id === id)) out.playerFiles[id] = path;
  }

  /* An npc instance, loaded independent of any scene or fight. A save from
     before this existed kept them nested under `encounter.npcs` instead —
     read from there too, so an old fight's monsters keep existing as loaded
     npcs rather than vanishing on the first reload after the upgrade. */
  const oldNpcs = Array.isArray(s?.encounter?.npcs) ? s.encounter.npcs : [];
  const rawNpcs = Array.isArray(s?.npcs) ? s.npcs : oldNpcs;
  out.npcs = rawNpcs.map(n => Object.assign(normaliseBeast(n), normalisePlay(n)));

  const refs = new Set([...out.party.map(c => 'pc:' + c.id), ...out.npcs.map(n => 'npc:' + n.id)]);

  const e = s?.encounter || {};
  out.encounter = {
    on: false,
    round: Math.max(1, Number(e.round) || 1),
    activeRef: typeof e.activeRef === 'string' ? e.activeRef : null,
    members: [],
    init: {},
  };
  for (const [ref, v] of Object.entries(e.init || {})) {
    if (refs.has(ref) && Number.isFinite(Number(v))) out.encounter.init[ref] = Number(v);
  }
  /* Which npcs are in this fight used to be implied — every npc that existed
     was, by definition, in the one fight npcs could exist for. Now that an
     npc can be loaded without joining anything, membership needs its own
     list, same as a player's always was. A save from before that split
     still has every one of its npcs in the fight it came from. */
  const wanted = Array.isArray(e.members) ? e.members : [...Object.keys(out.encounter.init), ...out.npcs.map(n => 'npc:' + n.id)];
  out.encounter.members = [...new Set(wanted.filter(r => refs.has(r)))];
  out.encounter.on = e.on === undefined
    ? out.encounter.members.length > 0            // migrating a save with no flag
    : e.on === true && out.encounter.members.length > 0;
  if (!out.encounter.members.includes(out.encounter.activeRef)) out.encounter.activeRef = null;

  const f = s?.field || {};
  out.field = blankField();
  out.field.cols = Math.min(60, Math.max(4, Number(f.cols) || 24));
  out.field.rows = Math.min(40, Math.max(4, Number(f.rows) || 14));
  /* A save from before scenes existed was always a live battlemap — that is
     all the board could be — so an absent flag reads as true rather than
     dropping an old session onto an empty library. */
  out.field.live = f.live === undefined ? true : f.live === true;
  out.field.grid = f.grid === undefined ? true : f.grid !== false;
  /* Whether the television is currently hearing about anything — see
     save()/syncBoard(). Persisted rather than reset on reload: a laptop that
     sleeps mid-ambush should not wake up and quietly push the half-arranged
     board the moment it reconnects. */
  out.field.paused = f.paused === true;
  out.field.sceneId = typeof f.sceneId === 'string' ? f.sceneId : null;
  out.field.map = normaliseArt(f.map);
  out.field.audio = normaliseAudio(f.audio);
  /* A prepared scene sits here, resolved and ready, until the DM explicitly
     puts it on the television — see goLive()/stageScene(). buildBoard() never
     reads this key, the same guarantee a hidden monster's reveal.on gets. */
  out.field.staged = f.staged && typeof f.staged.sceneId === 'string'
    ? { sceneId: f.staged.sceneId, map: normaliseArt(f.staged.map), audio: normaliseAudio(f.staged.audio) }
    : null;
  /* A benched player is one the DM took off the board on purpose; an entry
     pointing at nobody, or at an npc (which has no bench of its own — see
     blankField()), is dropped. */
  out.field.benched = Array.isArray(f.benched)
    ? [...new Set(f.benched.filter(r => typeof r === 'string' && r.startsWith('pc:') && refs.has(r)))]
    : [];
  const seatedRefs = new Set([...refs].filter(r => !out.field.benched.includes(r)));
  /* Positions of anyone who no longer exists, or who was benched, are
     dropped, the same way stale initiative entries already are. */
  for (const [ref, at] of Object.entries(f.tokens || {})) {
    if (seatedRefs.has(ref) && Number.isFinite(Number(at?.x)) && Number.isFinite(Number(at?.y))) {
      out.field.tokens[ref] = { x: clampCol(out.field, at.x), y: clampRow(out.field, at.y) };
    }
  }
  for (const n of out.npcs) out.field.reveal[n.id] = normaliseReveal(f.reveal?.[n.id]);

  return out;
}

const clampCol = (f, x) => Math.min(f.cols - 1, Math.max(0, Math.round(Number(x) || 0)));
const clampRow = (f, y) => Math.min(f.rows - 1, Math.max(0, Math.round(Number(y) || 0)));

/** Where a picture comes from. Exactly one of the two sources is set: `src` is
    a path relative to this file, which is what a scene uses and what both
    windows can load; `stamp` means the bytes are in MAP_KEY, which is what
    dropping an image on the board still does. That second path is a
    deliberate carve-out — it is the rescue for a map you found five minutes
    ago, and it is the one that can still hit the storage ceiling. */
function normaliseArt(m) {
  if (!m) return null;
  const src = typeof m.src === 'string' && m.src.trim() ? m.src.trim() : null;
  const stamp = src ? null : String(m.stamp || '');
  if (!src && !stamp) return null;
  return { src, stamp };
}

/** One sound layer: a path, how loud it sits in this scene's mix, and whether
    it repeats. Paths only, exactly like `art` and for the same reason — an MP3
    is bigger than the whole localStorage budget, so the bytes stay on disk.
    A layer with no path is no layer, which is how a scene has music and no
    ambience without carrying an empty object around. */
function normaliseLayer(l) {
  const src = typeof l === 'string' ? l.trim()
    : (typeof l?.src === 'string' ? l.src.trim() : '');
  if (!src) return null;
  /* `?? .5` rather than `|| .5`: a deliberate 0 is a layer you have turned all
     the way down, not a layer you forgot to set. */
  const v = l?.volume ?? .5;
  return {
    src,
    volume: Math.min(1, Math.max(0, Number.isFinite(Number(v)) ? Number(v) : .5)),
    loop: l?.loop !== false,
  };
}

/** Two layers, music and ambience, mixed per scene. Tolerant the same way `art`
    is: a bare string is the music, which is what somebody typing a scene into a
    text editor writes before they read about ambience and volume. */
function normaliseAudio(a) {
  if (!a) return null;
  if (typeof a === 'string') {
    const music = normaliseLayer(a);
    return music ? { music, ambience: null } : null;
  }
  const music = normaliseLayer(a.music);
  const ambience = normaliseLayer(a.ambience);
  return music || ambience ? { music, ambience } : null;
}

/** What the players are allowed to learn about one npc. Hidden by default:
    one you forgot to configure should not be the one that spoils the
    ambush — the same rule whether it turns out to be a threat or a
    bartender, so there is exactly one default to remember. */
function normaliseReveal(r) {
  const hp = ['none', 'coarse', 'exact'].includes(r?.hp) ? r.hp : 'coarse';
  return { on: r?.on === true, hp };
}

function normalisePlay(p) {
  const out = Object.assign(blankPlay(), p);
  /* `hp: null` means "untouched, therefore full" and has to survive a round
     trip. Testing Number.isFinite alone does not: Number(null) is 0, which is
     finite, so a stored null came back as a character on the floor. */
  out.hp = p && p.hp != null && Number.isFinite(Number(p.hp)) ? Number(p.hp) : null;
  out.temp = Math.max(0, Number(out.temp) || 0);
  out.exh = Math.min(6, Math.max(0, Number(out.exh) || 0));
  out.conditions = Array.isArray(out.conditions) ? out.conditions.filter(CONDITION) : [];
  out.death = { ok: Math.min(3, Math.max(0, Number(out.death?.ok) || 0)),
                fail: Math.min(3, Math.max(0, Number(out.death?.fail) || 0)) };
  out.note = String(out.note || '');
  out.gold = Math.max(0, Number(out.gold) || 0);
  out.inventory = String(out.inventory || '');
  return out;
}

function normaliseBeast(b) {
  return {
    id: b?.id || newId(),
    name: String(b?.name || 'Sin nombre'),
    tag: String(b?.tag || '').trim(),
    ac: Math.max(0, Number(b?.ac) || 10),
    hpMax: Math.max(1, Number(b?.hpMax) || 1),
    initMod: Number(b?.initMod) || 0,
    speed: b?.speed === '' || b?.speed == null ? null : Number(b.speed),
    note: String(b?.note || ''),
    portrait: b?.portrait
      ? { src: typeof b.portrait.src === 'string' ? b.portrait.src : null,
          stamp: typeof b.portrait.stamp === 'string' ? b.portrait.stamp : null }
      : null,
    abilities: Array.isArray(b?.abilities)
      ? b.abilities.map(a => ({ id: a?.id || newId(), name: String(a?.name || ''), desc: String(a?.desc || '') }))
        .filter(a => a.name || a.desc)
      : [],
    file: typeof b?.file === 'string' ? b.file : null,    // monsters/<name>.json, when it came from a scan
  };
}

/** "+ Nuevo PNJ" never checks for a collision — every monster typed by
    hand is new by definition. A monster read from monsters/*.json is not: the
    same file re-scanned after an edit should update the statblock, not
    duplicate it, the same way a re-scanned scene replaces by id. `b` has
    already been through `normaliseBeast()`, which invents an id when the file
    has none — and an invented id can never match anything already in the
    bestiary, so a file with no `id` always lands as a new entry, one per
    scan, the same as leaving it out on purpose. */
function absorbBeast(b) {
  const at = session.bestiary.findIndex(x => x.id === b.id);
  if (at >= 0) session.bestiary[at] = b;
  else session.bestiary.push(b);
}

function loadSession() {
  try {
    const raw = localStorage.getItem(DM_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return normaliseSession(parsed.session || parsed);
    }
  } catch (e) { /* corrupt or private mode: start clean */ }
  return blankSession();
}

function save() {
  try { localStorage.setItem(DM_KEY, JSON.stringify(session)); } catch (e) { /* private mode */ }
  syncBoard();
}

/* ================================================================ CAMPAIGN
   scenarios/, assets/, story/, players/ and monsters/ do not live under this
   file any more — they live one level up, in a sibling `campaigns/<name>/`,
   so this laptop can run several campaigns without several copies of the
   app. The folder pick still just hands over a File per entry with the
   picked folder's own name as the first path segment; that name is the one
   thing this seam remembers, because it is the one thing a `file://` page
   cannot ask the filesystem for on its own.

   Everything a scene or a scan stores — `scene.art.src`, an audio layer's
   `src`, a scanned asset's name — stays campaign-root-relative and portable,
   exactly what a scene file looks like written by hand. `campaignPath()` is
   the one seam that turns that portable name into a real `<img src>`/`url()`
   this file can actually load, by walking back up to the sibling folder. */

const CAMPAIGN_KEY = 'dnd-dm-campaign';

function loadCampaign() {
  try {
    const raw = JSON.parse(localStorage.getItem(CAMPAIGN_KEY) || 'null');
    return { name: typeof raw?.name === 'string' && raw.name.trim() ? raw.name.trim() : null };
  } catch (e) { return { name: null }; }
}

function saveCampaign() {
  try { localStorage.setItem(CAMPAIGN_KEY, JSON.stringify(campaign)); } catch (e) { /* private mode */ }
}

let campaign = loadCampaign();

/** Absent a campaign — nothing scanned yet, or a save from before campaigns/
    existed — a path is returned unchanged, which is what already resolves
    correctly against this file's own folder. */
function campaignPath(p) {
  return p && campaign.name ? `../campaigns/${campaign.name}/${p}` : p;
}

/* ================================================================= ESCENAS
   A scene is *prep*: a named background, a grid setting, and — from phase 3 —
   what is standing on it. The encounter is play. Keeping them apart is what
   lets a scene be reused: loading one never mutates it, and throwing a session
   away never costs you a night's preparation.

   Scenes live in their own key, not in the session, for that same reason. The
   pixels and the sound live on disk under assets/ and are referenced by
   relative path, because localStorage is about 5 MB and one MP3 is more than
   that — the path is what makes audio possible at all. `assets` is the list of
   filenames the last folder scan found, cached so a scene can be told its map
   is missing without going live to find out.
========================================================================= */

const SCENES_KEY = 'dnd-dm-scenes';

/** A roster is a list of bestiary ids and squares — `scene.roster`'s own
    shape. An entry with no bestiary id is not a placement of anything, so it
    is dropped rather than kept as a blank; whether the id still points at
    somebody in the bestiary is a question for whoever resolves the roster,
    not for parsing it. */
function normaliseRosterList(raw) {
  return Array.isArray(raw)
    ? raw.map(r => ({
        beastId: String(r?.beastId || '').trim(),
        x: Math.max(0, Math.round(Number(r?.x) || 0)),
        y: Math.max(0, Math.round(Number(r?.y) || 0)),
      })).filter(r => r.beastId)
    : [];
}

function blankScene() {
  return {
    id: newId(), name: 'Escena sin nombre',
    art: null,                       // { src }
    audio: null,                     // { music, ambience }
    roster: [],                      // phase 3
    grid: null,                      // { cols } — this scene's own column count, or the table's own if unset
    note: '',
    file: null,                      // scenarios/<name>.json, when it came from a scan
  };
}

/** Tolerant in the same way importCharacter() is: the envelope or a bare
    object, and anything missing filled in rather than refused. A scene is
    small enough to write by hand in a text editor, so it has to survive being
    written by hand in a text editor. */
function normaliseScene(s) {
  const raw = s?.kind === 'dnd-dm-scene' ? s.scene : (s?.scene || s);
  const out = Object.assign(blankScene(), raw);
  out.id = String(raw?.id || '').trim() || newId();
  out.name = String(raw?.name || '').trim() || 'Escena sin nombre';
  /* `art` accepts a bare string, because "assets/taberna.jpg" is what somebody
     writing this by hand will type before anything else about it. */
  out.art = typeof raw?.art === 'string'
    ? normaliseArt({ src: raw.art })
    : normaliseArt(raw?.art);
  out.audio = normaliseAudio(raw?.audio);
  out.note = String(raw?.note || '');
  /* Whether a beastId still points at somebody in the bestiary is checked
     later, at resolve time, not here: a scene scanned before its campaign's
     monsters are should not lose its roster for it. */
  out.roster = normaliseRosterList(raw?.roster);
  /* Only a real override if it is a number at all — an empty string is not
     zero even though Number('') says otherwise, which is exactly the trap a
     blank box left mid-edit would fall into without the explicit blank
     check. Absent, it stays absent: a scene with no opinion keeps using
     whatever the table's own grid already is, exactly as if this never
     existed. A `rows` from a save written before rows stopped being typed is
     read and quietly dropped — sceneGridSize() derives it fresh from this
     scene's own art every time, so a stale number here could only drift. */
  out.grid = (() => {
    const c = String(raw?.grid?.cols ?? '').trim();
    if (!c || !Number.isFinite(Number(c))) return null;
    return { cols: Math.min(60, Math.max(4, Math.round(Number(c)))) };
  })();
  out.file = typeof raw?.file === 'string' ? raw.file : null;
  return out;
}

/** A picture's own width-over-height, decoded once and cached by src — never
    reloaded, since the same asset is asked about every time a column count
    changes. Unknown or still loading reads as `fallback` rather than
    blocking: whatever asked gets an answer now and a re-render once the
    image actually decodes. */
const aspectCache = {};
function aspectOf(src, fallback) {
  if (!src) return fallback;
  if (src in aspectCache) return aspectCache[src] || fallback;
  aspectCache[src] = 0;
  const img = new Image();
  img.onload = () => { aspectCache[src] = img.naturalWidth / img.naturalHeight; render(); };
  img.onerror = () => { aspectCache[src] = fallback; };
  img.src = src;
  return fallback;
}

/** Rows a column count turns into once squares have to stay square: the
    board's actual shape (an image's own proportions, or the table's current
    ratio absent one) divided out of the column count the DM actually typed.
    Clamped the same way a typed number always was. */
function deriveRows(cols, aspect) {
  return Math.min(40, Math.max(4, Math.round(cols / (aspect || 1))));
}

/** The grid a scene's own board should use — its own `grid`, when it is a
    real override, or whatever the table's is otherwise. A real override only
    ever carries a column count; the row count is derived from this scene's
    own art (or the table's current ratio, art-less), never typed, so a
    scene's tiles can never come out anything but square. Shared by the
    editor's Reparto board (so placing a goblin lines up with the size the
    scene will actually go live at) and goLive() itself. */
function sceneGridSize(scene) {
  if (!scene?.grid) return { cols: session.field.cols, rows: session.field.rows };
  const src = scene.art?.src ? campaignPath(scene.art.src) : null;
  const aspect = aspectOf(src, session.field.cols / session.field.rows);
  return { cols: scene.grid.cols, rows: deriveRows(scene.grid.cols, aspect) };
}

function loadScenes() {
  try {
    const raw = JSON.parse(localStorage.getItem(SCENES_KEY) || 'null');
    return {
      scenes: Array.isArray(raw?.scenes) ? raw.scenes.map(normaliseScene) : [],
      assets: Array.isArray(raw?.assets) ? raw.assets.filter(a => typeof a === 'string') : [],
    };
  } catch (e) { return { scenes: [], assets: [] }; }
}

function saveScenes() {
  try {
    localStorage.setItem(SCENES_KEY, JSON.stringify({ version: 1, ...library }));
  } catch (e) { flash('No se pudo guardar la lista de escenas.'); }
}

let library = loadScenes();

const sceneById = id => library.scenes.find(s => s.id === id) || null;

/** Which of a scene's files are not where it says they are. Cheap, because it
    is a lookup against the last scan rather than a load: an empty scan cannot
    prove anything is missing, so it reports nothing rather than crying wolf
    about every scene in the library. */
function missingAssets(scene) {
  if (!library.assets.length) return [];
  const want = [scene?.art?.src, scene?.audio?.music?.src, scene?.audio?.ambience?.src];
  return want.filter(p => p && !library.assets.includes(p));
}

/* ================================================================== STORY
   The story, not the mechanics — the Historia tab: notes written by hand as
   .md files under story/<grupo>/*.md and rendered read-only. There is no
   editor here and no exportar — a note is edited where it was written, and
   reappears on the next scan. Its own key, standalone from session and
   library: nothing else in the app has to know a note exists, the same
   freedom scenes had before the field did. It never enters the projection
   and never touches the undo stack, for the same reason dnd-dm-scenes and
   dnd-dm-audio sit outside both. */

const STORY_KEY = 'dnd-dm-story';

function loadStory() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORY_KEY) || 'null');
    return { notes: Array.isArray(raw?.notes) ? raw.notes.filter(n => n && typeof n.content === 'string') : [] };
  } catch (e) { return { notes: [] }; }
}

function saveStory() {
  try {
    localStorage.setItem(STORY_KEY, JSON.stringify({ version: 1, ...story }));
  } catch (e) { flash('No se pudo guardar la lista de notas.'); }
}

let story = loadStory();

/** `story/<grupo>/nombre.md` groups by the first segment after story/; a bare
    `story/nombre.md` has no group at all, so it reads as "General" rather
    than a group nobody typed. */
function noteFrom(path, content) {
  const parts = path.replace(/^story\//i, '').split('/');
  const group = parts.length > 1 ? parts[0] : 'General';
  const name = parts[parts.length - 1].replace(/\.md$/i, '');
  return { path, group, name, content };
}

/** Derived, not stored: the first heading in the file if the note has one,
    else the filename turned into something worth reading. */
function noteTitle(note) {
  const h = note.content.match(/^#\s+(.+)$/m);
  if (h) return h[1].trim();
  const spaced = note.name.replace(/[-_]+/g, ' ').trim();
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}

/** [[wikilinks]] and #tags are both derived from `content` on the fly, the
    same "read-only, reappears on the next scan" spirit as the rest of
    Historia — nothing here is ever written back to dnd-dm-story. One index
    built per render pass, shared by link resolution and backlinks, so a
    title only ever resolves one way. */
function storyIndex() {
  const byTitle = new Map(), byName = new Map();
  for (const note of story.notes) {
    byTitle.set(noteTitle(note).toLowerCase(), note);
    byName.set(note.name.toLowerCase(), note);
  }
  return { byTitle, byName };
}

/** A DM writes `[[Título]]` thinking either of a note's heading or its
    filename — try the heading first since that's what's actually on screen. */
function resolveWikilink(text, index) {
  const key = text.trim().toLowerCase();
  return index.byTitle.get(key) || index.byName.get(key) || null;
}

const noteTags = note => {
  const seen = new Set();
  for (const m of note.content.matchAll(/#([a-z0-9_-]+)/gi)) seen.add(m[1].toLowerCase());
  return [...seen];
};

/** Only resolved targets count as graph edges — an unresolved [[link]] is a
    rendering concern (shown muted), not something backlinks/the graph track. */
function noteLinks(note, index) {
  const out = [];
  for (const m of note.content.matchAll(/\[\[([^\]]+)\]\]/g)) {
    const target = resolveWikilink(m[1], index);
    if (target && target !== note && !out.includes(target)) out.push(target);
  }
  return out;
}

const backlinksFor = (note, index) =>
  story.notes.filter(n => n !== note && noteLinks(n, index).includes(note));

/** A notes renderer, not a CommonMark implementation — headings, paragraphs,
    bold/italic and bullet lists are what a session note actually uses.
    Escaped first, so a stray "<" or "&" in a note cannot break what follows;
    heading levels are pushed down two so a note's own headings never outrank
    its card title. */
function mdToHtml(md, index) {
  const idx = index || storyIndex();
  /* text reaching inline() is already esc()'d (see the split() below), but
     resolveWikilink() needs the raw title back to match noteTitle()/note.name —
     esc() only ever touches &<>", so undoing it is this small on purpose. */
  const unesc = s => s.replace(/&amp;|&lt;|&gt;|&quot;/g, m => ({ '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"' }[m]));
  const lines = esc(String(md || '')).split(/\r?\n/);
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[\[([^\]]+)\]\]/g, (_, text) => {
      const target = resolveWikilink(unesc(text), idx);
      return target
        ? `<span class="wikilink" data-opennote="${esc(target.path)}">${text}</span>`
        : `<span class="wikilink unresolved">${text}</span>`;
    })
    .replace(/#([a-z0-9_-]+)/gi, (_, tag) => `<span class="tag" data-tag="${tag.toLowerCase()}">#${tag}</span>`);
  const out = [];
  let para = [], list = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para = []; } };
  const flushList = () => { if (list.length) { out.push(`<ul>${list.map(i => `<li>${inline(i)}</li>`).join('')}</ul>`); list = []; } };
  for (const raw of lines) {
    const line = raw.trim();
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    if (heading) {
      flushPara(); flushList();
      const level = heading[1].length + 2;
      out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      continue;
    }
    const bullet = line.match(/^-\s+(.+)$/);
    if (bullet) { flushPara(); list.push(bullet[1]); continue; }
    if (!line) { flushPara(); flushList(); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join('');
}

/** A scene's art and audio, resolved against the campaign folder once, rather
    than at every place f.map/f.audio get rendered or sent to the television —
    the library's own copy (scene.art, scene.audio) stays the portable,
    campaign-root-relative path a hand-written scene file has. Shared by
    goLive() and stageScene(), since preparing a scene and putting it on the
    television resolve the same way; only what they write differs. */
function resolveSceneAssets(scene) {
  const map = scene.art ? { ...scene.art, src: scene.art.src ? campaignPath(scene.art.src) : scene.art.src } : null;
  /* normaliseAudio rather than a spread, because it builds fresh objects: the
     result must not end up sharing a layer with the library, or turning the
     tavern's music down would quietly edit the tavern. */
  const audio = normaliseAudio(scene.audio);
  if (audio) {
    if (audio.music) audio.music.src = campaignPath(audio.music.src);
    if (audio.ambience) audio.ambience.src = campaignPath(audio.ambience.src);
  }
  return { map, audio };
}

/** Getting a scene ready without putting it on the television: resolves its
    art and audio the same way goLive() would, but only into f.staged, which
    buildBoard() never reads. The DM can check it, second-guess it, or leave it
    there overnight — none of it reaches the players until Al tablero. */
function stageScene(scene) {
  session.field.staged = scene ? { sceneId: scene.id, ...resolveSceneAssets(scene) } : null;
}

/** Seats scene.roster's prepared npcs the moment their scene goes live,
    spawning each from the bestiary the same way loadNpc() does — a fresh
    instance, never a shared reference, so tuning one goblin's hit points
    mid-fight cannot reach back into the roster. A beastId the bestiary no
    longer has is skipped rather than refused, the same tolerance a missing
    asset already gets. A square already standing on somebody is left alone:
    that is what makes going live on the same scene twice not double its
    ambush — the DM moved or removed one on purpose, going live is not the
    moment that gets undone in either direction. */
function resolveRoster(scene, f) {
  if (!scene.roster.length) return;
  const seated = new Set(Object.values(f.tokens).map(p => p.x + ',' + p.y));
  for (const r of scene.roster) {
    const beast = session.bestiary.find(b => b.id === r.beastId);
    if (!beast) continue;
    const x = clampCol(f, r.x), y = clampRow(f, r.y), key = x + ',' + y;
    if (seated.has(key)) continue;
    const n = normaliseBeast({ ...beast, id: newId(), name: beast.name });
    session.npcs.push(Object.assign(n, blankPlay(), { hp: n.hpMax }));
    f.tokens['npc:' + n.id] = { x, y };
    seated.add(key);
  }
}

/** Loading a scene onto the board. It writes the *field* and nothing else — the
    party stays as wounded as it was, and a fight in progress is untouched,
    because changing what the players are looking at is not an event in the
    fight. */
function goLive(scene) {
  const f = session.field;
  f.live = true;
  f.sceneId = scene ? scene.id : null;
  /* Promoting the very scene that was staged consumes the preparation; a
     go-live for anything else leaves whatever is staged untouched, since it
     was prepared for later, not for this. */
  if (f.staged && f.staged.sceneId === (scene ? scene.id : null)) f.staged = null;
  if (scene) {
    /* A scene always loads with the grid off — full-bleed art — regardless of
       whatever the toggle was doing before. The DM decides fresh each time
       whether this one needs tokens on it; the scene itself has no opinion. */
    f.grid = false;
    /* The board's size, on the other hand, *is* the scene's to decide when it
       says so — a floorplan drawn for a 20×20 room should not have to share
       the table's usual 24×14. Applied before the roster resolves and before
       anyone already on the field gets reclamped, the same way a manual
       resize in the map panel already reflows both. Absent, this changes
       nothing: the field just keeps being whatever size it already was. */
    if (scene.grid) { const size = sceneGridSize(scene); f.cols = size.cols; f.rows = size.rows; }
    const { map, audio } = resolveSceneAssets(scene);
    f.map = map;
    f.audio = audio;
    resolveRoster(scene, f);
  } else {
    /* "Sin escena" clears the grid too now: an empty board with no art and
       no tokens on it read as a mistake, not a deliberate battlemap. The DM
       still has the toggle to turn it back on once there is a reason to. */
    f.grid = false;
    f.map = null;
    f.audio = null;
    mapMemory = null;
    try { localStorage.removeItem(MAP_KEY); } catch (e) { /* private mode */ }
  }
  /* Shrinking the field can leave somebody outside it, the same way the column
     and row boxes can. */
  for (const [ref, at] of Object.entries(f.tokens)) {
    at.x = clampCol(f, at.x); at.y = clampRow(f, at.y);
  }
  seatAll();
}

/* ------------------------------------------------------------- discovery
   The folder pick. Chrome hands over every file in the tree with a
   `webkitRelativePath` like "campaign-01/scenarios/taberna.json", so the
   first segment is whatever folder you chose and is dropped: what is stored
   is the campaign-root-relative path, same as a scene written by hand would
   use, and the dropped segment is remembered on its own as `campaign.name`.

   Scene files are read here and parsed; assets are only *named*. That split is
   the whole design — a File object gives you a blob URL, and a blob URL is
   per-window, so the television could never read one. Rendering always goes
   through the relative path, which both windows can load.
====================================================================== */

/** Everything that belongs to one campaign and nothing that belongs to the
    app itself: the session, the scene library, the note library. Called
    whenever the picked folder's name changes out from under what was
    loaded, so campaign-01's party can never bleed into campaign-02's. */
function resetCampaignState() {
  session = blankSession(); save();
  library = { scenes: [], assets: [] }; saveScenes();
  story = { notes: [] }; saveStory();
  campaignDirHandle = null;
}

function scanFolder(files) {
  const list = Array.from(files || []);
  if (!list.length) { flash('No había nada en esa carpeta.'); return; }

  /* The chosen folder's own name is the first segment of every path. Dropping
     it is what makes "campaign-01/assets/x.jpg" and "assets/x.jpg" both come
     out as "assets/x.jpg" — so it does not matter whether you pick the
     campaign folder itself or scenarios/ inside it. That same name is also
     the one thing this scan remembers as *which* campaign it is: it is what
     campaignPath() walks back up to from campaigns/<name>/. */
  const rel = f => String(f.webkitRelativePath || f.name).split('/').slice(1).join('/');
  const folderName = list[0] && String(list[0].webkitRelativePath || '').split('/')[0];
  if (folderName && folderName !== campaign.name) {
    /* Switching to a *different* campaign, not re-scanning the one already
       loaded — the common case, an edited file, must keep merging the way it
       always has. A different name means whatever is cached is the last
       campaign's, and carrying it into this one would mix two parties and
       two scene libraries into one screen. */
    if (campaign.name) { resetCampaignState(); }
    campaign.name = folderName;
    saveCampaign();
  }

  const assets = [];
  const sceneFiles = [];
  const noteFiles = [];
  const playerFiles = [];
  const beastFiles = [];
  for (const f of list) {
    const path = rel(f);
    if (!path) continue;
    if (/^assets\//i.test(path)) assets.push(path);
    else if (/^scenarios\/.+\.json$/i.test(path)) sceneFiles.push({ path, file: f });
    else if (/^story\/.+\.md$/i.test(path)) noteFiles.push({ path, file: f });
    else if (/^players\/.+\.json$/i.test(path)) playerFiles.push({ path, file: f });
    else if (/^monsters\/.+\.json$/i.test(path)) beastFiles.push({ path, file: f });
  }

  if (!assets.length && !sceneFiles.length && !noteFiles.length && !playerFiles.length && !beastFiles.length) {
    flash('Ahí no hay scenarios/, assets/, story/, players/ ni monsters/. Elige la carpeta que los contiene.');
    return;
  }

  library.assets = assets.sort();

  const readable = sceneFiles.length + noteFiles.length + playerFiles.length + beastFiles.length;
  if (!readable) {
    saveScenes(); render();
    flash(`${assets.length} archivo${assets.length === 1 ? '' : 's'} en assets/. Nada más que leer.`);
    return;
  }

  /* Reading is asynchronous and there is no ordering guarantee across four
     different kinds of file, so the scan finishes when the last one has come
     back, not when any one loop ends. */
  let left = readable;
  const bad = [];
  const foundScenes = [], foundNotes = [], foundPlayers = [], foundBeasts = [];

  const readText = (path, file, onOk) => {
    const reader = new FileReader();
    reader.onload = () => {
      try { onOk(String(reader.result)); } catch (e) { bad.push(path); }
      done();
    };
    reader.onerror = () => { bad.push(path); done(); };
    reader.readAsText(file);
  };

  for (const { path, file } of sceneFiles) readText(path, file, text => {
    const scene = normaliseScene(JSON.parse(text));
    scene.file = path;
    foundScenes.push(scene);
  });
  for (const { path, file } of noteFiles) readText(path, file, text => {
    foundNotes.push(noteFrom(path, text));
  });
  for (const { path, file } of playerFiles) readText(path, file, text => {
    const parsed = JSON.parse(text);
    foundPlayers.push({ path, char: normalise(parsed?.character || parsed) });
  });
  for (const { path, file } of beastFiles) readText(path, file, text => {
    const beast = normaliseBeast(JSON.parse(text));
    beast.file = path;
    foundBeasts.push(beast);
  });

  function done() {
    if (--left > 0) return;

    /* A re-scan replaces a scene by id, the same way re-importing a character
       replaces the sheet: you edited the file on disk and want that edit. */
    for (const scene of foundScenes) {
      const at = library.scenes.findIndex(s => s.id === scene.id);
      if (at >= 0) library.scenes[at] = scene; else library.scenes.push(scene);
    }
    library.scenes.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    saveScenes();

    /* Notes have no id, only a path, and re-reading them is free — so unlike
       scenes, a scan replaces the whole library wholesale. Deleting a .md and
       scanning again is how a note leaves the tab. */
    story.notes = foundNotes.sort((a, b) =>
      a.group.localeCompare(b.group, 'es') || a.name.localeCompare(b.name, 'es'));
    saveStory();

    for (const { path, char } of foundPlayers) { mergeParty(char); session.playerFiles[char.id] = path; }
    for (const b of foundBeasts) absorbBeast(b);
    if (foundPlayers.length || foundBeasts.length) { statCache.clear(); seatAll(); save(); }

    render();
    const parts = [];
    if (foundScenes.length) parts.push(`${foundScenes.length} escena${foundScenes.length === 1 ? '' : 's'}`);
    if (assets.length) parts.push(`${assets.length} archivo${assets.length === 1 ? '' : 's'} en assets/`);
    if (foundNotes.length) parts.push(`${foundNotes.length} nota${foundNotes.length === 1 ? '' : 's'}`);
    if (foundPlayers.length) parts.push(`${foundPlayers.length} jugador${foundPlayers.length === 1 ? '' : 'es'}`);
    if (foundBeasts.length) parts.push(`${foundBeasts.length} PNJ`);
    flash(`${parts.join(' · ')}${bad.length ? ` · ${bad.length} ilegible${
      bad.length === 1 ? '' : 's'}: ${bad.join(', ')}` : ''}`);
  }
}

function exportScene(scene) {
  const slug = (scene.name || 'escena').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'escena';
  const { file, ...clean } = scene;          // `file` is where it was found, not part of the scene
  const blob = new Blob([JSON.stringify({ kind: 'dnd-dm-scene', version: 1, scene: clean }, null, 2)],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  flash(`Guardado ${slug}.json. Ponlo en scenarios/.`);
}

let session = loadSession();
let screen = 'juego';                // juego | jugadores | monstruos | escenas | story
const openRows = new Set();          // expanded cards, survive a re-render
/* A muster row's card is a different question from that card's own detail
   panel, so it is a different set: opening a goblin's hit points must not
   unfold a player's whole sheet with it. */
const musterOpen = new Set();        // muster rows showing their card
let condFor = null;                  // ref whose condition picker is open
let condShown = null;                // condition key whose reminder is showing
let showTV = false;                  // the map panel in the header
/* One filter box per library, kept across a re-render the same way a search
   box always should — clearing it is a click, and losing it to your own
   typing would be worse than a library too long to scroll. */
let sceneFilter = '';
let beastFilter = '';
let storyFilter = '';
const matchesFilter = (text, filter) =>
  !filter.trim() || text.toLowerCase().includes(filter.trim().toLowerCase());
let storyOpen = null;                // path of the one note on screen, or null for the index
const picked = new Set();            // refs ticked for a shared damage roll
/* The totals the wizard has collected so far, which outlive the modal: closing
   it by accident four names in should not mean asking the table again. */
const rolled = new Map();            // ref -> initiative total, before the fight starts

/* -------------------------------------------------------------- the editor
   `editorDraft` is a working copy, never the library scene itself: nothing
   here is real until Guardar. Editing a scene must not be able to break the
   one that is currently live on the television. */
let editingSceneId = null;
let editorDraft = null;

/* The open modal, or null. Every screen is rewritten wholesale on render, so a
   modal cannot keep anything in the DOM: what it is and what you have chosen
   inside it live here and are drawn from here, like everything else.
   `counts` maps a bestiary id to how many of it to bring; the initiative
   wizard keeps its queue, where in it you are, and the totals so far. */
let modal = null;   // { kind: 'beast'|'npcs'|'players'|'init', counts?, refs?, queue?, at?, vals? }

/* -------------------------------------------------------------------- undo
   Mishearing a damage number is the commonest mistake at a table and there
   was no way back from it. A whole snapshot rather than a diff: the session
   is a few kilobytes, one step is always correct, and there is no list of
   "things undo knows about" to forget to extend. In memory only — undo is for
   the last thing you said, not for last Tuesday.
====================================================================== */

const undoStack = [];
const UNDO_DEPTH = 25;

function remember(label) {
  undoStack.push({ label, snap: JSON.stringify(session) });
  if (undoStack.length > UNDO_DEPTH) undoStack.shift();
}

function undo() {
  const step = undoStack.pop();
  if (!step) return;
  session = normaliseSession(JSON.parse(step.snap));
  statCache.clear();
  for (const ref of [...picked]) if (!handleFor(ref)) picked.delete(ref);
  try { localStorage.setItem(DM_KEY, JSON.stringify(session)); } catch (e) { /* private mode */ }
  syncBoard();
  render();
  flash(`Deshecho: ${step.label}.`);
}

/* ------------------------------------------------------------------ stats
   derive() is the creator's, untouched, and it is the only source of a
   player's numbers — so a player who edits their sheet and re-sends the file
   updates this board. Memoised on updatedAt because a card can ask for the
   same character several times in one render.
====================================================================== */

const statCache = new Map();
function stats(c) {
  const key = c.id + ':' + (c.updatedAt || 0);
  let hit = statCache.get(key);
  if (!hit) { hit = derive(c); statCache.set(key, hit); }
  return hit;
}

function playOf(id) {
  if (!session.play[id]) session.play[id] = blankPlay();
  return session.play[id];
}

/* A uniform handle over a player and a monster. Everything the card draws
   comes from here, so the card never asks which one it is holding. */
function pcHandle(c) {
  const d = stats(c);
  const sp = SPECIES[c.species], cls = CLASSES[c.class];
  const lineage = sp?.lineages?.[c.lineage];
  return {
    kind: 'pc', id: c.id, ref: 'pc:' + c.id,
    name: c.name || 'Sin nombre',
    sub: [[sp?.es, lineage ? `(${lineage.es})` : null].filter(Boolean).join(' '),
      cls ? `${cls.es} 1` : null, c.player ? `jugador: ${c.player}` : null].filter(Boolean).join(' · '),
    ac: d.ca, hpMax: d.hp ?? 0, initMod: d.initiative,
    pp: d.passivePerception, speed: d.speed, portrait: c.portrait,
    play: playOf(c.id), char: c, d,
    /* A sheet still being built has no hit points at all, which must not read
       as a player lying on the floor. */
    broken: validate(c).filter(n => n.level === 'error'),
  };
}

function npcHandle(n) {
  return {
    kind: 'npc', id: n.id, ref: 'npc:' + n.id,
    name: n.name, sub: '',
    ac: n.ac, hpMax: n.hpMax, initMod: n.initMod,
    pp: null, speed: n.speed, portrait: n.portrait,
    play: n, npc: n,
  };
}

const partyHandles = () => session.party.map(pcHandle);
const npcById = id => session.npcs.find(n => n.id === id) || null;

function handleFor(ref) {
  const [kind, id] = String(ref).split(':');
  if (kind === 'pc') {
    const c = session.party.find(x => x.id === id);
    return c ? pcHandle(c) : null;
  }
  const n = npcById(id);
  return n ? npcHandle(n) : null;
}

const currentHP = cb => {
  const max = Math.max(0, cb.hpMax || 0);
  return Math.max(0, Math.min(max, cb.play.hp == null ? max : cb.play.hp));
};

/* ------------------------------------------------------------ hit points
   One expression box per row. Bare or negative is damage, `+n` heals, `tn`
   sets temporary hit points and `=n` sets the total outright — the last one
   is for monsters, whose maximum is whatever the DM decided it is.
====================================================================== */

function applyDelta(cb, raw) {
  const p = cb.play;
  const max = Math.max(0, cb.hpMax || 0);
  if (p.hp == null) p.hp = max;
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return false;

  let m;
  if ((m = s.match(/^t(\d+)$/))) {
    p.temp = Number(m[1]);                     // temporary hit points replace, never stack
  } else if ((m = s.match(/^=(\d+)$/))) {
    /* A monster's maximum is whatever you decided it is, so `=20` on a goblin
       you gave 7 raises the maximum with it — otherwise the number you typed
       silently became 7 and the box looked broken. A player's maximum is
       derive()'s and not this box's business. */
    const n = Number(m[1]);
    if (cb.kind === 'npc' && n > max) { cb.npc.hpMax = n; p.hp = n; }
    else p.hp = Math.min(max, n);
  } else if ((m = s.match(/^\+(\d+)$/))) {
    heal(cb, Number(m[1]));
  } else if ((m = s.match(/^-?(\d+)$/))) {
    hurt(cb, Number(m[1]));
  } else {
    return false;
  }
  if (p.hp > 0) p.death = { ok: 0, fail: 0 };
  return true;
}

function hurt(cb, n) {
  const p = cb.play;
  const soaked = Math.min(p.temp || 0, n);
  p.temp = (p.temp || 0) - soaked;
  p.hp = Math.max(0, p.hp - (n - soaked));
}

function heal(cb, n) {
  const max = Math.max(0, cb.hpMax || 0);
  cb.play.hp = Math.min(max, Math.max(0, cb.play.hp) + n);
}

/* Same grammar as the hit point box, minus temp and minus a maximum to clamp
   against — gold has neither. `-12` on 5 in hand floors at 0 rather than
   going into debt; a loan is a story beat, not a number this box should
   invent on its own. */
function applyGoldDelta(p, raw) {
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return false;
  let m;
  if ((m = s.match(/^=(\d+)$/))) p.gold = Number(m[1]);
  else if ((m = s.match(/^\+(\d+)$/))) p.gold = (p.gold || 0) + Number(m[1]);
  else if ((m = s.match(/^-(\d+)$/))) p.gold = Math.max(0, (p.gold || 0) - Number(m[1]));
  else return false;
  return true;
}

function longRest() {
  for (const c of session.party) {
    const p = playOf(c.id);
    p.hp = stats(c).hp ?? 0;
    p.temp = 0;
    p.conditions = [];
    p.exh = Math.max(0, p.exh - 1);            // a long rest removes one level
    p.death = { ok: 0, fail: 0 };
  }
}

/* -------------------------------------------------------------- initiative
   Typed, never rolled. `init` maps a ref to the total the player read out;
   a ref with no entry is simply not in the fight. The active combatant is
   held by ref rather than by index, so editing a total mid-fight re-sorts the
   order without moving the cursor onto somebody else.
====================================================================== */

/* Everyone in the fight, in order. Somebody whose player has not called out a
   number yet is still in the fight — they sort to the bottom rather than
   vanishing, which is what happens when the order is the list of numbers. */
function inOrder() {
  const e = session.encounter;
  return e.members
    .map(ref => ({ ref, init: e.init[ref], cb: handleFor(ref) }))
    .filter(o => o.cb)
    .sort((a, b) => (b.init ?? -999) - (a.init ?? -999) || (b.cb.initMod - a.cb.initMod)
      || a.cb.name.localeCompare(b.cb.name, 'es'));
}

const sideOf = kind => inOrder().filter(o => o.cb.kind === kind);
const allRolled = () => inOrder().every(o => o.init != null);

/** A monster on 0 hit points keeps its card but loses its turn. */
const skippable = cb => cb.kind === 'npc' && currentHP(cb) <= 0;

function advance(dir) {
  const e = session.encounter;
  const list = inOrder();
  if (!list.length) return;
  let i = list.findIndex(o => o.ref === e.activeRef);
  if (i < 0) { e.activeRef = list[0].ref; return; }

  for (let step = 0; step < list.length; step++) {
    i += dir;
    if (i >= list.length) { i = 0; e.round++; }
    if (i < 0) { i = list.length - 1; e.round = Math.max(1, e.round - 1); }
    if (!skippable(list[i].cb)) break;
  }
  e.activeRef = list[i].ref;
}

/** Combat starts when you say so, with whoever you ticked and whatever they
    rolled. `inits` is what the wizard collected: a ref missing from it has not
    rolled yet, which is a different thing from not being in the fight.

    Whoever you left unticked simply is not in this fight — it does not leave
    the table, the way it used to when a monster only ever existed for the
    fight it was made for. Loading and joining are two different decisions
    now, so `session.npcs` is not this function's to touch at all. */
function startCombat(refs, inits) {
  const e = session.encounter;
