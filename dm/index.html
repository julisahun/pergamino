<!doctype html>
<!-- ======================================================================
  Mesa del DM — the admin window.

  A shell, nothing more: the app is native ES modules under src/admin/, the
  look is src/styles/, and the campaign folder — read and written directly by
  this browser through the File System Access API — is the only database.
  Nothing it holds ever reaches a server; server.py hands out these files
  and knows nothing else.

  The television is /tv, a second window on this same machine. The two talk
  over a BroadcastChannel: same origin, no network, no relay, no room codes.
====================================================================== -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa del DM</title>
<link rel="stylesheet" href="/src/styles/fonts.css">
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/board.css">
<link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/admin/main.js"></script>
</body>
</html>
