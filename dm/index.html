<!--
  The DM side of the table: current hit points, conditions and initiative for
  the players and for whatever they are fighting.

  It invents no rules. Every number a player has — maximum hit points, CA,
  initiative modifier, passive perception, saves, skills, attacks — comes from
  derive(), the character creator's own engine, running on the .json the
  player exported. Edit a sheet, re-import it, and this board follows.

  Self-contained: no network, no dependencies, open it with a double click.
  UI and rules content are Spanish; code, comments and identifiers English.

  Layout of this file, in order:
    1. style          the creator's screen tokens, then this file's own board
    2. script#data    COPIED from creator/index.html — keep byte-identical
    3. script#engine  COPIED from creator/index.html — keep byte-identical
    4. script#dm-data conditions. This file's own frozen table.
    5. script#dm-app  session state, render, listeners, persistence.

  Blocks 2 and 3, plus blankCharacter/newId/normalise inside block 5, are
  copies. `python3 check-sync.py` fails if they drift from the creator's.
  Fix them in creator/index.html and re-copy — never edit them here.

  Rules text is paraphrased from SRD 5.2 (CC-BY-4.0), never copied from the PHB.
-->

/* ================================================================== LOOK
   One look, and everything below is written against the tokens in the block
   that follows: aged paper, IM Fell English headings, flourishes and ink
   blots. There used to be four to pick between, on `data-theme` with a
   picker in the header; there is one now, so there is no attribute, no
   picker and no stored preference to get out of step between files.

   Print stays ink-light — no fills, no tints, no textures, just black line
   art — and keeps the same typographic voice on paper.
========================================================================= */

/* ----------------------------------------------------------- shared tokens
   One voice for all three files, and it is pergamino: heavy mottling, foxing
   at the edges, IM Fell English for the headings, flourishes and ink blots.
   Metrics and the fallback stacks live here too. There is nothing left to
   switch between, so there is no theme attribute, no picker and no stored
   preference — the stylesheet simply is the look. */
:root {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius: 3px;
  color-scheme: light;
  accent-color: var(--seal);

  --parchment:   #efe3c8;
  --parchment-2: #ddcaa2;
  --page:
    radial-gradient(ellipse 40% 30% at 12% 8%,  rgba(255,252,240,.75), transparent 70%),
    radial-gradient(ellipse 35% 25% at 88% 92%, rgba(255,252,240,.55), transparent 70%),
    radial-gradient(ellipse 30% 22% at 70% 18%, rgba(150,112,64,.18),  transparent 70%),
    radial-gradient(ellipse 26% 30% at 22% 74%, rgba(150,112,64,.16),  transparent 70%),
    radial-gradient(ellipse 18% 14% at 45% 48%, rgba(126,92,50,.13),   transparent 70%),
    radial-gradient(ellipse 22% 18% at 8% 40%,  rgba(120,84,40,.16),   transparent 65%),
    radial-gradient(ellipse 20% 16% at 94% 30%, rgba(120,84,40,.15),   transparent 65%),
    linear-gradient(180deg, rgba(112,80,42,.24), transparent 10%, transparent 90%, rgba(112,80,42,.24)),
    linear-gradient(90deg,  rgba(112,80,42,.22), transparent 7%,  transparent 93%, rgba(112,80,42,.22)),
    repeating-linear-gradient(91deg, rgba(138,106,67,.05) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(1deg,  rgba(138,106,67,.035) 0 1px, transparent 1px 6px),
    linear-gradient(160deg, var(--parchment), var(--parchment-2));

  --ink:      #2b2118;
  --ink-soft: #5c4d3c;
  --sepia:    #8a6a43;
  --seal:     #8e2b20;
  --seal-2:   #a8382a;
  --gold:     #a98240;
  --rule:     #c0a878;

  --panel:      linear-gradient(180deg, rgba(255,252,240,.6), rgba(255,252,240,.18));
  --panel-solid:#f7eed6;
  --panel-2:    rgba(255,255,255,.45);
  --field:      rgba(255,255,255,.6);
  --btn:        linear-gradient(#fdf7e6, #eadfc2);
  --btn-hover:  linear-gradient(#fffdf3, #f0e6cc);
  --shadow:     0 1px 3px rgba(43,33,24,.12);

  --display: "IM Fell English SC", var(--serif);
  --head-variant: normal;         /* the SC face is already small caps */
  --head-ls: .03em;
  --head-weight: 400;
  --orn: "❦";
  --orn-head: "❧ ";
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* Nothing may push the page sideways on a phone. */
body { overflow-x: hidden; }
img, table, pre { max-width: 100%; }

body {
  margin: 0;
  font-family: var(--serif);
  color: var(--ink);
  background: var(--page);
  background-attachment: fixed;
  min-height: 100vh;
  line-height: 1.5;
}

/* Every heading in the app goes through this, so the display face is set once. */
.dsp {
  font-family: var(--display);
  font-variant: var(--head-variant);
  letter-spacing: var(--head-ls);
  font-weight: var(--head-weight);
}

/* ---------------------------------------------------------------- chrome
   Mobile first: one column, comfortable tap targets, and a sticky bottom bar
   for back/next so the thumb never has to travel. Wider screens only get more
   breathing room, never a second pane — the wizard is one thing at a time. */
button {
  font-family: var(--serif); font-size: 1rem;
  padding: .6rem 1rem; cursor: pointer; color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--sepia); border-radius: var(--radius);
  min-height: 2.75rem;                 /* comfortable on a phone */
}
button:hover:not(:disabled) { background: var(--btn-hover); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary {
  background: linear-gradient(var(--seal-2), var(--seal));
  color: #fdf6e6; border-color: var(--seal);
  font-family: var(--display); font-variant: var(--head-variant);
  letter-spacing: var(--head-ls);
}
button.primary:hover:not(:disabled) { background: linear-gradient(var(--seal), var(--seal-2)); }
button.ghost { background: none; border-color: var(--rule); }
button.small { font-size: .85rem; padding: .35rem .7rem; min-height: 2.2rem; }
button.link { background: none; border: 0; min-height: 0; padding: 0; text-decoration: underline; color: var(--sepia); font-size: inherit; }

header.top {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .75rem 1rem;
  border-bottom: 3px double var(--sepia);
  background: var(--panel);
  position: sticky; top: 0; z-index: 5;
  backdrop-filter: blur(3px);
}
header.top h1 {
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight);
  font-size: 1.05rem; margin: 0; letter-spacing: var(--head-ls);
  color: var(--seal); line-height: 1.2;
}
header.top h1 .sub {
  display: block; font-size: .72rem; color: var(--ink-soft);
  font-family: var(--serif); font-variant: normal; letter-spacing: 0; font-weight: 400;
}
header.top .actions { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
header.top .actions button { min-height: 2.4rem; padding: .4rem .7rem; font-size: .88rem; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* --------------------------------------------------------- progress bar */
.progress { padding: .6rem 1rem 0; }
.progress .bar { height: 5px; background: rgba(138,106,67,.2); border-radius: 3px; overflow: hidden; }
.progress .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--seal)); transition: width .25s ease; }
.progress .lab {
  display: flex; justify-content: space-between; font-size: .78rem;
  color: var(--ink-soft); margin-top: .3rem; letter-spacing: .02em;
}
.progress .lab span:first-child { font-family: var(--display); color: var(--sepia); letter-spacing: var(--head-ls); }

/* -------------------------------------------------------------- screens */
main { padding: 1rem 1rem 6.5rem; }
section.panel { min-width: 0; max-width: 44rem; margin: 0 auto; }
/* The fight is the one screen with three columns in it — two sides and the
   field between them — so it is the one screen allowed to be wider than a
   column of prose. */
section.panel.wide { max-width: 100rem; }
section.panel h2 {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  font-size: 1.3rem; margin: 0 0 .3rem;
  letter-spacing: var(--head-ls); color: var(--seal);
  border-bottom: 3px double var(--rule); padding-bottom: .25rem;
}
section.panel h2::before { content: var(--orn-head); color: var(--gold); }
section.panel > p.lead { margin: .3rem 0 1.25rem; color: var(--ink-soft); }

/* Sticky action bar: back/next in the wizard, nothing anywhere else. */
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; gap: .6rem; align-items: center;
  padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--sepia);
  background: var(--panel-solid);
  backdrop-filter: blur(4px);
}
.foot .spacer { flex: 1; }
.foot .why { font-size: .78rem; color: var(--seal); max-width: 14rem; line-height: 1.25; }

@media (min-width: 700px) {
  header.top { padding: .9rem 1.5rem; }
  header.top h1 { font-size: 1.3rem; }
  main { padding: 1.5rem 1.5rem 6rem; }
  .progress { padding: .8rem 1.5rem 0; max-width: 60rem; margin: 0 auto; }
  .foot { padding: .8rem 1.5rem; }
  .foot > * { max-width: 60rem; }
}

/* ---------------------------------------------------------------- roster */
.roster { display: grid; gap: .75rem; }
/* Phone: identity row, then a full-width row of actions. Never sideways scroll. */
.card-char {
  display: grid; grid-template-columns: 1fr auto; gap: .5rem .8rem; align-items: center;
  padding: .8rem .9rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
}
.card-char .who { min-width: 0; }
.card-char .who b {
  display: block; font-size: 1.1rem;
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight); letter-spacing: var(--head-ls);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-char .who span { display: block; font-size: .85rem; color: var(--ink-soft); }
.card-char .nums { display: flex; gap: .6rem; }
.card-char .nums span { text-align: center; font-size: .66rem; color: var(--sepia); font-variant: small-caps; }
.card-char .nums span b { display: block; font-size: 1.2rem; color: var(--ink); font-variant: normal; }
.card-char .acts {
  grid-column: 1 / -1; display: flex; gap: .35rem; flex-wrap: wrap;
  border-top: 1px dotted var(--rule); padding-top: .55rem;
}
.card-char .acts button { flex: 0 0 auto; }
.card-char .acts button[data-open], .card-char .acts button[data-edit] { flex: 1 1 6rem; }
.roster-empty { text-align: center; padding: 2rem 1rem; color: var(--ink-soft); }

@media (min-width: 620px) {
  .card-char { grid-template-columns: 1fr auto auto; }
  .card-char .acts { grid-column: auto; border-top: 0; padding-top: 0; flex-wrap: nowrap; }
  .card-char .acts button[data-open], .card-char .acts button[data-edit] { flex: 0 0 auto; }
}

/* ----------------------------------------------------- ficha en pantalla
   A reading layout, deliberately not a preview of the A4 sheet: one column
   on a phone, tap-sized rows, full spell text. The sheet's job is paper. */
.viewer { display: grid; gap: 1rem; }
.viewer .hero {
  padding: 1.1rem 1rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.viewer .hero h2 {
  border: 0; margin: 0; font-size: 1.75rem; line-height: 1.1;
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight); letter-spacing: var(--head-ls); color: var(--seal);
}
.viewer .hero h2::before { content: none; }
.viewer .hero .line { color: var(--ink-soft); font-size: .92rem; margin-top: .15rem; }
/* A hairline that carries the flourish. */
.viewer .hero .orn {
  display: block; margin: .7rem 0 .1rem; height: 0;
  border-top: 1px solid var(--rule); position: relative;
}
.viewer .hero .orn::after {
  content: var(--orn); position: absolute; left: 50%; top: 0;
  transform: translate(-50%, -.72em); background: var(--panel-solid);
  padding: 0 .5rem; color: var(--gold); font-size: .8rem;
}
.viewer .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: .5rem; margin-top: .8rem; }
.viewer .tile {
  text-align: center; padding: .5rem .3rem; border: 1px solid var(--rule);
  border-radius: var(--radius); background: var(--panel-2);
}
.viewer .tile .k { display: block; font-size: .66rem; font-variant: small-caps; color: var(--sepia); letter-spacing: .04em; }
.viewer .tile .v { display: block; font-size: 1.45rem; font-weight: 600; line-height: 1.15; }
.viewer .tile .v small { font-size: .6em; font-weight: 400; }

.viewer section {
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
}
.viewer section > h3 {
  margin: 0; padding: .55rem .9rem; font-size: 1rem;
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: var(--head-ls); color: var(--sepia); border-bottom: 1px solid var(--rule);
}
.viewer section > div { padding: .8rem .9rem; }

.abgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .5rem; }
.abgrid .ab { text-align: center; border: 1px solid var(--rule); border-radius: var(--radius); padding: .5rem .3rem; background: var(--panel-2); }
.abgrid .ab .n { display: block; font-size: .72rem; font-variant: small-caps; color: var(--sepia); }
.abgrid .ab .s { display: block; font-size: 1.5rem; font-weight: 600; line-height: 1.1; }
.abgrid .ab .m { display: block; font-size: .82rem; }
.abgrid .ab .sv { display: block; font-size: .72rem; color: var(--ink-soft); margin-top: .15rem; }
.abgrid .ab.prof { border-color: var(--sepia); border-width: 2px; }

.skgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .1rem .8rem; }
.skgrid div { display: flex; gap: .4rem; padding: .18rem 0; border-bottom: 1px dotted var(--rule); font-size: .92rem; }
.skgrid div .dot { width: 1.5rem; flex: none; letter-spacing: -1px; color: var(--seal); }
.skgrid div .mod { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.skgrid div.prof { font-weight: 600; }

table.vt { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.vt th { text-align: left; font-size: .72rem; font-variant: small-caps; color: var(--sepia); border-bottom: 1px solid var(--rule); padding: .2rem .4rem .2rem 0; }
table.vt td { padding: .35rem .4rem .35rem 0; border-bottom: 1px dotted var(--rule); vertical-align: top; }
table.vt td.c { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vfeat { margin-bottom: .6rem; font-size: .93rem; }
.vfeat b { font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls); }
.viewer h4 {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: var(--head-ls); color: var(--sepia);
}

/* ------------------------------------------------------------ edit view */
.editor details {
  border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: .6rem;
  background: var(--panel);
}
.editor details > summary {
  cursor: pointer; padding: .7rem .9rem;
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  font-size: 1.02rem; letter-spacing: var(--head-ls); color: var(--sepia);
}
.editor details[open] > summary { border-bottom: 1px solid var(--rule); color: var(--seal); }
.editor details > .body { padding: .9rem; }
.editor details > .body > h2:first-child { display: none; }  /* the summary is the heading */

/* -------------------------------------------------------------- widgets */
fieldset {
  border: 1px solid var(--rule); border-radius: var(--radius); margin: 0 0 1.25rem;
  padding: .75rem 1rem 1rem;
  background: var(--panel);
}
legend {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  font-size: .98rem; letter-spacing: var(--head-ls);
  padding: 0 .5rem; color: var(--sepia);
}
legend::before, legend::after { content: var(--orn); color: var(--gold); margin: 0 .35rem; font-family: var(--serif); }

label.field { display: block; margin-bottom: .85rem; }
label.field > span.lab { display: block; font-size: .85rem; color: var(--sepia); margin-bottom: .2rem; font-variant: small-caps; letter-spacing: .03em; }
input[type=text], textarea, select {
  width: 100%; font-family: var(--serif); font-size: .95rem; color: var(--ink);
  padding: .4rem .5rem; background: var(--field);
  border: 1px solid var(--rule); border-radius: 2px;
}
textarea { resize: vertical; min-height: 4.5rem; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
option { color: var(--ink); background: var(--panel-solid); }

/* choice cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .5rem; }
.card {
  text-align: left; padding: .55rem .7rem; border: 1px solid var(--rule);
  background: var(--panel-2); border-radius: var(--radius); display: block; width: 100%;
}
.card .name { font-weight: 600; display: block; font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls); }
.card .why { font-size: .78rem; color: var(--ink-soft); display: block; margin-top: .1rem; }
.card[aria-pressed="true"] { border-color: var(--seal); border-width: 2px; background: var(--panel-solid); }

/* checkbox / radio rows */
.opts { display: grid; gap: .3rem; }
.opt { display: flex; gap: .5rem; align-items: flex-start; font-size: .92rem; padding: .2rem .1rem; }
.opt input { margin-top: .32rem; flex: none; }
.opt.off { opacity: .45; }
.opt .tag { font-size: .72rem; color: var(--sepia); border: 1px solid var(--rule); border-radius: 2px; padding: 0 .25rem; }

/* help + notices */
details.help { margin: -.25rem 0 1rem; font-size: .87rem; }
details.help > summary { cursor: pointer; color: var(--sepia); font-variant: small-caps; letter-spacing: .03em; }
details.help > div { padding: .5rem .75rem; margin-top: .35rem; border-left: 3px solid var(--gold); background: var(--panel-2); }
details.help p { margin: 0 0 .5rem; }
details.help p:last-child { margin-bottom: 0; }

/* questionnaire */
fieldset.quiz { padding-top: .5rem; }
fieldset.quiz > legend { font-size: .82rem; color: var(--gold); letter-spacing: .06em; }
fieldset.quiz p.situation { margin: 0 0 .6rem; font-size: 1rem; line-height: 1.45; }
fieldset.quiz .opt { padding: .3rem .35rem; border-radius: 2px; cursor: pointer; }
fieldset.quiz .opt:hover { background: var(--panel-2); }
fieldset.quiz.answered { border-color: var(--gold); }
fieldset.quiz.answered > legend::after { content: " ✓"; color: var(--gold); }
fieldset.result { border: 2px solid var(--seal); }
fieldset.result > legend { color: var(--seal); font-size: 1.1rem; }
fieldset.result td { padding: .3rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }

.notice { border-left: 3px solid var(--sepia); background: var(--panel-2); padding: .45rem .7rem; font-size: .87rem; margin: .5rem 0; }
.notice.warn { border-color: var(--seal); }
.notice.ok { border-color: var(--gold); }

.counter { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); }
.suggest { display: flex; flex-wrap: wrap; gap: .3rem; margin: -.55rem 0 .9rem; }
.suggest button { font-size: .82rem; padding: .2rem .5rem; background: none; border-color: var(--rule); color: var(--ink-soft); text-align: left; }
.suggest button:hover { color: var(--ink); border-color: var(--sepia); background: var(--panel-2); }
.suggest .tag { font-size: .75rem; color: var(--sepia); align-self: center; margin-right: .2rem; }
.counter.over { color: var(--seal); font-weight: 700; }

/* point buy: rows, not a table, so it survives a 390px phone */
.buyrows { display: grid; gap: .3rem; }
.buyrow {
  display: grid; grid-template-columns: 1fr auto auto; gap: .6rem; align-items: center;
  padding: .4rem .1rem; border-bottom: 1px solid var(--rule);
}
.buyrow .nm { min-width: 0; font-size: .98rem; }
.buyrow .nm .muted { font-size: .8em; }
.buyrow .nm .brk { display: block; font-size: .72rem; color: var(--sepia); }
.buyrow .ctl { display: flex; gap: .25rem; }
.buyrow .ctl button { min-height: 2.4rem; width: 2.4rem; padding: 0; font-size: 1.2rem; line-height: 1; }
.buyrow .out { text-align: right; min-width: 3.4rem; font-variant-numeric: tabular-nums; }
.buyrow .out b { font-size: 1.35rem; display: block; line-height: 1.1; }
.buyrow .out span { font-size: .8rem; color: var(--ink-soft); }

/* ------------------------------------------------ one question, one screen */
.situation-big {
  font-size: 1.25rem; line-height: 1.45; margin: .5rem 0 1.25rem;
  padding-left: .9rem; border-left: 4px solid var(--seal);
}
.quiz-answers { display: grid; gap: .5rem; }
button.answer {
  display: flex; gap: .7rem; align-items: flex-start; text-align: left; width: 100%;
  padding: .8rem .9rem; font-size: 1.02rem; line-height: 1.35; min-height: 3.2rem;
  background: var(--panel); border: 1px solid var(--rule);
}
button.answer .letter {
  flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 1px solid var(--sepia); color: var(--sepia);
  font-size: .82rem; line-height: 1.45rem; text-align: center; font-weight: 600;
  font-family: var(--display);
}
button.answer[aria-pressed="true"] {
  border-color: var(--seal); border-width: 2px; background: var(--panel-solid);
}
button.answer[aria-pressed="true"] .letter { background: var(--seal); color: #fdf6e6; border-color: var(--seal); }

/* ------------------------------------------------------------- intro step */
.intro { max-width: 38rem; }
.intro blockquote {
  margin: 0 0 1rem; padding: 1rem 1.15rem; border: 1px solid var(--rule);
  border-left: 4px solid var(--seal);
  background: var(--panel);
  font-size: 1.05rem; line-height: 1.55;
}
/* Capitular: the opening letter of the campaign blurb. */
.intro blockquote::first-letter {
  float: left; font-size: 3.4rem; line-height: .82; padding: .1rem .5rem .1rem 0;
  color: var(--seal); font-family: var(--display); font-weight: var(--head-weight);
}
.intro h3 {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  margin: 1.5rem 0 .35rem; font-size: 1.08rem;
  letter-spacing: var(--head-ls); color: var(--sepia);
  border-bottom: 1px solid var(--rule); padding-bottom: .15rem;
}
.intro ul { margin: .25rem 0 0; padding-left: 1.2rem; }
.intro li { margin-bottom: .3rem; }

footer.credit { padding: 1rem 1.5rem 2rem; font-size: .78rem; color: var(--ink-soft); border-top: 1px solid var(--rule); }

/* ==================================================================== BOARD
   Everything below is the DM tool's own. It borrows the creator's tokens and
   its chrome (header.top, section.panel, button, .notice, .viewer, .abgrid,
   .skgrid, table.vt) so the tokens above apply to this file with no extra
   work.
========================================================================= */

/* ------------------------------------------------------------------ tabs */
.tabs {
  display: flex; gap: .3rem; padding: .5rem 1rem 0;
  max-width: 60rem; margin: 0 auto; flex-wrap: wrap;
}
.tabs button {
  flex: 1 1 6rem; min-height: 2.4rem; font-size: .9rem;
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
  border-color: var(--rule); background: none; color: var(--ink-soft);
}
.tabs button[aria-current="true"] {
  background: var(--panel-solid); border-color: var(--sepia); color: var(--seal);
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
  border-bottom-color: var(--panel-solid);
}
.tabs button .n { font-variant-numeric: tabular-nums; opacity: .6; }

/* ------------------------------------------------------------- drop zone
   A file input is the only way to read a local .json without a server, so the
   whole board is also a drop target and the input stays hidden. */
.drop {
  border: 2px dashed var(--rule); border-radius: var(--radius);
  padding: 2rem 1rem; text-align: center; color: var(--ink-soft);
}
.drop b { display: block; font-family: var(--display); font-variant: var(--head-variant);
  letter-spacing: var(--head-ls); color: var(--sepia); font-size: 1.05rem; margin-bottom: .3rem; }
body.dragging .drop { border-color: var(--seal); color: var(--ink); }
body.dragging::after {
  content: ""; position: fixed; inset: 0; z-index: 4; pointer-events: none;
  box-shadow: inset 0 0 0 3px var(--seal);
}

/* ------------------------------------------------------- combatant card
   One component for players and monsters alike: the play state has the same
   shape for both, so the row does too. Phone first — three stacked bands,
   never a sideways scroll. */
.board { display: grid; gap: .6rem; }

.cb {
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
  padding: .6rem .7rem;
}
.cb.npc { background: var(--panel-2); }
.cb.down { opacity: .62; }
.cb.active { border-color: var(--seal); border-width: 2px; padding: calc(.6rem - 1px) calc(.7rem - 1px); }

/* head: name, the four look-up numbers, expander */
.cb .head {
  display: grid; grid-template-columns: 1fr auto; gap: .15rem .6rem; align-items: start;
  cursor: pointer;
}
.cb .head .who { min-width: 0; display: flex; align-items: center; gap: .55rem; }
.cb .head .who .id { min-width: 0; }
.cb .head .who b {
  display: block; font-size: 1.05rem; line-height: 1.2;
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight); letter-spacing: var(--head-ls);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cb .head .who .sub {
  display: block; font-size: .78rem; color: var(--ink-soft);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* A dropped/picked image, downscaled and embedded as a stamp so it travels
   inside the character's or monster's own record — no separate storage key. */
.portrait {
  --size: 2.2rem;
  width: var(--size); height: var(--size); border-radius: 50%; overflow: hidden;
  flex: 0 0 auto; background: var(--panel-2); border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: calc(var(--size) * .38); color: var(--ink-soft);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait.big { --size: 3.6rem; }
.portrait.editable { cursor: pointer; }
.portrait.drag { outline: 2px dashed var(--seal); outline-offset: 2px; }
.cb .head .init {
  font-family: var(--display); font-size: 1.5rem; line-height: 1;
  color: var(--seal); font-variant-numeric: tabular-nums; text-align: right;
}
.cb .head .init small { display: block; font-size: .6rem; font-family: var(--serif);
  color: var(--sepia); font-variant: small-caps; letter-spacing: .04em; }

/* the look-up strip: CA, percepción pasiva, velocidad, iniciativa */
.cb .nums { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .35rem; }
.cb .nums span {
  font-size: .64rem; color: var(--sepia); font-variant: small-caps; letter-spacing: .04em;
  text-align: center; min-width: 2.6rem;
}
.cb .nums span b {
  display: block; font-size: 1.05rem; color: var(--ink);
  font-variant: normal; font-variant-numeric: tabular-nums; line-height: 1.15;
}

/* hit points: bar, then the number, then the one input that changes it */
.cb .hp { margin-top: .45rem; }
/* Two segments in a row, not an overlay: a percentage margin would resolve
   against the bar's *width*, which is not what a 9px-tall bar wants. */
.cb .bar {
  display: flex; height: 9px; border: 1px solid var(--rule); border-radius: 5px;
  overflow: hidden; background: rgba(138,106,67,.12);
}
.cb .bar > i { flex: none; height: 100%; background: linear-gradient(90deg, var(--gold), var(--seal)); transition: width .2s ease; }
.cb.bloodied .bar > i { background: linear-gradient(90deg, var(--seal-2), var(--seal)); }
.cb.down .bar > i { background: var(--sepia); }
/* Temporary hit points ride on the end of the bar, hatched so they never read
   as real ones. */
.cb .bar > u { flex: none; height: 100%; background: repeating-linear-gradient(
  135deg, rgba(176,141,87,.9) 0 3px, rgba(176,141,87,.35) 3px 6px); }

.cb .hpline {
  display: flex; align-items: baseline; gap: .4rem; margin-top: .25rem;
  font-variant-numeric: tabular-nums;
}
.cb .hpline .cur { font-size: 1.5rem; font-weight: 600; line-height: 1; }
.cb .hpline .max { color: var(--ink-soft); font-size: .92rem; }
.cb .hpline .tmp { color: var(--gold); font-size: .88rem; font-weight: 600; }
.cb .hpline .state {
  margin-left: auto; font-size: .74rem; font-variant: small-caps; letter-spacing: .05em;
  color: var(--seal);
}

.cb .dmg { display: flex; gap: .3rem; margin-top: .4rem; }
.cb .dmg input {
  flex: 1 1 4rem; min-width: 0; min-height: 2.4rem; text-align: center;
  font-family: var(--serif); font-size: 1rem; font-variant-numeric: tabular-nums;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: .2rem .4rem;
}
.cb .dmg button { flex: 0 0 2.6rem; min-height: 2.4rem; width: 2.6rem; padding: 0; font-size: 1.15rem; line-height: 1; }

/* conditions */
.chips { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .45rem; align-items: center; }
.chip {
  font-size: .76rem; padding: .12rem .45rem; min-height: 1.7rem; line-height: 1.4;
  border: 1px solid var(--rule); border-radius: 999px;
  background: none; color: var(--ink-soft); font-family: var(--serif);
}
.chip.on { border-color: var(--seal); color: var(--seal); background: var(--panel-solid); font-weight: 600; }
.chip.add { border-style: dashed; }
.condbox {
  margin-top: .4rem; padding: .5rem .6rem; border: 1px solid var(--rule);
  border-radius: var(--radius); background: var(--panel-2);
}
.condbox .grid { display: flex; flex-wrap: wrap; gap: .25rem; }
.condbox .why { font-size: .82rem; margin: .45rem 0 0; line-height: 1.4; }
.condbox .why b { color: var(--seal); }

/* death saves: the DM taps what the player rolled in front of them */
.death {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  margin-top: .45rem; padding-top: .45rem; border-top: 1px dotted var(--rule);
  font-size: .8rem; color: var(--sepia); font-variant: small-caps; letter-spacing: .04em;
}
.death .pips { display: flex; gap: .2rem; }
.death .pip {
  width: 1.5rem; height: 1.5rem; min-height: 0; padding: 0; border-radius: 50%;
  border: 1px solid var(--sepia); background: none; font-size: .8rem; line-height: 1;
  color: var(--sepia);
}
.death .pip.on { background: var(--seal); border-color: var(--seal); color: #fdf6e6; }
.death .pip.fail.on { background: #2b2118; border-color: #2b2118; }
.death .verdict { font-weight: 700; color: var(--seal); font-size: .9rem; letter-spacing: .06em; }

/* the expanded sheet under a player row */
.detail {
  margin-top: .55rem; padding-top: .55rem; border-top: 1px solid var(--rule);
  display: grid; gap: .7rem;
}
.detail h4 {
  margin: 0 0 .25rem; font-size: .8rem; letter-spacing: .06em;
  font-variant: small-caps; color: var(--sepia);
  border-bottom: 1px solid var(--rule); padding-bottom: .1rem;
}
.detail .abgrid .ab { padding: .35rem .2rem; }
.detail .abgrid .ab .s { font-size: 1.2rem; }
.detail .feat { font-size: .86rem; margin-bottom: .35rem; }
.detail .feat b { font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls); }
.detail .note textarea {
  width: 100%; min-height: 3.4rem; font-family: var(--serif); font-size: .92rem;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--rule); border-radius: var(--radius); padding: .35rem .45rem;
}

/* ---------------------------------------------------------------- combat */
.turnbar {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  padding: .55rem .7rem; margin-bottom: .7rem;
  border: 1px solid var(--sepia); border-radius: var(--radius);
  background: var(--panel-solid); box-shadow: var(--shadow);
}
.turnbar .round {
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
  color: var(--seal); font-size: 1.05rem;
}
.turnbar .round b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
/* Child combinator on purpose: the order strip also has a `.now`, and a
   descendant selector handed it `flex: 1 1 100%` and a whole row to itself. */
.turnbar > .now { font-size: .82rem; color: var(--ink-soft); flex: 1 1 100%; }
.turnbar > .now b { color: var(--ink); font-size: .95rem; }
.turnbar .spacer { flex: 1; }

/* ================================================== the two sides of a fight
   Players on the left, monsters on the right. That is the shape of the fight,
   and it turns "how many are left" into a glance instead of a read — which a
   single list sorted by initiative can never be. The muster wears the same
   shape before the fight exists, tick-rows instead of cards either side of
   the same field, so nothing about the screen reflows the moment Empezar
   combate is pressed — only what is inside each column changes.
========================================================================= */

.sides { display: grid; gap: .9rem; }

/* Each side is its own bordered, tinted panel rather than two lists a gap
   apart: which side a card is on becomes a colour you cannot mistake, and it
   still degrades to two stacked blocks on a phone. The tints are mixed from
   --seal and --sepia rather than written as fixed rgba, so they stay in step
   with the palette instead of drifting from it. */
/* `minmax(0, 1fr)`, not the implicit `auto`: an auto track is sized by its
   contents' max-content, so one card with an awkward intrinsic width — a
   wrapping flex row inside it is enough — quietly widens the column past the
   grid cell it was given and hangs off the side of the screen. */
.side {
  min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr);
  gap: .6rem; align-content: start;
  padding: .7rem .75rem; border: 1px solid var(--rule); border-radius: var(--radius);
}
.side.pcs {
  background: color-mix(in srgb, var(--seal) 5%, transparent);
  border-color: color-mix(in srgb, var(--seal) 35%, var(--rule));
}
.side.npcs {
  background: color-mix(in srgb, var(--sepia) 8%, transparent);
  border-color: color-mix(in srgb, var(--sepia) 40%, var(--rule));
}

.sideh {
  display: flex; align-items: center; gap: .5rem; margin: 0;
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: var(--head-ls); font-size: 1.05rem;
  border-bottom: 2px solid var(--rule); padding-bottom: .3rem;
}
.sideh .n {
  margin-left: auto; font-family: var(--serif); font-variant: normal; letter-spacing: 0;
  font-size: .9rem; font-variant-numeric: tabular-nums;
  min-width: 1.6rem; text-align: center; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-soft);
}
.sideh.pcs { color: var(--seal); border-bottom-color: var(--seal); }
.sideh.npcs { color: var(--sepia); }
/* The add button lives in the heading, not at the foot of the column: during
   a fight the column is a tall stack of cards, and the foot of it is several
   screens away from where you are looking. */
.sideh .plus {
  font-family: var(--serif); font-variant: normal; letter-spacing: 0;
  min-height: 1.9rem; padding: 0 .55rem; font-size: 1.05rem; line-height: 1;
}

/* ------------------------------------------------------- the card, in a fight
   The same card, wound in. During a fight a column is six of these and the
   field is next to them, so every row a card does not need is a row of field
   somebody gets to see — and a card you have to scroll to reach is a card you
   stop reading.

   What goes: the species-and-class line, which is a thing you look up once and
   never during a round; the look-up numbers become one line of text instead of
   a strip of stacked pairs; and the hit points and the box that changes them
   sit on the *same* row rather than one above the other. What stays is every
   control — nothing here is hidden behind an expander it was not behind
   before. Roughly seven rows become four.
========================================================================= */
.cb.compact { padding: .4rem .5rem; }
.cb.compact.active, .cb.compact.picked { padding: calc(.4rem - 1px) calc(.5rem - 1px); }
.cb.compact .head { gap: .1rem .45rem; }
.cb.compact .head .who b { font-size: 1rem; }
.cb.compact .head .who .sub { display: none; }
.cb.compact .head .init input { width: 2.9rem; min-height: 2rem; font-size: 1.15rem; }
.cb.compact .head .init small { font-size: .55rem; }

/* One line of text rather than four stacked label-over-number pairs: the
   number comes back beside its label instead of under it, which is the whole
   of the saving and costs no markup. */
.cb.compact .nums { gap: .1rem .55rem; margin-top: .2rem; }
.cb.compact .nums span { min-width: 0; text-align: left; }
.cb.compact .nums span b { display: inline; font-size: .92rem; margin-left: .18em; }

/* Wrapping flex rather than a grid of equal tracks: the number is as wide as
   the number, and everything left over goes to the box — two equal columns
   spent half a narrow card on "10 / 10 PG" and clipped the box's placeholder
   to nothing. It still drops the box onto its own line when even 9 rem is more
   than there is, which is the phone. No media query either way. */
.cb.compact .hp {
  margin-top: .3rem; display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .55rem;
}
.cb.compact .bar { flex: 1 0 100%; min-width: 0; }
.cb.compact .hpline { flex: 0 1 auto; min-width: 0; }
/* `min-width: 0`, or the box never shares the row: a flex item's automatic
   minimum is content-based, and this one contains an <input>, whose intrinsic
   width is around 180 px however narrow you are willing to let it be. The file
   already guards the input itself the same way; the box around it needs it
   too. */
.cb.compact .dmg { flex: 1 1 9rem; min-width: 0; }
.cb.compact .hpline { margin-top: 0; flex-wrap: wrap; }
.cb.compact .hpline .cur { font-size: 1.25rem; }
.cb.compact .hpline .state { margin-left: 0; }
.cb.compact .dmg { margin-top: 0; }
.cb.compact .dmg input { min-height: 2.1rem; font-size: .95rem; }
.cb.compact .dmg button { flex: 0 0 2.1rem; width: 2.1rem; min-height: 2.1rem; font-size: 1rem; }
.cb.compact .chips { margin-top: .3rem; gap: .2rem; }
.cb.compact .chip { min-height: 1.5rem; font-size: .72rem; }
.cb.compact .reveal { margin-top: .3rem; padding-top: .3rem; gap: .3rem; }
.cb.compact .reveal button { min-height: 1.9rem; font-size: .78rem; padding: .2rem .45rem; }
.cb.compact .reveal select { min-height: 1.9rem; font-size: .76rem; }
.cb.compact .death { margin-top: .3rem; padding-top: .3rem; }

/* ------------------------------------------------------------- the muster
   The same row on both sides. The tick and the name are separate targets, so
   deciding who is in and looking at what they are made of are never the same
   gesture by accident — the card the name opens is the fight's own card. */
.picklist { display: grid; gap: .35rem; }
.mrow {
  display: grid; grid-template-columns: auto 1fr auto; gap: .1rem .55rem; align-items: center;
  padding: .5rem .6rem;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel-2); color: var(--ink); font-family: var(--serif); font-size: 1rem;
}
.mrow.on { background: var(--panel); border-color: var(--sepia); }
.mrow > button.nm {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--serif); font-size: 1rem; text-align: left;
  background: none; border: 0; min-height: 0; padding: 0; color: var(--ink);
}
.mrow > button.nm b {
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
  font-weight: var(--head-weight);
}
.mrow:not(.on) > .nm { color: var(--ink-soft); }
/* Column 2 only: spanning into the third pushes the caret onto a row of its
   own, the same way it did in the modal's pick rows. */
.mrow > .st {
  grid-column: 2 / 3; font-size: .78rem; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.mrow > .tick { grid-row: span 2; }
.mrow > .caret {
  grid-row: span 2; min-height: 2rem; padding: 0 .45rem; font-size: .9rem; line-height: 1;
  color: var(--sepia); border-color: transparent;
}
.mrow > [data-delnpc] { grid-row: span 2; min-height: 2rem; padding: 0 .45rem; }
/* The card flows inside the row it belongs to rather than sitting in a second
   frame of its own: the row is its head, so a border around it would draw a
   box around half of one thing. */
/* Not `.card`: the creator's chrome already owns that name, and borrowing it
   here painted a panel behind a card that had just been told not to have one. */
.mrow > .open-card { grid-column: 1 / -1; margin-top: .5rem; padding-top: .5rem; border-top: 1px dotted var(--rule); }
.mrow.open { background: var(--panel); border-color: var(--sepia); }
/* No tick here — the muster stopped being a membership control, so the row
   is one column narrower than the picker's own rows. */
.mrow.plain { grid-template-columns: 1fr auto auto; }
.mrow.plain > .st { grid-column: 1 / 2; }
.cb.bare { border: 0; padding: 0; background: none; box-shadow: none; }
.cb.bare > .nums { margin-top: 0; }
.cb.bare .more { margin-top: .5rem; }
.cb.bare .more button { font-size: .78rem; min-height: 2rem; border-color: transparent; color: var(--sepia); }

.startbar {
  display: flex; gap: .8rem; align-items: center; flex-wrap: wrap;
  margin-top: 1.1rem; padding-top: .9rem; border-top: 2px solid var(--rule);
}
.startbar .muted { font-size: .85rem; }
button.big {
  font-size: 1.05rem; padding: .7rem 1.4rem; min-height: 3rem;
}

/* Ending a fight is not a per-turn control, so it does not go in the turn bar
   next to Siguiente where a misfire would cost you the encounter. It goes
   where Empezar was, at the foot of the same screen, and says what it does. */
.endbar {
  display: flex; gap: .8rem; align-items: center; flex-wrap: wrap;
  margin-top: 1.1rem; padding-top: .9rem; border-top: 2px solid var(--rule);
}
.endbar .muted { font-size: .85rem; flex: 1 1 14rem; }
button.danger {
  border-color: var(--seal); color: var(--seal);
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
}
button.danger:hover:not(:disabled) { background: var(--seal); color: #fdf6e6; }

/* ------------------------------------------------------------ turn order */
.orderstrip {
  list-style: none; display: flex; flex-wrap: wrap; gap: .3rem;
  margin: .5rem 0 0; padding: .5rem 0 0; flex: 1 1 100%;
  border-top: 1px dotted var(--rule);
}
.orderstrip li {
  font-size: .8rem; padding: .1rem .45rem; border-radius: 999px;
  border: 1px solid var(--rule); color: var(--ink-soft); background: var(--panel-2);
  font-variant-numeric: tabular-nums;
}
.orderstrip li b { color: var(--ink); }
.orderstrip li.pc { border-color: var(--sepia); }
.orderstrip li.now {
  background: var(--seal); border-color: var(--seal); color: #fdf6e6;
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
}
.orderstrip li.now b { color: #fdf6e6; }
.orderstrip li.out { opacity: .45; text-decoration: line-through; }

/* ============================================================ the small field
   The television is still where the field is *played*: this is a repeater, not
   a second board, and nothing on it can be dragged. What it buys is that the
   DM stops turning their head — and it shows what the television deliberately
   cannot, the monsters staged off-screen, drawn dashed.
========================================================================= */
.midboard {
  min-width: 0; display: grid; gap: .5rem; align-content: start;
  padding: .7rem .75rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: color-mix(in srgb, var(--sepia) 4%, transparent);
}
.midboard .sideh { border-bottom-color: var(--rule); color: var(--ink-soft); }
.midboard .sideh .n { margin-left: auto; padding: 0 .4rem; }
.midboard .tip { font-size: .74rem; color: var(--ink-soft); margin: 0; }

.minifield {
  position: relative; width: 100%; overflow: hidden;
  border: 1px solid var(--sepia); border-radius: 2px;
  background: var(--panel-2);
}
/* A real <img>, not a background-image div: sized by simply being in flow at
   its own natural proportions, which is what makes `.minifield`'s own height
   follow the picture's actual shape instead of a cols/rows guess — the grid
   overlaid on top (position:absolute; inset:0 below) can then never reach
   past where the picture actually ends. Nothing is ever cropped either way:
   this is what `contain` used to have to do with a fixed-shape container. */
.minifield .mapimg { display: block; width: 100%; height: auto; }
/* Two gradients instead of cols × rows empty divs: a 60 × 40 field would be
   2400 elements rebuilt on every keystroke, and the grid is only lines. */
.minifield .grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, var(--rule) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
  opacity: .55;
}
/* Where a drop would land, and how far the selected one could walk. Both are
   one element: a Chebyshev reach is a rectangle, so lighting it does not cost
   a div per square. */
.minifield .reach {
  position: absolute; background: rgba(176,141,87,.22);
  box-shadow: inset 0 0 0 1px rgba(176,141,87,.6); pointer-events: none;
}
.minifield .target { position: absolute; background: rgba(142,43,32,.3); pointer-events: none; }

.minifield .token {
  position: absolute; transform: translate(-50%, -50%);
  width: calc(var(--sq) * .82); height: calc(var(--sqy) * .82);
  border-radius: 50%; background: var(--tint, #3a3128);
  border: 1px solid rgba(0,0,0,.4); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  display: grid; place-items: center; color: #fdf6e6;
  container-type: inline-size; cursor: grab; touch-action: none;
}
.minifield .token.grabbed { cursor: grabbing; z-index: 9; box-shadow: 0 6px 14px rgba(0,0,0,.45); }
.minifield .token.selected { outline: 2px solid var(--gold); outline-offset: 1px; z-index: 4; }
/* The name only on the two tokens you are actually thinking about, because six
   labels in a huddle is a wall of text. In container units, not squares: a
   percentage inside a token resolves against the token. */
.minifield .token .lbl {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  margin-top: 2px; white-space: nowrap; pointer-events: none;
  font-size: max(9px, 34cqw); line-height: 1.2; color: var(--ink);
  background: color-mix(in srgb, var(--panel-solid) 88%, transparent);
  padding: 0 .25em; border-radius: 2px; z-index: 6;
}
.minifield .token .ini {
  display: none; font-family: var(--display); font-weight: 700;
  line-height: 1; font-size: 46cqw;
}
.minifield .token .pimg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
}
/* Initials only once the circle is big enough to hold them: on a 60-column
   field they would be three unreadable pixels. The query is against the token,
   which is its own container. */
@container (min-width: 17px) { .minifield .token .ini { display: block; } }
.minifield .token.active { box-shadow: 0 0 0 2px var(--seal), 0 1px 4px rgba(0,0,0,.4); z-index: 3; }
.minifield .token.out { opacity: .4; filter: grayscale(1); }
/* Staged off-screen: on this board and on no other. */
.minifield .token.hidden { border-style: dashed; border-color: #fdf6e6; opacity: .72; }

/* Initiative is typed on the card, where you are already looking when a
   player calls a number out. */
.cb .head .init input {
  width: 3.4rem; min-height: 2.2rem; text-align: center;
  font-family: var(--display); font-size: 1.25rem; color: var(--seal);
  font-variant-numeric: tabular-nums;
  background: var(--field); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: .1rem .2rem;
}
.cb .head .init input::placeholder { color: var(--rule); }

/* ------------------------------------------------------------------ modals
   Adding a monster and writing a statblock are both errands: you open them,
   finish them and want the board back. Inline forms sat on the screen for the
   whole session whether you wanted them or not.
========================================================================= */
.scrim {
  position: fixed; inset: 0; z-index: 60; padding: 1rem;
  display: grid; place-items: center; background: rgba(18,12,6,.6);
}
.modal {
  width: min(30rem, 100%); max-height: min(86vh, 44rem);
  display: flex; flex-direction: column;
  background: var(--panel-solid); border: 1px solid var(--sepia);
  border-radius: var(--radius); box-shadow: 0 10px 34px rgba(0,0,0,.4);
}
.modal > h2 {
  display: flex; align-items: center; gap: .5rem; margin: 0;
  padding: .7rem .85rem; border-bottom: 3px double var(--sepia);
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight); letter-spacing: var(--head-ls);
  font-size: 1.1rem; color: var(--seal);
}
.modal > h2 button { margin-left: auto; min-height: 2rem; padding: .1rem .5rem; }
.modal > .body { padding: .8rem .85rem; overflow: auto; flex: 1; }
.modal > .body > p:first-child { margin-top: 0; }
.modal > .acts {
  display: flex; align-items: center; gap: .45rem; flex-wrap: wrap;
  padding: .7rem .85rem; border-top: 1px solid var(--rule); background: var(--panel-2);
}
.modal > .acts .count { font-size: .82rem; color: var(--ink-soft); margin-right: auto; }

/* One row per statblock: tick it, then say how many. Three goblins and an
   ogre is one trip through this list, not four. */
.pickrow {
  display: grid; grid-template-columns: auto 1fr auto; gap: .1rem .55rem;
  align-items: center; padding: .45rem .55rem;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel-2); margin-bottom: .35rem;
}
.pickrow.on { border-color: var(--sepia); background: var(--panel); }
/* The name is a button too, so the whole row is a target and not just the
   sixteen pixels of the tick. It keeps none of a button's chrome. */
.pickrow > button.nm {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--serif); text-align: left;
  background: none; border: 0; min-height: 0; padding: 0; color: var(--ink);
}
.pickrow > button.nm b {
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
}
.pickrow:not(.on) > .nm { color: var(--ink-soft); }
/* Column 2 only, not `2 / -1`: spanning into the third column pushed the
   stepper onto a row of its own under the name. */
.pickrow > .st {
  grid-column: 2 / 3; font-size: .78rem; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.pickrow > .tick { grid-row: span 2; }
.pickrow .stepper { grid-row: span 2; display: flex; align-items: center; gap: .2rem; }
.pickrow .stepper button { min-height: 2rem; padding: .1rem .5rem; font-size: 1rem; line-height: 1; }
.pickrow .stepper b {
  min-width: 1.6rem; text-align: center; font-variant-numeric: tabular-nums;
  font-family: var(--display); font-size: 1.05rem;
}

/* The muster picker: players and monsters answer the same question, side by
   side, rather than one column at a time — the same reasoning `.sides`
   already carries into every other screen. */
.musterpick { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.musterpick .pickcol h3 {
  margin: 0 0 .5rem; font-family: var(--display); font-variant: var(--head-variant);
  letter-spacing: var(--head-ls); font-weight: var(--head-weight); font-size: 1rem; color: var(--sepia);
}
@media (max-width: 640px) { .musterpick { grid-template-columns: 1fr; } }
/* The visible/oculto switch rides along with the rest of an npc's row instead
   of asking for a fourth grid column — a monster you tick in is visible
   unless you say otherwise, so the common case never has to touch this. */
.pickrow > .st.withtoggle { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.pickrow > .st.withtoggle button { font-size: .74rem; padding: .15rem .5rem; min-height: 0; white-space: nowrap; }
.pickrow > .st.withtoggle button[aria-pressed="true"] { color: var(--sepia); border-color: var(--sepia); }

/* ------------------------------------------------------ one initiative, once
   The table calls the numbers out one at a time, going round, so the modal
   asks for them the same way: one name, one box, Enter. A grid of every
   combatant at once is a form you have to keep finding your place in. */
.initstep { display: grid; justify-items: center; gap: .2rem; text-align: center; padding: .3rem 0 .6rem; }
.initstep .nm {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: var(--head-ls); font-size: 1.5rem; line-height: 1.15; color: var(--seal);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.initstep .sub { font-size: .82rem; color: var(--ink-soft); }
.initstep input {
  width: 6.5rem; min-height: 3.6rem; margin-top: .5rem; text-align: center;
  font-family: var(--display); font-size: 2rem; color: var(--seal);
  font-variant-numeric: tabular-nums;
  background: var(--field); border: 1px solid var(--sepia); border-radius: var(--radius);
  padding: .1rem .3rem;
}
.initstep input::placeholder { color: var(--rule); }
.initstep .hint { font-size: .78rem; color: var(--ink-soft); margin: .45rem 0 0; }

/* Everybody, with whatever they have said so far: the DM can see who is still
   missing and jump straight to the one who has just spoken up. */
.initqueue {
  list-style: none; display: flex; flex-wrap: wrap; gap: .25rem;
  margin: 0; padding: .6rem 0 0; border-top: 1px dotted var(--rule);
}
.initqueue button {
  font-size: .78rem; padding: .15rem .5rem; min-height: 1.8rem; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-soft);
  font-family: var(--serif); max-width: 11rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.initqueue button b { color: var(--ink); font-variant-numeric: tabular-nums; }
.initqueue li.pc button { border-color: var(--sepia); }
.initqueue li.now button {
  background: var(--seal); border-color: var(--seal); color: #fdf6e6;
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
}
.initqueue li.now button b { color: #fdf6e6; }

.mform { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: .5rem; }
.mform label { display: block; font-size: .74rem; color: var(--sepia); font-variant: small-caps; letter-spacing: .04em; }
.mform label.wide, .mform .wide { grid-column: 1 / -1; }
.mform input, .mform textarea {
  width: 100%; min-height: 2.5rem; margin-top: .15rem;
  font-family: var(--serif); font-size: 1rem; color: var(--ink);
  background: var(--field); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: .3rem .45rem;
}
.mform textarea { min-height: 3rem; font-size: .92rem; }
.mform .acts { grid-column: 1 / -1; display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.mform .acts label { display: flex; align-items: center; gap: .3rem; font-size: .8rem; font-variant: normal; }

.mform .abilities { margin-top: .3rem; }
.abrow {
  display: grid; grid-template-columns: 8rem 1fr auto; gap: .4rem; align-items: start;
  margin-bottom: .4rem;
}
.abrow textarea { min-height: 2.5rem; }

.abdetails { margin-top: .3rem; }
.abdetails > summary {
  cursor: pointer; font-family: var(--display); font-variant: var(--head-variant);
  letter-spacing: var(--head-ls); color: var(--sepia); margin-bottom: .3rem;
}
.abdetails[open] > summary { margin-bottom: .5rem; }

.quickadd { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .6rem; }
.quickadd .tag { font-size: .74rem; color: var(--sepia); font-variant: small-caps; align-self: center; margin-right: .2rem; }

.filterbar { margin-bottom: .8rem; }
.filterbar input { width: 100%; }

/* -------------------------------------------------------------- bestiary */
.beast {
  display: grid; grid-template-columns: 1fr auto; gap: .3rem .6rem; align-items: center;
  padding: .6rem .7rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
}
.beast .bwho { display: flex; align-items: center; gap: .55rem; min-width: 0; }
.beast b { font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls); }
.beast .st { font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.beast .tag { font-size: .72rem; color: var(--sepia); border: 1px solid var(--rule); border-radius: 2px; padding: 0 .3rem; }
.beast .nt { grid-column: 1 / -1; font-size: .84rem; color: var(--ink-soft); white-space: pre-wrap; }
.beast .acts { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }

/* ================================================================ ESCENAS
   A scene is prep: the art, the grid, and what is standing on it. The library
   is a grid of thumbnails because a scene is a *picture* — a list of names
   would make you open three to find the tavern. It is the landing state of
   this tab when nothing is live, and a modal when you are swapping.
========================================================================= */

.scenegrid {
  display: grid; gap: .8rem;
  grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
}
.scenecard {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
}
.scenecard.on { border-color: var(--seal); box-shadow: 0 0 0 2px color-mix(in srgb, var(--seal) 35%, transparent); }
/* 16:9, because that is what a television is and what the art will be cropped
   to. A scene with no art keeps the same box so the grid does not jump. */
.scenecard .thumb {
  aspect-ratio: 16 / 9; background: var(--parchment-2) center / cover no-repeat;
  border-bottom: 1px solid var(--rule); position: relative;
}
.scenecard .thumb.none {
  display: grid; place-items: center;
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
  color: var(--ink-soft); font-size: .9rem;
}
.scenecard .thumb .badge {
  position: absolute; right: .3rem; top: .3rem;
  font-size: .68rem; padding: .1rem .35rem; border-radius: 2px;
  background: #2b2118; color: #f4ead2; letter-spacing: .04em;
}
.scenecard.staged { border-color: var(--sepia); }
.scenecard .thumb .badge.staged { background: var(--sepia); }
.quickadd.staged { align-items: center; }
.scenecard .meta { padding: .5rem .6rem; display: grid; gap: .25rem; }
.scenecard .meta b {
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
}
.scenecard .meta .st { font-size: .8rem; color: var(--ink-soft); }
.scenecard .acts { padding: 0 .6rem .6rem; display: flex; gap: .3rem; flex-wrap: wrap; }
/* A missing file is stated, never hidden: you want to find out while prepping
   and not with the television already on. */
.scenecard .gone, .scenebar .gone {
  font-size: .78rem; color: var(--seal); word-break: break-all;
}

/* ==== HISTORIA ====
   A note is prose, not a tile, so it stacks full-width rather than sitting in
   a grid the way a scene's picture-first cards do. */
.notecard {
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
  padding: .8rem 1rem; margin-bottom: .8rem;
}
.notecard > b {
  display: block; font-family: var(--display); font-variant: var(--head-variant);
  letter-spacing: var(--head-ls); font-size: 1.05rem; margin-bottom: .4rem;
}
.notebody h4, .notebody h5, .notebody h6 {
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
  color: var(--seal); margin: .6rem 0 .3rem;
}
.notebody p { margin: 0 0 .5rem; }
.notebody ul { margin: 0 0 .5rem; padding-left: 1.2rem; }
.notebody li { margin-bottom: .2rem; }

/* [[wikilinks]] and #tags, both derived from a note's own text — never a
   separate editor, so they look like part of the prose, not a widget. */
.wikilink { color: var(--sepia); text-decoration: underline; cursor: pointer; }
.wikilink.unresolved { color: var(--ink-soft); text-decoration: underline dashed; cursor: default; }
.notetags { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: .5rem; }
.notetags.inline { display: inline; margin: 0 0 0 .4rem; font-size: .78rem; color: var(--sepia); }
.notecard .tag, .notebody .tag {
  font-size: .72rem; color: var(--sepia); border: 1px solid var(--rule); border-radius: 2px;
  padding: 0 .3rem; cursor: pointer;
}
.backlinks {
  margin-top: .6rem; padding-top: .5rem; border-top: 1px dashed var(--rule);
  font-size: .84rem; color: var(--ink-soft);
}
.backlinks b { font-variant: small-caps; margin-right: .3rem; }
.backlinks .wikilink { margin-right: .2rem; }

/* The index: one row per note, titles only — opening one is storyNoteView's
   job, not this list's. */
.storyindex { list-style: none; margin: 0 0 1.1rem; padding: 0; }
.storyindex li {
  padding: .35rem 0; border-bottom: 1px solid var(--rule);
  display: flex; align-items: baseline; flex-wrap: wrap; gap: .3rem;
}
.storyindex li:last-child { border-bottom: 0; }
.storyindex button.link { font-size: .95rem; text-decoration: none; }
.storyindex button.link:hover { text-decoration: underline; }

/* The live scene, as one card wherever scenePanel() puts it. The picture
   comes first and stays big — it is the thing the players are looking at —
   with the controls in a row underneath it, never overlapping the art or
   crowding it into a corner. */
.scenebar {
  display: flex; flex-direction: column; gap: .5rem;
  padding: .6rem; margin-bottom: .8rem;
  border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel);
}
.scenebar .hero {
  aspect-ratio: 21 / 9; max-height: 46vh; border: 1px solid var(--rule); border-radius: 2px;
  background: var(--parchment-2) center / cover no-repeat;
}
.scenebar .row {
  display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap;
}
.scenebar b {
  font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls);
}
.scenebar .st { font-size: .8rem; color: var(--ink-soft); }
.scenebar .acts { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
.scenebar .nt {
  font-size: .84rem; color: var(--ink-soft); white-space: pre-wrap;
  border-top: 1px solid var(--rule); padding-top: .4rem; margin: 0;
}
/* Inside midBoard(), the art is already up on the minifield above — this is
   only the row of controls, so it borrows the frame it sits in rather than
   drawing a second one. */
.scenebar.compact {
  border: 0; border-top: 1px solid var(--rule); border-radius: 0;
  background: transparent; padding: .5rem 0 0; margin: 0;
}
.audiomini {
  display: flex; align-items: center; gap: .5rem;
  border-top: 1px solid var(--rule); padding-top: .4rem;
}
.audiomini input[type=range] { width: 8rem; accent-color: var(--seal); }
.audiomini b { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: .8rem; min-width: 2.4rem; }

/* The empty state is meant to be seen, not skimmed past: Juego opens here
   before anything is on the television, so it earns a real button rather
   than another link in a sentence. */
.scenepanel-empty { margin-bottom: .8rem; }
.scenepanel-empty button.primary { margin: .5rem 0 .2rem; }

/* ============================================================== EDITOR
   The scene editor: name, note, art and audio — nothing else. */
.escfields { display: grid; gap: .8rem; }
.escfields label { display: grid; gap: .2rem; font-size: .85rem; }
.escfields label input, .escfields label select, .escfields label textarea {
  font: inherit;
}
.escfields .row { display: flex; gap: .6rem; }
.escfields .row label { flex: 1 1 0; }
.escfields h3 { margin: .4rem 0 0; }
.escfields textarea { min-height: 4rem; resize: vertical; }
.escfields .tip { font-size: .8rem; color: var(--ink-soft); margin: -.4rem 0 0; }
.rosterpick { display: grid; gap: .35rem; }
.rprow { display: flex; align-items: center; gap: .5rem;
  padding: .4rem .55rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel-2); font-family: var(--serif); }
.rprow b { flex: 1 1 auto; }
.rosterlist { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }
.rosterlist li { display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  padding: .3rem .55rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel-2); font-size: .85rem; }

/* ================================================================ THE TV
   No grid in this window: the field is the television's, and the only thing
   left here is what feeds it. The panel hangs under the tabs from a header
   toggle, because you touch it at the start of a session and then forget it.
========================================================================= */

.tvpanel {
  max-width: 60rem; margin: .5rem auto 0; padding: 0 1rem;
}
.tvpanel .tvhint { font-size: .8rem; margin: .35rem 0 0; }

.fieldbar {
  display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
  padding: .5rem .6rem; margin-bottom: .4rem;
  border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel);
}
.fieldbar .spacer { flex: 1; }
.fieldbar label {
  display: flex; align-items: center; gap: .35rem;
  font-size: .74rem; color: var(--sepia); font-variant: small-caps; letter-spacing: .04em;
}
.fieldbar label b { font-variant: normal; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 3.2rem; }
.fieldbar input[type=number] {
  width: 4rem; min-height: 2.2rem; text-align: center; font-family: var(--serif); font-size: .95rem;
  background: var(--field); color: var(--ink); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: .2rem;
}
.fieldbar input[type=range] { width: 8rem; accent-color: var(--seal); }
.mapthumb {
  width: 5.5rem; height: 3.1rem; object-fit: cover; flex: none;
  border: 1px solid var(--sepia); border-radius: 2px;
}

header.top .actions button.on { border-color: var(--seal); color: var(--seal); }
.pausedbar {
  flex-basis: 100%; padding: .4rem .6rem;
  border: 1px solid var(--seal); border-radius: var(--radius);
  background: color-mix(in srgb, var(--seal) 10%, transparent);
  font-size: .82rem; color: var(--ink);
}

/* --------------------------------------------------------- picking cards
   Tick two or three and one number reaches all of them. The tick is its own
   target, well away from the name, so opening a sheet and marking a target
   are never the same gesture by accident. */
.cb .head { grid-template-columns: auto 1fr auto; }
.cb .head .who { cursor: pointer; }
.cb .head .caret { font-size: 1rem; color: var(--sepia); cursor: pointer; }
.cb.picked { border-color: var(--seal); border-width: 2px; padding: calc(.6rem - 1px) calc(.7rem - 1px); }

.tick {
  width: 1.6rem; height: 1.6rem; min-height: 0; padding: 0; flex: none;
  margin-top: .15rem; border-radius: 3px; line-height: 1;
  border: 1px solid var(--sepia); background: var(--field); color: var(--seal);
  font-size: .95rem; font-weight: 700;
}
.tick.on { background: var(--seal); border-color: var(--seal); color: #fdf6e6; }
/* The generic button:hover swaps in a light cream gradient, the same shade
   as the checkmark's own colour — invisible on invisible. A ticked box has
   to stay seal-on-cream under the cursor too, not just at rest. */
.tick.on:hover:not(:disabled) { background: var(--seal); border-color: var(--seal); color: #fdf6e6; }

.pickbar { flex-wrap: wrap; }
.pickbar .who {
  font-size: .82rem; font-variant: small-caps; letter-spacing: .04em; color: var(--seal);
  flex: 1 1 8rem; min-width: 0;
}
.pickbar .who .muted {
  display: block; font-variant: normal; letter-spacing: 0; font-size: .78rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pickbar input {
  flex: 0 1 7rem; min-width: 4rem; min-height: 2.5rem; text-align: center;
  font-family: var(--serif); font-size: 1rem; font-variant-numeric: tabular-nums;
  background: var(--field); color: var(--ink);
  border: 1px solid var(--sepia); border-radius: var(--radius); padding: .2rem .4rem;
}
.pickbar button { min-height: 2.5rem; }

/* ----------------------------------------------------- what the players see
   Next to the hit points it is about: both questions get asked the moment the
   thing walks into the room. */
.reveal {
  display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
  margin-top: .45rem; padding-top: .45rem; border-top: 1px dotted var(--rule);
}
.reveal.off { opacity: .7; }
.reveal label {
  display: flex; align-items: center; gap: .3rem;
  font-size: .72rem; color: var(--sepia); font-variant: small-caps; letter-spacing: .04em;
}
.reveal select {
  min-height: 2.2rem; font-size: .82rem; font-family: var(--serif); color: var(--ink);
  background: var(--field); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: .15rem .3rem;
}
.reveal select:disabled { opacity: .5; }

@media (min-width: 700px) {
  .tabs { padding: .6rem 1.5rem 0; }
  .board { grid-template-columns: 1fr; }
  .cb .head .who b { font-size: 1.15rem; }
  .tvpanel { padding: 0 1.5rem; }
  .pickbar .who { flex: 0 1 auto; }
}

/* Two real columns only once there is room for them; on a phone the sides
   stack, monsters under players, which is still the same reading order — and
   the field sits between them, where it does on every width. */
@media (min-width: 860px) {
  .sides { grid-template-columns: 1fr 1fr; gap: 1.8rem; align-items: start; }
  .sides .side { gap: .7rem; padding: .85rem .9rem; }
  /* At two columns the field cannot be between them without being a column
     itself, so it becomes the band above both rather than a stray third card
     in the bottom-left corner. */
  .sides .midboard { grid-column: 1 / -1; order: -1; }
  /* Centred and capped: full width here is a 16:9 band deep enough to push
     every card below the fold. */
  .sides .midboard .minifield { max-width: 34rem; margin: 0 auto; }
}

/* Three columns, and only now is the field literally between the two sides.
   It sticks under the header so it stays in view while a tall column of cards
   scrolls past it.

   The middle track is worth twice either side, because a compact card is a
   fixed handful of rows and stops getting better past about 20 rem, where the
   field goes on getting better as long as you feed it: more width is a bigger
   square, and a bigger square is a token you can tell apart and grab. The
   floors are what stop that argument going too far — 13 rem is a card that
   still reads, 21 rem a field still worth looking at. */
@media (min-width: 1180px) {
  .sides {
    grid-template-columns: minmax(13rem, 1fr) minmax(21rem, 2.1fr) minmax(13rem, 1fr);
    gap: 1.2rem;
  }
  .sides .midboard { grid-column: auto; order: 0; position: sticky; top: 4.8rem; }
  .sides .midboard .minifield { max-width: none; }
}

     read with FileReader like any other drop. It is how scenarios/ and
     assets/ are discovered. Chrome-only, like the rest of the television

const POINT_BUY_COST = Object.freeze({ 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 });
