# Ships the app to the Pi (https://dm.sigint-pm.uk) over a Tailscale SSH link.
#
# Vite emits two pages into dist/, and that plus server.py is the entire
# runtime set. No source, no node_modules and no Node reach the Pi — it runs
# `python3 server.py` and nothing else, which is why dm-app.service needs no
# change.
name: Deploy to Pi

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pi-dm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PI_HOST: sigint          # Tailscale MagicDNS name of the Pi
      PI_USER: sigint
      PI_DIR: /opt/dm-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The DM's own vault is private and is not here, so `*.vault.test.ts` is
      # skipped and vitest says so. What remains is the half that needs no
      # filesystem: the write-scope guard and the async shells, both against an
      # in-memory vault.
      - name: Tests
        run: npm test

      # `npm run build` runs tsc --noEmit first, so this is types + bundle.
      - name: Build
        run: npm run build

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Staged first, then mirrored with --delete, so the deployed tree is
      # *exactly* the runtime set: the two pages, their hashed assets, and the
      # host. That also clears out the previous app, whose index.html, src/ and
      # vendor/ are still sitting in $PI_DIR from the last deploy — inert under
      # the new server.py, which serves nothing but dist/, but no reason to
      # leave them there.
      # `--delay-updates` holds every transferred file aside and renames the
      # whole set into place at the end, and `--delete-after` waits until that
      # has happened before removing what the last build left. Without the
      # pair, the live server spends the transfer serving a half-swapped tree:
      # a fresh index.html naming hashed assets that have not landed, or whose
      # predecessors are already gone. That is a 404 on every asset, and it is
      # what a reload during a deploy actually hit.
      - name: Ship the build to the Pi
        run: |
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          cp -R dist /tmp/stage/dist
          cp server.py /tmp/stage/server.py
          rsync -a --delete --delete-after --delay-updates \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            /tmp/stage/ "$PI_USER@$PI_HOST:$PI_DIR/"

      # Both pages *and everything they name*. Curling / and /tv only proves
      # the html is there — it is a literal file on disk and answers 200 with
      # or without a single asset beside it, which is exactly how a build with
      # no reachable css shipped green.
      - name: Restart & smoke test
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" \
            'set -e
             sudo systemctl restart dm-app
             for i in $(seq 1 10); do
               curl -sf http://localhost:8085/api/ping >/dev/null && break
               sleep 1
             done
             curl -sf -o /dev/null http://localhost:8085/api/ping || {
               echo "dm-app: never came back up" >&2; exit 1; }
             for path in / /tv; do
               html=$(curl -sf "http://localhost:8085$path") || {
                 echo "dm-app: $path did not answer" >&2; exit 1; }
               assets=$(printf %s "$html" | grep -oE "/assets/[A-Za-z0-9._-]+" | sort -u)
               [ -n "$assets" ] || {
                 echo "dm-app: $path names no assets at all" >&2; exit 1; }
               for asset in $assets; do
                 curl -sf -o /dev/null "http://localhost:8085$asset" || {
                   echo "dm-app: $path names $asset, which is not being served" >&2
                   exit 1; }
               done
               echo "$path -> $(printf %s "$assets" | wc -w | tr -d " ") assets ok"
             done
             # A cacheable 404 is what turned one bad deploy into four hours of
             # blank page: the browser was told to keep the miss and stopped
             # asking. Errors must stay unstorable.
             curl -sI http://localhost:8085/assets/nope.css | grep -qi "cache-control: no-store" || {
               echo "dm-app: a 404 is cacheable again" >&2; exit 1; }
             # The property that makes public hosting safe, re-asserted on the
             # box: no route serves a campaign file, and POST does not exist.
             curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/vault/x | grep -qx 404 || {
               echo "dm-app: /vault/ answered something" >&2; exit 1; }
             curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8085/ | grep -qx 501 || {
               echo "dm-app: POST is implemented" >&2; exit 1; }
             echo ok'
