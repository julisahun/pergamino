# Ships dm/ to the Pi (https://dm.sigint-pm.uk) over a Tailscale SSH link.
# Nothing is built — dm/ is stdlib Python plus native ES modules, so the
# "artifact" is the source tree minus its dev-only files.
#
# creator/** is no longer a trigger: dm/src/rules/ is the app's own now, and
# the creator's export is one of the formats it reads rather than a sibling to
# stay byte-identical to. check-sync.py retired with that change.
name: Deploy dm to Pi

on:
  push:
    branches: [master]
    paths:
      - dm/**
      - .github/workflows/deploy-dm.yml
  workflow_dispatch:

concurrency:
  group: pi-dm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PI_HOST: sigint          # Tailscale MagicDNS name of the Pi
      PI_USER: sigint
      PI_DIR: /opt/dm-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24   # `node --test <glob>` and the model's syntax

      # The model, and the source lint that catches htm's unclosed void
      # elements — the bug whose symptom is a TypeError on the second render.
      - name: Tests
        run: node --test "dm/src/**/*.test.js"

      # Types are dev-only and emit nothing; the compiler is a machine tool,
      # not a repo dependency, which is why it is installed here rather than
      # committed as a package.json.
      - name: Types
        run: |
          npm i -g typescript
          tsc -p dm/jsconfig.json

      # The example campaign is the fixture the parsers promise to read. The
      # linter exits 1 for warnings and 2 for errors; only errors mean the app
      # would read something different from what the file says, so only errors
      # stop a deploy.
      - name: The example campaign still reads
        run: |
          node dm/check-campaign.js campaigns/example || \
            { [ $? -eq 1 ] && echo "warnings only — see above"; }

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # --delete-excluded so the deployed tree is exactly the runtime set:
      # Docs, tests, types and the verification pages never reach the Pi: the
      # deployed tree is exactly the runtime set.
      - name: Ship dm/ to the Pi
        run: |
          rsync -a --delete --delete-excluded \
            --exclude 'CLAUDE.md' \
            --exclude 'instructions.md' \
            --exclude 'importing.md' \
            --exclude 'check-campaign.js' \
            --exclude 'jsconfig.json' \
            --exclude 'probes' \
            --exclude '*.test.js' \
            --exclude '*.d.ts' \
            --exclude '*.d.mts' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            dm/ "$PI_USER@$PI_HOST:$PI_DIR/"

      - name: Restart & smoke test
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" \
            'sudo systemctl restart dm-app; for i in $(seq 1 10); do curl -sf http://localhost:8085/api/ping >/dev/null && { echo ok; exit 0; }; sleep 1; done; echo "dm-app failed to come up" >&2; exit 1'
