# Ships the app to the Pi (https://dm.sigint-pm.uk) over a Tailscale SSH link.
#
# Vite emits the pages into dist/ and esbuild bundles the server into one file,
# server/dist/index.mjs — `ws` and everything under shared/ inlined. That pair
# plus deploy/dm-app.service, is the entire runtime set: no source, no
# node_modules reach the Pi. It runs `node server/dist/index.mjs` under
# dm-app.service — the unit on the box is a `systemctl link` to the shipped
# file, so a change to it deploys like any other and takes effect on the
# `daemon-reload` before the restart — with DM_TOKEN, DM_DB and PUBLIC_URL in
# /opt/dm-app/.env.
#
# Two things on the Pi are never touched by this workflow: `.env`, and `data/`,
# where the SQLite database and its backups live. Both are excluded from the
# rsync — without that, `--delete` would take the database out with the
# previous build.
name: Deploy to Pi

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pi-dm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PI_HOST: sigint          # Tailscale MagicDNS name of the Pi
      PI_USER: sigint
      PI_DIR: /opt/dm-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The DM's own vault is private and is not here, so `*.vault.test.ts` is
      # skipped and vitest says so. What remains needs no filesystem: the pure
      # core, the write-scope guard, the async shells against an in-memory
      # vault, and the server against an in-memory database.
      - name: Tests
        run: npm test

      # `npm run build` runs tsc --noEmit first, so this is types + both bundles.
      - name: Build
        run: npm run build

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Staged first, then mirrored with --delete, so the deployed tree is
      # *exactly* the runtime set. `--delay-updates` holds every transferred
      # file aside and renames the whole set into place at the end, and
      # `--delete-after` waits until that has happened before removing what
      # the last build left — without the pair, the live server spends the
      # transfer serving a half-swapped tree. `--exclude` keeps the database
      # and the secrets out of the mirror's reach.
      - name: Ship the build to the Pi
        run: |
          rm -rf /tmp/stage && mkdir -p /tmp/stage/server/dist
          cp -R dist /tmp/stage/dist
          cp server/dist/index.mjs /tmp/stage/server/dist/index.mjs
          cp -R deploy /tmp/stage/deploy
          cp package.json /tmp/stage/package.json
          rsync -a --delete --delete-after --delay-updates \
            --exclude 'data/' --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            /tmp/stage/ "$PI_USER@$PI_HOST:$PI_DIR/"

      # The pages *and everything they name*; the cache headers that once cost
      # four hours of blank page; and the properties that make public hosting
      # safe, re-asserted on the box: no route serves a campaign file, nothing
      # under /api/dm/ answers without the token, an unknown link is a 404,
      # and the database survived the deploy.
      - name: Restart & smoke test
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" \
            'set -e
             node --version
             sudo systemctl daemon-reload
             sudo systemctl restart dm-app
             for i in $(seq 1 15); do
               curl -sf http://localhost:8085/api/ping >/dev/null && break
               sleep 1
             done
             curl -sf http://localhost:8085/api/ping || {
               echo "dm-app: never came back up" >&2; exit 1; }
             for path in / /tv /pj; do
               html=$(curl -sf "http://localhost:8085$path") || {
                 echo "dm-app: $path did not answer" >&2; exit 1; }
               assets=$(printf %s "$html" | grep -oE "/assets/[A-Za-z0-9._-]+" | sort -u)
               [ -n "$assets" ] || {
                 echo "dm-app: $path names no assets at all" >&2; exit 1; }
               for asset in $assets; do
                 curl -sf -o /dev/null "http://localhost:8085$asset" || {
                   echo "dm-app: $path names $asset, which is not being served" >&2
                   exit 1; }
               done
               echo "$path -> $(printf %s "$assets" | wc -w | tr -d " ") assets ok"
             done
             curl -sI http://localhost:8085/assets/nope.css | grep -qi "cache-control: no-store" || {
               echo "dm-app: a 404 is cacheable again" >&2; exit 1; }
             curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/vault/x | grep -qx 404 || {
               echo "dm-app: /vault/ answered something" >&2; exit 1; }
             curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8085/ | grep -qx 404 || {
               echo "dm-app: POST / answered something" >&2; exit 1; }
             curl -s -o /dev/null -w "%{http_code}" -X POST -d "{}" http://localhost:8085/api/dm/campaigns | grep -qx 401 || {
               echo "dm-app: the DM surface answers without a token" >&2; exit 1; }
             curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/api/pj/nope | grep -qx 404 || {
               echo "dm-app: an unknown link answered" >&2; exit 1; }
             test -f /opt/dm-app/data/dm.sqlite || {
               echo "dm-app: no database after the deploy" >&2; exit 1; }
             ls -la /opt/dm-app/data
             echo ok'
