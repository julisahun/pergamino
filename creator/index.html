function cards(kind, table, current) {
  return `<div class="cards">${Object.entries(table).map(([key, v]) =>
    `<button class="card" data-pick="${kind}" data-value="${key}" aria-pressed="${current === key}">
      <span class="name">${esc(v.es)}</span>
      <span class="why">${esc(v.why || v.d || '')}</span>
    </button>`).join('')}</div>`;
}

/** Checkbox list bound to an array on the state, with a hard cap. */
function checkList(field, options, max, disabledMap = new Map()) {
  const chosen = state[field] || [];
  return `<div class="opts">${options.map(o => {
    const on = chosen.includes(o.value);
    const blockedBy = disabledMap.get(o.value);
    const full = chosen.length >= max && !on;
    return `<label class="opt ${blockedBy || full ? 'off' : ''}">
      <input type="checkbox" data-toggle="${field}" data-value="${esc(o.value)}" data-max="${max}"
        ${on ? 'checked' : ''} ${blockedBy || full ? 'disabled' : ''}>
      <span>${esc(o.label)}${blockedBy ? ` <span class="tag">ya la da ${esc(blockedBy)}</span>` : ''}</span>
    </label>`;
  }).join('')}</div>`;
}

function counterLine(n, max, noun) {
  return `<p class="counter ${n > max ? 'over' : ''}">Elegidas <b>${n}</b> de ${max} ${noun}.</p>`;
}

const skillOptions = keys => keys.map(k => ({ value: k, label: `${skill(k).es} (${skill(k).en}) · ${skill(k).ability}` }));

/* -- 2. Especie ----------------------------------------------------------- */
STEP_VIEWS.especie = () => {
  const sp = SPECIES[state.species];
  let out = `<h2>Especie</h2>
    <p class="lead">De qué pueblo vienes. En las reglas de 2024 la especie <b>no</b> da bonos a las
    puntuaciones: eso lo hace el trasfondo.</p>
    <details class="help"><summary>¿Qué cambia según la especie?</summary><div>
      <p>La velocidad, el tamaño, si ves en la oscuridad y dos o tres rasgos especiales. Nada más.
      Ninguna especie es mejor para ninguna clase: elige la que te apetezca interpretar.</p>
    </div></details>
    ${cards('species', SPECIES, state.species)}`;

  if (!sp) return out + noticesFor('especie');

  if (sp.lineages) {
    out += `<fieldset><legend>Linaje de ${esc(sp.es)}</legend>
      ${cards('lineage', sp.lineages, state.lineage)}</fieldset>`;
  }
  if (sp.size.length > 1) {
    out += `<fieldset><legend>Tamaño</legend><div class="opts">${sp.size.map(s =>
      `<label class="opt"><input type="radio" name="size" data-set="size" data-value="${esc(s)}"
        ${state.size === s ? 'checked' : ''}><span>${esc(s)}</span></label>`).join('')}</div></fieldset>`;
  }
  if (sp.grants?.skills) {
    const granted = grantedSkillSources(state);
    const pool = sp.grants.skillsFrom ? sp.grants.skillsFrom : SKILLS.map(s => s.key);
    const blocked = new Map();
    for (const [k, src] of granted) if (!(state.speciesSkills || []).includes(k)) blocked.set(k, src);
    out += `<fieldset><legend>Habilidad de ${esc(sp.es)}</legend>
      ${counterLine((state.speciesSkills || []).length, sp.grants.skills, 'habilidades')}
      ${checkList('speciesSkills', skillOptions(pool), sp.grants.skills, blocked)}</fieldset>`;
  }
  if (sp.grants?.originFeat) {
    out += `<fieldset><legend>Dote de origen extra de ${esc(sp.es)}</legend>
      <p class="lead">El humano lleva una dote de origen además de la del trasfondo.</p>
      ${cards('extraFeat', ORIGIN_FEATS, state.extraFeat)}</fieldset>`;
  }

  out += `<fieldset><legend>Rasgos que ganas</legend>
    ${sp.traits.map(t => `<p><b>${esc(t.n)}.</b> ${esc(t.d)}</p>`).join('')}
    ${(sp.lineages?.[state.lineage]?.traits || []).map(t => `<p><b>${esc(t.n)}.</b> ${esc(t.d)}</p>`).join('')}
  </fieldset>`;

  return out + noticesFor('especie');
};

/* -- 3. Clase ------------------------------------------------------------- */
STEP_VIEWS.clase = () => {
  const cls = CLASSES[state.class];
  let out = `<h2>Clase</h2>
    <p class="lead">Qué sabes hacer. Es la decisión que más cambia cómo se juega el personaje.</p>
    <details class="help"><summary>¿Cómo elijo?</summary><div>
      <p>A nivel 1 no hay subclase todavía: llega al nivel 3, así que no tienes que decidirla ahora.</p>
      <p>Si es tu primera partida, <b>Guerrero</b>, <b>Bárbaro</b> y <b>Pícaro</b> son los más
      sencillos de llevar en mesa; <b>Mago</b> y <b>Druida</b> son los que más opciones piden por turno.</p>
    </div></details>
    ${cards('class', CLASSES, state.class)}`;

  if (!cls) return out + noticesFor('clase');

  const prof = proficiencies(state);
  out += `<fieldset><legend>Lo que te da ${esc(cls.es)}</legend>
    <div style="font-size:.92rem">
      <p><b>Dado de golpe:</b> 1d${cls.hitDie} · <b>Salvaciones:</b> ${cls.saves.map(s => byKey(ABILITIES, s).es).join(' y ')}</p>
      <p><b>Armaduras:</b> ${esc(prof.armor.join(', ') || 'ninguna')}<br>
         <b>Armas:</b> ${esc(prof.weapons.join(', '))}
         ${cls.tools ? `<br><b>Herramientas:</b> ${esc(cls.tools)}` : ''}</p>
      ${cls.features.map(f => `<p><b>${esc(f.n)}.</b> ${esc(f.d)}</p>`).join('')}
    </div></fieldset>`;

  if (cls.features.some(f => f.choice === 'fightingStyle')) {
    out += `<fieldset><legend>Estilo de combate</legend>
      ${cards('fightingStyle', FIGHTING_STYLES, state.fightingStyle)}</fieldset>`;
  }
  if (cls.features.some(f => f.choice === 'divineOrder')) {
    out += `<fieldset><legend>Orden divina</legend>
      ${cards('divineOrder', DIVINE_ORDERS, state.divineOrder)}</fieldset>`;
  }
  if (cls.features.some(f => f.choice === 'primalOrder')) {
    out += `<fieldset><legend>Orden primigenia</legend>
      ${cards('primalOrder', PRIMAL_ORDERS, state.primalOrder)}</fieldset>`;
  }

  if (cls.mastery) {
    const pool = WEAPONS.filter(w => proficientWithWeapon(state, w));
    out += `<fieldset><legend>Armas con maestría</legend>
      <details class="help" open><summary>¿Qué es la maestría?</summary><div>
        <p>Nueva en 2024: cada arma tiene un truco propio (derribar, empujar, hostigar…) y tu clase
        te deja usar el de unas cuantas. Elige las armas que de verdad vas a llevar.</p>
      </div></details>
      ${counterLine((state.masteries || []).length, cls.mastery.n, 'armas')}
      ${checkList('masteries', pool.map(w => ({
        value: w.key,
        label: `${w.es} — ${w.dmg} ${DAMAGE_TYPES[w.type]} · ${MASTERIES[w.mastery].es} (${MASTERIES[w.mastery].en}): ${MASTERIES[w.mastery].d}`,
      })), cls.mastery.n)}</fieldset>`;
  }

  return out + noticesFor('clase');
};

/* -- Cuestionario ---------------------------------------------------------
   Fourteen situations, one screen. Answering them all reveals the proposal at
   the bottom; applying it writes to the state, and every later step still
   works exactly as it did, so anything can be changed by hand afterwards. */
/**
 * One question, one screen. The first one carries the explanation so the
 * player knows what the answers are for; the rest are just the situation.
 */
function quizQuestionView(index) {
  const q = QUIZ[index];
  const chosen = state.quiz?.answers?.[q.id];
  const cls = CLASSES[state.class];

  return `
    ${index === 0 ? `<h2>Cuéntame quién es</h2>
      <p class="lead">Catorce situaciones, una por pantalla. Contesta lo que <b>haría tu
      personaje</b>, no lo que sea mejor jugada: de aquí salen su trasfondo, sus puntuaciones,
      sus habilidades, su equipo y sus conjuros. Después podrás cambiarlo todo.</p>
      ${!cls ? `<div class="notice warn">Elige antes una clase: el cuestionario la necesita
        para repartir los puntos y el equipo.</div>` : ''}` : ''}

    <p class="situation-big">${esc(q.text)}</p>
    <div class="quiz-answers">
      ${q.options.map((o, oi) => `
        <button class="answer" data-quiz="${esc(q.id)}" data-value="${oi}"
          aria-pressed="${chosen === oi}">
          <span class="letter">${'ABCD'[oi]}</span>
          <span>${esc(o.es)}</span>
        </button>`).join('')}
    </div>
    ${chosen != null
      ? `<p class="muted" style="font-size:.85rem">Puedes cambiar la respuesta o seguir.</p>`
      : `<p class="muted" style="font-size:.85rem">Si ninguna te encaja, pasa de largo:
         con doce respuestas de catorce sale igual de bien.</p>`}`;
}

/* The proposal, on its own screen right after the last question. */
STEP_VIEWS.resultado = () => {
  const answers = state.quiz?.answers || {};
  const done = quizAnswered(answers);
  const r = quizResult(state);

  if (!r) {
    return `<h2>Resultado</h2>
      <p class="lead">Has contestado <b>${done}</b> de ${QUIZ.length}. Necesito las catorce para
      proponerte un personaje completo.</p>
      <div class="notice warn">Vuelve atrás y contesta las que falten, o sigue adelante y
      elige el trasfondo, las puntuaciones y el resto a mano en los pasos siguientes.</div>`;
  }
  return `<h2>Esto es lo que sale</h2>
    <p class="lead">De tus catorce respuestas.</p>
    ${quizResultHTML(r)}
    <p><button class="ghost small" data-quiz-reset="1">Borrar respuestas y volver a empezar</button></p>`;
};

/* Final screen of the wizard. */
STEP_VIEWS.listo = () => {
  const errors = validate(state).filter(n => n.level === 'error');
  return `<h2>Listo</h2>
    ${errors.length
      ? `<p class="lead">El personaje se guarda igual, pero queda esto por decidir:</p>
         <div class="notice warn"><ul style="margin:0;padding-left:1.1rem">${errors.map(n =>
           `<li><button class="link" data-step="${esc(n.step)}">${esc(n.text)}</button></li>`).join('')}</ul></div>`
      : `<div class="notice ok">El personaje está completo y es legal.</div>
         <p class="lead">Guárdalo y ya puedes imprimirlo o mandárselo a tu DM.</p>`}
    <p class="muted" style="font-size:.9rem">Al guardar aparecerá en la lista de fichas, y desde
    ahí podrás verlo, editarlo, imprimirlo o descargarlo como <code>.json</code>.</p>`;
};

/** The proposal screen: what came out, and one button to apply it. */
function quizResultHTML(r) {
  const bg = BACKGROUNDS[r.background];
  const cls = CLASSES[state.class];
  const final = { ...r.buy };
  for (const [k, v] of Object.entries(r.boosts)) final[k] += v;

  const row = (label, value) => `<tr><td style="white-space:nowrap;padding-right:1rem"><b>${esc(label)}</b></td><td>${value}</td></tr>`;

  return `<fieldset class="result"><legend>La propuesta</legend>
    <p class="lead">Un personaje jugable y legal. Aplícalo y revísalo paso a paso, o cambia lo
    que quieras: los pasos siguientes siguen funcionando igual.</p>

    <table style="width:100%;border-collapse:collapse;font-size:.93rem">
      ${row('Trasfondo', `${esc(bg?.es || '—')} <span class="muted">— ${esc(bg?.why || '')}</span>`)}
      ${row('Dote de origen', esc(ORIGIN_FEATS[bg?.feat]?.es || '—'))}
      ${row('Puntuaciones', ABILITIES.map(a =>
        `${a.es.slice(0, 3)} <b>${final[a.key]}</b>${r.boosts[a.key] ? `<span class="muted">(+${r.boosts[a.key]})</span>` : ''}`).join(' · '))}
      ${row('Habilidades de clase', r.classSkills.length
        ? r.classSkills.map(k => esc(skill(k).es)).join(', ') : '—')}
      ${r.expertise.length ? row('Experticia', r.expertise.map(k => esc(skill(k).es)).join(', ')) : ''}
      ${row('Forma de pelear', `${esc(KIT_STYLES[r.style])}`)}
      ${row('Equipo', esc(cls?.equipment?.[r.equipmentClass]?.label || '—'))}
      ${r.masteries.length ? row('Armas con maestría',
        r.masteries.map(k => esc(weapon(k).es)).join(', ')) : ''}
      ${r.fightingStyle ? row('Estilo de combate', esc(FIGHTING_STYLES[r.fightingStyle].es)) : ''}
      ${r.divineOrder ? row('Orden divina', esc(DIVINE_ORDERS[r.divineOrder].es)) : ''}
      ${r.primalOrder ? row('Orden primigenia', esc(PRIMAL_ORDERS[r.primalOrder].es)) : ''}
      ${r.spells.cantrips.length ? row('Trucos',
        r.spells.cantrips.map(en => esc(spellByEn(en)?.es || en)).join(', ')) : ''}
      ${r.spells.level1.length ? row('Conjuros de nivel 1',
        r.spells.level1.map(en => esc(spellByEn(en)?.es || en)).join(', ')) : ''}
      ${row('Tono', r.tones.map(t => `<b>${esc(TONES[t].es)}</b>`).join(' · ') +
        `<br><span class="muted">${esc(TONES[r.tones[0]]?.d || '')}</span>`)}
    </table>

    <p style="margin-top:1rem">
      <button class="primary" data-quiz-apply="1">Aplicar y revisar →</button>
      ${state.quiz?.applied ? '<span class="muted" style="margin-left:.6rem">Ya aplicado. Volver a aplicar sobrescribe lo que hayas cambiado a mano.</span>' : ''}
    </p>
  </fieldset>`;
}

/* -- 4. Trasfondo --------------------------------------------------------- */
STEP_VIEWS.trasfondo = () => {
  const bg = BACKGROUNDS[state.background];
  let out = `<h2>Trasfondo</h2>
    <p class="lead">Qué hacías antes de esto. En 2024 el trasfondo es lo que sube tus puntuaciones
    y te da una dote de origen, así que pesa más que en ediciones anteriores.</p>
    ${cards('background', BACKGROUNDS, state.background)}`;

  if (!bg) return out + noticesFor('trasfondo');

  const feat = ORIGIN_FEATS[bg.feat];
  const spent = Object.values(state.boosts || {}).reduce((a, b) => a + b, 0);

  out += `<fieldset><legend>Mejoras de puntuación</legend>
    <details class="help" open><summary>Cómo funciona</summary><div>
      <p>Reparte <b>+2 y +1</b> entre dos de estas tres, o <b>+1 a cada una</b>. Se suman después
      de la compra de puntos, así que una puntuación puede acabar en 17.</p>
    </div></details>
    <div class="opts">${bg.abilities.map(k => {
      const a = byKey(ABILITIES, k);
      const cur = state.boosts?.[k] || 0;
      return `<div class="opt"><span style="min-width:9rem"><b>${esc(a.es)}</b> <span class="muted">(${a.en})</span></span>
        ${[0, 1, 2].map(v => `<label style="margin-right:.6rem"><input type="radio" name="boost-${k}"
          data-boost="${k}" data-value="${v}" ${cur === v ? 'checked' : ''}> ${v ? '+' + v : '—'}</label>`).join('')}
      </div>`;
    }).join('')}</div>
    <p class="counter ${spent !== 3 ? 'over' : ''}">Repartido <b>${spent}</b> de 3. Válido: +2/+1 o +1/+1/+1.</p>
    ${spent === 3 && !Object.values(state.boosts).includes(2) && Object.values(state.boosts).filter(v => v === 1).length !== 3
      ? '<div class="notice warn">Ese reparto no es legal: tiene que ser +2/+1 o +1/+1/+1.</div>' : ''}
  </fieldset>

  <fieldset><legend>Lo que te da ${esc(bg.es)}</legend>
    <p><b>Habilidades:</b> ${bg.skills.map(s => `${skill(s).es} (${skill(s).en})`).join(', ')}</p>
    <p><b>Herramienta:</b> ${esc(bg.tool.label)}</p>
    <p><b>Dote de origen — ${esc(feat.es)} (${esc(feat.en)}).</b> ${esc(feat.d)}</p>
  </fieldset>`;

  out += featToolPicker(feat, bg.feat);
  return out + noticesFor('trasfondo');
};

/** Crafter and Musician each need three tool picks; the rest need nothing. */
function featToolPicker(feat, key) {
  const h = feat?.hooks?.toolChoices;
  if (!h) return '';
  const pool = h.from === 'instruments' ? INSTRUMENTS : ARTISAN_TOOLS;
  return `<fieldset><legend>Herramientas de ${esc(feat.es)}</legend>
    ${counterLine((state.featTools || []).length, h.n, 'herramientas')}
    ${checkList('featTools', pool.map(t => ({ value: t, label: t })), h.n)}</fieldset>`;
}

/* -- 5. Puntuaciones ------------------------------------------------------ */
STEP_VIEWS.puntos = () => {
  const spent = buySpent(state.buy);
  const left = POINT_BUY_TOTAL - spent;
  const final = finalScores(state);
  const m = mods(final);
  const cls = CLASSES[state.class];

  return `<h2>Puntuaciones</h2>
    <p class="lead">Compra de puntos: <b>27 puntos</b> para repartir. Nadie tira dados, así que
    los tres personajes empiezan igual de sólidos.</p>
    <details class="help" open><summary>Qué mide cada una</summary><div>
      <p><b>Fuerza</b> golpear y cargar · <b>Destreza</b> puntería, sigilo y esquivar ·
      <b>Constitución</b> aguante y puntos de golpe · <b>Inteligencia</b> saber y deducir ·
      <b>Sabiduría</b> percibir y resistir la mente · <b>Carisma</b> tratar con gente.</p>
      <p>El <b>modificador</b> es lo que sumas a las tiradas. Sube de dos en dos: 12→+1, 14→+2, 16→+3.
      Un 15 y un 14 valen lo mismo en la práctica que un 14 y un 14, así que no dejes puntos sin gastar.</p>
      ${cls ? `<p>Para <b>${esc(cls.es)}</b> interesa sobre todo
        ${cls.primary.map(k => byKey(ABILITIES, k).es).join(' o ')}, y Constitución siempre ayuda.</p>` : ''}
    </div></details>

    <p class="counter ${left < 0 ? 'over' : ''}">Puntos gastados <b>${spent}</b> de ${POINT_BUY_TOTAL}
      · quedan <b>${left}</b></p>

    <div class="buyrows">${ABILITIES.map(a => {
      const buy = state.buy[a.key];
      const bonus = state.boosts?.[a.key] || 0;
      const canUp = buy < 15 && buyCost(buy + 1) - buyCost(buy) <= left;
      return `<div class="buyrow">
        <div class="nm">${esc(a.es)}<span class="muted"> (${a.en})</span>
          <span class="brk">compra ${buy}${bonus ? ` · trasfondo +${bonus}` : ''}</span></div>
        <div class="ctl">
          <button data-buy="${a.key}" data-delta="-1" ${buy <= 8 ? 'disabled' : ''} aria-label="Bajar ${esc(a.es)}">−</button>
          <button data-buy="${a.key}" data-delta="1" ${canUp ? '' : 'disabled'} aria-label="Subir ${esc(a.es)}">+</button>
        </div>
        <div class="out"><b>${final[a.key]}</b><span>${signed(m[a.key])}</span></div>
      </div>`;
    }).join('')}</div>
    <p><button class="ghost" data-buyreset="1">Reiniciar reparto</button></p>
    ${noticesFor('puntos')}`;
};

/* -- 6. Habilidades ------------------------------------------------------- */
STEP_VIEWS.habilidades = () => {
  const cls = CLASSES[state.class];
  if (!cls) return `<h2>Habilidades</h2><div class="notice warn">Elige antes una clase.</div>`;

  const granted = grantedSkillSources(state);
  const blocked = new Map();
  for (const [k, src] of granted) if (!(state.classSkills || []).includes(k)) blocked.set(k, src);

  let out = `<h2>Habilidades</h2>
    <p class="lead">Lo que se te da bien. Tener competencia suma <b>+2</b> a esa tirada.</p>
    <details class="help"><summary>¿Y si una habilidad me la dan dos veces?</summary><div>
      <p>No se acumula: si tu trasfondo ya te da Sigilo, la lista de la clase te la marca como
      cogida y eliges otra. Está resuelto automáticamente aquí abajo.</p>
    </div></details>`;

  if (granted.size) {
    out += `<fieldset><legend>Ya las tienes</legend><div class="opts">${
      [...granted].map(([k, src]) => `<div class="opt"><span>● ${esc(skill(k).es)}
        <span class="tag">${esc(src)}</span></span></div>`).join('')}</div></fieldset>`;
  }

  out += `<fieldset><legend>Habilidades de ${esc(cls.es)}</legend>
    ${counterLine((state.classSkills || []).length, cls.skills.n, 'habilidades')}
    ${checkList('classSkills', skillOptions(cls.skills.from), cls.skills.n, blocked)}</fieldset>`;

  const skilled = state.extraFeat === 'instruido' || BACKGROUNDS[state.background]?.feat === 'instruido';
  if (skilled) {
    const all = new Map(blocked);
    for (const k of (state.classSkills || [])) all.set(k, CLASSES[state.class].es);
    out += `<fieldset><legend>Habilidades de la dote Instruido</legend>
      ${counterLine((state.featSkills || []).length, 3, 'habilidades')}
      ${checkList('featSkills', skillOptions(SKILLS.map(s => s.key)), 3, all)}</fieldset>`;
  }

  if (cls.expertise) {
    const { prof } = skillProficiencies(state);
    out += `<fieldset><legend>Experticia</legend>
      <p class="lead">Dobla el bonificador de competencia: en vez de +2 sumas +4.
      Solo entre las habilidades en las que ya tienes competencia.</p>
      ${counterLine((state.expertise || []).length, cls.expertise.n, 'habilidades')}
      ${prof.size
        ? checkList('expertise', skillOptions([...prof]), cls.expertise.n)
        : '<div class="notice warn">Elige primero las habilidades de arriba.</div>'}</fieldset>`;
  }

  return out + noticesFor('habilidades');
};

/* -- 7. Equipo ------------------------------------------------------------ */
STEP_VIEWS.equipo = () => {
  const cls = CLASSES[state.class];
  const bg = BACKGROUNDS[state.background];
  if (!cls || !bg) return `<h2>Equipo</h2><div class="notice warn">Elige antes clase y trasfondo.</div>`;

  const kit = loadout(state);
  const a = armor(kit.armor);

  const packs = (table, field, current) => `<div class="opts">${Object.entries(table).map(([key, p]) => {
    const sub = [...p.items, p.gp ? `${p.gp} po` : ''].filter(Boolean).join(' · ');
    /* The gold-only option's contents ARE its label; repeating "50 po" under
       "50 po" read like a bug, so it explains itself instead. */
    const detail = sub && sub !== p.label ? sub : 'Solo el oro: tú eliges qué comprar con él.';
    return `<label class="opt"><input type="radio" name="${field}" data-set="${field}" data-value="${key}"
      ${current === key ? 'checked' : ''}>
      <span><b>${esc(p.label || key)}</b><br><span class="muted" style="font-size:.88em">${
        esc(detail)}</span></span></label>`;
  }).join('')}</div>`;

  return `<h2>Equipo</h2>
    <p class="lead">Con qué empiezas. Cada opción está ya equilibrada: coge la que encaje con
    cómo quieres jugar, no la que "suma más".</p>
    <fieldset><legend>Paquete de ${esc(cls.es)}</legend>
      ${packs(cls.equipment, 'equipmentClass', state.equipmentClass)}</fieldset>
    <fieldset><legend>Paquete de ${esc(bg.es)}</legend>
      ${packs(bg.equipment, 'equipmentBackground', state.equipmentBackground)}</fieldset>
    <fieldset><legend>Lo que sale de ahí</legend>
      <p><b>Armadura:</b> ${esc(a.es)}${kit.shield ? ' + escudo' : ''} → <b>CA ${derive(state).ca}</b></p>
      <p><b>Armas:</b> ${kit.weapons.length ? kit.weapons.map(w => esc(weapon(w).es)).join(', ') : '—'}</p>
      <p><b>Monedas:</b> ${kit.gp} po</p>
    </fieldset>
    ${noticesFor('equipo')}`;
};

/* -- 8. Conjuros ---------------------------------------------------------- */

/** One selectable spell row: name, mechanical line, and the short summary. */
function spellOption(sp) {
  const bits = [sp.school, sp.time, sp.range, sp.dur];
  if (sp.conc) bits.push('concentración');
  if (sp.rit) bits.push('ritual');
  return {
    value: sp.en,
    label: `${sp.es} (${sp.en}) — ${bits.join(' · ')}\n${sp.sum}`,
  };
}

/** Checkbox list for spells: same contract as checkList but two-line labels. */
function spellList_UI(field, list, max, path) {
  const chosen = path ? (state.magicInitiate?.[field] || []) : (state.spells?.[field] || []);
  return `<div class="opts">${list.map(sp => {
    const on = chosen.includes(sp.en);
    const full = chosen.length >= max && !on;
    const attr = path ? `data-mi-toggle="${field}"` : `data-spell-toggle="${field}"`;
    return `<label class="opt ${full ? 'off' : ''}">
      <input type="checkbox" ${attr} data-value="${esc(sp.en)}" data-max="${max}"
        ${on ? 'checked' : ''} ${full ? 'disabled' : ''}>
      <span><b>${esc(sp.es)}</b> <span class="muted" style="font-size:.85em">(${esc(sp.en)})</span>
        <br><span class="tag">${esc(sp.school)}</span>
        <span class="muted" style="font-size:.82em">${esc([sp.time, sp.range, sp.dur,
          sp.conc ? 'concentración' : null, sp.rit ? 'ritual' : null].filter(Boolean).join(' · '))}</span>
        <br><span style="font-size:.9em">${esc(sp.sum)}</span></span>
    </label>`;
  }).join('')}</div>`;
}

STEP_VIEWS.conjuros = () => {
  const d = derive(state);
  const cls = CLASSES[state.class];
  const c = cls?.casting;
  let out = `<h2>Conjuros</h2>
    <p class="lead">Lo que puedes lanzar a nivel 1. Cada entrada trae ya el resumen: no hace
    falta abrir el libro en mesa.</p>`;

  if (c) {
    out += `<fieldset><legend>Tus números</legend>
      <p><b>Característica de lanzamiento:</b> ${esc(d.casting.abilityName)}<br>
         <b>CD de tus conjuros:</b> ${d.casting.dc} — es el número que tienen que superar tus enemigos<br>
         <b>Ataque de conjuro:</b> ${signed(d.casting.attack)} — lo que sumas cuando el conjuro pide tirada de ataque<br>
         <b>Espacios de nivel 1:</b> ${d.casting.slots}</p>
      ${c.note ? `<div class="notice">${esc(c.note)}</div>` : ''}
    </fieldset>`;

    if (c.cantrips > 0) {
      const list = spellList(state.class, 0);
      out += `<fieldset><legend>Trucos</legend>
        <details class="help" open><summary>¿Qué es un truco?</summary><div>
          <p>Un conjuro que puedes lanzar <b>todas las veces que quieras</b>, sin gastar espacios.
          Es tu ataque o tu utilidad de siempre: elige al menos uno que haga daño.</p>
        </div></details>
        ${counterLine((state.spells?.cantrips || []).length, c.cantrips, 'trucos')}
        ${spellList_UI('cantrips', list, c.cantrips)}</fieldset>`;
    }

    const wantLevel1 = c.book ?? c.prepared ?? c.known ?? 0;
    if (wantLevel1 > 0) {
      const list = spellList(state.class, 1);
      const label = c.book ? `Conjuros del libro (${c.book})`
        : c.known != null ? `Conjuros conocidos (${c.known})`
        : `Conjuros preparados (${c.prepared})`;
      out += `<fieldset><legend>${esc(label)}</legend>
        <details class="help" open><summary>Espacios, preparados y conocidos</summary><div>
          <p>Tienes <b>${c.slots} espacio(s) de nivel 1</b>: eso es cuántos conjuros puedes lanzar
          antes de descansar, no cuántos sabes.</p>
          ${c.book ? `<p>Tu libro empieza con ${c.book} conjuros; de ellos preparas
            ${c.prepared} cada mañana. Aquí eliges los del libro.</p>` : ''}
        </div></details>
        ${counterLine((state.spells?.level1 || []).length, wantLevel1, 'conjuros')}
        ${spellList_UI('level1', list, wantLevel1)}</fieldset>`;
    }
  }

  // Species and lineage cantrips are fixed, so they are shown, not chosen.
  const fixed = d.extraSpells.filter(s => !s.from.startsWith('Iniciado'));
  if (fixed.length) {
    out += `<fieldset><legend>Conjuros que ya traes</legend>
      ${fixed.map(src => `<p><b>${esc(src.from)}:</b> ${
        [...src.cantrips, ...src.level1].map(en => {
          const sp = spellByEn(en);
          return sp ? `${esc(sp.es)} <span class="muted">(${esc(sp.en)})</span>` : esc(en);
        }).join(', ')}</p>`).join('')}
      <p class="muted" style="font-size:.88em">Estos no gastan espacios de conjuro
      y salen impresos en la hoja con su descripción.</p>
    </fieldset>`;
  }

  // Magic Initiate: pick a list, then two cantrips and one level-1 spell from it.
  const mi = magicInitiateFeat(state);
  if (mi) {
    out += `<fieldset><legend>Iniciado en la magia</legend>
      <p class="lead">Tu dote de origen te da dos trucos y un conjuro de nivel 1 de una lista.
      El de nivel 1 lo lanzas una vez por descanso largo sin gastar espacio.</p>
      <div class="opts">${Object.entries(MAGIC_INITIATE_LISTS).map(([key, v]) =>
        `<label class="opt"><input type="radio" name="mi-list" data-mi-list="${key}"
          ${mi.list === key ? 'checked' : ''}>
          <span><b>${esc(v.es)}</b> <span class="muted">— lanzas con ${
            esc(byKey(ABILITIES, v.ability).es)}</span></span></label>`).join('')}</div>`;
    if (mi.list) {
      out += `<h3 style="font-size:1rem;margin:1rem 0 .3rem">Dos trucos</h3>
        ${counterLine((mi.cantrips || []).length, 2, 'trucos')}
        ${spellList_UI('cantrips', spellList(mi.list, 0), 2, 'mi')}
        <h3 style="font-size:1rem;margin:1rem 0 .3rem">Un conjuro de nivel 1</h3>
        <div class="opts">${spellList(mi.list, 1).map(sp =>
          `<label class="opt"><input type="radio" name="mi-l1" data-mi-level1="${esc(sp.en)}"
            ${mi.level1 === sp.en ? 'checked' : ''}>
            <span><b>${esc(sp.es)}</b> <span class="muted" style="font-size:.85em">(${esc(sp.en)})</span>
            <br><span style="font-size:.9em">${esc(sp.sum)}</span></span></label>`).join('')}</div>`;
    }
    out += `</fieldset>`;
  }

  return out + noticesFor('conjuros');
};

/**
 * Story suggestions from the questionnaire's top tones. Clicking one drops the
 * line into the field: a starting point to rewrite, not a decision.
 */
function storySuggestions(field) {
  const tones = quizResult(state)?.tones || [];
  const lines = tones.map(t => [t, TONE_STORY[t]?.[field]]).filter(([, l]) => l);
  if (!lines.length) return '';
  return `<div class="suggest"><span class="tag">Del cuestionario:</span>${
    lines.map(([tone, line]) =>
      `<button data-suggest="story.${field}" data-line="${esc(line)}"
        title="Tono: ${esc(TONES[tone].es)}">${esc(line)}</button>`).join('')}</div>`;
}

/* ------------------------------------------------------------- ornaments
   Line art for the printed sheet, as inline SVG stroked in `currentColor`.
   This is a constraint, not a flourish for its own sake: Chrome will not print
   background graphics unless the player finds the checkbox in the print
   dialog, so anything drawn with a gradient or a background-image is simply
   missing from most people's paper. Text, borders and inline SVG always
   survive, which is the whole vocabulary these ornaments are built from.

   The curls match the headings they sit under, so the typographic voice
   extends to the drawing rather than stopping at the type. */
const ORN = {
  /** Divider under the character's name. */
  flourish() {
    const line = 'stroke-width=".9"';
    return svg('0 0 240 16',
      `<path d="M2 8 H86" ${line}/><path d="M154 8 H238" ${line}/>
       <path d="M86 8 c10 0 8-6 16-6 c6 0 8 6 2 6" ${line}/>
       <path d="M154 8 c-10 0 -8-6 -16-6 c-6 0 -8 6 -2 6" ${line}/>
       <path d="M104 8 h8 M128 8 h8" ${line}/>
       <path d="M120 2 L124.5 8 L120 14 L115.5 8 Z" fill="currentColor" stroke="none"/>`);
  },

  /** Top-left corner. CSS mirrors it into the other three. */
  corner() {
    return svg('0 0 16 16',
      `<path d="M0 16 V5 C0 2 2 0 5 0 H16" stroke-width=".9"/>
       <path d="M5 5 c3 0 5 2 5 5 M5 5 c0 3 -2 5 -5 5" stroke-width=".55"/>
       <circle cx="5" cy="5" r="1.2" fill="currentColor" stroke="none"/>`);
  },

  /** The outline a headline number sits inside. */
  shape(kind) {
    if (kind === 'shield') {
      return svg('0 0 40 46',
        `<path d="M2.4 2.4 H37.6 V24 C37.6 34 30.4 41 20 43.6 C9.6 41 2.4 34 2.4 24 Z" stroke-width="1.4"/>`);
    }
    if (kind === 'die') {
      // A flat-topped hexagon, not a pointed one: the label needs width where it
      // sits, and an apex gives it none. Nothing inside it either — an inner
      // triangle collides with the number.
      return svg('0 0 40 46',
        `<path d="M11 2.4 H29 L37.6 23 L29 43.6 H11 L2.4 23 Z" stroke-width="1.4"/>`);
    }
    // hit points: a box with the corners cut off.
    return svg('0 0 40 46',
      `<path d="M7 2.4 H33 L37.6 7 V39 L33 43.6 H7 L2.4 39 V7 Z" stroke-width="1.4"/>`);
  },
};

const svg = (viewBox, body) =>
  `<svg class="orn" viewBox="${viewBox}" fill="none" stroke="currentColor"
     stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

/** A headline number inside a drawn outline. */
function shapeBox(kind, label, value, extraClass = '') {
  return `<div class="shape ${kind} ${extraClass}">
    ${ORN.shape(kind)}
    <span class="lbl">${esc(label)}</span>
    <span class="val">${value}</span>
  </div>`;
}

/* ------------------------------------------------------------ sheet render */
/** The A4 sheet, kept up to date in a container only the printer can see. */
function renderPrintArea() {
  document.getElementById('print-area').innerHTML = state ? sheetHTML() : '';
}

function sheetHTML() {
  const d = derive(state);
  const sp = SPECIES[state.species];
  const cls = CLASSES[state.class];
  const bg = BACKGROUNDS[state.background];
  const lineage = sp?.lineages?.[state.lineage];
  const line = [
    [sp?.es, lineage ? `(${lineage.es})` : null].filter(Boolean).join(' '),
    cls ? `${cls.es} 1` : null,
    bg?.es,
    d.size,
  ].filter(Boolean).join(' · ');

  return `<div class="sheet"><div class="pad">${frame(`
    <div class="hd">
      <div class="who">${esc(state.name) || '<span class="muted">Sin nombre</span>'}</div>
      <div class="line">${esc(line) || '—'}${state.player ? `<br>jugador: ${esc(state.player)}` : ''}</div>
    </div>
    <div class="flourish">${ORN.flourish()}</div>

    <!-- The three numbers that get read every round get a drawn outline each:
         a shield for armour, a die for initiative, a cut-corner box for hit
         points. The four read every few rounds stay plain boxes. Size and
         ornament both follow how often a thing is looked up. -->
    <div class="vitals">
      ${shapeBox('shield', 'CA', d.ca)}
      ${shapeBox('hp', 'PG', d.hp ?? '—')}
      ${shapeBox('die', 'Inic.', signed(d.initiative))}
      <div class="mini">
        ${box('Competencia', signed(PROFICIENCY_BONUS))}
        ${box('Velocidad', d.speed != null ? `${String(d.speed).replace('.', ',')}<small> m</small>` : '—')}
        ${box('Perc. pasiva', d.passivePerception)}
        ${box('Dado de golpe', cls ? `1d${cls.hitDie}` : '—')}
      </div>
    </div>

    <!-- The six across the full width, in the shape every player already
         knows how to read: score, modifier, saving throw. -->
    <div class="abband">
      ${d.saves.map(s => `<div class="abx ${s.prof ? 'prof' : ''}">
        <span class="n">${esc(s.es)}</span>
        <span class="s">${d.scores[s.key]}</span>
        <span class="m">${signed(d.mods[s.key])}</span>
        <span class="sv">salv. ${s.prof ? '<b>' + signed(s.total) + '</b> ●' : signed(s.total)}</span>
      </div>`).join('')}
    </div>

    <!-- One balanced two-column flow rather than two fixed columns. A fixed
         split has to be as tall as its longest side, which left about 56mm of
         dead paper under the short one; letting the browser balance the same
         blocks reclaims it, and that reclaimed height is what pays for the
         frame, the flourishes and the drawn shapes above. -->
    <div class="flow">
      <div class="long">
        <h3>Habilidades <span class="muted" style="font-variant:normal;text-transform:none">● comp. · ●● expert.</span></h3>
        <ul class="sk">
        ${d.skills.map(s => `<li class="${s.prof ? 'prof' : ''}">
          <span class="dot">${s.expertise ? '●●' : s.prof ? '●' : ''}</span>
          <span>${esc(s.es)}</span>
          <span class="ab">${s.ability}</span>
          <span class="mod">${signed(s.total)}</span></li>`).join('')}
        </ul>
      </div>
      <!-- Properties and mastery go on their own line under each weapon rather
           than in a fourth column: in a 94mm column a Notas column forces both
           the weapon name and the damage expression to wrap. -->
      <div>
        <h3>Ataques</h3>
        ${d.attacks.length ? `<table class="atk">
          <thead><tr><th>Arma</th><th class="c">Ataque</th><th class="c">Daño</th></tr></thead><tbody>
          ${d.attacks.map(a => {
            const notes = [...a.props, a.mastery ? `<b>${esc(a.mastery.es)}</b>` : null].filter(Boolean);
            return `<tr class="${notes.length ? 'nb' : ''}">
              <td class="wp">${esc(a.name)}</td>
              <td class="c">${signed(a.attack)}</td>
              <td class="c dmg">${esc(a.damage)}</td></tr>
              ${notes.length ? `<tr><td class="n2" colspan="3">${notes.join(' · ')}</td></tr>` : ''}`;
          }).join('')}
          </tbody></table>` : '<div class="muted">Sin armas elegidas.</div>'}
      </div>
      ${d.casting || d.extraSpells.length ? castingBox(d) : ''}
      <div class="long">
        <h3>Rasgos y dotes</h3>
        ${featuresHTML(d)}
      </div>
      <div>
        <h3>Equipo</h3>
        ${equipmentHTML()}
      </div>
      <div>
        <h3>Competencias e idiomas</h3>
        <div class="kv">
          <div><b>Armaduras:</b> ${cls ? esc(d.proficiencies.armor.join(', ') || 'ninguna') : '—'}</div>
          <div><b>Armas:</b> ${cls ? esc(d.proficiencies.weapons.join(', ')) : '—'}</div>
          <div><b>Herramientas:</b> ${esc([cls?.tools, bg?.tool?.label, ...(state.featTools || [])].filter(Boolean).join(', ')) || '—'}</div>
          <div><b>Idiomas:</b> Común y dos más</div>
        </div>
      </div>
      <div>
        <h3>En mesa</h3>
        <div class="track">
          <div><span>PG actuales</span><span class="rule"></span></div>
          <div><span>PG temporales</span><span class="rule"></span></div>
          <div><span>Dados de golpe gastados</span><span class="rule"></span></div>
          <div class="deaths"><span>Salvaciones de muerte</span>
            <span class="pips">éxitos ${'<span class="pip"></span>'.repeat(3)}</span>
            <span class="pips">fallos ${'<span class="pip"></span>'.repeat(3)}</span>
          </div>
          <div><span>Inspiración Heroica</span><span class="pip"></span></div>
        </div>
      </div>
      <div class="long">
        <h3>Personalidad e historia</h3>
        <div class="story">${storyHTML()}</div>
      </div>
    </div>

    <div class="flourish small">${ORN.flourish()}</div>

    <div class="sheetfoot">
      <span>${esc(state.name) || 'Sin nombre'}</span>
      <span class="r">D&amp;D 5e · reglas 2024 · nivel 1 · hoja 1</span>
    </div>`)}</div></div>
  ${spellSheetHTML(d)}`;
}

/** The ruled border and its four corner ornaments, around a page's content. */
function frame(inner) {
  const c = ORN.corner();
  return `<div class="frame">
    <span class="cnr tl">${c}</span><span class="cnr tr">${c}</span>
    <span class="cnr bl">${c}</span><span class="cnr br">${c}</span>
    ${inner}
  </div>`;
}

/** One stat box. `variant` is 'big' for the three read every round. */
function box(k, v, variant = '') {
  return `<div class="box ${variant}"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
}

/**
 * The casting numbers, and only the numbers. Page 2 exists whenever this block
 * does — castsAnything() gates both — and it already lists every spell with its
 * school, casting time, range, duration and effect. Repeating the names here
 * cost about 20mm of page 1 to say something the next page says better, and
 * page 1 is the one that runs out of room. What stays is what you need without
 * turning the sheet over mid-turn.
 */
function castingBox(d) {
  const c = d.casting;
  const counts = [
    d.classSpells.cantrips.length ? `${d.classSpells.cantrips.length} trucos` : null,
    d.classSpells.level1.length ? `${d.classSpells.level1.length} de nivel 1` : null,
    ...d.extraSpells.map(s => `${s.cantrips.length + s.level1.length} de ${s.from}`),
  ].filter(Boolean).join(' · ');

  return `<div>
    <h3>Conjuros <span class="muted" style="font-variant:normal;text-transform:none">→ hoja 2</span></h3>
    <div class="kv">
      ${c ? `<div><b>Característica:</b> ${esc(c.abilityName)} · <b>CD:</b> ${c.dc} · <b>Ataque:</b> ${signed(c.attack)}</div>
      <div class="slots"><b>Espacios de nivel 1:</b> ${Array.from({ length: c.slots }, () => '<span class="pip"></span>').join('')}</div>` : ''}
      ${counts ? `<div class="muted">${esc(counts)}</div>` : ''}
    </div>
  </div>`;
}

function featuresHTML(d) {
  const rows = [];
  const sp = SPECIES[state.species];
  const cls = CLASSES[state.class];
  if (sp) for (const t of sp.traits) rows.push([t.n, t.d]);
  const lineage = sp?.lineages?.[state.lineage];
  if (lineage) for (const t of (lineage.traits || [])) rows.push([t.n, t.d]);
  const CHOICE_TABLES = {
    fightingStyle: [FIGHTING_STYLES, 'Estilo de combate'],
    divineOrder:   [DIVINE_ORDERS,   'Orden divina'],
    primalOrder:   [PRIMAL_ORDERS,   'Orden primigenia'],
  };
  if (cls) for (const f of cls.features) {
    const table = f.choice && CHOICE_TABLES[f.choice];
    const chosen = f.choice && state[f.choice];
    if (table && chosen && table[0][chosen]) {
      rows.push([`${table[1]}: ${table[0][chosen].es}`, table[0][chosen].d]);
    } else {
      rows.push([f.n, f.d]);
    }
  }
  for (const f of d.hooks.feats) {
    const feat = ORIGIN_FEATS[f];
    if (feat) rows.push([`${feat.es} (dote de origen)`, feat.d]);
  }
  if (!rows.length) return '<div class="muted">—</div>';
  return rows.map(([n, dsc]) => `<div class="feat"><b>${esc(n)}.</b> ${esc(dsc)}</div>`).join('');
}

function equipmentHTML() {
  const kit = loadout(state);
  if (!kit.items.length && !kit.gp) return '<div class="muted">—</div>';
  return `<div class="eq">`
    + kit.items.map(i => `<div>· ${esc(i)}</div>`).join('')
    + (kit.gp ? `<div>· <b>${kit.gp} po</b></div>` : '')
    + `</div>`;
}

function storyHTML() {
  const s = state.story;
  const rows = [
    ['Aspecto', state.appearance],
    ['Rasgos de personalidad', s.personality],
    ['Ideales', s.ideals],
    ['Vínculos', s.bonds],
    ['Defectos', s.flaws],
    ['Historia', s.backstory],
    ['A quién conoce del grupo', s.ties],
  ].filter(([, v]) => v && v.trim());
  if (!rows.length) return '<div class="writein"></div><div class="writein"></div><div class="writein"></div>';
  return rows.map(([k, v]) => `<p><b>${esc(k)}.</b> ${esc(v)}</p>`).join('');
}

/** Second A4 page. Only exists in the DOM when the character casts. */
function spellSheetHTML(d) {
  if (!castsAnything(state)) return '';
  const c = d.casting;

  /* Three columns only: the mechanical fields are stacked in one narrow cell so
     the summary gets the width it needs and the whole list stays on one page. */
  const table = (title, rows) => !rows.length ? '' : `
    <div style="margin-bottom:2mm">
      <h3>${esc(title)}</h3>
      <table class="sp"><thead><tr>
        <th>Conjuro</th><th>Datos</th><th>Efecto</th>
      </tr></thead><tbody>
      ${rows.map(sp => `<tr>
        <td class="nm">${esc(sp.es)}<br><span class="muted" style="font-weight:400">${esc(sp.en)}</span></td>
        <td class="meta">${esc(sp.school)}<br>${esc(sp.time)} · ${esc(sp.range)}<br>${esc(sp.dur)}${
          sp.conc ? ' · <b>conc.</b>' : ''}${sp.rit ? ' · <b>ritual</b>' : ''}<br>
          <span class="muted">${esc(sp.comp)}</span></td>
        <td class="sum">${esc(sp.sum)}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;

  // Species, lineage and feat spells do not use class slots, so they get
  // their own block with the source named.
  const extras = d.extraSpells.map(src => {
    const rows = [...src.cantrips, ...src.level1].map(spellByEn).filter(Boolean);
    return table(`${src.from} — no gasta espacios`, rows);
  }).join('');

  return `<div class="sheet"><div class="pad">${frame(`
    <div class="hd">
      <div class="who">Conjuros</div>
      <div class="line">${esc(state.name) || '—'}${
        c ? `<br>CD ${c.dc} · ataque ${signed(c.attack)} · ${esc(c.abilityName)}` : ''}</div>
    </div>
    <div class="flourish">${ORN.flourish()}</div>

    ${c ? `<div class="strip">
      ${box('Característica', esc(c.abilityName))}
      ${box('CD de conjuros', c.dc)}
      ${box('Ataque de conjuro', signed(c.attack))}
      ${box('Espacios nivel 1', c.slots)}
    </div>
    <div class="kv" style="margin-bottom:2mm"><b>Espacios usados:</b>
      <span class="slots" style="display:inline-flex;margin-left:1mm">${
        Array.from({ length: c.slots }, () => '<span class="pip"></span>').join('')}</span>
      ${c.note ? ` · <span class="muted">${esc(c.note)}</span>` : ''}
    </div>` : ''}

    ${table('Trucos — a voluntad, sin gastar espacios', d.classSpells.cantrips)}
    ${table(c?.book ? 'Conjuros de nivel 1 del libro' : 'Conjuros de nivel 1', d.classSpells.level1)}
    ${extras}

    <div class="sheetfoot">
      <span>${esc(state.name) || 'Sin nombre'}</span>
      <span class="r">D&amp;D 5e · reglas 2024 · nivel 1 · hoja 2</span>
    </div>`)}</div></div>`;
}

/* ------------------------------------------------------- library actions */
function openCharacter(id, where) {
  const c = library.characters.find(x => x.id === id);
  if (!c) return;
  state = c;
  const incomplete = validate(c).some(n => n.level === 'error');
  screen = where || (c.wizardDone && !incomplete ? 'view' : 'wizard');
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function newCharacter() {
  state = blankCharacter();
  library.characters.push(state);
  save();
  nav('wizard');
}

function duplicateCharacter(id) {
  const c = library.characters.find(x => x.id === id);
  if (!c) return;
  const copy = normalise(JSON.parse(JSON.stringify(c)));
  copy.id = newId();
  copy.name = (c.name || 'Sin nombre') + ' (copia)';
  copy.updatedAt = Date.now();
  library.characters.push(copy);
  save();
  render();
  flash('Duplicado.');
}

function deleteCharacter(id) {
  const c = library.characters.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`¿Borrar a ${c.name || 'este personaje'}? No se puede deshacer.`)) return;
  library.characters = library.characters.filter(x => x.id !== id);
  if (state?.id === id) state = null;
  save();
  nav('roster');
}

/** Download one character as .json. */
function exportCharacter(id) {
  const c = library.characters.find(x => x.id === id);
  if (!c) return;
  const safe = (c.name || 'personaje').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'personaje';
  const blob = new Blob([JSON.stringify({ kind: 'dnd-creator-character', version: 2, character: c }, null, 2)],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${safe}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/** Reads a .json back in. Always lands as a new character, never overwrites. */
function importCharacter(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      const raw = parsed?.character || parsed;
      if (!raw || typeof raw !== 'object') throw new Error('formato');
      const c = normalise(raw);
      c.id = newId();                      // never collide with what is here
      c.updatedAt = Date.now();
      library.characters.push(c);
      save();
      nav('roster');
      flash(`Importado: ${c.name || 'sin nombre'}.`);
    } catch (err) {
      flash('Ese archivo no es una ficha de este creador.');
    }
  };
  reader.onerror = () => flash('No se pudo leer el archivo.');
  reader.readAsText(file);
}

/* -------------------------------------------------------------- listeners */
/** Changing a choice invalidates whatever depended on it. */
function pick(kind, value) {
  if (kind === 'species') {
    if (state.species === value) return;
    state.species = value;
    state.lineage = null;
    state.speciesSkills = [];
    state.extraFeat = null;
    state.size = SPECIES[value]?.size.length === 1 ? SPECIES[value].size[0] : null;
  } else if (kind === 'class') {
    if (state.class === value) return;
    state.class = value;
    state.classSkills = [];
    state.masteries = [];
    state.expertise = [];
    state.fightingStyle = null;
    state.divineOrder = null;
    state.primalOrder = null;
    state.equipmentClass = Object.keys(CLASSES[value]?.equipment || { A: 1 })[0];
    state.spells = { cantrips: [], level1: [] };
  } else if (kind === 'background') {
    if (state.background === value) return;
    state.background = value;
    state.boosts = {};
    state.featTools = [];
    state.featSkills = [];
    state.magicInitiate = null;
    state.equipmentBackground = Object.keys(BACKGROUNDS[value]?.equipment || { A: 1 })[0];
  } else if (kind === 'extraFeat') {
    state.extraFeat = state.extraFeat === value ? null : value;
    state.featTools = [];
    state.featSkills = [];
    state.magicInitiate = null;
  } else {
    state[kind] = state[kind] === value ? null : value;
  }
}

document.addEventListener('click', e => {
  // --- library and navigation, which work with no character open ---------
  const hit = sel => e.target.closest(sel);
  if (hit('[data-new]'))    { newCharacter(); return; }
  if (hit('[data-import]')) { document.getElementById('import-file').click(); return; }

  const open = hit('[data-open]');
  if (open) { openCharacter(open.dataset.open); return; }
  const edit = hit('[data-edit]');
  if (edit) { openCharacter(edit.dataset.edit, 'edit'); return; }
  const dup = hit('[data-dup]');
  if (dup) { duplicateCharacter(dup.dataset.dup); return; }
  const del = hit('[data-del]');
  if (del) { deleteCharacter(del.dataset.del); return; }
  const exp = hit('[data-export]');
  if (exp) { exportCharacter(exp.dataset.export); return; }

  const portrait = hit('[data-portrait-for]');
  if (portrait) {
    const input = document.getElementById('portrait-file');
    input.dataset.target = portrait.dataset.portraitFor;
    input.click();
    return;
  }

  const navBtn = hit('[data-nav]');
  if (navBtn) { save(); nav(navBtn.dataset.nav); return; }

  if (hit('[data-print]')) { window.print(); return; }
  if (hit('[data-copy]'))  { copyMarkdown(); return; }

  if (hit('[data-finish]')) {
    state.wizardDone = true;
    save();
    nav('view');
    flash('Ficha guardada.');
    return;
  }
  const stepBtn = hit('[data-step]');
  if (stepBtn) { goToStepId(stepBtn.dataset.step); return; }

  if (!state) return;                       // everything below needs a character

  const t = hit('[data-go]');
  if (t && !t.disabled) { e.preventDefault(); go(Number(t.dataset.go)); return; }

  // Quiz answers are buttons, so tapping anywhere on the text selects them.
  const answer = hit('[data-quiz]');
  if (answer) {
    state.quiz = { applied: false, ...state.quiz, answers: { ...state.quiz?.answers } };
    state.quiz.answers[answer.dataset.quiz] = Number(answer.dataset.value);
    save(); render(); return;
  }

  const card = e.target.closest('[data-pick]');
  if (card) { pick(card.dataset.pick, card.dataset.value); save(); render(); return; }

  const suggest = e.target.closest('[data-suggest]');
  if (suggest) {
    const path = suggest.dataset.suggest.split('.');
    let obj = state;
    while (path.length > 1) obj = obj[path.shift()];
    obj[path[0]] = suggest.dataset.line;
    save(); render(); return;
  }

  if (e.target.closest('[data-quiz-apply]')) { applyQuizResult(); return; }
  if (e.target.closest('[data-quiz-reset]')) {
    if (confirm('¿Borrar las respuestas del cuestionario? Lo que ya hayas aplicado se queda como está.')) {
      state.quiz = { answers: {}, applied: false };
      save(); render();
    }
    return;
  }

  const buy = e.target.closest('[data-buy]');
  if (buy) {
    const key = buy.dataset.buy;
    const next = state.buy[key] + Number(buy.dataset.delta);
    if (buyCost(next) != null) {
      const trial = { ...state.buy, [key]: next };
      if (buySpent(trial) <= POINT_BUY_TOTAL) state.buy = trial;
    }
    save(); render(); return;
  }
  if (e.target.closest('[data-buyreset]')) {
    state.buy = { FUE: 8, DES: 8, CON: 8, INT: 8, SAB: 8, CAR: 8 };
    save(); render(); return;
  }

});

/* Remember which editor sections are open, so a re-render does not shut them. */
document.addEventListener('toggle', e => {
  const sec = e.target.closest?.('details[data-sec]');
  if (!sec) return;
  if (sec.open) openSections.add(sec.dataset.sec);
  else openSections.delete(sec.dataset.sec);
}, true);   // capture: the toggle event does not bubble

/* The file picker is the only way to read a local .json without a server. */
document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (file) importCharacter(file);
  e.target.value = '';                      // so the same file can be picked twice
});

const portraitInput = document.getElementById('portrait-file');
portraitInput.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (file) readPortrait(file, portraitInput.dataset.target);
  e.target.value = '';
});

/* A portrait's own drop target, not the document-wide one: dropping an
   image anywhere else on the page should do nothing. */
document.addEventListener('dragover', e => {
  if (e.target.closest('[data-portrait-for]')) e.preventDefault();
});
document.addEventListener('dragenter', e => {
  const w = e.target.closest('[data-portrait-for]');
  if (w) { e.preventDefault(); w.classList.add('drag'); }
});
document.addEventListener('dragleave', e => {
  e.target.closest('[data-portrait-for]')?.classList.remove('drag');
});
document.addEventListener('drop', e => {
  const w = e.target.closest('[data-portrait-for]');
  if (!w) return;
  e.preventDefault();
  w.classList.remove('drag');
  const file = [...(e.dataTransfer?.files || [])].find(f => /^image\//.test(f.type));
  if (file) readPortrait(file, w.dataset.portraitFor);
});

/* Text inputs must not re-render the form: that would steal focus mid-typing.
   They update the state and repaint only the sheet. */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-text]');
  if (!el) return;
  const path = el.dataset.text.split('.');
  let obj = state;
  while (path.length > 1) obj = obj[path.shift()];
  obj[path[0]] = el.value;
  scheduleSave();
  renderPrintArea();
  refreshWizardFooter();
});

/* Enter advances the wizard instead of doing nothing (there is no <form>,
   so it has no other effect). Textareas keep Enter as a newline. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || screen !== 'wizard') return;
  if (e.target.tagName === 'TEXTAREA' || e.target.closest('.foot')) return;
  const btn = document.querySelector('.foot [data-finish], .foot [data-go].primary');
  if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
});

/* Checkboxes, radios and selects: these do re-render, since a choice here can
   change which options the rest of the step offers. */
document.addEventListener('change', e => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const field = toggle.dataset.toggle;
    const value = toggle.dataset.value;
    const max = Number(toggle.dataset.max);
    const list = state[field] || (state[field] = []);
    const at = list.indexOf(value);
    if (at >= 0) list.splice(at, 1);
    else if (list.length < max) list.push(value);
    // Dropping a skill must also drop any expertise that rested on it.
    if (field === 'classSkills' || field === 'featSkills' || field === 'speciesSkills') {
      const { prof } = skillProficiencies(state);
      state.expertise = (state.expertise || []).filter(s => prof.has(s));
    }
    save(); render(); return;
  }

  const spellToggle = e.target.closest('[data-spell-toggle]');
  if (spellToggle) {
    const field = spellToggle.dataset.spellToggle;
    const max = Number(spellToggle.dataset.max);
    state.spells = { cantrips: [], level1: [], ...state.spells };
    const list = state.spells[field];
    const at = list.indexOf(spellToggle.dataset.value);
    if (at >= 0) list.splice(at, 1);
    else if (list.length < max) list.push(spellToggle.dataset.value);
    save(); render(); return;
  }

  const miToggle = e.target.closest('[data-mi-toggle]');
  if (miToggle) {
    const mi = state.magicInitiate = { list: null, cantrips: [], level1: null, ...state.magicInitiate };
    const max = Number(miToggle.dataset.max);
    const at = mi.cantrips.indexOf(miToggle.dataset.value);
    if (at >= 0) mi.cantrips.splice(at, 1);
    else if (mi.cantrips.length < max) mi.cantrips.push(miToggle.dataset.value);
    save(); render(); return;
  }

  const miList = e.target.closest('[data-mi-list]');
  if (miList) {
    // Switching list invalidates the spells picked from the previous one.
    state.magicInitiate = { list: miList.dataset.miList, cantrips: [], level1: null };
    save(); render(); return;
  }

  const miL1 = e.target.closest('[data-mi-level1]');
  if (miL1) {
    state.magicInitiate = { list: null, cantrips: [], ...state.magicInitiate, level1: miL1.dataset.miLevel1 };
    save(); render(); return;
  }

  const quizPick = e.target.closest('[data-quiz]');
  if (quizPick) {
    state.quiz = { applied: false, ...state.quiz, answers: { ...state.quiz?.answers } };
    state.quiz.answers[quizPick.dataset.quiz] = Number(quizPick.dataset.value);
    save(); render(); return;
  }

  const setter = e.target.closest('[data-set]');
  if (setter) { state[setter.dataset.set] = setter.dataset.value; save(); render(); return; }

  const boost = e.target.closest('[data-boost]');
  if (boost) {
    const v = Number(boost.dataset.value);
    state.boosts = { ...state.boosts };
    if (v === 0) delete state.boosts[boost.dataset.boost];
    else state.boosts[boost.dataset.boost] = v;
    save(); render(); return;
  }
});

/**
 * Writes the proposal into the state. Deliberately overwrites only what the
 * quiz decides; the name, species, class and story text are left alone.
 */
function applyQuizResult() {
  const r = quizResult(state);
  if (!r) return;

  state.background = r.background;
  state.boosts = { ...r.boosts };
  state.buy = { ...r.buy };
  state.classSkills = [...r.classSkills];
  state.expertise = [...r.expertise];
  state.equipmentClass = r.equipmentClass;
  state.equipmentBackground = r.equipmentBackground;
  state.spells = { cantrips: [...r.spells.cantrips], level1: [...r.spells.level1] };
  if (r.fightingStyle) state.fightingStyle = r.fightingStyle;
  if (r.divineOrder) state.divineOrder = r.divineOrder;
  if (r.primalOrder) state.primalOrder = r.primalOrder;
  if (r.masteries.length) state.masteries = [...r.masteries];

  // The background may have changed, so anything that hung off the old one goes.
  state.featTools = [];
  state.featSkills = [];
  state.magicInitiate = null;

  state.quiz = { ...state.quiz, applied: true };
  save();
  flash('Aplicado. Revisa los pasos siguientes y cambia lo que quieras.');
  go(stepIndex('trasfondo'));
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

/* ------------------------------------------------------------ markdown out */
function markdown() {
  const d = derive(state);
  const sp = SPECIES[state.species], cls = CLASSES[state.class], bg = BACKGROUNDS[state.background];
  const L = [];
  L.push(`# ${state.name || 'Sin nombre'}`, '');
  L.push(`> ${[sp?.es, cls ? `${cls.es} 1` : null, bg?.es, state.player ? `jugador: ${state.player}` : null]
    .filter(Boolean).join(' · ')}`, '');

  L.push('## Combate', '');
  L.push('| CA | PG | Iniciativa | Competencia | Velocidad | Perc. pasiva | Dados de golpe |');
  L.push('|---|---|---|---|---|---|---|');
  L.push(`| ${d.ca} | ${d.hp ?? '—'} | ${signed(d.initiative)} | ${signed(PROFICIENCY_BONUS)} | ${d.speed != null ? String(d.speed).replace('.', ',') + ' m' : '—'} | ${d.passivePerception} | 1d${cls?.hitDie ?? '—'} |`, '');

  L.push('## Características', '');
  L.push('| Característica | Puntuación | Mod. | Salvación |');
  L.push('|---|---|---|---|');
  for (const s of d.saves) {
    L.push(`| ${s.es} | ${d.scores[s.key]} | ${signed(d.mods[s.key])} | ${s.prof ? `**${signed(s.total)}**` : signed(s.total)} |`);
  }
  L.push('');

  L.push('## Habilidades', '', '`●` competencia · `●●` experticia', '');
  for (const s of d.skills) {
    L.push(`- ${s.expertise ? '`●●`' : s.prof ? '`●`' : '`  `'} ${s.es} (${s.ability}) ${signed(s.total)}`);
  }
  L.push('');

  if (d.attacks.length) {
    L.push('## Ataques', '', '| Arma | Ataque | Daño | Notas |', '|---|---|---|---|');
    for (const a of d.attacks) L.push(`| ${a.name} | ${signed(a.attack)} | ${a.damage} | ${a.props.join(', ')}${a.mastery ? ` · **${a.mastery.es}**` : ''} |`);
    L.push('');
  }

  L.push('## Rasgos y dotes', '');
  const tmp = document.createElement('div');
  tmp.innerHTML = featuresHTML(d);
  for (const el of tmp.querySelectorAll('.feat')) L.push(`- ${el.textContent.trim()}`);
  L.push('');

  if (castsAnything(state)) {
    L.push('## Conjuros', '');
    if (d.casting) {
      L.push(`**Característica.** ${d.casting.abilityName} · **CD** ${d.casting.dc} · ` +
        `**Ataque de conjuro** ${signed(d.casting.attack)} · **Espacios de nivel 1** ${d.casting.slots}`, '');
    }
    const spellRows = (title, rows) => {
      if (!rows.length) return;
      L.push(`### ${title}`, '', '| Conjuro | Escuela | Lanzar | Alcance | Duración | Efecto |', '|---|---|---|---|---|---|');
      for (const sp of rows) {
        const dur = [sp.dur, sp.conc ? 'concentración' : null, sp.rit ? 'ritual' : null].filter(Boolean).join(', ');
        L.push(`| ${sp.es} (${sp.en}) | ${sp.school} | ${sp.time} | ${sp.range} | ${dur} | ${sp.sum} |`);
      }
      L.push('');
    };
    spellRows('Trucos', d.classSpells.cantrips);
    spellRows('Nivel 1', d.classSpells.level1);
    for (const src of d.extraSpells) {
      spellRows(src.from, [...src.cantrips, ...src.level1].map(spellByEn).filter(Boolean));
    }
  }

  L.push('## Equipo', '');
  const eq = document.createElement('div');
  eq.innerHTML = equipmentHTML();
  for (const el of eq.children) L.push(`- ${el.textContent.replace(/^·\s*/, '').trim()}`);
  L.push('');

  L.push('## Personalidad e historia', '');
  const st = state.story;
  for (const [k, v] of [['Aspecto', state.appearance], ['Rasgos de personalidad', st.personality],
    ['Ideales', st.ideals], ['Vínculos', st.bonds], ['Defectos', st.flaws],
    ['Historia', st.backstory], ['A quién conoce del grupo', st.ties]]) {
    if (v && v.trim()) L.push(`**${k}.** ${v.trim()}`, '');
  }
  return L.join('\n');
}

async function copyMarkdown() {
  const text = markdown();
  try {
    await navigator.clipboard.writeText(text);
    flash('Copiado al portapapeles.');
  } catch (e) {
    // file:// often blocks the async Clipboard API; fall back to a textarea.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    flash(ok ? 'Copiado al portapapeles.' : 'No se pudo copiar. Selecciona el texto a mano.');
  }
}

function flash(msg) {
  const n = document.createElement('div');
  n.textContent = msg;
  n.style.cssText = 'position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);' +
    'background:#2b2118;color:#f4ead2;padding:.5rem 1rem;border-radius:3px;z-index:99;font-family:var(--serif)';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2200);
}

/* --------------------------------------------------------------- boot
   With one character saved, open it straight away; with several, show the
   list; with none, the list invites you to make one. */
if (library.characters.length === 1) {
  state = library.characters[0];
  const incomplete = validate(state).some(n => n.level === 'error');
  screen = state.wizardDone && !incomplete ? 'view' : 'wizard';
} else {
  screen = 'roster';
}
render();
</script>
