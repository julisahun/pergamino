/* ================================================================== LOOK
   One look, and everything below is written against the tokens in the block
   that follows: aged paper, IM Fell English headings, flourishes and ink
   blots. There used to be four to pick between, on `data-theme` with a
   picker in the header; there is one now, so there is no attribute, no
   picker and no stored preference to get out of step between files.

   Print stays ink-light — no fills, no tints, no textures, just black line
   art — and keeps the same typographic voice on paper.
========================================================================= */

/* ----------------------------------------------------------- shared tokens
   One voice for all three files, and it is pergamino: heavy mottling, foxing
   at the edges, IM Fell English for the headings, flourishes and ink blots.
   Metrics and the fallback stacks live here too. There is nothing left to
   switch between, so there is no theme attribute, no picker and no stored
   preference — the stylesheet simply is the look. */
:root {
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius: 3px;
  color-scheme: light;
  accent-color: var(--seal);

  --parchment:   #efe3c8;
  --parchment-2: #ddcaa2;
  --page:
    radial-gradient(ellipse 40% 30% at 12% 8%,  rgba(255,252,240,.75), transparent 70%),
    radial-gradient(ellipse 35% 25% at 88% 92%, rgba(255,252,240,.55), transparent 70%),
    radial-gradient(ellipse 30% 22% at 70% 18%, rgba(150,112,64,.18),  transparent 70%),
    radial-gradient(ellipse 26% 30% at 22% 74%, rgba(150,112,64,.16),  transparent 70%),
    radial-gradient(ellipse 18% 14% at 45% 48%, rgba(126,92,50,.13),   transparent 70%),
    radial-gradient(ellipse 22% 18% at 8% 40%,  rgba(120,84,40,.16),   transparent 65%),
    radial-gradient(ellipse 20% 16% at 94% 30%, rgba(120,84,40,.15),   transparent 65%),
    linear-gradient(180deg, rgba(112,80,42,.24), transparent 10%, transparent 90%, rgba(112,80,42,.24)),
    linear-gradient(90deg,  rgba(112,80,42,.22), transparent 7%,  transparent 93%, rgba(112,80,42,.22)),
    repeating-linear-gradient(91deg, rgba(138,106,67,.05) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(1deg,  rgba(138,106,67,.035) 0 1px, transparent 1px 6px),
    linear-gradient(160deg, var(--parchment), var(--parchment-2));

  --ink:      #2b2118;
  --ink-soft: #5c4d3c;
  --sepia:    #8a6a43;
  --seal:     #8e2b20;
  --seal-2:   #a8382a;
  --gold:     #a98240;
  --rule:     #c0a878;

  --panel:      linear-gradient(180deg, rgba(255,252,240,.6), rgba(255,252,240,.18));
  --panel-solid:#f7eed6;
  --panel-2:    rgba(255,255,255,.45);
  --field:      rgba(255,255,255,.6);
  --btn:        linear-gradient(#fdf7e6, #eadfc2);
  --btn-hover:  linear-gradient(#fffdf3, #f0e6cc);
  --shadow:     0 1px 3px rgba(43,33,24,.12);

  --display: "IM Fell English SC", var(--serif);
  --head-variant: normal;         /* the SC face is already small caps */
  --head-ls: .03em;
  --head-weight: 400;
  --orn: "❦";
  --orn-head: "❧ ";
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* Nothing may push the page sideways on a phone. */
body { overflow-x: hidden; }
img, table, pre { max-width: 100%; }

body {
  margin: 0;
  font-family: var(--serif);
  color: var(--ink);
  background: var(--page);
  background-attachment: fixed;
  min-height: 100vh;
  line-height: 1.5;
}

/* Every heading in the app goes through this, so a theme swaps one token. */
.dsp {
  font-family: var(--display);
  font-variant: var(--head-variant);
  letter-spacing: var(--head-ls);
  font-weight: var(--head-weight);
}

/* ---------------------------------------------------------------- chrome
   Mobile first: one column, comfortable tap targets, and a sticky bottom bar
   for back/next so the thumb never has to travel. Wider screens only get more
   breathing room, never a second pane — the wizard is one thing at a time. */
button {
  font-family: var(--serif); font-size: 1rem;
  padding: .6rem 1rem; cursor: pointer; color: var(--ink);
  background: var(--btn);
  border: 1px solid var(--sepia); border-radius: var(--radius);
  min-height: 2.75rem;                 /* comfortable on a phone */
}
button:hover:not(:disabled) { background: var(--btn-hover); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary {
  background: linear-gradient(var(--seal-2), var(--seal));
  color: #fdf6e6; border-color: var(--seal);
  font-family: var(--display); font-variant: var(--head-variant);
  letter-spacing: var(--head-ls);
}
button.primary:hover:not(:disabled) { background: linear-gradient(var(--seal), var(--seal-2)); }
button.ghost { background: none; border-color: var(--rule); }
button.small { font-size: .85rem; padding: .35rem .7rem; min-height: 2.2rem; }
button.link { background: none; border: 0; min-height: 0; padding: 0; text-decoration: underline; color: var(--sepia); font-size: inherit; }

header.top {
  display: flex; align-items: center; gap: .6rem;
  padding: .75rem 1rem;
  border-bottom: 3px double var(--sepia);
  background: var(--panel);
  position: sticky; top: 0; z-index: 5;
  backdrop-filter: blur(3px);
}
header.top h1 {
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight);
  font-size: 1.05rem; margin: 0; letter-spacing: var(--head-ls);
  color: var(--seal); line-height: 1.2;
}
header.top h1 .sub {
  display: block; font-size: .72rem; color: var(--ink-soft);
  font-family: var(--serif); font-variant: normal; letter-spacing: 0; font-weight: 400;
}
header.top .actions { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
header.top .actions button { min-height: 2.4rem; padding: .4rem .7rem; font-size: .88rem; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* --------------------------------------------------------- progress bar */
.progress { padding: .6rem 1rem 0; }
.progress .bar { height: 5px; background: rgba(138,106,67,.2); border-radius: 3px; overflow: hidden; }
.progress .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--seal)); transition: width .25s ease; }
.progress .lab {
  display: flex; justify-content: space-between; font-size: .78rem;
  color: var(--ink-soft); margin-top: .3rem; letter-spacing: .02em;
}
.progress .lab span:first-child { font-family: var(--display); color: var(--sepia); letter-spacing: var(--head-ls); }

/* -------------------------------------------------------------- screens */
main { padding: 1rem 1rem 6.5rem; }
section.panel { min-width: 0; max-width: 44rem; margin: 0 auto; }
section.panel h2 {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  font-size: 1.3rem; margin: 0 0 .3rem;
  letter-spacing: var(--head-ls); color: var(--seal);
  border-bottom: 3px double var(--rule); padding-bottom: .25rem;
}
section.panel h2::before { content: var(--orn-head); color: var(--gold); }
section.panel > p.lead { margin: .3rem 0 1.25rem; color: var(--ink-soft); }

/* Sticky action bar: back/next in the wizard, nothing anywhere else. */
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; gap: .6rem; align-items: center;
  padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--sepia);
  background: var(--panel-solid);
  backdrop-filter: blur(4px);
}
.foot .spacer { flex: 1; }
.foot .why { font-size: .78rem; color: var(--seal); max-width: 14rem; line-height: 1.25; }

@media (min-width: 700px) {
  header.top { padding: .9rem 1.5rem; }
  header.top h1 { font-size: 1.3rem; }
  main { padding: 1.5rem 1.5rem 6rem; }
  .progress { padding: .8rem 1.5rem 0; max-width: 60rem; margin: 0 auto; }
  .foot { padding: .8rem 1.5rem; }
  .foot > * { max-width: 60rem; }
}

/* ---------------------------------------------------------------- roster */
.roster { display: grid; gap: .75rem; }
/* Phone: identity row, then a full-width row of actions. Never sideways scroll. */
.card-char {
  display: grid; grid-template-columns: 1fr auto; gap: .5rem .8rem; align-items: center;
  padding: .8rem .9rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
}
.card-char .who { min-width: 0; display: flex; align-items: center; gap: .6rem; }
.card-char .who .id { min-width: 0; }
.card-char .who b {
  display: block; font-size: 1.1rem;
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight); letter-spacing: var(--head-ls);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-char .who span { display: block; font-size: .85rem; color: var(--ink-soft); }
.card-char .nums { display: flex; gap: .6rem; }
.card-char .nums span { text-align: center; font-size: .66rem; color: var(--sepia); font-variant: small-caps; }
.card-char .nums span b { display: block; font-size: 1.2rem; color: var(--ink); font-variant: normal; }
.card-char .acts {
  grid-column: 1 / -1; display: flex; gap: .35rem; flex-wrap: wrap;
  border-top: 1px dotted var(--rule); padding-top: .55rem;
}
.card-char .acts button { flex: 0 0 auto; }
.card-char .acts button[data-open], .card-char .acts button[data-edit] { flex: 1 1 6rem; }
.roster-empty { text-align: center; padding: 2rem 1rem; color: var(--ink-soft); }

/* -------------------------------------------------------------- portrait
   A dropped/picked image, downscaled and embedded as a stamp so it travels
   inside the character's own .json — no separate storage key to manage. */
.portrait {
  --size: 2.4rem;
  width: var(--size); height: var(--size); border-radius: 50%; overflow: hidden;
  flex: 0 0 auto; background: var(--panel-2); border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-family: var(--display); font-weight: 600; font-size: calc(var(--size) * .38);
  color: var(--sepia);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait.big { --size: 4.5rem; }
.portrait.drag { outline: 2px dashed var(--seal); outline-offset: 2px; }

@media (min-width: 620px) {
  .card-char { grid-template-columns: 1fr auto auto; }
  .card-char .acts { grid-column: auto; border-top: 0; padding-top: 0; flex-wrap: nowrap; }
  .card-char .acts button[data-open], .card-char .acts button[data-edit] { flex: 0 0 auto; }
}

/* ----------------------------------------------------- ficha en pantalla
   A reading layout, deliberately not a preview of the A4 sheet: one column
   on a phone, tap-sized rows, full spell text. The sheet's job is paper. */
.viewer { display: grid; gap: 1rem; }
.viewer .hero {
  padding: 1.1rem 1rem; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.viewer .hero-top { display: flex; align-items: center; gap: .9rem; }
.viewer .hero h2 {
  border: 0; margin: 0; font-size: 1.75rem; line-height: 1.1;
  font-family: var(--display); font-variant: var(--head-variant);
  font-weight: var(--head-weight); letter-spacing: var(--head-ls); color: var(--seal);
}
.viewer .hero h2::before { content: none; }
.viewer .hero .line { color: var(--ink-soft); font-size: .92rem; margin-top: .15rem; }
/* A hairline the theme can turn into a flourish. */
.viewer .hero .orn {
  display: block; margin: .7rem 0 .1rem; height: 0;
  border-top: 1px solid var(--rule); position: relative;
}
.viewer .hero .orn::after {
  content: var(--orn); position: absolute; left: 50%; top: 0;
  transform: translate(-50%, -.72em); background: var(--panel-solid);
  padding: 0 .5rem; color: var(--gold); font-size: .8rem;
}
.viewer .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.2rem, 1fr)); gap: .5rem; margin-top: .8rem; }
.viewer .tile {
  text-align: center; padding: .5rem .3rem; border: 1px solid var(--rule);
  border-radius: var(--radius); background: var(--panel-2);
}
.viewer .tile .k { display: block; font-size: .66rem; font-variant: small-caps; color: var(--sepia); letter-spacing: .04em; }
.viewer .tile .v { display: block; font-size: 1.45rem; font-weight: 600; line-height: 1.15; }
.viewer .tile .v small { font-size: .6em; font-weight: 400; }

.viewer section {
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
}
.viewer section > h3 {
  margin: 0; padding: .55rem .9rem; font-size: 1rem;
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: var(--head-ls); color: var(--sepia); border-bottom: 1px solid var(--rule);
}
.viewer section > div { padding: .8rem .9rem; }

.abgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .5rem; }
.abgrid .ab { text-align: center; border: 1px solid var(--rule); border-radius: var(--radius); padding: .5rem .3rem; background: var(--panel-2); }
.abgrid .ab .n { display: block; font-size: .72rem; font-variant: small-caps; color: var(--sepia); }
.abgrid .ab .s { display: block; font-size: 1.5rem; font-weight: 600; line-height: 1.1; }
.abgrid .ab .m { display: block; font-size: .82rem; }
.abgrid .ab .sv { display: block; font-size: .72rem; color: var(--ink-soft); margin-top: .15rem; }
.abgrid .ab.prof { border-color: var(--sepia); border-width: 2px; }

.skgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .1rem .8rem; }
.skgrid div { display: flex; gap: .4rem; padding: .18rem 0; border-bottom: 1px dotted var(--rule); font-size: .92rem; }
.skgrid div .dot { width: 1.5rem; flex: none; letter-spacing: -1px; color: var(--seal); }
.skgrid div .mod { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
.skgrid div.prof { font-weight: 600; }

table.vt { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.vt th { text-align: left; font-size: .72rem; font-variant: small-caps; color: var(--sepia); border-bottom: 1px solid var(--rule); padding: .2rem .4rem .2rem 0; }
table.vt td { padding: .35rem .4rem .35rem 0; border-bottom: 1px dotted var(--rule); vertical-align: top; }
table.vt td.c { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vfeat { margin-bottom: .6rem; font-size: .93rem; }
.vfeat b { font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls); }
.viewer h4 {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: var(--head-ls); color: var(--sepia);
}

/* ------------------------------------------------------------ edit view */
.editor details {
  border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: .6rem;
  background: var(--panel);
}
.editor details > summary {
  cursor: pointer; padding: .7rem .9rem;
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  font-size: 1.02rem; letter-spacing: var(--head-ls); color: var(--sepia);
}
.editor details[open] > summary { border-bottom: 1px solid var(--rule); color: var(--seal); }
.editor details > .body { padding: .9rem; }
.editor details > .body > h2:first-child { display: none; }  /* the summary is the heading */

/* -------------------------------------------------------------- widgets */
fieldset {
  border: 1px solid var(--rule); border-radius: var(--radius); margin: 0 0 1.25rem;
  padding: .75rem 1rem 1rem;
  background: var(--panel);
}
legend {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  font-size: .98rem; letter-spacing: var(--head-ls);
  padding: 0 .5rem; color: var(--sepia);
}
legend::before, legend::after { content: var(--orn); color: var(--gold); margin: 0 .35rem; font-family: var(--serif); }

label.field { display: block; margin-bottom: .85rem; }
label.field > span.lab { display: block; font-size: .85rem; color: var(--sepia); margin-bottom: .2rem; font-variant: small-caps; letter-spacing: .03em; }
input[type=text], textarea, select {
  width: 100%; font-family: var(--serif); font-size: .95rem; color: var(--ink);
  padding: .4rem .5rem; background: var(--field);
  border: 1px solid var(--rule); border-radius: 2px;
}
textarea { resize: vertical; min-height: 4.5rem; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
option { color: var(--ink); background: var(--panel-solid); }

/* choice cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .5rem; }
.card {
  text-align: left; padding: .55rem .7rem; border: 1px solid var(--rule);
  background: var(--panel-2); border-radius: var(--radius); display: block; width: 100%;
}
.card .name { font-weight: 600; display: block; font-family: var(--display); font-variant: var(--head-variant); letter-spacing: var(--head-ls); }
.card .why { font-size: .78rem; color: var(--ink-soft); display: block; margin-top: .1rem; }
.card[aria-pressed="true"] { border-color: var(--seal); border-width: 2px; background: var(--panel-solid); }

/* checkbox / radio rows */
.opts { display: grid; gap: .3rem; }
.opt { display: flex; gap: .5rem; align-items: flex-start; font-size: .92rem; padding: .2rem .1rem; }
.opt input { margin-top: .32rem; flex: none; }
.opt.off { opacity: .45; }
.opt .tag { font-size: .72rem; color: var(--sepia); border: 1px solid var(--rule); border-radius: 2px; padding: 0 .25rem; }

/* help + notices */
details.help { margin: -.25rem 0 1rem; font-size: .87rem; }
details.help > summary { cursor: pointer; color: var(--sepia); font-variant: small-caps; letter-spacing: .03em; }
details.help > div { padding: .5rem .75rem; margin-top: .35rem; border-left: 3px solid var(--gold); background: var(--panel-2); }
details.help p { margin: 0 0 .5rem; }
details.help p:last-child { margin-bottom: 0; }

/* questionnaire */
fieldset.quiz { padding-top: .5rem; }
fieldset.quiz > legend { font-size: .82rem; color: var(--gold); letter-spacing: .06em; }
fieldset.quiz p.situation { margin: 0 0 .6rem; font-size: 1rem; line-height: 1.45; }
fieldset.quiz .opt { padding: .3rem .35rem; border-radius: 2px; cursor: pointer; }
fieldset.quiz .opt:hover { background: var(--panel-2); }
fieldset.quiz.answered { border-color: var(--gold); }
fieldset.quiz.answered > legend::after { content: " ✓"; color: var(--gold); }
fieldset.result { border: 2px solid var(--seal); }
fieldset.result > legend { color: var(--seal); font-size: 1.1rem; }
fieldset.result td { padding: .3rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }

.notice { border-left: 3px solid var(--sepia); background: var(--panel-2); padding: .45rem .7rem; font-size: .87rem; margin: .5rem 0; }
.notice.warn { border-color: var(--seal); }
.notice.ok { border-color: var(--gold); }

.counter { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); }
.suggest { display: flex; flex-wrap: wrap; gap: .3rem; margin: -.55rem 0 .9rem; }
.suggest button { font-size: .82rem; padding: .2rem .5rem; background: none; border-color: var(--rule); color: var(--ink-soft); text-align: left; }
.suggest button:hover { color: var(--ink); border-color: var(--sepia); background: var(--panel-2); }
.suggest .tag { font-size: .75rem; color: var(--sepia); align-self: center; margin-right: .2rem; }
.counter.over { color: var(--seal); font-weight: 700; }

/* point buy: rows, not a table, so it survives a 390px phone */
.buyrows { display: grid; gap: .3rem; }
.buyrow {
  display: grid; grid-template-columns: 1fr auto auto; gap: .6rem; align-items: center;
  padding: .4rem .1rem; border-bottom: 1px solid var(--rule);
}
.buyrow .nm { min-width: 0; font-size: .98rem; }
.buyrow .nm .muted { font-size: .8em; }
.buyrow .nm .brk { display: block; font-size: .72rem; color: var(--sepia); }
.buyrow .ctl { display: flex; gap: .25rem; }
.buyrow .ctl button { min-height: 2.4rem; width: 2.4rem; padding: 0; font-size: 1.2rem; line-height: 1; }
.buyrow .out { text-align: right; min-width: 3.4rem; font-variant-numeric: tabular-nums; }
.buyrow .out b { font-size: 1.35rem; display: block; line-height: 1.1; }
.buyrow .out span { font-size: .8rem; color: var(--ink-soft); }

/* ------------------------------------------------ one question, one screen */
.situation-big {
  font-size: 1.25rem; line-height: 1.45; margin: .5rem 0 1.25rem;
  padding-left: .9rem; border-left: 4px solid var(--seal);
}
.quiz-answers { display: grid; gap: .5rem; }
button.answer {
  display: flex; gap: .7rem; align-items: flex-start; text-align: left; width: 100%;
  padding: .8rem .9rem; font-size: 1.02rem; line-height: 1.35; min-height: 3.2rem;
  background: var(--panel); border: 1px solid var(--rule);
}
button.answer .letter {
  flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 1px solid var(--sepia); color: var(--sepia);
  font-size: .82rem; line-height: 1.45rem; text-align: center; font-weight: 600;
  font-family: var(--display);
}
button.answer[aria-pressed="true"] {
  border-color: var(--seal); border-width: 2px; background: var(--panel-solid);
}
button.answer[aria-pressed="true"] .letter { background: var(--seal); color: #fdf6e6; border-color: var(--seal); }

/* ------------------------------------------------------------- intro step */
.intro { max-width: 38rem; }
.intro blockquote {
  margin: 0 0 1rem; padding: 1rem 1.15rem; border: 1px solid var(--rule);
  border-left: 4px solid var(--seal);
  background: var(--panel);
  font-size: 1.05rem; line-height: 1.55;
}
/* Capitular: the opening letter of the campaign blurb. */
.intro blockquote::first-letter {
  float: left; font-size: 3.4rem; line-height: .82; padding: .1rem .5rem .1rem 0;
  color: var(--seal); font-family: var(--display); font-weight: var(--head-weight);
}
.intro h3 {
  font-family: var(--display); font-variant: var(--head-variant); font-weight: var(--head-weight);
  margin: 1.5rem 0 .35rem; font-size: 1.08rem;
  letter-spacing: var(--head-ls); color: var(--sepia);
  border-bottom: 1px solid var(--rule); padding-bottom: .15rem;
}
.intro ul { margin: .25rem 0 0; padding-left: 1.2rem; }
.intro li { margin-bottom: .3rem; }

footer.credit { padding: 1rem 1.5rem 2rem; font-size: .78rem; color: var(--ink-soft); border-top: 1px solid var(--rule); }

/* ==================================================================== ornament
   The few things a colour token cannot say. All of it is decoration: remove
   the block and the sheet still works, just less distinctly. */

/* Flourished, centred rules on the viewer's headings and on the hero. */
.viewer section > h3 { text-align: center; }
.viewer section > h3::before { content: "❦ "; color: var(--gold); }
.viewer section > h3::after  { content: " ❦"; color: var(--gold); }
.viewer .hero { border-width: 2px; }
.viewer .hero h2 { text-align: center; }
.viewer .hero .line { text-align: center; }

/* =========================================================== the A4 sheet
   Never visible on screen: rendered into #print-area, which only @media
   print reveals, so the printer button produces the same sheet from any
   screen. The sheet's own tokens are separate from the app's because paper
   is always ink-light — black line art, no fills, no tints — while still
   keeping each theme's typographic voice.

   Layout, top to bottom:
     name + identity line
     vitals   AC / HP / initiative large, then four smaller boxes
     abband   the six abilities across the full width, save under each
     cols     58mm skills + table trackers | attacks, spells, features
     foot     equipment in two columns, then personality and history
========================================================================= */
.sheet {
  --s-ink:     #16110c;
  --s-rule:    #6d5942;
  --s-hair:    #b8a482;
  --s-label:   #6d5942;
  --s-accent:  #16110c;
  --s-display: var(--display);
  --s-orn:     "";

  width: 190mm; min-height: 277mm; padding: 0; background: #fffdf6;
  color: var(--s-ink); font-size: 8.6pt; line-height: 1.28;
  font-family: var(--serif);
  border: 1px solid var(--rule); box-shadow: 0 2px 14px rgba(43,33,24,.18);
}
.sheet + .sheet { margin-top: 1rem; }
.sheet .pad { padding: 4mm 5mm 5mm; }

/* ------------------------------------------------------------- ornament
   Every ornament on the sheet is inline SVG stroked in `currentColor`.
   That is not a style choice: of everything the print pipeline can paint,
   only text, borders and inline SVG are guaranteed. Chrome does not print
   background graphics unless the player ticks a box in the print dialog, so
   an ornament built from a background-image or a gradient would simply be
   absent on most people's paper. */
.sheet .orn { display: block; width: 100%; height: auto; color: var(--s-accent); }

/* The ruled frame, with an ornament at each corner. */
.sheet .frame { position: relative; border: .8pt solid var(--s-rule); padding: 2mm 3.4mm; }
.sheet .frame > .cnr { position: absolute; width: 5mm; height: 5mm; color: var(--s-accent); }
.sheet .frame > .cnr svg { display: block; width: 100%; height: 100%; }
.sheet .frame > .tl { top: -.5pt; left: -.5pt; }
.sheet .frame > .tr { top: -.5pt; right: -.5pt; transform: scaleX(-1); }
.sheet .frame > .bl { bottom: -.5pt; left: -.5pt; transform: scaleY(-1); }
.sheet .frame > .br { bottom: -.5pt; right: -.5pt; transform: scale(-1); }

/* The flourish under the name, and the one between the closing sections.
   Width-capped rather than height-capped: these keep their aspect ratio, so
   letting them span the full 183mm of the sheet would make them 11mm tall and
   the loudest thing on the page. */
.sheet .flourish { width: 64mm; margin: 1mm auto 1.6mm; }
.sheet .flourish.small { width: 40mm; margin: 1.2mm auto; }

/* A number inside a drawn shape: shield for AC, die for initiative, a
   cut-corner box for hit points. The SVG draws the outline, the text sits on
   top as real text, so it stays selectable and uses the theme's face. */
.sheet .shape { position: relative; }
.sheet .shape .lbl {
  position: absolute; left: 0; right: 0; top: 1.5mm; text-align: center;
  font-size: 5pt; font-variant: small-caps; letter-spacing: .04em; color: var(--s-label);
}
.sheet .shape .val {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 15.5pt; font-weight: 600; line-height: 1;
}
.sheet .shape .val small { font-size: 6.5pt; font-weight: 400; }
/* A shield carries its weight high, so a geometrically centred number reads as
   too high: nudge it down. */
.sheet .shape.shield .val { padding-top: 2.4mm; }
.sheet .shape.die .val { padding-top: .8mm; }

.sheet .sheetfoot {
  margin-top: 2mm; padding-top: .8mm; border-top: .4pt solid var(--s-hair);
  font-size: 5.6pt; font-variant: small-caps; letter-spacing: .06em;
  color: var(--s-label); display: flex; gap: 2mm;
}
.sheet .sheetfoot .r { margin-left: auto; }

.sheet h3 {
  font-family: var(--s-display); font-size: 8.4pt;
  font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: .07em;
  margin: 0 0 1.2mm; padding-bottom: .4mm;
  border-bottom: .7pt solid var(--s-accent); color: var(--s-accent);
}
.sheet h3::before { content: var(--s-orn); }
.sheet h3 .muted { font-family: var(--serif); letter-spacing: 0; }

/* --------------------------------------------------------------- header */
.sheet .hd {
  display: flex; align-items: flex-end; gap: 3mm;
  border-bottom: 1.6pt solid var(--s-ink); padding-bottom: 1.4mm; margin-bottom: 2.4mm;
}
.sheet .hd .who {
  font-family: var(--s-display); font-size: 16pt; line-height: 1.02;
  font-variant: var(--head-variant); font-weight: var(--head-weight);
  letter-spacing: .02em;
}
.sheet .hd .line { font-size: 8pt; color: var(--s-label); margin-left: auto; text-align: right; }

/* --------------------------------------------------------------- vitals */
.sheet .vitals {
  display: grid; grid-template-columns: repeat(3, 16.5mm) 1fr; gap: 2mm;
  margin-bottom: 2.4mm; align-items: stretch;
}
/* The four plain boxes stretch to the height of the drawn shapes beside them,
   so the row reads as one band instead of tall shapes with stubs next to it. */
.sheet .vitals .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5mm; }
.sheet .vitals .mini .box { display: grid; place-content: center; }
.sheet .box {
  border: .7pt solid var(--s-rule); border-radius: .6mm; padding: .8mm .5mm;
  text-align: center; overflow: hidden;
}
.sheet .box .k {
  font-size: 5.4pt; font-variant: small-caps; letter-spacing: .02em;
  color: var(--s-label); display: block; white-space: nowrap;
}
.sheet .box .v { font-size: 11.5pt; font-weight: 600; line-height: 1.12; display: block; }
.sheet .box .v small { font-size: 6.5pt; font-weight: 400; }
/* The three that get looked up most often, so they get the size. */
.sheet .box.big { border-width: 1.1pt; padding: 1mm .5mm 1.2mm; }
.sheet .box.big .k { font-size: 6pt; }
.sheet .box.big .v { font-size: 17pt; line-height: 1.05; }

/* ------------------------------------------------------- ability scores
   The six across the full width, in the shape everyone recognises: name,
   score, modifier, and the saving throw underneath. */
.sheet .abband { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.5mm; margin-bottom: 2.4mm; }
.sheet .abx {
  border: .7pt solid var(--s-rule); border-radius: .6mm;
  text-align: center; padding: .7mm .5mm .8mm;
}
.sheet .abx .n {
  display: block; font-size: 5.6pt; font-variant: small-caps;
  letter-spacing: .03em; color: var(--s-label); white-space: nowrap;
}
.sheet .abx .s { display: block; font-size: 13pt; font-weight: 600; line-height: 1.02; }
/* The modifier is the number actually rolled with, so it gets a drawn circle
   rather than sharing the box with the score. A perfect circle from a border,
   which prints; nothing here depends on a fill. */
.sheet .abx .m {
  display: grid; place-items: center; margin: .5mm auto .6mm;
  width: 6.9mm; height: 6.9mm; border: .8pt solid var(--s-accent); border-radius: 50%;
  font-size: 8pt; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1;
}
/* No rule above this: the modifier circle already separates it from the score,
   and a second line here read as the bottom of the box. */
.sheet .abx .sv {
  display: block; font-size: 5.8pt; color: var(--s-label);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sheet .abx.prof { border-width: 1.2pt; border-color: var(--s-ink); }

/* --------------------------------------------------------------- columns
   A balanced flow, not a grid. Two fixed columns must be as tall as the longer
   of the two, and on this sheet the short side wasted about 56mm of paper.
   Letting the same blocks flow means the browser evens them out.

   Most blocks may not be split — half a tracker at the foot of a column is
   worse than a ragged column — but the two long ones may, because a features
   list that cannot break would set the column height all by itself. */
.sheet .flow { columns: 2; column-gap: 5mm; }
.sheet .flow > div { break-inside: avoid; margin: 0 0 2.4mm; }
.sheet .flow > div.long { break-inside: auto; }
.sheet .flow h3 { break-after: avoid; }        /* never orphan a heading */
.sheet .flow .feat, .sheet .flow ul.sk li { break-inside: avoid; }

/* One column, not two: 18 skills read better in a single tall list than in
   two cramped ones, and the narrow column has the height to spare. */
ul.sk { list-style: none; margin: 0; padding: 0; }
ul.sk li {
  display: flex; gap: 1mm; align-items: baseline; line-height: 1.18;
  padding: .1mm 0; border-bottom: .3pt dotted var(--s-hair);
}
ul.sk li .dot { width: 3.2mm; flex: none; letter-spacing: -.4mm; }
ul.sk li .mod { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
ul.sk li .ab { color: var(--s-label); font-size: 5.8pt; }
ul.sk li.prof { font-weight: 600; }

/* Three columns and a notes line, sized so nothing wraps inside a 94mm column. */
table.atk { width: 100%; border-collapse: collapse; }
table.atk th {
  font-size: 5.6pt; color: var(--s-label); font-variant: small-caps;
  text-align: left; border-bottom: .5pt solid var(--s-rule); padding-right: 1.5mm;
}
table.atk td { padding: .45mm 1.5mm .45mm 0; border-bottom: .3pt dotted var(--s-hair); vertical-align: top; }
table.atk td.c, table.atk th.c { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.atk th.c { text-align: center; }
table.atk td.wp { font-weight: 600; }
/* A weapon and its notes are one entry, so no rule runs between them. */
table.atk tr.nb td { border-bottom: 0; }
table.atk td.n2 {
  padding: 0 0 .5mm 3.2mm; font-size: 7.2pt; color: var(--s-label);
  border-bottom: .3pt dotted var(--s-hair);
}

.sheet .eq { line-height: 1.18; }
.sheet .eq > div { padding: .1mm 0; }
.sheet .kv { font-size: 8pt; }
.sheet .kv b { font-variant: small-caps; letter-spacing: .02em; }
.sheet .kv > div { padding: .25mm 0; }
.sheet .feat { margin-bottom: 1.1mm; }
.sheet .feat b { font-family: var(--s-display); font-variant: var(--head-variant); letter-spacing: .02em; }
.sheet .writein { border-bottom: .3pt solid var(--s-hair); height: 3.4mm; }
.sheet .muted { color: var(--s-label); }
.sheet .slots { display: flex; gap: 1mm; align-items: center; }
.sheet .pip { width: 2.6mm; height: 2.6mm; border: .7pt solid var(--s-ink); border-radius: 50%; display: inline-block; }
/* The equipment and the history are blocks in the same flow as everything else,
   so they are already inside a column: no sub-columns here, or the text ends up
   in 45mm strips. */
.sheet .story p { margin: 0 0 1mm; break-inside: avoid; }

/* Blank spaces the player fills in during play, not generated values. */
.sheet .track { font-size: 7.6pt; }
.sheet .track > div { display: flex; align-items: baseline; gap: 1mm; padding: .5mm 0; border-bottom: .3pt dotted var(--s-hair); }
.sheet .track > div > span:first-child { color: var(--s-label); white-space: nowrap; }
.sheet .track .rule { flex: 1; border-bottom: .4pt solid var(--s-ink); height: 3mm; }
.sheet .track .deaths { flex-wrap: wrap; }
.sheet .track .pips { display: inline-flex; align-items: center; gap: .8mm; color: var(--s-label); font-size: 6.4pt; }
.sheet .track .pips .pip { width: 2.2mm; height: 2.2mm; }

/* Page 2, the spell list. Four boxes across, then one table per group. */
.sheet .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5mm; margin-bottom: 2mm; }
table.sp { width: 100%; border-collapse: collapse; font-size: 8pt; }
table.sp th {
  font-size: 5.6pt; color: var(--s-label); font-variant: small-caps;
  text-align: left; border-bottom: .5pt solid var(--s-rule); padding-right: 1mm;
}
table.sp td { padding: .55mm 1.5mm .55mm 0; border-bottom: .3pt dotted var(--s-hair); vertical-align: top; line-height: 1.18; }
table.sp td.nm { font-weight: 600; width: 32mm; }
table.sp td.meta { width: 42mm; font-size: 6.8pt; color: var(--s-label); }
table.sp .sum { color: var(--s-ink); }

/* ============================================================ PRINT
   Only #print-area exists on paper. The whole app is hidden, so the printer
   button produces the same A4 sheet from the roster, the wizard, the viewer
   or the editor. Ink-light in every theme: the fills, tints and textures are
   a screen affordance and are stripped here. What survives per theme is the
   typographic voice — the display face, the rule work and the ornament. */
#print-area { display: none; }

@media print {
  html, body {
    background: #fff !important; color: #000 !important;
    margin: 0; padding: 0; line-height: 1.28;
  }
  #app { display: none !important; }
  #print-area { display: block !important; }

  .sheet {
    --s-ink: #000; --s-rule: #000; --s-hair: #555; --s-label: #333; --s-accent: #000;
    width: auto; min-height: 0; border: 0 !important; box-shadow: none !important;
    background: #fff !important; color: #000 !important;
    break-inside: avoid;
  }
  .sheet .pad { padding: 0; }
  .sheet + .sheet { margin-top: 0; break-before: page; }

  @page { size: A4; margin: 8mm; }

  /* Small-caps IM Fell, a flourish before each heading and a double rule
     under it, the way a printed page of the period would set it. */
  .sheet {
    --s-display: "IM Fell English SC", var(--serif);
    --s-orn: "❦ ";
  }
  .sheet h3 {
    border-bottom: 2.2pt double var(--s-accent); padding-bottom: .2mm; letter-spacing: .04em;
  }
  .sheet .hd { border-bottom-style: double; border-bottom-width: 3pt; }
  .sheet h3::before { font-family: var(--serif); font-size: 7pt; }
}

<script id="engine">
/* ================================================================= ENGINE
   Pure functions. No DOM, no state mutation: every function takes what it
   needs and returns a value, so each rule can be checked by hand.
========================================================================= */

const byKey = (list, key) => list.find(x => x.key === key);
const skill = key => byKey(SKILLS, key);
const weapon = key => byKey(WEAPONS, key);
const armor = key => byKey(ARMORS, key);

const signed = n => (n >= 0 ? `+${n}` : `${n}`);
const abilityMod = score => Math.floor((score - 10) / 2);

/** Point-buy cost of one score, or null if outside the legal 8..15 range. */
function buyCost(score) {
  return POINT_BUY_COST[score] ?? null;
}

/** Total points spent across the six purchased scores. */
function buySpent(buy) {
  return ABILITIES.reduce((sum, a) => sum + (buyCost(buy[a.key]) ?? 0), 0);
}

/**
 * Final ability scores: purchased values plus the background improvement.
 * The 8..15 range applies to the purchase only; the background can push a
 * score to 17, which is the single most misread part of the 2024 rules.
 */
function finalScores(state) {
  const out = {};
  for (const a of ABILITIES) out[a.key] = state.buy[a.key];
  for (const [key, bonus] of Object.entries(state.boosts || {})) {
    if (out[key] != null) out[key] += bonus;
  }
  return out;
}

function mods(scores) {
  const out = {};
  for (const a of ABILITIES) out[a.key] = abilityMod(scores[a.key]);
  return out;
}

/** Every mechanical hook granted by species, background feat and class. */
function hooks(state) {
  const sp = SPECIES[state.species];
  const bg = BACKGROUNDS[state.background];
  const feats = [];
  if (bg) feats.push(bg.feat);
  if (state.extraFeat) feats.push(state.extraFeat);   // Human's Versatile

  let hpPerLevel = 0, initiativeProficiency = false, unarmed = null;
  if (sp?.grants?.hpPerLevel) hpPerLevel += sp.grants.hpPerLevel;
  for (const f of feats) {
    const h = ORIGIN_FEATS[f]?.hooks || {};
    if (h.hpPerLevel) hpPerLevel += h.hpPerLevel;
    if (h.initiativeProficiency) initiativeProficiency = true;
    if (h.unarmed) unarmed = h.unarmed;
  }
  return { feats, hpPerLevel, initiativeProficiency, unarmed };
}

/** Hit points at level 1: max hit die + CON mod + per-level bonuses. */
function hitPoints(state, m) {
  const cls = CLASSES[state.class];
  if (!cls) return null;
  const h = hooks(state);
  return cls.hitDie + m.CON + h.hpPerLevel;
}

/**
 * What the character is actually carrying, merged from the chosen class and
 * background packages. Single source for AC, attacks and the equipment list,
 * so the sheet can never disagree with the package that was picked.
 */
function loadout(state) {
  const packs = [
    CLASSES[state.class]?.equipment?.[state.equipmentClass],
    BACKGROUNDS[state.background]?.equipment?.[state.equipmentBackground],
  ].filter(Boolean);

  const items = [];
  let gp = 0, armorKey = 'ninguna', shield = false;
  const weapons = [];

  for (const p of packs) {
    items.push(...(p.items || []));
    gp += p.gp || 0;
    const g = p.grants || {};
    // Heaviest armor wins when both packages grant one.
    if (g.armor && (armor(g.armor)?.ca ?? 0) > (armor(armorKey)?.ca ?? 0)) armorKey = g.armor;
    if (g.shield) shield = true;
    for (const w of g.weapons || []) if (!weapons.includes(w)) weapons.push(w);
  }
  return { items, gp, armor: armorKey, shield, weapons };
}

/** Armor Class from the equipped armor and shield. */
function armorClass(state, m) {
  const kit = loadout(state);
  const a = armor(kit.armor) || armor('ninguna');
  let ca = a.ca;
  // 'full' adds Dexterity outright, a number caps it (a negative one still
  // applies), 'none' means heavy armour where Dexterity does not count at all.
  if (a.dex === 'full') ca += m.DES;
  else if (typeof a.dex === 'number') ca += Math.min(m.DES, a.dex);
  if (kit.shield) ca += 2;
  if (state.fightingStyle === 'defensa' && a.key !== 'ninguna') ca += 1;

  // Unarmored Defense only applies with no armor. The Barbarian may still use
  // a shield; the Monk may not, so each class declares it.
  const ud = CLASSES[state.class]?.unarmoredDefense;
  if (ud && a.key === 'ninguna' && !(kit.shield && !ud.shield)) {
    ca = Math.max(ca, 10 + m.DES + m[ud.ability] + (kit.shield && ud.shield ? 2 : 0));
  }
  return ca;
}

/** Warns when the armor's Strength requirement is not met. */
function armorPenalty(state, scores) {
  const a = armor(loadout(state).armor);
  if (!a || !a.str) return null;
  if (scores.FUE >= a.str) return null;
  return `${a.es} pide Fuerza ${a.str} y tienes ${scores.FUE}: tu velocidad baja 3 m.`;
}

/** Set of skill keys the character is proficient in, and which are expertise. */
function skillProficiencies(state) {
  const prof = new Set();
  const expertise = new Set();
  const bg = BACKGROUNDS[state.background];
  if (bg) bg.skills.forEach(s => prof.add(s));
  for (const s of state.classSkills || []) prof.add(s);
  for (const s of state.speciesSkills || []) prof.add(s);
  for (const s of state.featSkills || []) prof.add(s);
  for (const s of state.expertise || []) if (prof.has(s)) expertise.add(s);
  return { prof, expertise };
}

/** Skills granted automatically, mapped to where they came from. */
function grantedSkillSources(state) {
  const src = new Map();
  const bg = BACKGROUNDS[state.background];
  if (bg) bg.skills.forEach(s => src.set(s, bg.es));
  for (const s of state.speciesSkills || []) if (!src.has(s)) src.set(s, SPECIES[state.species]?.es || 'Especie');
  for (const s of state.featSkills || []) if (!src.has(s)) src.set(s, 'Dote');
  return src;
}

function skillRow(key, m, prof, expertise) {
  const sk = skill(key);
  const base = m[sk.ability];
  const bonus = expertise.has(key) ? PROFICIENCY_BONUS * 2 : prof.has(key) ? PROFICIENCY_BONUS : 0;
  return { ...sk, total: base + bonus, prof: prof.has(key), expertise: expertise.has(key) };
}

function saves(state, m) {
  const cls = CLASSES[state.class];
  const profSaves = new Set(cls?.saves || []);
  return ABILITIES.map(a => ({
    ...a,
    prof: profSaves.has(a.key),
    total: m[a.key] + (profSaves.has(a.key) ? PROFICIENCY_BONUS : 0),
  }));
}

/** Walking speed in metres. A lineage may override the species value. */
function speed(state) {
  const sp = SPECIES[state.species];
  if (!sp) return null;
  return sp.lineages?.[state.lineage]?.speed ?? sp.speed;
}

/** Size, either fixed by the species or chosen by the player. */
function size(state) {
  const sp = SPECIES[state.species];
  if (!sp) return null;
  return sp.size.length === 1 ? sp.size[0] : (state.size || null);
}

function initiative(state, m) {
  const h = hooks(state);
  return m.DES + (h.initiativeProficiency ? PROFICIENCY_BONUS : 0);
}

function passivePerception(m, prof, expertise) {
  return 10 + skillRow('percepcion', m, prof, expertise).total;
}

/**
 * Armor and weapon proficiency, after the level-1 class choices that widen it:
 * the Cleric's Protector order and the Druid's Guardian order.
 */
function proficiencies(state) {
  const cls = CLASSES[state.class];
  if (!cls) return { armor: [], weapons: [], weaponProf: { simple: false, martial: false } };
  const armorList = [...cls.armor];
  const weaponList = [...cls.weapons];
  const wp = { ...cls.weaponProf };

  if (state.divineOrder === 'protector') {
    if (!armorList.includes('pesadas')) armorList.push('pesadas');
    if (wp.martial !== 'todas') { wp.martial = 'todas'; weaponList.push('marciales'); }
  }
  if (state.primalOrder === 'guardian') {
    if (!armorList.includes('medias')) armorList.push('medias');
    if (wp.martial !== 'todas') { wp.martial = 'todas'; weaponList.push('marciales'); }
  }
  return { armor: armorList, weapons: weaponList, weaponProf: wp };
}

/** Whether the character is proficient with a given weapon. */
function proficientWithWeapon(state, w) {
  const wp = proficiencies(state).weaponProf;
  if (w.cat === 'simple') return !!wp.simple;
  const has = p => w.props.some(x => x.startsWith(p));
  switch (wp.martial) {
    case 'todas': return true;
    case 'sutil-o-ligera': return has('sutil') || has('ligera');
    case 'ligera': return has('ligera');
    default: return false;
  }
}

/**
 * A Monk's Martial Arts lets Dexterity replace Strength on unarmed strikes and
 * on "monk weapons": Simple melee, or Martial melee with Ligera, never Pesada
 * or a dos manos.
 */
function isMonkWeapon(w) {
  if (!w.melee) return false;
  const has = p => w.props.some(x => x.startsWith(p));
  if (has('pesada') || has('a dos manos')) return false;
  return w.cat === 'simple' || has('ligera');
}

/** Attack rows for the character's chosen weapons, plus unarmed when it matters. */
function attacks(state, m) {
  const masteries = new Set(state.masteries || []);
  const cls = CLASSES[state.class];
  const martialArts = cls?.martialArts;

  const rows = loadout(state).weapons.map(key => {
    const w = weapon(key);
    if (!w) return null;
    const proficient = proficientWithWeapon(state, w);
    const finesse = w.props.some(p => p.startsWith('sutil'));
    const dexAllowed = !w.melee || finesse || (martialArts && isMonkWeapon(w));
    const useDex = dexAllowed && m.DES >= m.FUE;
    const abilityKey = useDex ? 'DES' : 'FUE';
    const mod = m[abilityKey];
    return {
      key,
      name: w.es,
      en: w.en,
      ability: abilityKey,
      attack: mod + (proficient ? PROFICIENCY_BONUS : 0),
      damage: `${w.dmg}${mod ? ' ' + signed(mod) : ''} ${DAMAGE_TYPES[w.type]}`,
      props: w.props,
      mastery: masteries.has(key) ? MASTERIES[w.mastery] : null,
      proficient,
    };
  }).filter(Boolean);

  // Unarmed strike, listed only when something makes it worth rolling.
  const h = hooks(state);
  const unarmedDie = martialArts || h.unarmed;
  if (unarmedDie) {
    const useDex = martialArts ? m.DES >= m.FUE : false;
    const mod = useDex ? m.DES : m.FUE;
    rows.push({
      key: 'unarmed',
      name: 'Golpe sin armas',
      en: 'Unarmed Strike',
      ability: useDex ? 'DES' : 'FUE',
      attack: mod + PROFICIENCY_BONUS,
      damage: `${unarmedDie}${mod ? ' ' + signed(mod) : ''} ${DAMAGE_TYPES.c}`,
      props: martialArts ? ['artes marciales'] : ['camorrista'],
      mastery: null,
      proficient: true,
    });
  }
  return rows;
}

/** Level-1 spellcasting numbers, or null for a character who does not cast. */
function spellcasting(state, m) {
  const cls = CLASSES[state.class];
  if (!cls?.casting) return null;
  const ab = cls.casting.ability;
  return {
    ability: ab,
    abilityName: byKey(ABILITIES, ab).es,
    dc: 8 + PROFICIENCY_BONUS + m[ab],
    attack: PROFICIENCY_BONUS + m[ab],
    cantrips: cls.casting.cantrips || 0,
    prepared: cls.casting.prepared ?? null,
    known: cls.casting.known ?? null,
    slots: cls.casting.slots1 || 0,
    ritual: !!cls.casting.ritual,
  };
}

/* Spells are identified by their English name, which is unique in the table. */
const spellByEn = en => SPELLS.find(s => s.en === en) || null;

/** The spells one class list offers at a given level. */
function spellList(classKey, lvl) {
  return SPELLS.filter(s => s.lvl === lvl && s.classes.includes(classKey))
    .sort((a, b) => a.es.localeCompare(b.es, 'es'));
}

/** Does this character have a Magic Initiate feat, and from which list? */
function magicInitiateFeat(state) {
  const h = hooks(state);
  if (!h.feats.includes('iniciado')) return null;
  return state.magicInitiate || { list: null, cantrips: [], level1: null };
}

/**
 * Every spell the character has, grouped by where it came from. Species and
 * feat spells are separate from class spells because they do not use the
 * class's spell slots.
 */
function extraSpellSources(state) {
  const out = [];
  const sp = SPECIES[state.species];
  if (sp?.grants?.cantrips?.length) {
    out.push({ from: sp.es, cantrips: sp.grants.cantrips, level1: [] });
  }
  const lineage = sp?.lineages?.[state.lineage];
  if (lineage?.cantrips?.length) {
    out.push({ from: lineage.es, cantrips: lineage.cantrips, level1: [] });
  }
  const mi = magicInitiateFeat(state);
  if (mi && (mi.cantrips?.length || mi.level1)) {
    out.push({
      from: `Iniciado en la magia (${MAGIC_INITIATE_LISTS[mi.list]?.es || '—'})`,
      cantrips: mi.cantrips || [],
      level1: mi.level1 ? [mi.level1] : [],
    });
  }
  return out;
}

/** True when there is anything at all to put on a spell sheet. */
function castsAnything(state) {
  if (CLASSES[state.class]?.casting) return true;
  const sp = SPECIES[state.species];
  if (sp?.grants?.cantrips?.length) return true;
  if (sp?.lineages?.[state.lineage]?.cantrips?.length) return true;
  return !!magicInitiateFeat(state);
}

/** Class cantrips and level-1 spells the player has actually picked. */
function chosenClassSpells(state) {
  return {
    cantrips: (state.spells?.cantrips || []).map(spellByEn).filter(Boolean),
    level1: (state.spells?.level1 || []).map(spellByEn).filter(Boolean),
  };
}

/** Full derived character. One call, everything the sheet needs. */
function derive(state) {
  const scores = finalScores(state);
  const m = mods(scores);
  const { prof, expertise } = skillProficiencies(state);
  return {
    scores, mods: m,
    hp: hitPoints(state, m),
    ca: armorClass(state, m),
    initiative: initiative(state, m),
    saves: saves(state, m),
    skills: SKILLS.map(s => skillRow(s.key, m, prof, expertise)),
    passivePerception: passivePerception(m, prof, expertise),
    attacks: attacks(state, m),
    casting: spellcasting(state, m),
    extraSpells: extraSpellSources(state),
    classSpells: chosenClassSpells(state),
    hooks: hooks(state),
    loadout: loadout(state),
    proficiencies: proficiencies(state),
    speed: speed(state),
    size: size(state),
    armorPenalty: armorPenalty(state, scores),
  };
}

/* ============================================================ QUIZ ENGINE
   Pure: takes the answers and returns a complete, legal proposal for the
   background, ability spread, skills, equipment and spells. It never writes
   to the state — the app applies it, and the player can change all of it.
========================================================================= */

/** Adds every selected answer's weights into one bucket per channel. */
function quizWeights(answers) {
  const acc = { bg: {}, ab: {}, sk: {}, kit: {}, tone: {} };
  for (const q of QUIZ) {
    const pick = answers?.[q.id];
    if (pick == null) continue;
    const w = q.options[pick]?.w;
    if (!w) continue;
    for (const channel of ['bg', 'ab', 'sk', 'kit', 'tone']) {
      for (const [key, value] of Object.entries(w[channel] || {})) {
        acc[channel][key] = (acc[channel][key] || 0) + value;
      }
    }
  }
  return acc;
}

/** Keys of a score bucket, highest first, ties broken alphabetically. */
function ranked(bucket) {
  return Object.entries(bucket)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([key]) => key);
}

const quizAnswered = answers => QUIZ.filter(q => answers?.[q.id] != null).length;

/**
 * Ability priority. The quiz gives the flavour, but the class decides what the
 * character actually needs, so its primary abilities get a decisive bonus and
 * Constitution a small one — nobody at level 1 wants a d6 class with CON 8.
 */
function abilityPriority(state, weights) {
  const cls = CLASSES[state.class];
  const score = {};
  for (const a of ABILITIES) {
    score[a.key] = (weights.ab[a.key] || 0)
      + (cls?.primary?.includes(a.key) ? 20 : 0)
      + (a.key === 'CON' ? 4 : 0);
  }
  // A spellcasting class must not end up with a weak casting ability.
  if (cls?.casting) score[cls.casting.ability] += 20;

  const order = ranked(score);

  // Constitution must land in the top three, which is a 13 or better on the
  // standard spread. A level-1 character with CON 12 and three players at the
  // table goes down too easily for the quiz to hand that out by accident.
  const at = order.indexOf('CON');
  if (at > 2) {
    order.splice(at, 1);
    order.splice(2, 0, 'CON');
  }
  return order;
}

/**
 * The standard 27-point spread, handed out in priority order, plus the
 * background improvement placed as high up that order as the background allows.
 */
const QUIZ_SPREAD = Object.freeze([15, 14, 13, 12, 10, 8]);

function allocateAbilities(priority, backgroundKey) {
  const buy = {};
  priority.forEach((key, i) => { buy[key] = QUIZ_SPREAD[i]; });

  // +2/+1, both restricted to the three abilities the background offers.
  const allowed = BACKGROUNDS[backgroundKey]?.abilities || [];
  const byPriority = priority.filter(k => allowed.includes(k));
  const boosts = {};
  if (byPriority[0]) boosts[byPriority[0]] = 2;
  if (byPriority[1]) boosts[byPriority[1]] = 1;
  return { buy, boosts };
}

/** The package that best matches a fighting style, never the gold-only one. */
function packageForStyle(cls, style) {
  const entries = Object.entries(cls?.equipment || {}).filter(([, p]) => (p.items || []).length);
  if (!entries.length) return Object.keys(cls?.equipment || { A: 1 })[0];

  const score = ([, p]) => {
    const weapons = (p.grants?.weapons || []).map(weapon).filter(Boolean);
    const has = pred => weapons.some(pred);
    const prop = (w, name) => w.props.some(x => x.startsWith(name));
    let n = 0;
    if (style === 'distancia' && has(w => !w.melee)) n += 3;
    if (style === 'cuerpo' && has(w => w.melee && !prop(w, 'ligera'))) n += 2;
    if (style === 'cuerpo' && (p.grants?.shield || armor(p.grants?.armor || 'ninguna')?.cat === 'pesada')) n += 2;
    if (style === 'sutil' && has(w => prop(w, 'sutil') || prop(w, 'ligera'))) n += 3;
    if (style === 'apoyo' && p.grants?.shield) n += 2;
    return n;
  };
  return entries.slice().sort((a, b) => score(b) - score(a))[0][0];
}

/** Class skills, chosen by affinity and skipping anything already granted. */
function pickClassSkills(state, weights, backgroundKey) {
  const cls = CLASSES[state.class];
  if (!cls) return [];
  const taken = new Set([
    ...(BACKGROUNDS[backgroundKey]?.skills || []),
    ...(state.speciesSkills || []),
  ]);
  const pool = cls.skills.from.filter(k => !taken.has(k));
  const order = pool.slice().sort((a, b) =>
    (weights.sk[b] || 0) - (weights.sk[a] || 0) || a.localeCompare(b));
  return order.slice(0, cls.skills.n);
}

/** Spells from the curated list, trimmed to what the class may actually take. */
function pickSpells(state, slant) {
  const cls = CLASSES[state.class];
  if (!cls?.casting) return { cantrips: [], level1: [] };
  const picks = SPELL_PICKS[state.class]?.[slant];
  if (!picks) return { cantrips: [], level1: [] };

  const legal = (names, lvl) => {
    const allowed = new Set(spellList(state.class, lvl).map(s => s.en));
    return names.filter(n => allowed.has(n));
  };
  const wantL1 = cls.casting.book ?? cls.casting.prepared ?? cls.casting.known ?? 0;
  return {
    cantrips: legal(picks.c, 0).slice(0, cls.casting.cantrips),
    level1: legal(picks.l, 1).slice(0, wantL1),
  };
}

/**
 * Weapon masteries. Mastery only pays off on a weapon you actually swing, so
 * the ones in the chosen starting package come first; after that, whatever
 * fits the fighting style and hits hardest, so the count is always filled.
 */
function pickMasteries(state, cls, style, carried = []) {
  const usable = WEAPONS.filter(w => proficientWithWeapon(state, w));
  const wantsRanged = style === 'distancia';
  const fitsStyle = w => wantsRanged ? !w.melee
    : style === 'sutil' ? w.props.some(p => p.startsWith('sutil') || p.startsWith('ligera'))
    : w.melee;

  // Average damage, only used to break ties sensibly.
  const avg = w => {
    const m = /^(\d+)d(\d+)$/.exec(w.dmg);
    return m ? Number(m[1]) * (Number(m[2]) + 1) / 2 : Number(w.dmg) || 0;
  };
  const score = w =>
    (carried.includes(w.key) ? 100 : 0) +
    (fitsStyle(w) ? 20 : 0) +
    (w.cat === 'marcial' ? 5 : 0) +
    avg(w);

  return usable.slice().sort((a, b) => score(b) - score(a) || a.key.localeCompare(b.key))
    .slice(0, cls.mastery.n).map(w => w.key);
}

/** The full proposal. `null` until the questionnaire is finished. */
function quizResult(state) {
  const answers = state.quiz?.answers || {};
  if (quizAnswered(answers) < QUIZ.length) return null;

  const weights = quizWeights(answers);
  const background = ranked(weights.bg)[0] || 'trotamundos';
  const priority = abilityPriority(state, weights);
  const { buy, boosts } = allocateAbilities(priority, background);
  const style = ranked(weights.kit)[0] || 'cuerpo';
  const tones = ranked(weights.tone).slice(0, 3);

  const cls = CLASSES[state.class];
  const classSkills = pickClassSkills(state, weights, background);

  // Expertise, for the Rogue, follows the same affinity order.
  let expertise = [];
  if (cls?.expertise) {
    const proficient = [...new Set([...classSkills, ...(BACKGROUNDS[background]?.skills || []),
      ...(state.speciesSkills || [])])];
    expertise = proficient
      .sort((a, b) => (weights.sk[b] || 0) - (weights.sk[a] || 0) || a.localeCompare(b))
      .slice(0, cls.expertise.n);
  }

  // A support-leaning character gets the support spell list.
  const slant = (style === 'apoyo' || tones[0] === 'protector') ? 'apoyo' : 'ofensivo';

  // Masteries need to know the equipment first: they follow what you carry.
  const equipmentClass = cls ? packageForStyle(cls, style) : 'A';
  const carried = cls?.equipment?.[equipmentClass]?.grants?.weapons || [];

  return {
    background, priority, buy, boosts, style, tones, classSkills, expertise, slant,
    equipmentClass,
    equipmentBackground: 'A',
    spells: pickSpells(state, slant),
    // Class choices the quiz can settle without the player going back.
    fightingStyle: cls?.features?.some(f => f.choice === 'fightingStyle')
      ? (style === 'distancia' ? 'arqueria' : style === 'sutil' ? 'dosarmas' : 'defensa') : null,
    divineOrder: cls?.features?.some(f => f.choice === 'divineOrder')
      ? (style === 'cuerpo' ? 'protector' : 'taumaturgo') : null,
    primalOrder: cls?.features?.some(f => f.choice === 'primalOrder')
      ? (style === 'cuerpo' ? 'guardian' : 'mago') : null,
    masteries: cls?.mastery ? pickMasteries(state, cls, style, carried) : [],
  };
}

/**
 * Non-blocking notices. Order matters: `error` entries mean the step is
 * incomplete, `warn` entries are advice a player is free to ignore.
 */
function validate(state) {
  const out = [];
  const push = (level, step, text) => out.push({ level, step, text });

  if (!state.name?.trim()) push('error', 'concepto', 'El personaje no tiene nombre.');
  if (!state.species) push('error', 'especie', 'Falta elegir especie.');
  if (!state.class) push('error', 'clase', 'Falta elegir clase.');
  if (!state.background) push('error', 'trasfondo', 'Falta elegir trasfondo.');

  const sp = SPECIES[state.species];
  if (sp?.lineages && !state.lineage) push('error', 'especie', `Falta elegir el linaje de ${sp.es}.`);
  if (sp?.size?.length > 1 && !state.size) push('error', 'especie', 'Falta elegir tamaño.');

  const cls = CLASSES[state.class];
  if (cls) {
    const need = cls.skills.n, have = (state.classSkills || []).length;
    if (have < need) push('error', 'habilidades', `Te faltan ${need - have} habilidad(es) de ${cls.es}.`);
    if (cls.mastery && (state.masteries || []).length < cls.mastery.n) {
      push('error', 'clase', `Te faltan armas con maestría (${(state.masteries||[]).length} de ${cls.mastery.n}).`);
    }
    if (cls.features?.some(f => f.choice === 'fightingStyle') && !state.fightingStyle) {
      push('error', 'clase', 'Falta elegir estilo de combate.');
    }
    if (cls.features?.some(f => f.choice === 'divineOrder') && !state.divineOrder) {
      push('error', 'clase', 'Falta elegir orden divina.');
    }
    if (cls.features?.some(f => f.choice === 'primalOrder') && !state.primalOrder) {
      push('error', 'clase', 'Falta elegir orden primigenia.');
    }
    if (cls.expertise && (state.expertise || []).length < cls.expertise.n) {
      push('error', 'habilidades', `Te falta elegir experticia (${(state.expertise||[]).length} de ${cls.expertise.n}).`);
    }
  }

  const bg = BACKGROUNDS[state.background];
  if (bg) {
    const spent = Object.values(state.boosts || {}).reduce((a, b) => a + b, 0);
    if (spent !== 3) push('error', 'trasfondo', 'Falta repartir las mejoras de puntuación del trasfondo (+2/+1 o +1/+1/+1).');
  }

  if (cls?.casting) {
    const c = cls.casting;
    const nCantrips = (state.spells?.cantrips || []).length;
    const nLevel1 = (state.spells?.level1 || []).length;
    const wantLevel1 = c.book ?? c.prepared ?? c.known ?? 0;
    if (nCantrips < c.cantrips) push('error', 'conjuros', `Te faltan ${c.cantrips - nCantrips} truco(s).`);
    if (nLevel1 < wantLevel1) push('error', 'conjuros', `Te faltan ${wantLevel1 - nLevel1} conjuro(s) de nivel 1.`);
  }
  const mi = magicInitiateFeat(state);
  if (mi) {
    if (!mi.list) push('error', 'conjuros', 'Falta elegir la lista de Iniciado en la magia.');
    else {
      if ((mi.cantrips || []).length < 2) push('error', 'conjuros', 'Iniciado en la magia: te faltan trucos.');
      if (!mi.level1) push('error', 'conjuros', 'Iniciado en la magia: falta el conjuro de nivel 1.');
    }
  }

  const spentPoints = buySpent(state.buy);
  if (spentPoints > POINT_BUY_TOTAL) push('error', 'puntos', `Te has pasado: ${spentPoints} de ${POINT_BUY_TOTAL} puntos.`);
  else if (spentPoints < POINT_BUY_TOTAL) push('warn', 'puntos', `Te quedan ${POINT_BUY_TOTAL - spentPoints} puntos por gastar.`);

  // advice, never blocking
  if (cls && state.class) {
    const scores = finalScores(state);
    const best = cls.primary.reduce((a, b) => (scores[a] >= scores[b] ? a : b));
    if (scores[best] < 14) {
      push('warn', 'puntos', `${cls.es} funciona mejor con ${cls.primary.map(k => byKey(ABILITIES,k).es).join(' o ')} alta; ahora la mejor está en ${scores[best]}.`);
    }
  }
  const pen = state.class ? armorPenalty(state, finalScores(state)) : null;
  if (pen) push('warn', 'equipo', pen);

  return out;
}
</script>

<script id="app">
/* ==================================================================== APP
   One serializable `state` object is the single source of truth. Inputs
   write to it and call render(); nothing is ever read back out of the DOM.
========================================================================= */

const STORAGE_KEY = 'dnd-creator-v2';
const OLD_STORAGE_KEY = 'dnd-creator-v1';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ---------------------------------------------------------------- storage
   One library holds every character. `state` always points at the character
   being worked on, so every existing view keeps working unchanged.
====================================================================== */

function blankCharacter() {
  return {
    id: newId(),
    updatedAt: Date.now(),
    wizardStep: 0,
    wizardDone: false,
    name: '', player: '', appearance: '', portrait: null,
    species: null, lineage: null, size: null, speciesSkills: [], extraFeat: null,
    class: null, classSkills: [], masteries: [], expertise: [], fightingStyle: null,
    divineOrder: null, primalOrder: null,
    quiz: { answers: {}, applied: false },
    background: null, boosts: {}, featSkills: [], featTools: [], magicInitiate: null,
    buy: { FUE: 8, DES: 8, CON: 8, INT: 8, SAB: 8, CAR: 8 },
    equipmentClass: 'A', equipmentBackground: 'A',
    spells: { cantrips: [], level1: [] },
    story: { personality: '', ideals: '', bonds: '', flaws: '', backstory: '', ties: '' },
  };
}

function newId() {
  return 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
}

let library = loadLibrary();
let state = null;                    // the character currently open, or null
let screen = 'roster';               // roster | wizard | view | edit

function loadLibrary() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed?.version === 2 && Array.isArray(parsed.characters)) {
        return { version: 2, characters: parsed.characters.map(normalise) };
      }
    }
    // A v1 save held a single character. Carry it over instead of losing it.
    const old = localStorage.getItem(OLD_STORAGE_KEY);
    if (old) {
      const one = JSON.parse(old);
      if (one && typeof one === 'object') {
        return { version: 2, characters: [normalise(one)] };
      }
    }
  } catch (e) { /* corrupt or private mode: start clean */ }
  return { version: 2, characters: [] };
}

/** Fills in anything a stored character is missing, so old saves stay usable. */
function normalise(c) {
  const merged = Object.assign(blankCharacter(), c);
  merged.id = c.id || newId();
  merged.quiz = Object.assign({ answers: {}, applied: false }, c.quiz);
  merged.spells = Object.assign({ cantrips: [], level1: [] }, c.spells);
  merged.story = Object.assign(
    { personality: '', ideals: '', bonds: '', flaws: '', backstory: '', ties: '' }, c.story);
  merged.portrait = c.portrait
    ? { src: typeof c.portrait.src === 'string' ? c.portrait.src : null,
        stamp: typeof c.portrait.stamp === 'string' ? c.portrait.stamp : null }
    : null;
  delete merged.step;                // v1 field, replaced by wizardStep
  return merged;
}

/** A portrait resolves to whatever it holds — no folder scan here to walk a
    `src` back to disk, so a hand-authored path is shown as-is, best effort. */
function portraitSrc(p) {
  return p ? (p.stamp || p.src || null) : null;
}

function portraitWidget(charId, name, portrait, big) {
  const src = portraitSrc(portrait);
  const initials = String(name || '').trim().split(/\s+/).slice(0, 2)
    .map(w => w[0] || '').join('').toUpperCase();
  return `<div class="portrait${big ? ' big' : ''}" data-portrait-for="${esc(charId)}"
      role="button" tabindex="0" title="Cambiar retrato"
      aria-label="Cambiar retrato de ${esc(name || 'Sin nombre')}">
    ${src ? `<img src="${esc(src)}" alt="">` : `<span class="ini">${esc(initials)}</span>`}
  </div>`;
}

/** Downscaled to 512 px and re-encoded as JPEG before it is embedded: a
    portrait is a thumbnail and a token icon, never a full-bleed image, so it
    stays cheap against the same 5 MB ceiling `readImage()` in the DM app
    watches for the battlemap. */
function readPortrait(file, charId) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(512, img.naturalWidth);
      const h = Math.round(img.naturalHeight * (w / img.naturalWidth));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const url = cv.toDataURL('image/jpeg', 0.8);
      const target = state && state.id === charId
        ? state : library.characters.find(c => c.id === charId);
      if (target) target.portrait = { src: null, stamp: url };
      save(); render();
    };
    img.onerror = () => flash('No pude leer esa imagen.');
    img.src = String(reader.result);
  };
  reader.onerror = () => flash('No se pudo leer el archivo.');
  reader.readAsDataURL(file);
}

function save() {
  if (state) {
    state.updatedAt = Date.now();
    const at = library.characters.findIndex(c => c.id === state.id);
    if (at >= 0) library.characters[at] = state;
    else library.characters.push(state);
  }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(library)); } catch (e) { /* private mode */ }
}

/* --------------------------------------------------------------- wizard steps
   The questionnaire contributes one step per question, so the wizard really is
   one decision per screen. `wizardSteps()` is recomputed on demand because the
   spell step only exists for a caster. */
const BASE_STEPS = [
  { id: 'campana',   title: 'La campaña' },
  { id: 'concepto',  title: 'Concepto' },
  { id: 'especie',   title: 'Especie' },
  { id: 'clase',     title: 'Clase' },
];
const AFTER_QUIZ_STEPS = [
  { id: 'resultado',   title: 'Resultado' },
  { id: 'trasfondo',   title: 'Trasfondo' },
  { id: 'puntos',      title: 'Puntuaciones' },
  { id: 'habilidades', title: 'Habilidades' },
  { id: 'equipo',      title: 'Equipo' },
  { id: 'conjuros',    title: 'Conjuros' },
  { id: 'historia',    title: 'Historia' },
  { id: 'listo',       title: 'Listo' },
];

function wizardSteps() {
  const quiz = QUIZ.map((q, i) => ({ id: `q:${q.id}`, title: `Pregunta ${i + 1}`, quiz: i }));
  const tail = AFTER_QUIZ_STEPS.filter(s => s.id !== 'conjuros' || castsAnything(state));
  return [...BASE_STEPS, ...quiz, ...tail];
}

const stepIndex = id => wizardSteps().findIndex(s => s.id === id);

function currentStep() {
  const steps = wizardSteps();
  return steps[Math.min(state.wizardStep, steps.length - 1)];
}

/* Screens that decide nothing and so can never block progress. */
const FREE_STEPS = new Set(['campana', 'resultado', 'listo']);

/**
 * The first thing that still has to be decided on this screen, or null when
 * the player may move on. Only `error` notices block; advice never does, and
 * an individual question can always be skipped.
 */
function blockingFor(stepId) {
  if (FREE_STEPS.has(stepId) || stepId.startsWith('q:')) return null;
  const hit = validate(state).find(n => n.level === 'error' && n.step === stepId);
  return hit ? hit.text : null;
}

function go(i) {
  const steps = wizardSteps();
  state.wizardStep = Math.max(0, Math.min(steps.length - 1, i));
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function goToStepId(id) {
  const at = stepIndex(id);
  if (at >= 0) { screen = 'wizard'; go(at); }
}

/* ------------------------------------------------------------------ router */
function render() {
  const app = document.getElementById('app');
  if (screen !== 'roster' && !state) screen = 'roster';
  app.innerHTML =
    screen === 'roster' ? rosterScreen() :
    screen === 'wizard' ? wizardScreen() :
    screen === 'edit'   ? editScreen()   : viewScreen();
  renderPrintArea();
}

function nav(to) {
  screen = to;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function topBar(title, sub, actions) {
  return `<header class="top">
    <h1>${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</h1>
    <div class="actions">${actions}</div>
  </header>`;
}

function noticesFor(id) {
  const rows = validate(state).filter(n => n.step === id);
  if (!rows.length) return '';
  return rows.map(n => `<div class="notice ${n.level === 'error' ? 'warn' : ''}">${esc(n.text)}</div>`).join('');
}

/* ------------------------------------------------------------------ roster */

/* ------------------------------------------------------------------ wizard */
/** Current step + whether it blocks progress. Shared by wizardScreen() and
 *  the footer patch that text-input typing triggers (see refreshWizardFooter). */
function wizardStepState() {
  const steps = wizardSteps();
  const i = Math.min(state.wizardStep, steps.length - 1);
  const step = steps[i];
  const blocked = step.quiz != null ? null : blockingFor(step.id);
  return { steps, i, step, blocked, last: i === steps.length - 1 };
}

function wizardScreen() {
  const { steps, i, step, blocked, last } = wizardStepState();
  const pct = Math.round(((i + 1) / steps.length) * 100);

  const body = step.quiz != null
    ? quizQuestionView(step.quiz)
    : (STEP_VIEWS[step.id] ? STEP_VIEWS[step.id]() : '<p>—</p>');

  return topBar(state.name || 'Nuevo personaje', `Paso ${i + 1} de ${steps.length}`,
      `<button class="ghost" data-nav="roster">Guardar y salir</button>`) +
    `<div class="progress">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="lab"><span>${esc(step.title)}</span><span>${i + 1} / ${steps.length}</span></div>
    </div>
    <main><section class="panel">${body}</section></main>
    <div class="foot">
      <button data-go="${i - 1}" ${i === 0 ? 'disabled' : ''}>← Atrás</button>
      <span class="why">${esc(blocked || '')}</span>
      <span class="spacer"></span>
      ${last
        ? `<button class="primary" data-finish="1">Guardar ficha →</button>`
        : `<button class="primary" data-go="${i + 1}" ${blocked ? 'disabled' : ''}>Siguiente →</button>`}
    </div>`;
}

/** Text inputs don't call render() (would steal focus mid-typing), so a
 *  newly-typed value that clears a blocking error would otherwise leave the
 *  footer stuck showing the old error and a disabled Siguiente. Patch just
 *  those two nodes instead of re-rendering the whole step. */
function refreshWizardFooter() {
  if (screen !== 'wizard') return;
  const { blocked, last } = wizardStepState();
  const why = document.querySelector('.foot .why');
  if (why) why.textContent = blocked || '';
  if (!last) {
    const next = document.querySelector('.foot [data-go].primary');
    if (next) next.disabled = !!blocked;
  }
}
